<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>大地のつくり</title>
<style>
/* =========================================================
   大地のつくり（6年 理科 B(4) 土地のつくりと変化）
   学習指導要領解説 理科編 p.89-91 より
   ・(ｱ) 土地は 礫・砂・泥・火山灰などからできており，層をつくって
   　　　広がっているものがあること。層には化石が含まれているものがあること
   　　　→「複数の地点の地層のつくりを，粒の大きさや形，色を相互に関係付けて
   　　　　調べ，地層の重なりや広がりを捉える」「地質ボーリングの資料を利用」
   ・(ｲ) 地層は 流れる水の働きや火山の噴火によってできること
   　　　→ 丸みを帯びた礫＝流れる水／火山灰・多くの穴をもつ石＝火山
   　　　→ 内容の取扱い「扱う岩石は 礫岩・砂岩・泥岩」
   ・(ｳ) 土地は 火山の噴火や地震によって変化すること
   　　　→ 溶岩・火山灰・地割れ・断層・崖くずれ
   　　　→ 内容の取扱い「自然災害についても触れること」
   　　　→「過去に起こったことや，将来にも起こる可能性があることを捉える」
   ・「博物館や資料館などの社会教育施設を活用する」→ ⑤ 日本の 地層
   ・「野外観察においては安全を第一に」→ ⑤ の 下に 出す

   【線引き】プレート・地質年代（〇〇紀）・示準化石・変成岩の しくみは
   　中学校第2分野「大地の成り立ちと変化」。ここでは 扱わない。
   　岩石の 名前は 礫岩・砂岩・泥岩 だけ。

   6年なので 画面の 字は 漢字。外部読み込みは なし。1ファイルで 動く。
   写真は 作者（本校教員）が 撮影した もの。base64 で 埋めこんである。
   ========================================================= */
:root{
  --paper:#fdf6e3;
  --card:#fffdf7;
  --ink:#2b2118;
  --dim:#7a6a52;
  --line:#e7d9b8;
  --gold:#c9a227;      /* こたえ合わせ */
  --blue:#2f6fa8;      /* 同じ 画面の 中で すすむ */
  --ok:#5a8a4c;        /* べつの もんだいへ */
  --sub:#a99a7c;       /* もどる・やりなおす */
  --ng:#d34b4b;
  /* 地層の 色（①②③④⑤ ぜんぶ 同じ 色を つかう。ここを 変えると 全部 変わる） */
  --reki:#b0916a;      /* れき */
  --suna:#dcc38a;      /* 砂 */
  --doro:#8d8071;      /* どろ */
  --hai:#ece7db;       /* 火山灰 */
  --soil:#6d5a3c;      /* 表土 */
  /* なかまの 色（⑤の ピンと ③④の 見出し） */
  --c-mizu:#2f6fa8;    /* 流れる水 */
  --c-kazan:#d2622a;   /* 火山 */
  --c-jishin:#7a5aa8;  /* 地震 */
  --c-kaseki:#4f8a4a;  /* 化石 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  /* 外から フォントを 読まない。端末に 入っている 書体を 上から さがす */
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Klee One','BIZ UDPGothic','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-weight:700;
  -webkit-text-size-adjust:100%;
}
#app{height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;gap:6px;max-width:1180px;margin:0 auto;}

/* ---- 見出しと タブ ---- */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
h1{margin:0;font-size:clamp(15px,2.2vw,21px);letter-spacing:.04em;}
h1 .sub{color:#9a7a1e;font-size:.7em;margin-left:8px;font-weight:700;}
nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.tab{
  font:inherit;font-size:clamp(11px,1.35vw,15px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;min-height:40px;cursor:pointer;
}
.tab.on{color:#3a2c05;background:#f5d97a;border-color:var(--gold);}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ---- ステージ ---- */
#main{flex:1;min-height:0;position:relative;}
.stage{position:absolute;inset:0;display:none;flex-direction:column;gap:6px;}
.stage.on{display:flex;}
.stage > .card{flex:1;min-height:0;}
.cols{flex:1;min-height:0;display:grid;grid-template-rows:1.4fr 1fr;grid-template-columns:1fr;gap:6px;}
@media (orientation:landscape) and (min-width:700px){
  .cols.two{grid-template-columns:1.32fr .78fr;grid-template-rows:1fr;}
  .cols.map{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;min-height:0;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.side{display:flex;flex-direction:column;gap:6px;min-height:0;}
.viewbox{position:relative;flex:1;min-height:90px;background:#fffdf7;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.viewbox .cap{
  position:absolute;top:5px;left:0;right:0;text-align:center;
  font-size:clamp(10px,1.25vw,13px);color:var(--dim);pointer-events:none;
}
.msg{
  /* display:flex に すると <b> が flex の 子に なり 語の とちゅうで 折り返す。
     block の まま 中央ぞろえに する（月と太陽 と 同じ） */
  flex:0 0 auto;background:#f7f0dd;border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;font-size:clamp(12px,1.55vw,16px);line-height:1.5;text-align:center;min-height:44px;
  display:block;
}
.msg b{color:#9a7a1e;}
.msg .ok{color:var(--ok);}
.msg .ng{color:#c06a2a;}

/* ---- ボタン ---- */
.bar{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{
  font:inherit;font-size:clamp(12px,1.45vw,15px);color:#fff;border:none;border-radius:14px;
  padding:10px 15px;min-height:44px;cursor:pointer;background:#6a7f9b;
}
.btn:active{transform:scale(.97);}
.btn.play{background:var(--blue);}           /* 同じ 画面の 中で すすむ */
.btn.show{background:var(--gold);color:#3a2c05;} /* こたえ合わせ */
.btn.next{background:var(--ok);}             /* べつの もんだいへ */
.btn.sub{background:var(--sub);}             /* もどる・やりなおす */
.btn.ghost{background:#f6eed9;color:var(--dim);border:1px solid var(--line);}
.btn.ghost.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.btn[disabled]{opacity:.4;}
.dots{display:flex;gap:5px;align-items:center;}
.dots i{width:9px;height:9px;border-radius:50%;background:#e0d3b4;display:block;}
.dots i.on{background:var(--blue);}

/* ---- ⑤ 日本の 地層 ---- */
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#efe9dc;display:none;}
.photo.on{display:block;}
.credit{
  position:absolute;right:6px;bottom:5px;font-size:clamp(9px,1.05vw,11px);
  color:#fff;background:rgba(0,0,0,.42);padding:2px 7px;border-radius:8px;pointer-events:none;
}
#spotName{
  flex:0 0 auto;text-align:center;font-size:clamp(14px,2vw,20px);
}
#spotName small{display:block;color:var(--dim);font-size:.62em;margin-top:2px;}
.chip{
  display:inline-block;font-size:.56em;color:#fff;border-radius:999px;
  padding:3px 9px;margin-left:6px;vertical-align:middle;
}
.filters{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.fil{
  font:inherit;font-size:clamp(10px,1.2vw,13px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:999px;padding:6px 11px;min-height:38px;cursor:pointer;
  display:flex;align-items:center;gap:5px;
}
.fil i{width:11px;height:11px;border-radius:50%;display:block;}
.fil.on{background:#fff;color:var(--ink);}
.note{
  flex:0 0 auto;text-align:center;font-size:clamp(10px,1.2vw,12.5px);color:var(--dim);
}
@media (max-height:600px){
  #app{padding:5px 8px 7px;gap:4px;}
  .msg{padding:6px 10px;min-height:38px;font-size:clamp(11px,1.45vw,14px);}
  .btn{min-height:40px;padding:8px 12px;}
  .tab{min-height:36px;padding:5px 10px;}
  .fil{min-height:34px;padding:4px 9px;}
  .note{font-size:10px;}
}
@media (max-height:520px){ .note{display:none;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>大地のつくり<span class="sub">つぶを 見ると でき方が わかる</span></h1>
    <nav id="tabs">
      <button class="tab on" data-s="1">① 地層を 見る</button>
      <button class="tab" data-s="2">② 広がりを 調べる</button>
      <button class="tab" data-s="3">③ どうして できた</button>
      <button class="tab" data-s="4">④ 土地の 変化</button>
      <button class="tab" data-s="5">⑤ 日本の 地層</button>
    </nav>
  </header>

  <div id="main">

    <!-- ① 地層を 見る -->
    <section class="stage on" id="s1">
      <div class="cols two">
        <div class="card" id="w1"><canvas id="c1"></canvas></div>
        <div class="side">
          <div class="viewbox" id="w1v">
            <canvas id="c1v"></canvas>
            <div class="cap">虫めがねで 見た つぶ</div>
          </div>
        </div>
      </div>
      <div class="msg" id="m1"></div>
      <div class="bar">
        <button class="btn play" id="b1up">▲ うえの 層へ</button>
        <button class="btn play" id="b1down">▼ したの 層へ</button>
        <button class="btn ghost" id="b1cmp">つぶの 大きさを くらべる</button>
      </div>
    </section>

    <!-- ② 広がりを 調べる（ボーリング） -->
    <section class="stage" id="s2">
      <div class="card" id="w2"><canvas id="c2"></canvas></div>
      <div class="msg" id="m2"></div>
      <div class="bar">
        <button class="btn sub" id="b2prev">◀ 1つ もどす</button>
        <button class="btn play" id="b2next">1つ すすむ ▶</button>
        <span class="dots" id="d2"></span>
        <button class="btn sub" id="b2reset">はじめから</button>
      </div>
    </section>

    <!-- ③ どうして できた -->
    <section class="stage" id="s3">
      <div class="card" id="w3"><canvas id="c3"></canvas></div>
      <div class="msg" id="m3"></div>
      <div class="bar">
        <button class="btn ghost on" id="b3mizu">流れる水</button>
        <button class="btn ghost" id="b3kazan">火山の 噴火</button>
        <button class="btn sub" id="b3prev">◀ 1つ もどす</button>
        <button class="btn play" id="b3next">1つ すすむ ▶</button>
        <span class="dots" id="d3"></span>
      </div>
    </section>

    <!-- ④ 土地の 変化 -->
    <section class="stage" id="s4">
      <div class="card" id="w4"><canvas id="c4"></canvas></div>
      <div class="msg" id="m4"></div>
      <div class="bar">
        <button class="btn ghost on" id="b4kazan">火山の 噴火</button>
        <button class="btn ghost" id="b4jishin">地震</button>
        <button class="btn sub" id="b4prev">◀ 1つ もどす</button>
        <button class="btn play" id="b4next">1つ すすむ ▶</button>
        <span class="dots" id="d4"></span>
      </div>
    </section>

    <!-- ⑤ 日本の 地層 -->
    <section class="stage" id="s5">
      <div class="cols map">
        <div class="card" id="w5"><canvas id="c5"></canvas></div>
        <div class="side">
          <div class="viewbox" id="w5v">
            <canvas id="c5v"></canvas>
            <img class="photo" id="p5" alt="">
            <div class="credit" id="cr5">撮影：この 教材の 作者</div>
          </div>
          <div id="spotName"></div>
        </div>
      </div>
      <div class="msg" id="m5"></div>
      <div class="filters" id="fil5"></div>
      <div class="note">地層を 見に 行く ときは 大人と いっしょに。がけの 下や 落石に 気を つける。石を とる ときは 保護めがねを つける。</div>
    </section>

  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ========================= 下じき ========================= */
function fit(cv){
  const r=cv.getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d;}
  const g=cv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,w,h);
  return {g,w,h};
}
function txt(g,s,x,y,size,color,align,base){
  g.save();
  g.font='700 '+size+'px "Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif';
  g.textAlign=align||'center';g.textBaseline=base||'middle';
  g.fillStyle=color||'#2b2118';g.fillText(s,x,y);g.restore();
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function prng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function arrow(g,x1,y1,x2,y2,col,wid,head){
  const a=Math.atan2(y2-y1,x2-x1),hd=head||9;
  g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=wid||3;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*hd*.8,y2-Math.sin(a)*hd*.8);g.stroke();
  g.beginPath();g.moveTo(x2,y2);
  g.lineTo(x2-Math.cos(a-0.4)*hd,y2-Math.sin(a-0.4)*hd);
  g.lineTo(x2-Math.cos(a+0.4)*hd,y2-Math.sin(a+0.4)*hd);
  g.closePath();g.fill();g.restore();
}
/* 人の しるし（大きさが わかるように がけの 下に 置く） */
function person(g,cx,by,hgt,col){
  const s=hgt/28;
  g.save();g.fillStyle=col||'rgba(43,33,24,.55)';
  g.beginPath();g.arc(cx,by-25*s,4.4*s,0,TAU);g.fill();
  rr(g,cx-4*s,by-20*s,8*s,12*s,3*s);g.fill();
  g.fillRect(cx-3.4*s,by-9*s,2.6*s,9*s);
  g.fillRect(cx+0.8*s,by-9*s,2.6*s,9*s);
  g.restore();
}

/* =========================================================
   つぶ（礫・砂・泥・火山灰）
   粒の 大きさは 教科書の 区分。
   ・れき   2mm より 大きい
   ・砂     0.06mm 〜 2mm
   ・どろ   0.06mm より 小さい
   形は 解説の とおり
   ・流れる水が 運んだ つぶ → 丸みを おびる
   ・火山灰の つぶ → 角ばって いる
   ========================================================= */
const ROCK={
  soil:{n:'表土',  c:'#6d5a3c',c2:'#4e4029',size:'',
        say:'いちばん 上は 表土。草や 木が 生えて いる ところ。'},
  reki:{n:'れき',  c:'#b0916a',c2:'#8a6f4b',size:'2mm より 大きい',mm:[4,17],round:1,
        say:'れきの 層。つぶが 大きくて、<b>丸みを おびて いる</b>。川を ころがる うちに 角が とれた ＝ <b>流れる水</b>が 運んだ しるし。'},
  suna:{n:'砂',    c:'#dcc38a',c2:'#b89a5c',size:'0.06mm 〜 2mm',mm:[0.3,1.7],round:1,
        say:'砂の 層。手に とると ざらざら する。れきより 小さく、どろより 大きい つぶ。'},
  doro:{n:'どろ',  c:'#8d8071',c2:'#6f6357',size:'0.06mm より 小さい',mm:[0.02,0.05],round:1,
        say:'どろの 層。つぶが とても 細かくて、さわると なめらか。遠くまで 運ばれて しずんだ。'},
  hai: {n:'火山灰',c:'#ece7db',c2:'#b3ab99',size:'0.06mm 〜 2mm',mm:[0.15,1.3],round:0,
        say:'火山灰の 層。白っぽくて、つぶは <b>角ばって いる</b>。ガラスの かけらのような つぶも ある ＝ <b>火山の 噴火</b>の しるし。'}
};
const ROCKS=['reki','suna','doro','hai'];

/* ---- 地層の 帯（がけ・柱状図 で つかう しるし） ---- */
function band(g,x,y,w,h,kind,seed,fossil){
  if(h<=0.5)return;
  const R=ROCK[kind],rd=prng(seed*7919+13);
  g.save();
  g.beginPath();g.rect(x,y,w,h);g.clip();
  g.fillStyle=R.c;g.fillRect(x,y,w,h);
  if(kind==='reki'){
    const n=Math.max(4,Math.round(w*h/620));
    for(let i=0;i<n;i++){
      const px=x+rd()*w,py=y+rd()*h,r=2.6+rd()*4.2;
      g.beginPath();g.ellipse(px,py,r,r*(.72+rd()*.24),rd()*TAU,0,TAU);
      g.fillStyle=rd()<.5?R.c2:'#9c8059';g.fill();
      g.strokeStyle='rgba(60,45,28,.30)';g.lineWidth=.8;g.stroke();
    }
  }else if(kind==='suna'){
    const n=Math.max(20,Math.round(w*h/46));
    g.fillStyle='rgba(120,96,52,.55)';
    for(let i=0;i<n;i++){g.beginPath();g.arc(x+rd()*w,y+rd()*h,.75+rd()*.7,0,TAU);g.fill();}
  }else if(kind==='doro'){
    g.strokeStyle='rgba(60,52,42,.30)';g.lineWidth=1;
    for(let yy=y+3;yy<y+h;yy+=5){g.beginPath();g.moveTo(x,yy+rd()*.8);g.lineTo(x+w,yy+rd()*.8);g.stroke();}
  }else if(kind==='hai'){
    const n=Math.max(14,Math.round(w*h/150));
    g.strokeStyle='rgba(120,112,96,.62)';g.lineWidth=1;
    for(let i=0;i<n;i++){
      const px=x+rd()*w,py=y+rd()*h,r=1.6+rd()*1.8,a=rd()*TAU;
      g.beginPath();
      for(let k=0;k<3;k++){const t=a+k*TAU/3;g[k?'lineTo':'moveTo'](px+Math.cos(t)*r,py+Math.sin(t)*r);}
      g.closePath();g.stroke();
    }
  }else if(kind==='soil'){
    g.fillStyle='rgba(40,32,18,.35)';
    for(let i=0;i<Math.max(8,w*h/200);i++){g.beginPath();g.arc(x+rd()*w,y+rd()*h,1+rd()*1.6,0,TAU);g.fill();}
  }
  if(fossil){
    const n=Math.max(2,Math.round(w/70));
    for(let i=0;i<n;i++)shell(g,x+w*(i+.5)/n+(rd()-.5)*w*.16,y+h*(.3+rd()*.45),5+rd()*3,rd()*TAU);
  }
  g.restore();
}
/* 貝の 化石 */
function shell(g,cx,cy,r,rot){
  g.save();g.translate(cx,cy);g.rotate(rot);
  g.beginPath();g.moveTo(0,-r*.75);
  g.arc(0,-r*.75,r,Math.PI*0.16,Math.PI*0.84,false);
  g.closePath();
  g.fillStyle='#fbf6e6';g.fill();
  g.strokeStyle='rgba(80,64,40,.75)';g.lineWidth=1;g.stroke();
  g.beginPath();
  for(let i=1;i<=4;i++){const a=Math.PI*(0.16+0.68*i/5);g.moveTo(0,-r*.75);g.lineTo(Math.cos(a)*r,-r*.75+Math.sin(a)*r);}
  g.stroke();g.restore();
}
/* ---- 虫めがねで 見た つぶ（ほんとうの 大きさの 比で かく） ---- */
const FOV_MM=24;   /* 虫めがねの 中に 見える はば＝24mm */
function zoom(g,cx,cy,R,kind,seed){
  const rock=ROCK[kind],rd=prng((seed||1)*104729+7),ppm=2*R/FOV_MM;
  g.save();
  g.beginPath();g.arc(cx,cy,R,0,TAU);g.clip();
  g.fillStyle=kind==='hai'?'#f3efe6':'#cbbb9c';g.fillRect(cx-R,cy-R,2*R,2*R);
  const mm=rock.mm,area=Math.PI*R*R;
  const avg=(mm[0]+mm[1])/2*ppm;
  let n=Math.round(area/(avg*avg*1.35));
  n=clamp(n,1,2400);
  if(kind==='doro'){
    g.fillStyle=rock.c;g.fillRect(cx-R,cy-R,2*R,2*R);
    g.fillStyle='rgba(255,255,255,.10)';
    for(let i=0;i<1600;i++){g.beginPath();g.arc(cx-R+rd()*2*R,cy-R+rd()*2*R,.5+rd()*.4,0,TAU);g.fill();}
    g.fillStyle='rgba(40,34,26,.10)';
    for(let i=0;i<1200;i++){g.beginPath();g.arc(cx-R+rd()*2*R,cy-R+rd()*2*R,.5+rd()*.4,0,TAU);g.fill();}
    /* 見えない ことが こたえ。空っぽに 見えないよう ことばを 入れる */
    if(R>38)txt(g,'つぶが 小さすぎて 見えない',cx,cy,clamp(R*.145,10,15),'rgba(255,253,247,.92)');
  }else{
    for(let i=0;i<n;i++){
      const px=cx-R+rd()*2*R,py=cy-R+rd()*2*R;
      const d=(mm[0]+rd()*(mm[1]-mm[0]))*ppm/2;
      const a=rd()*TAU;
      g.beginPath();
      if(rock.round){
        g.ellipse(px,py,d,d*(.74+rd()*.24),a,0,TAU);
      }else{
        const v=5+Math.floor(rd()*2);
        for(let k=0;k<v;k++){
          const t=a+k*TAU/v,rr2=d*(.5+rd()*.75);
          g[k?'lineTo':'moveTo'](px+Math.cos(t)*rr2,py+Math.sin(t)*rr2);
        }
        g.closePath();
      }
      const pal=kind==='reki'?['#b79a72','#a2855d','#c9b28c','#8e7550','#b0a08a']
               :kind==='suna'?['#e3cf9c','#cbb075','#f0e2bb','#b79a5f','#d8c48e']
               :['#fdfbf5','#e6e0d2','#cbc4b2','#f5f1e6','#b9b2a0'];
      g.fillStyle=pal[Math.floor(rd()*pal.length)];
      g.fill();
      g.strokeStyle='rgba(60,50,34,.32)';g.lineWidth=.7;g.stroke();
    }
  }
  g.restore();
  /* ものさし（1cm）＝ どの つぶも 同じ 倍率で 見て いる */
  const bar=10*ppm,bx=cx-bar/2,by=cy+R-13;
  g.save();g.strokeStyle='rgba(43,33,24,.85)';g.lineWidth=2.4;g.lineCap='butt';
  g.beginPath();g.moveTo(bx,by);g.lineTo(bx+bar,by);
  g.moveTo(bx,by-4);g.lineTo(bx,by+4);g.moveTo(bx+bar,by-4);g.lineTo(bx+bar,by+4);g.stroke();
  g.restore();
  txt(g,'1cm',cx,by-11,11,'rgba(43,33,24,.85)');
  g.save();g.beginPath();g.arc(cx,cy,R,0,TAU);
  g.strokeStyle='#8a7350';g.lineWidth=4;g.stroke();
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.4;g.stroke();g.restore();
}
</script>
<script>
/* =========================================================
   ① 地層を 見る
   がけの 層を タップ → 虫めがねで つぶを 見る。
   解説「複数の地点の地層のつくりを 層の構成物の 粒の大きさや形，色を
   相互に関係付けて調べ」の うち、まず 1か所を ていねいに 見る ところ。
   ========================================================= */
const L1=[
  {k:'soil',h:0.8},
  {k:'reki',h:2.2},
  {k:'suna',h:1.8},
  {k:'hai' ,h:0.9},
  {k:'doro',h:2.6,fossil:true},
  {k:'suna',h:2.0},
  {k:'reki',h:2.7}
];
const S1={sel:3,cmp:false};

function geoL1(w,h){
  const x0=w*0.185,x1=w*0.92,top=h*0.13,bot=h*0.90;
  const sum=L1.reduce((a,b)=>a+b.h,0);
  const ys=[];let y=top;
  for(const L of L1){const hh=(bot-top)*L.h/sum;ys.push([y,hh]);y+=hh;}
  return {x0,x1,top,bot,ys,sum,mpp:(bot-top)/sum};
}
function drawS1(){
  const {g,w,h}=fit($('c1'));
  const G=geoL1(w,h);
  /* 空と 地面 */
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#dbe8f2');sky.addColorStop(1,'#eef1e6');
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  /* がけの 層 */
  for(let i=0;i<L1.length;i++){
    const L=L1[i],[y,hh]=G.ys[i];
    band(g,G.x0,y,G.x1-G.x0,hh,L.k,i+3,L.fossil);
    g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
    g.beginPath();g.moveTo(G.x0,y+hh);g.lineTo(G.x1,y+hh);g.stroke();
  }
  g.strokeStyle='rgba(60,48,30,.45)';g.lineWidth=1.6;
  g.strokeRect(G.x0,G.top,G.x1-G.x0,G.bot-G.top);
  /* 草 */
  const rd=prng(99);
  g.strokeStyle='#6f9a4e';g.lineWidth=2;g.lineCap='round';
  for(let x=G.x0+3;x<G.x1;x+=6){
    const t=4+rd()*7;
    g.beginPath();g.moveTo(x,G.top);g.lineTo(x+(rd()-.5)*5,G.top-t);g.stroke();
  }
  /* がけの 下の くずれた 石と 人（大きさの 目やす） */
  g.fillStyle='#cdbf9f';
  g.beginPath();g.moveTo(G.x0,G.bot);g.lineTo(G.x1,G.bot);g.lineTo(G.x1,h);g.lineTo(0,h);
  g.lineTo(0,G.bot+8);g.closePath();g.fill();
  person(g,G.x0-w*0.055,G.bot+(h-G.bot)*0.52,G.mpp*1.4);
  txt(g,'1.4m',G.x0-w*0.055,G.bot+(h-G.bot)*0.52+9,10,'rgba(43,33,24,.6)','center','top');
  /* ものさし（左はし） */
  const sx=clamp(w*0.085,30,52);
  g.save();g.strokeStyle='rgba(43,33,24,.7)';g.lineWidth=1.6;
  g.beginPath();g.moveTo(sx,G.top);g.lineTo(sx,G.bot);g.stroke();
  for(let m=0;m<=Math.round(G.sum);m++){
    const y=G.top+m*G.mpp;if(y>G.bot+.5)break;
    const lg=(m%5===0);
    g.beginPath();g.moveTo(sx-(lg?7:4),y);g.lineTo(sx+(lg?7:4),y);g.stroke();
    if(lg)txt(g,m+'m',sx-10,y,10,'rgba(43,33,24,.7)','right');
  }
  g.restore();
  /* 層の 名前 */
  for(let i=0;i<L1.length;i++){
    const L=L1[i],[y,hh]=G.ys[i];
    if(hh<13)continue;
    const nm=ROCK[L.k].n+(L.fossil?'（化石）':'');
    const fs=clamp(hh*.52,10,15);
    g.save();g.font='700 '+fs+'px sans-serif';
    const tw=g.measureText(nm).width+12;g.restore();
    g.fillStyle='rgba(255,253,247,.82)';
    rr(g,G.x1-tw-8,y+hh/2-fs*.8,tw,fs*1.6,6);g.fill();
    txt(g,nm,G.x1-tw/2-8,y+hh/2,fs,'#2b2118');
  }
  /* えらんで いる 層 */
  const [sy,sh]=G.ys[S1.sel];
  g.save();g.strokeStyle='#c9a227';g.lineWidth=4;
  g.strokeRect(G.x0-2,sy-1,G.x1-G.x0+4,sh+2);g.restore();
  const cx=G.x0+(G.x1-G.x0)*0.16,cy=sy+sh/2,r=Math.min(sh*.42,22);
  g.save();g.beginPath();g.arc(cx,cy,r,0,TAU);
  g.strokeStyle='#c9a227';g.lineWidth=3.5;g.stroke();
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.4;g.stroke();
  g.beginPath();g.moveTo(cx+r*.72,cy+r*.72);g.lineTo(cx+r*1.5,cy+r*1.5);
  g.strokeStyle='#c9a227';g.lineWidth=4.5;g.lineCap='round';g.stroke();g.restore();
  txt(g,'層を タップすると つぶが 見える',w/2,h*0.055,clamp(w*.021,11,15),'#7a6a52');
}
function drawS1v(){
  const {g,w,h}=fit($('c1v'));
  g.fillStyle='#fffdf7';g.fillRect(0,0,w,h);
  if(S1.cmp){
    const cols=(w>h*1.25)?4:2,rows=Math.ceil(4/cols);
    const cw=w/cols,ch=(h-16)/rows;
    for(let i=0;i<4;i++){
      const k=ROCKS[i],cx=cw*(i%cols)+cw/2,cy=16+ch*Math.floor(i/cols)+ch*0.44;
      const R=Math.min(cw*.40,ch*.36);
      zoom(g,cx,cy,R,k,i+1);
      txt(g,ROCK[k].n,cx,cy+R+10,clamp(R*.30,10,14),'#2b2118');
      txt(g,ROCK[k].size,cx,cy+R+10+clamp(R*.30,10,14),clamp(R*.24,9,11),'#7a6a52');
    }
    txt(g,'どれも 同じ 倍率。ものさしは 1cm',w/2,h-7,clamp(w*.026,10,13),'#7a6a52');
    return;
  }
  const k=L1[S1.sel].k;
  const R=Math.min(w*.36,h*.36);
  zoom(g,w/2,h*0.46,R,k,S1.sel+1);
  const big=clamp(R*.34,13,22);
  txt(g,ROCK[k].n,w/2,h*0.46+R+big*0.9,big,'#2b2118');
  if(ROCK[k].size)txt(g,'つぶの 大きさ　'+ROCK[k].size,w/2,h*0.46+R+big*2.1,clamp(R*.24,10,14),'#7a6a52');
  if(L1[S1.sel].fossil)txt(g,'貝の 化石が 見つかる',w/2,h*0.46+R+big*3.1,clamp(R*.24,10,14),'#4f8a4a');
}
function msgS1(){
  const L=L1[S1.sel],R=ROCK[L.k];
  let s=R.say;
  if(L.fossil)s+='　<b class="ok">貝の 化石</b>＝ ここは むかし <b>海の 底</b>。';
  if(S1.cmp)s='<b>れき・砂・どろ・火山灰</b>を 同じ 倍率で ならべた。ちがいは <b>つぶの 大きさ</b>と <b>形</b>。';
  $('m1').innerHTML=s;
}
function selS1(i){S1.sel=clamp(i,0,L1.length-1);S1.cmp=false;$('b1cmp').classList.remove('on');paint();}
$('c1').addEventListener('click',e=>{
  const r=$('c1').getBoundingClientRect(),y=e.clientY-r.top;
  const G=geoL1(r.width,r.height);
  for(let i=0;i<L1.length;i++){if(y>=G.ys[i][0]&&y<G.ys[i][0]+G.ys[i][1]){selS1(i);return;}}
});
$('b1up').onclick=()=>selS1(S1.sel-1);
$('b1down').onclick=()=>selS1(S1.sel+1);
$('b1cmp').onclick=()=>{S1.cmp=!S1.cmp;$('b1cmp').classList.toggle('on',S1.cmp);paint();};
</script>
<script>
/* =========================================================
   ② 広がりを 調べる（ボーリング）
   解説「複数の地点の地層のつくりを…調べ，地層の重なりや広がりを捉える」
   　　「地質ボーリングの資料を利用することが考えられる」
   かぎに なるのは <火山灰の 層>。ふかさは ちがうのに、標高で そろえると
   ひとつづきに なる ＝ 層は 横に 広がって いる。
   ========================================================= */
const SEQ=[              /* 標高（m）で もつ。3か所 とも 同じ 積み重なり */
  {k:'reki',t:66,b:50},
  {k:'suna',t:50,b:42},
  {k:'hai' ,t:42,b:38},
  {k:'doro',t:38,b:28,fossil:true},
  {k:'suna',t:28,b:16},
  {k:'reki',t:16,b:-2}
];
const PTS=[{n:'A',e:62,x:.245},{n:'B',e:52,x:.50},{n:'C',e:44,x:.755}];
const DEPTH=25, EMIN=17, EMAX=64;
const S2={step:0,a:0};
const S2MAX=6;
const HAI_DEPTH=PTS.map(p=>p.e-42);   /* 火山灰の 上までの ふかさ＝20,10,2 */

function drawS2(){
  const {g,w,h}=fit($('c2'));
  const yTop=h*0.17,yBot=h*0.92;
  const mppA=(yBot-yTop)/(EMAX-EMIN);          /* 標高で そろえた ときの ばい率 */
  const mppC=h*0.62/DEPTH;                     /* ならべた だけの ときは 大きく 見せる */
  const a=S2.a, mpp=lerp(mppC,mppA,a);
  const yE=e=>yBot-(e-EMIN)*mppA;
  const coreTop=h*0.24;
  const cw=clamp(w*0.125,34,80);
  const tops=PTS.map(p=>lerp(coreTop,yE(p.e),a));
  /* 空（標高で そろえた ときだけ。ならべた だけの ときは 紙の 色） */
  g.fillStyle='#fffdf7';g.fillRect(0,0,w,h);
  if(a>0.02){
    const sky=g.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#dbe8f2');sky.addColorStop(1,'#f3f1e4');
    g.save();g.globalAlpha=a;g.fillStyle=sky;g.fillRect(0,0,w,h);g.restore();
    /* 地面（柱の 上を つないで かく。とちゅうでも はなれない） */
    g.save();g.globalAlpha=a;
    g.beginPath();g.moveTo(-2,tops[0]+6);
    for(let i=0;i<PTS.length;i++)g.lineTo(w*PTS[i].x,tops[i]);
    g.lineTo(w+2,tops[2]+6);g.lineTo(w+2,h+2);g.lineTo(-2,h+2);g.closePath();
    g.fillStyle='#e6dcc2';g.fill();
    g.beginPath();g.moveTo(-2,tops[0]+6);
    for(let i=0;i<PTS.length;i++)g.lineTo(w*PTS[i].x,tops[i]);
    g.lineTo(w+2,tops[2]+6);
    g.strokeStyle='#7c9a55';g.lineWidth=3;g.stroke();
    g.restore();
  }
  /* 標高の ものさし（そろい終わる ころに 出す） */
  const av=clamp((a-0.55)/0.45,0,1);
  if(av>0.01){
    const sx=w*0.045;
    g.save();g.globalAlpha=av;g.strokeStyle='rgba(43,33,24,.55)';g.lineWidth=1.4;
    g.beginPath();g.moveTo(sx,yE(EMAX));g.lineTo(sx,yE(EMIN));g.stroke();
    for(let e=EMIN+3;e<=EMAX;e+=10){
      g.beginPath();g.moveTo(sx-6,yE(e));g.lineTo(sx+6,yE(e));g.stroke();
      txt(g,e+'m',sx-9,yE(e),10,'rgba(43,33,24,.65)','right');
    }
    txt(g,'標高',sx,yE(EMAX)-12,11,'rgba(43,33,24,.65)');
    g.restore();
  }
  /* 3本の 柱 */
  for(let i=0;i<PTS.length;i++){
    const p=PTS[i],cx=w*p.x,x=cx-cw/2,top=tops[i];
    const drawn=(S2.step>i);
    /* 地面の しるし（ならべて いる あいだ） */
    if(a<0.6){
      g.save();g.globalAlpha=1-a/0.6;
      g.strokeStyle='#7c9a55';g.lineWidth=3;g.lineCap='round';
      g.beginPath();g.moveTo(cx-cw*.85,top-2);g.lineTo(cx+cw*.85,top-2);g.stroke();
      g.restore();
    }
    if(!drawn){
      g.fillStyle='rgba(43,33,24,.09)';
      rr(g,x,top,cw,DEPTH*mpp,8);g.fill();
      txt(g,'?',cx,top+DEPTH*mpp/2,clamp(cw*.5,16,30),'rgba(43,33,24,.3)');
    }else{
      for(const L of SEQ){
        const t=Math.min(L.t,p.e),b=Math.max(L.b,p.e-DEPTH);
        if(t<=b)continue;
        const y=top+(p.e-t)*mpp,hh=(t-b)*mpp;
        band(g,x,y,cw,hh,L.k,i*11+L.t,L.fossil&&cw>40);
        g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
        g.beginPath();g.moveTo(x,y+hh);g.lineTo(x+cw,y+hh);g.stroke();
      }
      g.strokeStyle='rgba(60,48,30,.55)';g.lineWidth=1.6;
      g.strokeRect(x,top,cw,DEPTH*mpp);
    }
    /* 名前と 標高 */
    txt(g,p.n,cx,top-clamp(w*.026,13,20),clamp(w*.032,14,22),'#2b2118','center','bottom');
    txt(g,'標高 '+p.e+'m',cx,top-5,clamp(w*.019,10,13),'#7a6a52','center','bottom');
    /* ふかさの ものさし（Aの 左） */
    if(i===0&&drawn&&a<0.5){
      g.save();g.globalAlpha=1-a*2;
      for(let d=0;d<=DEPTH;d+=5){
        const y=top+d*mpp;
        g.strokeStyle='rgba(43,33,24,.5)';g.lineWidth=1;
        g.beginPath();g.moveTo(x-5,y);g.lineTo(x,y);g.stroke();
        txt(g,d+'m',x-8,y,10,'rgba(43,33,24,.6)','right');
      }
      txt(g,'ふかさ',x+cw*.1,top+DEPTH*mpp+13,10,'rgba(43,33,24,.6)','right','top');
      g.restore();
    }
    /* ④ 火山灰までの ふかさ */
    if(S2.step===4){
      const y1=top,y2=top+HAI_DEPTH[i]*mpp;
      g.save();g.setLineDash([4,4]);g.strokeStyle='#c9a227';g.lineWidth=2;
      g.beginPath();g.moveTo(x+cw+7,y1);g.lineTo(x+cw+7,y2);g.stroke();g.restore();
      arrow(g,x+cw+7,y1,x+cw+7,y2,'#c9a227',2,7);
      g.fillStyle='rgba(255,253,247,.9)';
      rr(g,x+cw+11,(y1+y2)/2-11,40,22,6);g.fill();
      txt(g,HAI_DEPTH[i]+'m',x+cw+31,(y1+y2)/2,13,'#9a7a1e');
    }
  }
  /* ⑥ 火山灰の 層を つなぐ */
  if(S2.step>=6&&a>0.8){
    g.save();
    const xa=w*PTS[0].x-cw/2,xb=w*PTS[2].x+cw/2;
    for(const L of SEQ){
      const on=(L.k==='hai');
      g.setLineDash(on?[]:[3,6]);
      g.strokeStyle=on?'#d2622a':'rgba(60,48,30,.40)';
      g.lineWidth=on?3:1.4;
      for(const e of [L.t,L.b]){
        const y=yE(e);
        if(y<yTop-10||y>yBot+10)continue;
        g.beginPath();g.moveTo(xa-14,y);g.lineTo(xb+14,y);g.stroke();
      }
    }
    g.restore();
    g.fillStyle='rgba(255,253,247,.92)';
    rr(g,w*0.5-72,yE(40)-13,144,26,8);g.fill();
    txt(g,'火山灰の 層',w*0.5,yE(40),14,'#d2622a');
  }
  /* しるしの 説明 */
  const lg=['reki','suna','doro','hai'];
  const bw=clamp(w*0.085,44,80),gap=6,tot=lg.length*(bw+gap)-gap;
  let lx=w/2-tot/2;
  for(const k of lg){
    band(g,lx,h*0.028,bw,15,k,5);
    g.strokeStyle='rgba(60,48,30,.4)';g.lineWidth=1;g.strokeRect(lx,h*0.028,bw,15);
    txt(g,ROCK[k].n,lx+bw/2,h*0.028+19,clamp(w*.020,10,13),'#7a6a52','center','top');
    lx+=bw+gap;
  }
}
const M2=[
 'A・B・C の 3か所。地面の 高さ（<b>標高</b>）は ちがう。地面の 下は どう なって いるだろう。',
 '<b>A</b>で ボーリング。25m ほって、出て きた 物を 上から 順に ならべた。',
 '<b>B</b>も 同じように ほった。れきの 層が うすい。',
 '<b>C</b>も ほった。3本 そろった。同じ 層が ありそうかな。',
 '白い <b>火山灰の 層</b>までの ふかさは Aが 20m、Bが 10m、Cが 2m。ばらばらに 見える。',
 '3本を <b>標高で そろえて</b> みると…',
 '火山灰の 層が 横に <b class="ok">ひとつづき</b>に なった。ほかの 層も つながる ＝ <b>層は 横に 広がって いる</b>。'
];
function showS2(){
  S2.step=clamp(S2.step,0,S2MAX);
  $('m2').innerHTML=M2[S2.step];
  $('b2prev').disabled=(S2.step===0);
  $('b2next').disabled=(S2.step===S2MAX);
  const d=$('d2');
  if(d.children.length!==S2MAX+1){d.innerHTML='';for(let i=0;i<=S2MAX;i++)d.appendChild(document.createElement('i'));}
  for(let i=0;i<=S2MAX;i++)d.children[i].classList.toggle('on',i<=S2.step);
  paint();
}
$('b2next').onclick=()=>{S2.step++;showS2();};
$('b2prev').onclick=()=>{S2.step--;showS2();};
$('b2reset').onclick=()=>{S2.step=0;showS2();};
</script>
<script>
/* =========================================================
   ③ どうして できた
   解説 (ｲ)「地層は，流れる水の働きや火山の噴火によってできること」
   ・丸みを おびた れきや 砂 → 流れる水が つくった 地層
   ・火山灰や 多くの 穴を もつ 石  → 火山の 噴火が つくった 地層
   ・内容の取扱い「流れる水の働きでできた岩石として 礫岩，砂岩，泥岩を扱う」
   ========================================================= */
const S3={mode:'mizu',step:0};
const S3MAX={mizu:6,kazan:5};

/* ---- 丸い つぶ・角ばった つぶの 見本（すみに 出す） ---- */
function sample(g,x,y,bw,bh,title,kind,note){
  g.save();
  g.fillStyle='rgba(255,253,247,.94)';g.strokeStyle='#c9a227';g.lineWidth=2;
  rr(g,x,y,bw,bh,12);g.fill();g.stroke();
  g.restore();
  const fs=clamp(bh*.15,10,14);
  txt(g,title,x+bw/2,y+fs*1.1,fs,'#9a7a1e');
  zoom(g,x+bw/2,y+bh*0.50,Math.min(bw*.30,bh*.30),kind,9);
  if(note)txt(g,note,x+bw/2,y+bh-fs*1.0,fs*.92,'#2b2118');
}
/* ---- 岩石（れき岩・砂岩・でい岩） ---- */
function rockChip(g,x,y,bw,bh,kind,name){
  g.save();g.beginPath();rr(g,x,y,bw,bh,8);g.clip();
  band(g,x,y,bw,bh,kind,kind.length*31+7);
  g.restore();
  g.save();g.strokeStyle='rgba(60,48,30,.6)';g.lineWidth=1.6;rr(g,x,y,bw,bh,8);g.stroke();g.restore();
  txt(g,name,x+bw/2,y+bh+clamp(bh*.28,9,13),clamp(bh*.30,10,14),'#2b2118','center','top');
}

function drawS3(){
  const {g,w,h}=fit($('c3'));
  const t=performance.now()/1000;
  if(S3.mode==='mizu')drawMizu(g,w,h,t,S3.step);
  else drawKazan(g,w,h,t,S3.step);
}
/* ---------- 流れる水 ---------- */
function drawMizu(g,w,h,t,st){
  const xs=w*0.34, ysea=h*0.40;
  const floorY=x=>h*0.66+(clamp((x-xs)/(w-xs),0,1))*h*0.20;
  /* 空 */
  const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#cfe2f0');sky.addColorStop(1,'#eaf0ee');
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  /* 岩ばん */
  g.beginPath();g.moveTo(xs-w*0.05,h);
  for(let i=0;i<=40;i++){const x=xs+(w-xs)*i/40;g.lineTo(x,floorY(x));}
  g.lineTo(w,h);g.closePath();g.fillStyle='#736e68';g.fill();
  /* 岩ばんの 上に 線を 引く＝つもった ものと 見分けが つく */
  g.save();g.strokeStyle='rgba(40,36,30,.65)';g.lineWidth=2;
  g.beginPath();for(let i=0;i<=40;i++){const x=xs+(w-xs)*i/40;g.lineTo(x,floorY(x));}g.stroke();g.restore();
  /* つもった 層 */
  const N=48,T=h*0.040;
  const base=[];for(let i=0;i<=N;i++)base.push(floorY(xs+(w-xs)*i/N));
  const sets=st>=5?3:(st>=4?2:(st>=2?1:0));
  const th={
    reki:u=>Math.max(0,1-u/0.34),
    suna:u=>0.92*Math.exp(-Math.pow((u-0.42)/0.30,2)),
    doro:u=>clamp((u-0.22)/0.45,0,1)*0.92
  };
  for(let s=0;s<sets;s++){
    const part=(s===0&&st===2)?['reki']:['reki','suna','doro'];
    for(const k of part){
      const top=[];
      for(let i=0;i<=N;i++){const u=i/N;top.push(base[i]-T*th[k](u));}
      let mn=1e9,mx=-1e9;
      for(let i=0;i<=N;i++){mn=Math.min(mn,top[i]);mx=Math.max(mx,base[i]);}
      g.save();
      g.beginPath();
      for(let i=0;i<=N;i++)g.lineTo(xs+(w-xs)*i/N,base[i]);
      for(let i=N;i>=0;i--)g.lineTo(xs+(w-xs)*i/N,top[i]);
      g.closePath();g.clip();
      band(g,xs,mn-1,w-xs,mx-mn+2,k,s*13+k.length*5);
      g.restore();
      g.save();g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
      g.beginPath();for(let i=0;i<=N;i++)g.lineTo(xs+(w-xs)*i/N,top[i]);g.stroke();g.restore();
      for(let i=0;i<=N;i++)base[i]=top[i];
    }
  }
  /* 海の 水（つもった ものの 上に うすく かける＝水の 中だと わかる） */
  g.save();g.fillStyle='rgba(120,180,208,.24)';
  g.fillRect(xs-w*0.06,ysea,w,h-ysea);
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;
  g.beginPath();
  for(let x=xs-w*0.06;x<w;x+=8)g.lineTo(x,ysea+Math.sin(x*0.05+t*1.4)*2.2);
  g.stroke();g.restore();
  /* 山と 陸（水の あとに かく＝なぎさで きちんと 切れる） */
  g.beginPath();g.moveTo(0,h);g.lineTo(0,h*0.36);
  g.lineTo(w*0.11,h*0.17);g.lineTo(w*0.21,h*0.33);g.lineTo(w*0.27,h*0.30);
  g.lineTo(xs,ysea+2);g.lineTo(xs-w*0.05,h);g.closePath();
  g.fillStyle='#9aa87a';g.fill();
  /* 川 */
  g.save();g.strokeStyle='#8fc3dc';g.lineWidth=clamp(w*0.020,6,15);g.lineCap='round';
  g.beginPath();g.moveTo(w*0.11,h*0.20);g.lineTo(w*0.19,h*0.32);g.lineTo(w*0.26,h*0.33);g.lineTo(xs,ysea);g.stroke();g.restore();
  /* 水の 中の つぶ */
  if(st>=1){
    const rd=prng(4321),cnt=42;
    for(let i=0;i<cnt;i++){
      const ph=(t*0.28+i/cnt)%1;
      const kind=i%3===0?'reki':(i%3===1?'suna':'doro');
      const reach=kind==='reki'?0.20:(kind==='suna'?0.48:0.92);
      const u=ph*reach+rd()*0.05;
      const x=xs+(w-xs)*u;
      const y=lerp(ysea+5,floorY(x)-5,Math.pow(ph,kind==='doro'?1.6:0.8));
      const r=kind==='reki'?3.4:(kind==='suna'?2.1:1.3);
      g.beginPath();g.arc(x,y,r,0,TAU);
      g.fillStyle=ROCK[kind].c2;g.fill();
    }
  }
  /* 川の 流れの 矢じるし */
  const fa=(t*0.6)%1;
  arrow(g,w*0.14+fa*w*0.05,h*0.24+fa*h*0.04,w*0.19+fa*w*0.05,h*0.31+fa*h*0.04,'rgba(47,111,168,.85)',3,8);
  /* ことば */
  txt(g,'山',w*0.11,h*0.11,clamp(w*.024,11,16),'#2b2118');
  txt(g,'川',w*0.235,h*0.25,clamp(w*.024,11,16),'#2f6fa8');
  txt(g,'海',xs+(w-xs)*0.22,ysea-9,clamp(w*.026,12,18),'#2f6fa8','center','bottom');
  if(st>=1)txt(g,'流れが 弱く なる',xs+w*0.035,ysea+16,clamp(w*.021,10,14),'#2f6fa8','left','top');
  if(st>=2)tag(g,'れき',xs+(w-xs)*0.10,floorY(xs+(w-xs)*0.10)+16,clamp(w*.020,10,14),'#5c4a2e');
  if(st>=3){
    tag(g,'砂',xs+(w-xs)*0.45,floorY(xs+(w-xs)*0.45)+16,clamp(w*.020,10,14),'#5c4a2e');
    tag(g,'どろ',xs+(w-xs)*0.85,floorY(xs+(w-xs)*0.85)+16,clamp(w*.020,10,14),'#5c4a2e');
  }
  if(st>=6){
    const bw=clamp(w*0.29,148,240);
    const ph1=clamp(h*0.26,88,140), ph2=ph1*0.52;
    const x0=w*0.018, y0=h*0.97-(ph1+ph2+10);
    sample(g,x0,y0,bw,ph1,'流れる水が 運んだ つぶ','reki','角が とれて 丸い');
    const cwid=bw/3.7, gap=(bw-cwid*3)/4;
    const names=[['reki','れき岩'],['suna','砂岩'],['doro','でい岩']];
    for(let i=0;i<3;i++)rockChip(g,x0+gap+i*(cwid+gap),y0+ph1+10,cwid,ph2*0.58,names[i][0],names[i][1]);
  }
}
/* ---------- 火山の 噴火 ---------- */
function drawKazan(g,w,h,t,st){
  const gy=h*0.70, vx=w*0.24, vtop=h*0.24;
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,st>=1?'#c8c3bb':'#cfe2f0');sky.addColorStop(1,'#eef0e8');
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  /* もとから あった 地面（ここも 地層） */
  const gh=h-gy;
  band(g,0,gy,w,gh*0.34,'suna',41);
  band(g,0,gy+gh*0.34,w,gh*0.30,'doro',42);
  band(g,0,gy+gh*0.64,w,gh*0.40,'reki',43);
  g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
  for(const f of [0.34,0.64]){g.beginPath();g.moveTo(0,gy+gh*f);g.lineTo(w,gy+gh*f);g.stroke();}
  /* つもった 火山灰の 層 */
  const layers=st>=4?3:(st>=3?1:0);
  const lh=clamp(h*0.026,7,16);
  for(let i=0;i<layers;i++){
    const y=gy-(i+1)*lh*2;
    band(g,0,y,w,lh,'hai',i*17+3);
    band(g,0,y+lh,w,lh,'doro',i*17+9);
    g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
  }
  const top0=gy-layers*lh*2;
  g.strokeStyle='#7c9a55';g.lineWidth=3;
  g.beginPath();g.moveTo(0,top0);g.lineTo(w,top0);g.stroke();
  /* 火山 */
  g.beginPath();g.moveTo(vx-w*0.22,top0+2);g.lineTo(vx-w*0.045,vtop);
  g.lineTo(vx+w*0.045,vtop);g.lineTo(vx+w*0.22,top0+2);g.closePath();
  g.fillStyle='#8a7c6a';g.fill();
  g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.4;g.stroke();
  /* 噴煙と 火山灰 */
  if(st>=1){
    const rd=prng(777),tilt=st>=2?1:0;
    for(let i=0;i<110;i++){
      const ph=(t*0.16+i/110)%1;
      const up=Math.pow(ph,0.7);
      const x=vx+(rd()-.5)*w*0.06+tilt*up*w*0.55*(0.4+rd()*0.9);
      const y=vtop-up*h*0.20+(rd()-.5)*h*0.03;
      const r=3+up*clamp(w*0.016,5,13)*(0.5+rd());
      g.beginPath();g.arc(x,y,r,0,TAU);
      g.fillStyle='rgba(150,143,132,'+(0.30-up*0.13)+')';g.fill();
    }
    if(st>=2){
      const rd2=prng(31337);
      for(let i=0;i<70;i++){
        const ph=(t*0.35+i/70)%1;
        const x=vx+w*0.10+rd2()*w*0.92;
        const y=lerp(vtop-h*0.05,top0-3,ph);
        g.beginPath();g.arc(x,y,1.6+rd2()*1.5,0,TAU);
        g.fillStyle='rgba(120,112,100,.55)';g.fill();
      }
      arrow(g,vx+w*0.10,vtop-h*0.12,vx+w*0.42,vtop-h*0.14,'rgba(47,111,168,.7)',3,9);
      txt(g,'風',vx+w*0.26,vtop-h*0.17,clamp(w*.022,11,15),'#2f6fa8');
    }
  }
  txt(g,'火山',vx,vtop-12,clamp(w*.026,12,17),'#2b2118','center','bottom');
  if(st>=3)txt(g,'火山灰が つもった 層',w*0.72,top0-14,clamp(w*.022,11,15),'#d2622a','center','bottom');
  if(st>=5){
    const bw=clamp(w*0.30,150,250),bh=clamp(h*0.34,110,175);
    sample(g,w-bw-10,h*0.04,bw,bh,'火山灰の つぶ','hai','角ばって いる');
    /* 穴の 多い 石（軽石） */
    const px=w-bw-10+bw*0.5,py=h*0.04+bh+clamp(h*0.10,30,52);
    const pr=clamp(bh*0.22,22,40);
    g.save();g.beginPath();g.arc(px,py,pr,0,TAU);
    g.fillStyle='#ddd7c9';g.fill();g.strokeStyle='rgba(60,48,30,.6)';g.lineWidth=2;g.stroke();
    g.clip();const rd=prng(555);
    g.fillStyle='rgba(90,82,70,.5)';
    for(let i=0;i<48;i++){g.beginPath();g.arc(px-pr+rd()*2*pr,py-pr+rd()*2*pr,1.6+rd()*3.4,0,TAU);g.fill();}
    g.restore();
    txt(g,'あなの 多い 石',px,py+pr+8,clamp(bh*.11,10,13),'#2b2118','center','top');
  }
}
const M3={
 mizu:[
  '山に ふった 雨が 川に なり、けずった <b>土や 石</b>を 運ぶ。',
  '川が 海に 出ると <b>流れが 弱く なる</b>。運べなく なった ものは しずむ。',
  'まず <b>大きくて 重い れき</b>から、岸の 近くに しずむ。',
  'つぎに <b>砂</b>。いちばん 細かい <b>どろ</b>は 遠くまで 運ばれて しずむ。',
  '大水が おきると、その 上に また 同じように つもる。',
  '何回も くりかえす うちに、<b>層が 何まいも 重なる</b>。',
  'つぶは 運ばれる うちに 角が とれて <b>丸い</b>。長い 年月で かたまると <b>れき岩・砂岩・でい岩</b>に なる。'
 ],
 kazan:[
  '火山と、その まわりの 土地。',
  '<b>噴火</b>。火山灰が 高く ふき上がる。',
  '火山灰は <b>風に 流されて 広い はんい</b>に ふる。遠くの 土地にも つもる。',
  'ふった 火山灰が つもって、<b>白っぽい 層</b>に なる。',
  'また 噴火が おきると、その 上に <b>重なる</b>。',
  'つぶは <b>角ばって いる</b>。<b>あなの 多い 石</b>が まじる ことも ある。流れる水で できた 層との ちがい。'
 ]
};
function showS3(){
  const mx=S3MAX[S3.mode];
  S3.step=clamp(S3.step,0,mx);
  $('m3').innerHTML=M3[S3.mode][S3.step];
  $('b3prev').disabled=(S3.step===0);
  $('b3next').disabled=(S3.step===mx);
  $('b3mizu').classList.toggle('on',S3.mode==='mizu');
  $('b3kazan').classList.toggle('on',S3.mode==='kazan');
  const d=$('d3');d.innerHTML='';
  for(let i=0;i<=mx;i++){const e=document.createElement('i');if(i<=S3.step)e.classList.add('on');d.appendChild(e);}
  paint();
}
$('b3next').onclick=()=>{S3.step++;showS3();};
$('b3prev').onclick=()=>{S3.step--;showS3();};
$('b3mizu').onclick=()=>{S3.mode='mizu';S3.step=0;showS3();};
$('b3kazan').onclick=()=>{S3.mode='kazan';S3.step=0;showS3();};
</script>
<script>
/* =========================================================
   ④ 土地の 変化
   解説 (ｳ)「土地は，火山の噴火や地震によって変化すること」
   　「溶岩が流れ出したり，火山灰が噴き出したりして変化した土地の様子や，
   　　大きな地震によって地割れが生じたり断層が地表に現れたり
   　　崖が崩れたりした様子を調べる」
   内容の取扱い「自然災害についても触れること」
   　「過去に起こった…土地が変化したことや将来にも起こる可能性があること」
   ========================================================= */
const S4={mode:'kazan',step:0,off:0};
const S4MAX={kazan:6,jishin:6};

function tree(g,x,by,s){
  g.save();g.fillStyle='#6b4f32';g.fillRect(x-s*.09,by-s*.34,s*.18,s*.34);
  g.fillStyle='#5f8a44';
  g.beginPath();g.moveTo(x,by-s);g.lineTo(x+s*.38,by-s*.30);g.lineTo(x-s*.38,by-s*.30);g.closePath();g.fill();
  g.restore();
}
function house(g,x,by,s){
  g.save();g.fillStyle='#e8e2d2';g.fillRect(x-s*.38,by-s*.55,s*.76,s*.55);
  g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1;g.strokeRect(x-s*.38,by-s*.55,s*.76,s*.55);
  g.fillStyle='#b4583f';
  g.beginPath();g.moveTo(x-s*.48,by-s*.55);g.lineTo(x,by-s);g.lineTo(x+s*.48,by-s*.55);g.closePath();g.fill();
  g.restore();
}
function panel(g,x,y,bw,lines,title,col){
  g.save();
  g.fillStyle='rgba(255,253,247,.95)';g.strokeStyle=col;g.lineWidth=2.5;
  const fs=clamp(bw*.058,11,16),bh=fs*(1.9+lines.length*1.55);
  rr(g,x,y,bw,bh,12);g.fill();g.stroke();g.restore();
  const fs2=clamp(bw*.058,11,16);
  txt(g,title,x+bw/2,y+fs2*1.15,fs2*1.05,col);
  for(let i=0;i<lines.length;i++)txt(g,lines[i],x+bw*.5,y+fs2*(2.4+i*1.55),fs2*.92,'#2b2118');
}

function drawS4(){
  const {g,w,h}=fit($('c4'));
  const t=performance.now()/1000;
  if(S4.mode==='kazan')drawKaz4(g,w,h,t,S4.step);
  else drawJis4(g,w,h,t,S4.step);
}
/* ---------- 火山の 噴火 ---------- */
function drawKaz4(g,w,h,t,st){
  const gy=h*0.76, vx=w*0.45, hw=w*0.18, vtop=h*0.32;
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,st>=1?'#bfb8ae':'#cfe2f0');sky.addColorStop(1,'#eef0e8');
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  /* もとから あった 地面（ここも 地層） */
  const gh=h-gy;
  band(g,0,gy,w,gh*0.34,'suna',51);
  band(g,0,gy+gh*0.34,w,gh*0.30,'doro',52);
  band(g,0,gy+gh*0.64,w,gh*0.40,'reki',53);
  g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
  for(const f of [0.34,0.64]){g.beginPath();g.moveTo(0,gy+gh*f);g.lineTo(w,gy+gh*f);g.stroke();}
  g.fillStyle=st>=4?'#cdc6b6':'#7c9a55';g.fillRect(0,gy-5,w,6);
  /* 火山 */
  g.beginPath();g.moveTo(vx-hw,gy);g.lineTo(vx-hw*0.28,vtop);
  g.lineTo(vx+hw*0.28,vtop);g.lineTo(vx+hw,gy);g.closePath();
  g.fillStyle='#8a7c6a';g.fill();
  g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.4;g.stroke();
  /* よう岩 */
  if(st>=2){
    const done=st>=3, endx=vx+hw*1.35;
    g.save();
    g.beginPath();g.moveTo(vx-hw*0.10,vtop+3);
    g.quadraticCurveTo(vx+hw*0.55,gy-h*0.14,endx,gy-2);
    g.lineTo(endx+w*0.05,gy-2);
    g.quadraticCurveTo(vx+hw*0.75,gy-h*0.09,vx+hw*0.12,vtop+3);
    g.closePath();
    if(done)g.fillStyle='#4a4038';
    else{const lg=g.createLinearGradient(vx,vtop,endx,gy);
      lg.addColorStop(0,'#ffd24a');lg.addColorStop(.5,'#f2762a');lg.addColorStop(1,'#d2401c');g.fillStyle=lg;}
    g.fill();
    /* ふもとに 広がった ぶん（すじ1本だと 土地に なったように 見えない） */
    g.beginPath();g.moveTo(vx+hw*0.55,gy);
    g.quadraticCurveTo(vx+hw*1.15,gy-h*0.055,endx+w*0.11,gy);
    g.closePath();g.fill();
    g.restore();
    if(done){
      const rd=prng(88);g.fillStyle='rgba(20,16,12,.45)';
      for(let i=0;i<55;i++){const x=vx+hw*0.6+rd()*(endx+w*0.11-vx-hw*0.6),y=gy-h*0.01-rd()*h*0.045;
        g.beginPath();g.arc(x,y,2+rd()*4,0,TAU);g.fill();}
      txt(g,'よう岩が かたまった 土地',vx+hw*0.85,gy+gh*0.14,clamp(w*.021,10,14),'#2b2118');
    }else txt(g,'よう岩',vx+hw*0.80,gy-h*0.16,clamp(w*.024,11,16),'#d2401c');
  }
  /* 新しく もり上がった 山（左がわ。よう岩と はなして おく） */
  if(st>=5){
    const cx=w*0.14,cw2=w*0.10;
    g.beginPath();g.moveTo(cx-cw2,gy);
    g.quadraticCurveTo(cx,gy-h*0.24,cx+cw2,gy);g.closePath();
    g.fillStyle='#9d7a62';g.fill();g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.4;g.stroke();
    arrow(g,cx,gy-h*0.30,cx,gy-h*0.20,'#d2622a',3,9);
    txt(g,'もり上がった',cx,gy-h*0.32,clamp(w*.021,10,14),'#d2622a','center','bottom');
  }else{
    tree(g,w*0.13,gy-4,clamp(h*.10,22,48));
  }
  /* 噴煙 */
  if(st>=1){

    for(let i=0;i<120;i++){
      const ph=(t*0.14+i/120)%1,up=Math.pow(ph,0.7);
      const x=vx+(rd()-.5)*w*0.06+up*w*0.26*(rd()-0.15);
      const y=vtop-up*h*0.25+(rd()-.5)*h*0.03;
      g.beginPath();g.arc(x,y,3+up*clamp(w*0.016,5,13)*(0.5+rd()),0,TAU);
      g.fillStyle='rgba(140,133,124,'+(0.30-up*0.14)+')';g.fill();
    }
  }
  /* ふりつもる 火山灰 */
  if(st>=4){
    const rd=prng(4444);
    for(let i=0;i<90;i++){
      const ph=(t*0.30+i/90)%1;
      g.beginPath();g.arc(rd()*w,lerp(0,gy-6,ph),1.5+rd()*1.5,0,TAU);
      g.fillStyle='rgba(120,112,100,.5)';g.fill();
    }
    txt(g,'火山灰が つもる',w*0.86,gy-h*0.20,clamp(w*.022,11,15),'#d2622a','center','bottom');
  }
  /* 木と 家（右はし） */
  house(g,w*0.87,gy-4,clamp(h*.085,20,42));
  if(st<4)tree(g,w*0.96,gy-4,clamp(h*.09,20,44));

    const bw=clamp(w*0.44,220,350);

      ['よう岩・火山灰・火さい流から 身を 守る','ハザードマップで 危ない ところを 知る','むかし おきた ことは、また おこる ことが ある'],
      '火山と どう つきあうか','#d2622a');
  }
}

/* 地層の 上の 字は 読みにくいので、うすい 板を しいてから かく */
function tag(g,str,x,y,size,col,align){
  g.save();g.font='700 '+size+'px sans-serif';
  const tw=g.measureText(str).width+12;g.restore();
  const ax=align==='left'?x:(align==='right'?x-tw:x-tw/2);
  g.fillStyle='rgba(255,253,247,.88)';
  rr(g,ax,y-size*0.85,tw,size*1.7,6);g.fill();
  txt(g,str,ax+tw/2,y,size,col);
}
function drawJis4(g,w,h,t,st){
  const gy=h*0.40;
  const fx0=w*0.46,fx1=w*0.60;
  const off=S4.off;
  const sky=g.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,'#cfe2f0');sky.addColorStop(1,'#eaf0ee');
  g.fillStyle=sky;g.fillRect(0,0,w,gy+2);
  const LY=[
    {k:'soil',t:0.00,b:0.05},{k:'reki',t:0.05,b:0.22},{k:'suna',t:0.22,b:0.36},
    {k:'hai',t:0.36,b:0.44},{k:'doro',t:0.44,b:0.66},{k:'suna',t:0.66,b:0.84},{k:'reki',t:0.84,b:1.10}
  ];
  const H=h-gy;
  function blockLayers(shift){
    for(let i=0;i<LY.length;i++){
      const L=LY[i],y=gy+L.t*H-shift,hh=(L.b-L.t)*H;
      band(g,-2,y,w+4,hh,L.k,i*23+5,L.k==='doro');
      g.strokeStyle='rgba(60,48,30,.35)';g.lineWidth=1;
      g.beginPath();g.moveTo(-2,y+hh);g.lineTo(w+2,y+hh);g.stroke();
    }
  }
  /* 左の ブロック */
  g.save();
  g.beginPath();g.moveTo(-2,gy-40);g.lineTo(fx0,gy-40);g.lineTo(fx1,h+2);g.lineTo(-2,h+2);g.closePath();
  g.clip();blockLayers(0);
  g.strokeStyle='#7c9a55';g.lineWidth=4;g.beginPath();g.moveTo(-2,gy);g.lineTo(fx0+6,gy);g.stroke();
  g.restore();
  /* 右の ブロック（ずれる） */
  g.save();
  g.beginPath();g.moveTo(fx0,gy-40-off);g.lineTo(w+2,gy-40-off);g.lineTo(w+2,h+2);g.lineTo(fx1,h+2);g.closePath();
  g.clip();blockLayers(off);
  g.strokeStyle='#7c9a55';g.lineWidth=4;g.beginPath();g.moveTo(fx0-6,gy-off);g.lineTo(w+2,gy-off);g.stroke();
  g.restore();
  /* 断層の 線 */
  if(off>1){
    g.save();g.strokeStyle='#7a5aa8';g.lineWidth=3.5;
    g.beginPath();g.moveTo(fx0,gy-off);g.lineTo(fx1,h);g.stroke();g.restore();
  }
  /* 力の 矢じるし */
  if(st===1||st===2){
    const p=(Math.sin(t*3)*0.5+0.5)*w*0.03;
    arrow(g,w*0.04+p,gy+H*0.55,w*0.20+p,gy+H*0.55,'#7a5aa8',5,13);
    arrow(g,w*0.96-p,gy+H*0.55,w*0.80-p,gy+H*0.55,'#7a5aa8',5,13);
    tag(g,'大きな 力',w*0.13+p,gy+H*0.43,clamp(w*.022,11,15),'#7a5aa8');
  }
  /* 段差と 断層の 名前 */
  if(st>=3&&off>6){
    g.save();g.setLineDash([4,4]);g.strokeStyle='#7a5aa8';g.lineWidth=2;
    g.beginPath();g.moveTo(fx0+w*0.05,gy);g.lineTo(fx0+w*0.05,gy-off);g.stroke();g.restore();
    arrow(g,fx0+w*0.05,gy,fx0+w*0.05,gy-off,'#7a5aa8',2,7);
    tag(g,'段差',fx0+w*0.075,gy-off/2,clamp(w*.021,11,15),'#7a5aa8','left');
    tag(g,'断層',(fx0+fx1)/2+w*0.045,gy+H*0.33,clamp(w*.022,11,16),'#7a5aa8');
  }
  /* 地われ と がけくずれ */
  if(st>=4){
    const cx=w*0.34,cw2=clamp(w*0.018,7,15);
    g.save();g.fillStyle='#3b3128';
    g.beginPath();g.moveTo(cx-cw2,gy);g.lineTo(cx+cw2,gy);g.lineTo(cx+cw2*0.2,gy+H*0.22);g.lineTo(cx-cw2*0.3,gy+H*0.20);g.closePath();g.fill();g.restore();
    const rd=prng(606);
    g.fillStyle='#a8977a';
    for(let i=0;i<34;i++){
      const x=fx0-w*0.01+rd()*w*0.08,y=gy-rd()*off*0.9;
      g.beginPath();g.arc(x,y+off*0.1,2+rd()*5,0,TAU);g.fill();
    }
    if(st===4){
      tag(g,'地われ',cx,gy-h*0.05,clamp(w*.021,11,15),'#7a5aa8');
      tag(g,'がけくずれ',fx0-w*0.02,gy+H*0.13,clamp(w*.021,11,15),'#7a5aa8');
    }
  }
  /* もち上がる・しずむ（空の ところに 出す） */
  if(st>=5){
    arrow(g,w*0.84,gy-off-h*0.06,w*0.84,gy-off-h*0.20,'#d2622a',4,11);
    txt(g,'もち上がる',w*0.84,gy-off-h*0.22,clamp(w*.022,11,15),'#d2622a','center','bottom');
    arrow(g,w*0.17,gy-h*0.22,w*0.17,gy-h*0.07,'#2f6fa8',4,11);
    txt(g,'しずむ',w*0.17,gy-h*0.24,clamp(w*.022,11,15),'#2f6fa8','center','bottom');
  }
  /* 木と 家 */
  if(st<4){house(g,w*0.09,gy-2,clamp(h*.085,20,42));tree(g,w*0.24,gy-2,clamp(h*.09,20,44));}
  else house(g,w*0.06,gy-2,clamp(h*.085,20,42));
  tree(g,w*0.70,gy-off-2,clamp(h*.09,20,44));
  if(st>=6){
    const bw=clamp(w*0.44,220,350);
    panel(g,w/2-bw/2,h*0.02,bw,
      ['地われ・がけくずれ・つ波に 気を つける','ゆれたら まず 身を 守る。きけんな 場所を 知って おく','むかし おきた ことは、また おこる ことが ある'],
      '地震と どう つきあうか','#7a5aa8');
  }
}

 {n:'根尾谷断層',pref:'岐阜県',lon:136.63,lat:35.61,cat:'jishin',art:'dansou',
  say:'1891年の 大きな 地震で 地面に できた <b>段差</b>。高さは 6mほど。いまも 見る ことが できる。'},
 {n:'千畳敷',pref:'和歌山県',lon:135.33,lat:33.68,cat:'mizu',art:'daichi',
  say:'<b>砂</b>が つもって できた 岩が、波に けずられて 広い 台に なった。地層の 重なりが 上から 見える。'},
 {n:'野島断層',pref:'兵庫県',lon:134.98,lat:34.56,cat:'jishin',art:'dansou',
  say:'1995年の 地震で 地表に 現れた <b>断層</b>。田んぼの あぜや 道が ずれた ようすを、その まま のこして ある。'},
 {n:'室戸岬',pref:'高知県',lon:134.18,lat:33.25,cat:'jishin',art:'ryuuki',
  say:'海の 底に つもった 地層が <b>もち上がって</b> できた 岬。地震の たびに 土地が 高く なって きた。'},
 {n:'須佐（ホルンフェルス）',pref:'山口県',lon:131.60,lat:34.62,cat:'mizu',photo:'horn',
  say:'砂と どろが <b>交ごに つもった 地層</b>。地下から 上がって きた マグマの 熱で かたく 焼かれた。白と 黒の しま模様の 大きな がけ。'},
 {n:'青島（鬼の洗濯板）',pref:'宮崎県',lon:131.47,lat:31.80,cat:'mizu',photo:'onisen',
  say:'海の 底に 砂と どろが <b>交ごに つもった 地層</b>。もち上がって 波に けずられ、かたい 砂の 層だけが すじに なって のこった。'},
 {n:'阿蘇',pref:'熊本県',lon:131.08,lat:32.88,cat:'kazan',art:'kazan',
  say:'大むかしの 大きな 噴火で、<b>火山灰</b>や 火さい流が 広い はんいに 広がった。その あと 大きな くぼ地が のこった。'},
 {n:'桜島',pref:'鹿児島県',lon:130.66,lat:31.59,cat:'kazan',art:'kazan',
  say:'いまも 噴火して いる 火山。1914年の 噴火で 流れた <b>よう岩</b>が、島と 半島を つないだ。まわりには 火山灰が つもる。'}
];
const S5={sel:15,fil:'all',hit:[]};

function bounds(keys){
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const k of keys){const p=JP[k];
    for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);b=Math.max(b,p[i]);c=Math.min(c,p[i+1]);d=Math.max(d,p[i+1]);}}
  return {lo1:a,lo2:b,la1:c,la2:d};
}
const KLON=Math.cos(37.5*Math.PI/180);   /* 経度1度は 緯度1度より みじかい */
function mapper(keys,x0,y0,bw,bh,pad){
  const B=bounds(keys);
  const dx=(B.lo2-B.lo1)*KLON,dy=(B.la2-B.la1);
  const s=Math.min((bw-pad*2)/dx,(bh-pad*2)/dy);
  const ox=x0+pad+((bw-pad*2)-dx*s)/2, oy=y0+pad+((bh-pad*2)-dy*s)/2;
  return (lon,lat)=>[ox+(lon-B.lo1)*KLON*s, oy+(B.la2-lat)*s];
}
function poly(g,arr,P,fill,stroke,lw){
  g.beginPath();
  for(let i=0;i<arr.length;i+=2){const p=P(arr[i],arr[i+1]);g[i?'lineTo':'moveTo'](p[0],p[1]);}
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1.4;g.stroke();}
}
function pin(g,x,y,col,r,on){
  g.save();
  g.beginPath();
  g.arc(x,y-r,r,Math.PI*0.86,Math.PI*0.14,false);
  g.lineTo(x,y+r*0.62);g.closePath();
  g.fillStyle=col;g.fill();
  g.strokeStyle=on?'#c9a227':'#fffdf7';g.lineWidth=on?3:2;g.stroke();
  g.beginPath();g.arc(x,y-r,r*0.40,0,TAU);g.fillStyle='#fffdf7';g.fill();
  g.restore();
}
function drawS5(){
  const {g,w,h}=fit($('c5'));
  g.fillStyle='#dceaf1';g.fillRect(0,0,w,h);
  const P=mapper(MAIN,0,0,w,h*0.985,Math.max(10,w*0.02));
  for(const k of MAIN)poly(g,JP[k],P,'#efe4c6','#b09a6c',1.5);
  /* 沖縄は 遠いので 別わく（教科書の 地図と 同じ やり方） */
  const iw=clamp(w*0.20,74,120),ih=iw*1.05,ix=8,iy=8;
  g.save();
  g.fillStyle='#dceaf1';g.strokeStyle='#b09a6c';g.lineWidth=1.4;
  g.setLineDash([5,4]);rr(g,ix,iy,iw,ih,8);g.fill();g.stroke();g.restore();
  const P2=mapper(['okinawa'],ix,iy,iw,ih-14,10);
  poly(g,JP.okinawa,P2,'#efe4c6','#b09a6c',1.5);
  txt(g,'沖縄県',ix+iw/2,iy+ih-8,clamp(iw*.13,9,13),'#7a6a52');
  /* ピン */
  S5.hit=[];
  const r=clamp(w*0.018,7,12);
  for(let i=0;i<SPOTS.length;i++){
    const sp=SPOTS[i],p=P(sp.lon,sp.lat);
    const on=(i===S5.sel), show=(S5.fil==='all'||S5.fil===sp.cat);
    S5.hit.push({x:p[0],y:p[1],i,show});
    if(i===S5.sel)continue;
    g.globalAlpha=show?1:0.20;
    pin(g,p[0],p[1],CAT[sp.cat].c,r,false);
    g.globalAlpha=1;
  }
  /* えらんで いる ピンは 最後に（上に 出す） */
  const sp=SPOTS[S5.sel],p=P(sp.lon,sp.lat);
  pin(g,p[0],p[1],CAT[sp.cat].c,r*1.3,true);
  const fs=clamp(w*0.029,11,16);
  g.save();g.font='700 '+fs+'px sans-serif';
  const label=sp.pref+' '+sp.n;
  const tw=g.measureText(label).width+16;g.restore();
  /* ふきだしは ピンの あいて いる がわに 出す（左はしの 沖縄の わくと かさねない） */
  let lx=(p[0]<w*0.5)?p[0]+r*1.1:p[0]-tw-r*1.1;
  lx=clamp(lx,4,w-tw-4);
  let ly=p[1]-r*1.9-fs*0.95;
  if(ly<4)ly=p[1]+r*0.6;
  g.fillStyle='rgba(255,253,247,.95)';g.strokeStyle='#c9a227';g.lineWidth=2;
  rr(g,lx,ly,tw,fs*1.9,8);g.fill();g.stroke();
  txt(g,label,lx+tw/2,ly+fs*0.95,fs,'#2b2118');
}
/* ---- 写真の ない ところの 絵 ---- */
function drawS5v(){
  const {g,w,h}=fit($('c5v'));
  const sp=SPOTS[S5.sel];
  if(sp.photo){g.clearRect(0,0,w,h);return;}
  art(g,w,h,sp.art);
}
function art(g,w,h,kind){
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#d5e6f0');sky.addColorStop(1,'#eef1e6');
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  const gy=h*0.86;
  if(kind==='gosou'||kind==='hai'||kind==='gake'){
    /* しま模様の がけ（互層・火山灰・川ぞいの がけ） */
    const x0=w*0.08,x1=w*0.92,top=h*0.16;
    const pat=kind==='hai'?['hai','doro','hai','suna','hai','doro','hai','suna']
            :kind==='gake'?['suna','doro','suna','hai','doro','suna','doro']
            :['suna','doro','suna','doro','suna','doro','suna','doro'];
    const bh=(gy-top)/pat.length;
    for(let i=0;i<pat.length;i++){
      band(g,x0,top+i*bh,x1-x0,bh,pat[i],i*9+2,kind==='gake'&&i===4);
      g.strokeStyle='rgba(60,48,30,.4)';g.lineWidth=1;
      g.beginPath();g.moveTo(x0,top+(i+1)*bh);g.lineTo(x1,top+(i+1)*bh);g.stroke();
    }
    g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.6;g.strokeRect(x0,top,x1-x0,gy-top);
    if(kind==='gake'){g.fillStyle='#8fc3dc';g.fillRect(0,gy,w,h-gy);txt(g,'川',w*0.5,gy+(h-gy)/2,clamp(w*.05,10,15),'#2f6fa8');}
    else{g.fillStyle='#cdbf9f';g.fillRect(0,gy,w,h-gy);}
  }else if(kind==='dansou'){
    const top=h*0.20,H=gy-top,fx0=w*0.46,fx1=w*0.60,off=H*0.22;
    const pat=['soil','reki','suna','hai','doro','suna'];
    const bh=H/pat.length;
    for(const side of [0,1]){
      g.save();g.beginPath();
      if(side===0){g.moveTo(0,top-off);g.lineTo(fx0,top-off);g.lineTo(fx1,h);g.lineTo(0,h);}
      else{g.moveTo(fx0,top-off);g.lineTo(w,top-off);g.lineTo(w,h);g.lineTo(fx1,h);}
      g.closePath();g.clip();
      const sh=side?off:0;
      for(let i=0;i<pat.length;i++)band(g,-2,top+i*bh-sh,w+4,bh+1,pat[i],i*13+4);
      g.restore();
    }
    g.save();g.strokeStyle='#7a5aa8';g.lineWidth=3;
    g.beginPath();g.moveTo(fx0,top-off);g.lineTo(fx1,h);g.stroke();g.restore();
    /* 上がったのは 右がわなので、矢じるしも 右に 出す */
    const ax=fx1+w*0.16;
    arrow(g,ax,top+off*0.25,ax,top-off+2,'#7a5aa8',3,9);
    txt(g,'ずれ',ax,top+off*0.75,clamp(w*.05,10,15),'#7a5aa8','center','top');
  }else if(kind==='kaseki'){
    const x0=w*0.08,x1=w*0.92,top=h*0.16;
    const pat=['suna','doro','suna','doro'];const bh=(gy-top)/pat.length;
    for(let i=0;i<pat.length;i++)band(g,x0,top+i*bh,x1-x0,bh,pat[i],i*5+1);
    g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.6;g.strokeRect(x0,top,x1-x0,gy-top);
    /* アンモナイト */
    const cx=w*0.5,cy=(top+gy)/2,R=Math.min(w,h)*0.17;
    g.save();g.translate(cx,cy);
    g.beginPath();
    for(let a=0;a<TAU*2.1;a+=0.08){const r=R*Math.exp(0.11*(a-TAU*2.1));g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    g.strokeStyle='#fbf6e6';g.lineWidth=Math.max(5,R*0.30);g.lineJoin='round';g.stroke();
    g.strokeStyle='rgba(80,64,40,.8)';g.lineWidth=1.6;g.stroke();
    g.restore();
    g.fillStyle='#cdbf9f';g.fillRect(0,gy,w,h-gy);
  }else if(kind==='yougan'){
    /* おくに 火山、手前に かたまった よう岩 */
    g.beginPath();g.moveTo(w*0.18,h*0.62);g.lineTo(w*0.44,h*0.16);
    g.lineTo(w*0.58,h*0.16);g.lineTo(w*0.86,h*0.62);g.closePath();
    g.fillStyle='#9c8f7c';g.fill();g.strokeStyle='rgba(60,48,30,.45)';g.lineWidth=1.2;g.stroke();
    g.fillStyle='#b6a888';g.fillRect(0,h*0.62,w,h);
    g.fillStyle='#4a4038';
    g.beginPath();g.moveTo(0,h*0.70);
    g.quadraticCurveTo(w*0.3,h*0.58,w*0.62,h*0.66);
    g.quadraticCurveTo(w*0.85,h*0.72,w,h*0.64);g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fill();
    const rd=prng(2024);
    for(let i=0;i<70;i++){
      const x=rd()*w,y=h*0.70+rd()*h*0.28;
      g.beginPath();g.ellipse(x,y,3+rd()*9,2+rd()*6,rd()*TAU,0,TAU);
      g.fillStyle=rd()<.5?'#3a322c':'#5a5048';g.fill();
    }
    txt(g,'かたまった よう岩',w/2,h*0.86,clamp(w*.055,11,17),'rgba(255,253,247,.95)');
  }else if(kind==='kazan'){
    g.fillStyle='#b6a888';g.fillRect(0,h*0.80,w,h);
    g.beginPath();g.moveTo(w*0.12,h*0.80);g.lineTo(w*0.42,h*0.30);g.lineTo(w*0.58,h*0.30);g.lineTo(w*0.88,h*0.80);g.closePath();
    g.fillStyle='#8a7c6a';g.fill();g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.4;g.stroke();
    const rd=prng(7);
    for(let i=0;i<70;i++){
      const up=rd();
      g.beginPath();g.arc(w*0.5+(rd()-.5)*w*0.28*(0.3+up),h*0.30-up*h*0.24,3+up*10,0,TAU);
      g.fillStyle='rgba(140,133,124,'+(0.30-up*0.14)+')';g.fill();
    }
  }else if(kind==='ryuuki'||kind==='daichi'){
    g.fillStyle='#8fc3dc';g.fillRect(0,h*0.58,w,h);
    const top=h*0.30,x0=-2,x1=w*0.78;
    const pat=['suna','doro','suna','doro','suna'];
    const bh=(h*0.62-top)/pat.length;
    g.save();g.beginPath();
    g.moveTo(x0,top);g.lineTo(x1,top+h*0.04);g.lineTo(x1-w*0.06,h);g.lineTo(x0,h);g.closePath();g.clip();
    for(let i=0;i<pat.length;i++)band(g,-2,top+i*bh,w,bh+1,pat[i],i*11+6);
    g.restore();
    g.save();g.strokeStyle='rgba(60,48,30,.5)';g.lineWidth=1.6;
    g.beginPath();g.moveTo(x0,top);g.lineTo(x1,top+h*0.04);g.lineTo(x1-w*0.06,h);g.stroke();g.restore();
    /* 波 */
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;
    for(let i=0;i<3;i++){
      const y=h*0.66+i*h*0.09;
      g.beginPath();
      for(let x=x1-w*0.10;x<w;x+=8)g.lineTo(x,y+Math.sin(x*0.16+i)*3);
      g.stroke();
    }
    if(kind==='ryuuki'){
      arrow(g,w*0.30,top+h*0.22,w*0.30,top-h*0.16,'#d2622a',4,11);
      txt(g,'もち上がる',w*0.30,top-h*0.18,clamp(w*.055,11,16),'#d2622a','center','bottom');
    }else{
      txt(g,'波に けずられた 岩の 台',w*0.40,top-h*0.06,clamp(w*.050,10,15),'#2b2118','center','bottom');
    }
  }
}
function showS5(){
  const sp=SPOTS[S5.sel],C=CAT[sp.cat];
  $('spotName').innerHTML=sp.n+'<span class="chip" style="background:'+C.c+'">'+C.s+'</span>'+
    '<small>'+sp.pref+'</small>';
  $('m5').innerHTML=sp.say;
  const img=$('p5'),cr=$('cr5');
  if(sp.photo){img.src=PHOTO[sp.photo];img.classList.add('on');cr.style.display='block';}
  else{img.classList.remove('on');img.removeAttribute('src');cr.style.display='none';}
  paint();
}
$('c5').addEventListener('click',e=>{
  const r=$('c5').getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  let best=-1,bd=1e9;
  for(const p of S5.hit){
    if(!p.show)continue;
    const d=Math.hypot(p.x-x,p.y-y+8);
    if(d<bd){bd=d;best=p.i;}
  }
  if(best>=0&&bd<Math.max(26,r.width*0.04)){S5.sel=best;showS5();}
});
(function buildFilters(){
  const box=$('fil5');
  const list=[['all','ぜんぶ','#7a6a52']].concat(Object.keys(CAT).map(k=>[k,CAT[k].s,CAT[k].c]));
  for(const [k,label,col] of list){
    const b=document.createElement('button');
    b.className='fil'+(k==='all'?' on':'');
    b.innerHTML='<i style="background:'+col+'"></i>'+label;
    b.onclick=()=>{
      S5.fil=k;
      [...box.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      if(k!=='all'&&SPOTS[S5.sel].cat!==k){
        const i=SPOTS.findIndex(s=>s.cat===k);if(i>=0)S5.sel=i;
      }
      showS5();
    };
    b.style.borderColor=col;
    box.appendChild(b);
  }
})();
</script>
<script>
/* ========================= タブと えがき直し ========================= */
let cur=1, dirty=true;
function paint(){dirty=true;}          /* えがき直しの 予約 */
function render(){
  if(cur===1){drawS1();drawS1v();msgS1();}
  else if(cur===2)drawS2();
  else if(cur===3)drawS3();
  else if(cur===4)drawS4();
  else if(cur===5){drawS5();drawS5v();}
}
function setStage(n){
  cur=n;
  for(const t of document.querySelectorAll('.tab'))t.classList.toggle('on',+t.dataset.s===n);
  for(let i=1;i<=5;i++)$('s'+i).classList.toggle('on',i===n);
  paint();
}
for(const t of document.querySelectorAll('.tab'))t.onclick=()=>setStage(+t.dataset.s);
window.addEventListener('resize',paint);
window.addEventListener('orientationchange',()=>setTimeout(paint,120));

function loop(){
  /* ②の「標高で そろえる」 */
  const t2=(S2.step>=5)?1:0;
  const move2=Math.abs(S2.a-t2)>0.002;
  if(move2)S2.a+=(t2-S2.a)*0.13; else S2.a=t2;
  /* ④の 断層の ずれ */
  const r4=$('c4').getBoundingClientRect();
  const t4=(S4.mode==='jishin'&&S4.step>=2)?r4.height*0.135:0;
  const move4=Math.abs(S4.off-t4)>0.3;
  if(move4)S4.off+=(t4-S4.off)*0.11; else S4.off=t4;
  /* ③④は うごく 絵なので 毎回。ほかは 必要な ときだけ */
  if(cur===3||cur===4||dirty||(cur===2&&move2)){render();dirty=false;}
  requestAnimationFrame(loop);
}
showS2();showS3();showS4();showS5();msgS1();
setStage(1);
requestAnimationFrame(loop);
</script>
