<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>あまりのある わり算</title>
<style>
:root{
  /* ほかの算数アプリと 同じ 和紙色。--bg がページ、--paper がカード。
     ほかのアプリの --paper（#fdf6e3）＝ここの --bg、--card（#fffdf7）＝ここの --paper */
  --bg:#fdf6e3;
  --paper:#fffdf7;
  --line:#e7d9b8;
  --line2:#cbb489;
  --ink:#2b2118;
  --muted:#8a7a5f;
  --gold:#c9a227;
  --gold-l:#f7ecc9;
  --gold-d:#a5811a;
  --ok:#5a8a4c;
  --ok-l:#f2f9ee;
  /* あまりの だいだいは そのまま。金・みどりと ぶつからず、
     「あまり」だけを 表す 色として 3画面で つかっている */
  --amari:#E2621C;
  --amari-l:#FDE7D8;
  --f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Klee One","BIZ UDPGothic","Yu Gothic UI",sans-serif;
  --f-text:"UD デジタル 教科書体 NP-R","UDデジタル教科書体 NP-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Zen Maru Gothic","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,#fef0d0 0,transparent 40%),
    radial-gradient(circle at 85% 90%,#fbe6cf 0,transparent 45%),
    var(--bg);
  font-family:var(--f-round);overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100vh;height:var(--appH,100vh);padding:8px 14px 12px;gap:8px}

/* ---- ヘッダー ---- */
#top{display:flex;align-items:center;gap:8px}
#tabs{display:flex;gap:4px;background:#f0e6cd;border-radius:12px;padding:4px}
.tab{border:0;background:transparent;border-radius:9px;padding:7px 15px;
  font-size:clamp(13px,1.35vw,18px);color:#8a7a5f}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(22,48,78,.18)}
#top .spacer{flex:1}

#mondai{margin:0;font-family:var(--f-text);font-size:clamp(15px,1.95vw,30px);
  line-height:1.4;letter-spacing:.02em}
#mondai b{color:var(--gold-d);font-weight:700}

/* ---- 設定 ---- */
#settings{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#settings.hide{display:none}
.grp{display:flex;align-items:center;gap:6px}
.grp.k{display:none}
body.kimari .grp.w{display:none}
body.kimari .grp.k{display:flex}
.glab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.num{min-width:2.1em;text-align:center;font-size:clamp(16px,1.6vw,22px);font-weight:700;color:var(--gold-d)}
.step{border:1px solid var(--line2);background:var(--paper);border-radius:9px;
  width:2em;height:2em;font-size:clamp(14px,1.4vw,19px);line-height:1;display:grid;place-items:center}
.step:active{background:#f5edda}
.sep{width:1px;align-self:stretch;background:var(--line)}
select{font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink);
  border:1px solid var(--line2);border-radius:9px;padding:6px 8px}

/* ---- 本体 ---- */
#main{flex:1;min-height:0;display:flex;gap:12px;overflow:hidden}
.pane{flex:1;min-width:0;position:relative;background:var(--paper);
  border:1px solid var(--line);border-radius:16px;overflow:hidden}
body.kimari #stage{display:none}
body:not(.kimari) #ktable{display:none}

/* ---- わけて みる ---- */
.band{position:absolute;left:0;right:0;pointer-events:none}
.band .bl{position:absolute;left:12px;top:4px;font-size:13px;color:var(--muted);letter-spacing:.08em}
#bandPool{background:#fbf6ea;border-bottom:1px dashed var(--line2)}
#bandAmari{border-top:1px dashed var(--amari);background:var(--amari-l)}
#bandAmari .bl{color:var(--amari);font-weight:700}

#stage,#ktable{cursor:pointer}
/* おした ことが わかるように ひかる */
#stage.tapped,#ktable.tapped{background:#f5edda}
#conts,#items,#ghosts{position:absolute;inset:0;pointer-events:none}

#items{z-index:3}
#ghosts{z-index:2}

.cont{position:absolute;border:2px solid var(--line2);background:#fdfaf1;
  transition:border-color .3s,background .3s,opacity .3s;opacity:0}
.cont.on{opacity:1}
.cont.bag{border-radius:12px 12px 22px 22px}
.cont.plate{border-radius:14px 14px 34% 34%}
.cont.done{border-color:var(--ok);background:var(--ok-l)}
.cont .clab{position:absolute;left:0;right:0;top:-1.35em;text-align:center;
  font-size:13px;color:var(--muted);white-space:nowrap}
.cont.done .clab{color:var(--ok);font-weight:700}

.item{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
  background:#fffdf7;border:1px solid var(--line);border-radius:50%;
  transition:transform .45s cubic-bezier(.22,.75,.3,1);will-change:transform}
.item.noanim{transition:none}
.item.amari{background:#fffdf7;border-color:var(--amari);box-shadow:0 0 0 2px var(--amari)}
.ghost{position:absolute;left:0;top:0;border:2px dashed var(--amari);
  border-radius:50%;opacity:0;transition:opacity .3s}
.ghost.on{opacity:1}

/* ---- くらべて みる ---- */
#ktable{padding:10px 14px;overflow:auto}
#krows{display:flex;flex-direction:column;gap:5px}
.krow{display:grid;align-items:center;gap:0 .1em;
  grid-template-columns:2.4em .9em 1.7em 1.1em 1.7em 3.4em 1.7em 1fr;
  font-size:clamp(16px,1.9vw,27px);padding:4px 8px;border-radius:10px;
  background:#fbf6ea;border:1px solid transparent}
.krow > span{text-align:center}
.krow .n{font-weight:700}
.krow .q{color:var(--gold-d);font-weight:700}
.krow .am{font-size:.62em;color:var(--muted)}
.krow .r{color:var(--amari);font-weight:700}
.krow.zero{background:var(--ok-l);border-color:#c6ddb8}
.krow.zero .r{color:var(--ok)}
.krow.zero .am{color:var(--ok)}
.krow.new{border-color:var(--gold);background:var(--gold-l)}
.strip{display:flex;align-items:center;gap:7px;justify-self:start;padding-left:12px;flex-wrap:wrap}
.grpx{display:flex;gap:2px;padding:2px 3px;border-radius:5px;background:#efe4c9;border:1px solid #dcc9a2}
.grpx.rem{background:var(--amari-l);border-color:var(--amari)}
.grpx i{display:block;width:.42em;height:.42em;border-radius:2px;background:#8c7a58;font-size:inherit}
.grpx.rem i{background:var(--amari)}
#kend{margin-top:10px;font-family:var(--f-text);font-size:clamp(13px,1.4vw,20px);color:var(--muted)}

/* ---- 右パネル ---- */
#rail{flex:none;width:clamp(206px,21.5%,304px);display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ctitle{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
.wcard{flex:none}
body.kimari .wcard{display:none}

/* 九九の ひょう。列の 見出しで「どの数が なにか」を 1回だけ しめす＝
   行ごとに ことばを くりかえさない（2026-09-12） */
#kukuCard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.kimari #kukuCard{display:none}
.kkgrid{display:grid;grid-template-columns:1fr .6em 1fr .6em 1.35fr;
  gap:0 .08em;align-items:center;text-align:center}
#kukuHead{font-size:clamp(10px,1.18vw,15px);color:var(--muted);
  margin-bottom:5px;padding:0 4px;line-height:1.2}
#kukuHead .hd{font-weight:700}
#kukuHead .hq{color:var(--gold-d)}
#kukuHead .hu{color:var(--ok)}
#kukuList{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}
.kk{padding:3px 4px;border-radius:8px;font-size:clamp(15px,1.72vw,24px);
  font-weight:700;background:#F4F1E6;color:var(--muted)}
.kk .kq{color:var(--gold-d)}
.kk .ku{color:var(--ok)}
.kk.done{background:var(--ok-l);color:var(--ink)}
.kk.over{background:var(--amari-l);color:var(--amari)}
.kk.over .kq,.kk.over .ku{color:var(--amari)}
/* いま つかっている 九九の「こたえ」だけ 金の ふだに する。
   しきカードの こたえ（金）と 同じ色なので、どの数が こたえか 目で つながる */
.chip{display:inline-block;background:var(--gold);color:#3A2600;
  border-radius:8px;padding:1px .42em;min-width:1.1em;line-height:1.25}
/* 大きすぎる 九九には わけを そえる（なぜ そこで とまるか）。
   「13より 大きい」のは 15 のことなので、つかった数の 列の 下に おく
   （行ぜんたいの 下に 置くと、どの数の ことか 分からない。2026-09-12 指摘） */
/* 1行に つめると 8px まで 小さくなって 読めない。
   2行に おりかえして 字を 大きく する（「13より／大きい」で 切れる） */
.kknote{grid-column:5;font-size:clamp(11px,1.2vw,16px);font-weight:700;
  margin-top:2px;letter-spacing:0;line-height:1.25;word-break:keep-all}
#kukuEmpty{font-size:clamp(11px,1.15vw,14px);color:var(--muted);padding:4px 6px;text-align:center}
body:not(.kimari) .kcard{display:none}

#shikiRow{display:flex;align-items:flex-end;justify-content:center;gap:.18em;flex-wrap:wrap;padding-bottom:2px;
  font-size:clamp(19px,2.3vw,34px);line-height:1.1}
.slot{display:inline-flex;flex-direction:column;align-items:center;min-width:1.5em}
.slot.op{min-width:.7em}
.slot .v{font-weight:700}
.slot .u{font-size:.42em;color:var(--muted);margin-top:.25em}
.slot.q .v{color:var(--gold-d)}
.slot.r .v{color:var(--amari)}
.slot .v.blank{color:var(--line2)}
#kotae{margin-top:8px;text-align:center;font-family:var(--f-text);
  font-size:clamp(13px,1.35vw,19px);min-height:1.4em;line-height:1.4}

#ringRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ring{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(15px,1.55vw,21px);font-weight:700;border:2px solid var(--line2);
  color:var(--muted);background:#fbf6ea;transition:background .25s,color .25s,border-color .25s}
.ring.seen{border-color:var(--amari);color:var(--amari);background:var(--amari-l)}
.ring.zero.seen{border-color:var(--ok);color:var(--ok);background:var(--ok-l)}
.ring.now{transform:scale(1.12);box-shadow:0 0 0 3px var(--gold-l)}
.ring.no{border-style:dashed;border-color:var(--line2);color:var(--line2);background:transparent;position:relative}
.ring.no::after{content:"";position:absolute;left:8%;right:8%;top:48%;height:2px;
  background:var(--line2);transform:rotate(-38deg)}
#ringNote{margin-top:9px;font-family:var(--f-text);font-size:clamp(12px,1.3vw,18px);
  line-height:1.45;color:var(--ink)}
#ringNote .hot{color:var(--amari);font-weight:700}

/* ---- やって みよう（ドリル） ---- */
body.drill #mondai,body.drill #settings,body.drill #main,
body.drill #msg,body.drill #ctrl,body.drill #bFocus{display:none}
body:not(.drill) #drill{display:none}
#drill{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

#dOps{display:flex;gap:6px;flex-wrap:wrap}
.dlv{flex:1;min-width:104px;border:1px solid var(--line2);background:var(--paper);
  border-radius:12px;padding:9px 6px;font-size:clamp(12px,1.3vw,17px)}
.dlv[aria-pressed="true"]{background:var(--gold);color:#3A2600;border-color:var(--gold-d);font-weight:700}

#dScore{display:flex;gap:8px}
#dScore .dbox{flex:1;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:4px;text-align:center}
#dScore .dn{font-size:clamp(16px,1.9vw,23px);font-weight:700;line-height:1.2}
#dScore .dt{font-size:11px;color:var(--muted)}
#dScore .st .dn{color:var(--gold-d)}

#dStage{flex:1;min-height:0;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;
  justify-content:flex-start;gap:9px;overflow:hidden;transition:background .25s,border-color .25s}
/* もんだい文は いちばん上。式から下は のこった ところの まん中に そろえる */
#dQrow{flex:none}
#dEq{margin-top:auto}
#dPic{margin-bottom:auto}
#dStage.ok{background:var(--ok-l);border-color:#c6ddb8}
#dStage.ng{background:var(--amari-l);border-color:var(--amari)}

#dQrow{display:flex;align-items:flex-start;gap:10px}
#dQ{flex:1;margin:0;font-family:var(--f-text);font-size:clamp(13px,1.65vw,23px);line-height:1.45}
#dQ b{color:var(--gold-d);font-weight:700}
#dHintBtn{flex:none;border:1px solid var(--line2);background:var(--paper);border-radius:10px;
  padding:6px 12px;font-size:clamp(12px,1.2vw,16px)}
#dHintBtn[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold)}

#dEq{display:flex;align-items:baseline;justify-content:center;gap:.16em;flex-wrap:wrap;
  font-size:clamp(24px,min(5.4vw,6.6vh),54px);font-weight:700;line-height:1.15}
#dEq .amw{font-size:.6em;color:var(--muted);font-weight:400;margin:0 .1em}
.dfld{display:inline-block;min-width:1.6em;text-align:center;color:var(--line2);
  border-bottom:4px solid var(--line2);border-radius:8px 8px 0 0;padding:0 .06em}
.dfld.has{color:var(--gold-d)}
.dfld.rr.has{color:var(--amari)}
.dfld.on{border-color:var(--gold);background:var(--gold-l);animation:dglow 1.2s infinite}
.dfld.fixed{border-bottom-color:transparent;animation:none;background:transparent}
@keyframes dglow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 5px var(--gold-l)}}

/* ヒントは ことばで 説明しない＝式だけ 出す。
   これで 困る子は、長い 説明を 順に 読めない（2026-09-12 指摘）。
   左が こたえの ます（金）、右が あまりの ます（だいだい）。
   色と ならび順が そのまま 入れる ますを さしている */
#dHint{font-family:var(--f-text);font-size:clamp(12px,1.35vw,18px);color:var(--muted);
  text-align:center;line-height:1.5;min-height:1.3em}
#dHint em{font-style:normal;color:var(--gold-d);font-weight:700}
#dHint.eqs{display:flex;justify-content:center;align-items:center;
  gap:clamp(14px,3vw,54px);flex-wrap:wrap;
  font-size:clamp(17px,2.4vw,32px);font-weight:700;line-height:1.2}
#dHint .hq{color:var(--gold-d)}
#dHint .hr{color:var(--amari)}
#dVerdict{font-family:var(--f-text);font-size:clamp(13px,1.5vw,21px);text-align:center;
  line-height:1.45;min-height:1.4em}
#dVerdict.ok{color:var(--ok);font-weight:700}
#dVerdict.ng{color:var(--amari);font-weight:700}
#dVerdict .hot{color:var(--amari);font-weight:700}
#dVerdict small{display:block;font-size:.74em;color:var(--ok);font-weight:400;margin-top:2px}

/* こたえあわせの あとだけ 出す。ステップ１の ブロックと 同じ 見た目にして、
   「わけて みる」で 見たことと つなげる */
#dPic{display:flex;justify-content:center;font-size:clamp(22px,3.4vw,40px)}
#dPic .strip{padding-left:0;justify-content:center}

#dPick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dpick{border:2px solid var(--line2);background:var(--paper);border-radius:14px;
  padding:11px 24px;font-size:clamp(16px,2.2vw,28px);font-weight:700}
.dpick[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-l);color:var(--gold-d)}
.dpick:disabled{opacity:.55}
.dpick.right,.dpick.right:disabled{border-color:var(--ok);background:var(--ok-l);color:var(--ok);opacity:1}

#dPad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#dPad.one{grid-template-columns:1fr}
.dkey{border:1px solid var(--line2);background:var(--paper);border-radius:12px;
  padding:11px 2px;font-size:clamp(15px,2vw,24px);font-weight:700;white-space:nowrap}
.dkey:active{transform:translateY(2px)}
.dkey.dkdel{background:#f5edda}
/* 青＝同じ問題の中で 進む／金＝答え合わせ／みどり＝別の問題へ */
.dkey.dkgo{background:#2f6fa8;color:#fff;border-color:#22527d}
.dkey.dkans{background:var(--gold);color:#3A2600;border-color:var(--gold-d)}
/* 「つぎの もんだい→」は 長いので、ますに 入らないときは 2行にする。
   （みじかく「つぎ →」に しない。青の ボタンと 一字ちがいに なるため） */
.dkey.dknext{background:var(--ok);color:#fff;border-color:#446838;
  font-size:.74em;white-space:normal;line-height:1.15;word-break:keep-all;padding:8px 3px}

/* ---- メッセージ ---- */
#msg{font-family:var(--f-text);font-size:clamp(14px,1.7vw,26px);line-height:1.4;
  min-height:3.6em;display:flex;align-items:center;padding:8px 14px;border-radius:12px;
  background:var(--gold-l);border:1px solid #EBD49A}
#msgIn{width:100%}
#msg em{font-style:normal;color:var(--gold-d);font-weight:700}
#msg .hot{color:var(--amari);font-weight:700}

/* ---- そうさ ---- */
/* すすむボタンは 絵の すぐ下に おく（画面いちばん下の 端を ねらわなくて いいように） */
#go{display:flex;justify-content:center}
#go .btn{min-height:58px;width:100%;max-width:520px}
body.drill #go{display:none}
#ctrl{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--paper);border-radius:12px;
  padding:10px 16px;font-size:clamp(14px,1.5vw,20px);transition:transform .08s,background .2s}
.btn:active{transform:translateY(2px);background:#f5edda}
.btn:disabled{opacity:.38;cursor:default}
/* 青＝同じ画面の中で 先へ すすむ（ほかの算数アプリと そろえる。
   金は「答え合わせ」に とってあるので すすむボタンには 使わない） */
.btn.main{background:#2f6fa8;color:#fff;border-color:#22527d;font-weight:700;flex:1;min-width:180px}
.btn.main:active{background:#22527d;color:#fff}
.btn.sm{padding:7px 11px;font-size:clamp(12px,1.15vw,15px);min-height:0}
#ctrl .btn{min-height:52px}
.btn.tog[aria-pressed="true"]{background:var(--gold);color:#3A2600;border-color:var(--gold-d);font-weight:700}
body.kimari .wbtn{display:none}
body:not(.kimari) .kbtn{display:none}

@media (max-width:820px){
  #main{flex-direction:column;overflow:hidden}
  #rail{width:auto;flex-direction:row;flex:none;min-height:0}
  #rail .card{min-width:0;overflow:hidden}
  /* せまい画面では ステージを ちぢめて、しきカードが かくれないように */
  .pane{min-height:120px}
  #settings{gap:6px 10px;padding:6px 10px}
  #mondai{font-size:clamp(14px,3.4vw,20px)}
  #dPad{grid-template-columns:repeat(3,1fr)}
  #dQ{font-size:clamp(14px,3.2vw,21px)}
  .dlv{min-width:0;font-size:clamp(11px,3vw,15px);padding:8px 3px}
}
/* Googleサイトの わくが たてに みじかいとき、まわりを つめて 絵と 九九に 場所を まわす */
@media (max-height:700px){
  #app{padding:6px 10px 8px;gap:5px}
  /* 九九の ひょうに 場所を まわす。式と たしかめが のこるので 意味は 失われない */
  #kotae{display:none}
  .card{padding:7px 9px}
  /* 「いま つかった 九九」と「大きすぎる 九九」の 2行が かならず 見えるだけの 場所を とる */
  #kukuHead{font-size:clamp(9px,1.05vw,13px);margin-bottom:3px}
  .kk{font-size:clamp(14px,1.5vw,19px);padding:2px 4px}
  #shikiRow{font-size:clamp(17px,2vw,27px)}
  #mondai{font-size:clamp(13px,1.5vw,20px)}
  #go .btn{min-height:46px;font-size:clamp(13px,1.4vw,18px)}
  #ctrl .btn{min-height:40px;padding:6px 12px;font-size:clamp(12px,1.2vw,16px)}
  #msg{min-height:2.5em;padding:5px 10px;font-size:clamp(12px,1.4vw,19px)}
  #settings{padding:5px 9px;gap:5px 10px}
  .card{padding:7px 9px}
}
/* とても みじかい わく（480px くらい）で 設定を 出したままでも 九九が 見えるように */
@media (max-height:520px){
  #shikiRow{font-size:clamp(15px,1.75vw,23px)}
  .card{padding:5px 8px}
  .ctitle{margin-bottom:3px}
  #kukuHead{margin-bottom:2px}
  #kotae{display:none}
}
@media (prefers-reduced-motion:reduce){
  .item,.cont,.ghost,.ring{transition:none!important}
}
</style>

<script>
(function(){
"use strict";

var ITEMS = {
  candy :{e:"🍬",name:"あめ",   c:"こ"},
  mikan :{e:"🍊",name:"みかん", c:"こ"},
  cookie:{e:"🍪",name:"クッキー",c:"まい"},
  ichigo:{e:"🍓",name:"いちご", c:"こ"},
  ball  :{e:"⚽",name:"ボール", c:"こ"}
};

var S = {view:"wake", mode:"zutsu", N:13, D:3, item:"candy", step:0,
         focus:false, kStart:12, kCount:1, kStrip:true};
var timer=null, L=null;
var $=function(id){return document.getElementById(id);};
var stage=$("stage"), contsEl=$("conts"), itemsEl=$("items"), ghostsEl=$("ghosts");
var itemEls=[], ghostEls=[], contEls=[];

function save(){ try{ localStorage.setItem("warizan2", JSON.stringify(
  {mode:S.mode,N:S.N,D:S.D,kStrip:S.kStrip})); }catch(e){} }
function load(){ try{ var o=JSON.parse(localStorage.getItem("warizan2")||"null");
  if(o&&o.N){ S.mode=o.mode||S.mode; S.N=o.N; S.D=o.D;
    if(typeof o.kStrip==="boolean") S.kStrip=o.kStrip; } }catch(e){} }

function setH(){ document.documentElement.style.setProperty("--appH", window.innerHeight+"px"); }

function q(){ return Math.floor(S.N/S.D); }
function r(){ return S.N-q()*S.D; }
function inf(){ return ITEMS[S.item]; }
function nCont(){ return S.mode==="zutsu" ? Math.max(q(),1) : S.D; }
function slotsPer(){ return S.mode==="zutsu" ? S.D : Math.max(q(),1); }

function destOf(i){
  var Q=q();
  if(i>=Q*S.D) return {a:true, idx:i-Q*S.D};
  if(S.mode==="zutsu") return {a:false, ci:Math.floor(i/S.D), slot:i%S.D};
  return {a:false, ci:i%S.D, slot:Math.floor(i/S.D)};
}
function grid(n){
  var m={1:1,2:2,3:3,4:2,5:3,6:3,7:4,8:4,9:3,10:5,11:4,12:4,13:5,14:5,15:5,16:4,17:5,18:5,19:5,20:5};
  var c=m[n]||Math.ceil(Math.sqrt(n)); return {cols:c, rows:Math.ceil(n/c)};
}

/* ================= わけて みる ================= */
function tryLayout(sz,oneRow,loose){
  var W=stage.clientWidth, H=stage.clientHeight;
  if(W<80||H<80) return null;
  var pad=14, lab=Math.max(15,Math.min(22,H*0.038)), cell=sz*1.14;

  /* 「のこり」と「あまり」の 置き場は、いる ぶんだけ 高さを とる。
     まえは 画面の 25.5%／23.5% で 固定していたので、よこに 広くて たてが みじかい
     画面（Googleサイトの わく）だと あきばしょが 大きく のこり、あめが 小さくなっていた */
  var pc=Math.max(1,Math.floor((W-2*pad)/cell)); pc=Math.min(pc,Math.max(S.N,1));
  var pr=Math.ceil(Math.max(S.N,1)/pc);
  var poolH=Math.min(H*0.45, lab+pr*cell+6);
  var amariH=Math.min(H*0.40, lab+cell+8);
  var workY=poolH+2, workH=H-poolH-amariH-4;
  if(workH<cell+lab && !loose) return null;
  if(pr*cell>poolH-lab-4 && !loose) return null;
  var pX=Math.max(0,(W-pc*cell)/2), pY=lab+Math.max(0,(poolH-lab-pr*cell)/2);

  var g=grid(slotsPer()), cp=Math.max(7,sz*0.20);
  var botPad=(S.mode==="nin")?cp+sz*0.30:cp;   /* おさらの丸みぶん 下を広く */
  var cw=g.cols*cell+2*cp, ch=g.rows*cell+cp+botPad;
  var gap=Math.max(10,sz*0.30), n=nCont();
  var perRow=Math.max(1,Math.floor((W-2*pad+gap)/(cw+gap)));
  if(S.mode==="nin"&&oneRow){ if(perRow<S.D) return null; perRow=S.D; }
  perRow=Math.min(perRow,n);
  var rows=Math.ceil(n/perRow), totH=rows*(ch+lab+gap)-gap;
  if(totH>workH-4 && !loose) return null;

  var conts=[], k=0, y0=workY+lab+Math.max(0,(workH-totH)/2);
  for(var ro=0;ro<rows;ro++){
    var inRow=Math.min(perRow,n-ro*perRow);
    var x0=(W-(inRow*cw+(inRow-1)*gap))/2;
    for(var co=0;co<inRow;co++,k++){
      var cx=Math.max(0,x0)+co*(cw+gap), cy=y0+ro*(ch+lab+gap), slots=[];
      for(var s=0;s<slotsPer();s++){
        slots.push({x:cx+cp+(s%g.cols)*cell+(cell-sz)/2,
                    y:cy+cp+Math.floor(s/g.cols)*cell+(cell-sz)/2});
      }
      conts.push({x:cx,y:cy,w:cw,h:ch,slots:slots});
    }
  }
  var R=r(), aCells=R>0?S.D:1;
  if(aCells*cell>W-2*pad && !loose) return null;
  var aX=Math.max(0,(W-aCells*cell)/2), aY=H-amariH+lab+Math.max(0,(amariH-lab-cell)/2);

  return {sz:sz,cell:cell,W:W,H:H,lab:lab,poolH:poolH,amariH:amariH,
    pool:function(i){ return {x:pX+(i%pc)*cell+(cell-sz)/2, y:pY+Math.floor(i/pc)*cell+(cell-sz)/2}; },
    conts:conts,
    amari:function(i){ return {x:aX+i*cell+(cell-sz)/2, y:aY}; }};
}
function relayout(){
  var sz,L2;
  /* まずは 人を1れつに ならべる形で さがす */
  for(sz=76;sz>=16;sz-=2){ L2=tryLayout(sz,true,false);  if(L2){ L=L2; return; } }
  /* せまいときは おさらを 2れつに おりかえす */
  for(sz=76;sz>=10;sz-=2){ L2=tryLayout(sz,false,false); if(L2){ L=L2; return; } }
  /* とても みじかい画面でも、かならず ならびを つくる（古いならびを 残さない） */
  L2=tryLayout(10,false,true); if(L2){ L=L2; return; }
}
function unfreeze(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
  for(var i=0;i<itemEls.length;i++) itemEls[i].classList.remove("noanim"); }); }); }

function buildItems(){
  itemsEl.innerHTML=""; ghostsEl.innerHTML=""; itemEls=[]; ghostEls=[];
  var e=inf().e,i,d,gd;
  for(i=0;i<S.N;i++){ d=document.createElement("div"); d.className="item noanim";
    d.textContent=e; itemsEl.appendChild(d); itemEls.push(d); }
  for(i=0;i<12;i++){ gd=document.createElement("div"); gd.className="ghost";
    ghostsEl.appendChild(gd); ghostEls.push(gd); }
}
function buildConts(){
  contsEl.innerHTML=""; contEls=[];
  for(var i=0;i<nCont();i++){
    var c=document.createElement("div");
    c.className="cont "+(S.mode==="zutsu"?"bag":"plate");
    var l=document.createElement("span"); l.className="clab";
    l.textContent=S.mode==="zutsu"?(i+1)+"ふくろめ":(i+1)+"人め";
    c.appendChild(l); contsEl.appendChild(c); contEls.push(c);
  }
}
function paint(){
  if(!L) return;
  /* しきカードが のびて ステージが せまくなることがあるので、ずれたら ならべ直す */
  if(L.W!==stage.clientWidth||L.H!==stage.clientHeight){ relayout(); if(!L) return; }
  var sz=L.sz,i,p,Q=q();
  $("bandPool").style.height=L.poolH+"px"; $("bandPool").style.top="0";
  $("bandAmari").style.height=L.amariH+"px"; $("bandAmari").style.top=(L.H-L.amariH)+"px";
  $("poolLab").textContent="のこりの"+inf().name+"　"+(S.N-S.step)+inf().c;

  for(i=0;i<contEls.length;i++){
    var c=contEls[i], g=L.conts[i]; if(!g) continue;
    c.style.width=g.w+"px"; c.style.height=g.h+"px";
    c.style.transform="translate("+g.x+"px,"+g.y+"px)";
    c.classList.toggle("on", S.mode==="nin" ? true : (i<Q && S.step>i*S.D));
    var full=(S.mode==="zutsu") ? (S.step>=(i+1)*S.D && i<Q)
                                : (Math.floor(S.step/S.D)>=slotsPer() && Q>0);
    c.classList.toggle("done", !!full);
    var lb=c.querySelector(".clab");
    if(S.mode==="zutsu") lb.textContent=(i+1)+"ふくろめ"+(full?" ✓":"");
    else{
      var have=Math.floor(S.step/S.D)+((S.step%S.D)>i?1:0);
      have=Math.min(have,Q);
      lb.textContent=(i+1)+"人め　"+have+inf().c;
    }
  }
  for(i=0;i<itemEls.length;i++){
    var el=itemEls[i];
    el.style.width=sz+"px"; el.style.height=sz+"px"; el.style.fontSize=(sz*0.70)+"px";
    if(i>=S.step){ p=L.pool(i); el.classList.remove("amari"); }
    else{
      var d=destOf(i);
      if(d.a){ p=L.amari(d.idx); el.classList.add("amari"); }
      else{ var cc=L.conts[d.ci]; p=cc?cc.slots[d.slot]:L.pool(i); el.classList.remove("amari"); }
    }
    el.style.transform="translate("+p.x+"px,"+p.y+"px)";
  }
  var R=r(), done=(S.step>=S.N), need=(done&&R>0)?(S.D-R):0;
  for(i=0;i<ghostEls.length;i++){
    var ge=ghostEls[i];
    if(i<need){ var gp=L.amari(R+i);
      ge.style.width=sz+"px"; ge.style.height=sz+"px";
      ge.style.transform="translate("+gp.x+"px,"+gp.y+"px)"; ge.classList.add("on");
    } else ge.classList.remove("on");
  }
  $("amariLab").textContent = done ? ("あまり　"+R+inf().c+(R===0?"（ぴったり！）":"")) : "あまり";
}
function slotHTML(cls,val,unit){
  var v=(val===null)?'<span class="v blank">?</span>':'<span class="v">'+val+'</span>';
  return '<span class="slot '+cls+'">'+v+'<span class="u">'+unit+'</span></span>';
}
function paintShiki(){
  var Q=q(),R=r(),c=inf().c;
  var qs=Math.min(Math.floor(S.step/S.D),Q);
  var showQ=(S.step===0)?null:qs;
  var showR=(S.step<S.N)?null:R;
  var uq=S.mode==="zutsu"?"ふくろ":c;
  $("shikiRow").innerHTML=
    slotHTML("n",S.N,c)+'<span class="slot op"><span class="v">÷</span><span class="u">&nbsp;</span></span>'+
    slotHTML("n",S.D,S.mode==="zutsu"?(c+"ずつ"):"人")+
    '<span class="slot op"><span class="v">＝</span><span class="u">&nbsp;</span></span>'+
    slotHTML("q",showQ,uq)+'<span style="flex-basis:100%;height:0"></span>'+
    '<span class="slot op" style="min-width:2.6em"><span class="v" style="font-size:.62em">あまり</span><span class="u">&nbsp;</span></span>'+
    slotHTML("r",showR,c);
  var k="";
  if(S.step>=S.N){
    k=(S.mode==="zutsu")?Q+"ふくろ できて、"+R+c+" あまる"
                        :"1人分は "+Q+c+" で、"+R+c+" あまる";
  }
  $("kotae").textContent=k;
}
/* わる数の だんを、ふくろが できるたび 1行ずつ ふやす。
   数の 色は しきカードと そろえる＝わる数＝ふつう／こたえ＝金／つかった数＝みどり（ふくろの色） */
function paintKuku(){
  $("kukuTitle").textContent=S.D+"のだん";
  var Q=q(), qs=Math.min(Math.floor(S.step/S.D),Q), done=(S.step>=S.N), h="", k;
  for(k=1;k<=qs;k++){
    var kq=(k===qs)?'<b class="chip">'+k+'</b>':k;   /* いま つかっている 九九の こたえ */
    h+='<div class="kkgrid kk done">'+
       '<span>'+S.D+'</span><span>×</span><span class="kq">'+kq+'</span>'+
       '<span>＝</span><span class="ku">'+(S.D*k)+'</span></div>';
  }
  if(done&&S.D*(Q+1)>S.N){
    h+='<div class="kkgrid kk over">'+
       '<span>'+S.D+'</span><span>×</span><span class="kq">'+(Q+1)+'</span>'+
       '<span>＝</span><span class="ku">'+(S.D*(Q+1))+'</span>'+
       '<span class="kknote">'+S.N+'より 大きい</span></div>';
  }
  var box=$("kukuList");
  box.innerHTML=h||'<div id="kukuEmpty">すすむと ふえます</div>';
  /* 場所が すこししか ないときに いちばん 見せたいのは
     「いま つかった 九九」と「大きすぎる 九九」の 2行。
     いちばん下まで 送ると、大きすぎる 行だけに なってしまう */
  function toLast(){
    var ds=box.querySelectorAll(".kk.done"), last=ds.length?ds[ds.length-1]:null;
    if(!last){ box.scrollTop=box.scrollHeight; return; }
    /* offsetTop は 一覧からの きょりに ならない（#kukuList に position が ない）ので
       じっさいの 位置を 測って 送る。まえは いつも いちばん下まで 行ってしまい、
       場所が せまいと「大きすぎる 九九」だけが 見えていた */
    box.scrollTop += last.getBoundingClientRect().top - box.getBoundingClientRect().top;
  }
  requestAnimationFrame(toLast);
  setTimeout(toLast,90);   /* わくの 高さが あとから 決まるので もう一度 */
}
function paintMsgW(){
  var c=inf().c,nm=inf().name,Q=q(),R=r(),m="";
  if(S.step===0){
    m=(S.mode==="zutsu")
      ?"上の えを おすと すすむよ。<em>"+S.D+c+"ずつ</em> ふくろに 入れていこう。"
      :"上の えを おすと すすむよ。<em>1"+c+"ずつ じゅんばんに</em> "+S.D+"人に くばっていこう。";
  } else if(S.step<S.N){
    if(S.mode==="zutsu"){
      var inBag=S.step%S.D, bags=Math.floor(S.step/S.D);
      if(inBag===0&&bags<=Q) m="<em>"+bags+"ふくろめ</em>が できた。つかった"+nm+"は "+(bags*S.D)+c+"。";
      else if(bags>=Q) m="のこりの "+(S.N-Q*S.D)+c+" は、"+S.D+c+" そろわない。";
      else m="いま "+(bags+1)+"ふくろめに "+inBag+c+"。あと <em>"+(S.D-inBag)+c+"</em> で ふくろが できる。";
    } else {
      var rd=Math.floor(S.step/S.D), pos=S.step%S.D;
      if(pos===0) m="1人 <em>"+rd+c+"</em>ずつに なった。";
      else m=pos+"人めまで くばった。あと "+(S.D-pos)+"人 くばると、みんな "+(rd+1)+c+"。";
    }
  } else {
    if(Q===0){
      m=(S.mode==="zutsu")
        ?"1ふくろも できない。<em>"+S.D+c+"</em> そろわないから、"+S.N+c+" ぜんぶが <span class='hot'>あまり</span>。"
        :S.D+"人に 1"+c+"ずつ くばることも できない。"+S.N+c+" ぜんぶが <span class='hot'>あまり</span>。";
    } else if(R===0){
      m=(S.mode==="zutsu")
        ?"ちょうど <em>"+Q+"ふくろ</em>。あまりは <span class='hot'>0</span>。ぴったり わりきれた。"
        :"1人 <em>"+Q+c+"</em>ずつ。あまりは <span class='hot'>0</span>。ぴったり わりきれた。";
    } else if(S.mode==="zutsu"){
      m="<em>"+Q+"ふくろ</em> できた。のこりは <span class='hot'>"+R+c+"</span>。あと "+(S.D-R)+c+
        " ないと ふくろに できないから、これが <span class='hot'>あまり</span>。";
    } else {
      m="1人 <em>"+Q+c+"</em>ずつ。のこりは <span class='hot'>"+R+c+"</span>。"+S.D+"人に 1"+c+
        "ずつ くばるには あと "+(S.D-R)+c+" いるから、これが <span class='hot'>あまり</span>。";
    }
    if(R>0&&Q>0) m+="　→ あまりは いつも わる数（"+S.D+"）より 小さい。";
  }
  $("msgIn").innerHTML=m;
}

/* ================= くらべて みる ================= */
function kRows(){
  var a=[];
  for(var i=0;i<S.kCount;i++){
    var n=S.kStart+i, qq=Math.floor(n/S.D);
    a.push({n:n,q:qq,r:n-qq*S.D});
  }
  return a;
}
function stripHTML(n){
  if(!S.kStrip) return "";
  var D=S.D, full=Math.floor(n/D), rem=n-full*D, h='<span class="strip">', i, j;
  for(i=0;i<full;i++){
    h+='<span class="grpx">';
    for(j=0;j<D;j++) h+='<i></i>';
    h+='</span>';
  }
  if(rem>0){ h+='<span class="grpx rem">'; for(j=0;j<rem;j++) h+='<i></i>'; h+='</span>'; }
  return h+'</span>';
}
function paintK(){
  var rows=kRows(), h="", i;
  for(i=0;i<rows.length;i++){
    var w=rows[i];
    h+='<div class="krow'+(w.r===0?" zero":"")+(i===rows.length-1?" new":"")+'">'+
       '<span class="n">'+w.n+'</span><span>÷</span><span class="n">'+S.D+'</span>'+
       '<span>＝</span><span class="q">'+w.q+'</span>'+
       '<span class="am">あまり</span><span class="r">'+w.r+'</span>'+
       stripHTML(w.n)+'</div>';
  }
  $("krows").innerHTML=h;
  var last=rows[rows.length-1];
  $("kend").innerHTML = (S.kCount>=14) ? "" :
    '<div style="opacity:.6">つぎは '+(last.n+1)+' ÷ '+S.D+' … あまりは いくつ？</div>';
  var pane=$("ktable");
  requestAnimationFrame(function(){ pane.scrollTop=pane.scrollHeight; });

  /* あまりの輪 */
  var seen={}, j;
  for(j=0;j<rows.length;j++) seen[rows[j].r]=true;
  var rh="";
  for(j=0;j<S.D;j++){
    rh+='<span class="ring'+(j===0?" zero":"")+(seen[j]?" seen":"")+
        (last.r===j?" now":"")+'">'+j+'</span>';
  }
  rh+='<span class="ring no">'+S.D+'</span>';
  $("ringRow").innerHTML=rh;
  $("ringTitle").textContent=S.D+"で わったときの あまり";

  var note="";
  if(S.kCount<=2) note="つぎの あまりは いくつに なるかな。";
  else if(S.kCount<=S.D) note="あまりが 1ずつ ふえている。";
  else note="あまりは <span class='hot'>0 から "+(S.D-1)+"</span> の くりかえし。わる数の "+
            S.D+" には <span class='hot'>ならない</span>。";
  $("ringNote").innerHTML=note;

  /* メッセージ */
  var m;
  if(S.kCount===1){
    m="上の 表を おすと つぎの しきが 出るよ。あまりは どう かわるかな。";
  } else if(last.r===0){
    m="あまりが <em>0</em> に もどった。"+last.n+" は "+S.D+"で <em>わりきれる</em>。";
  } else {
    m="あまりが <em>"+last.r+"</em>。あと "+(S.D-last.r)+" ふえると どうなる？";
  }
  if(S.kCount>S.D){
    m+="　→ あまりは <span class='hot'>0,1,…,"+(S.D-1)+"</span> の くりかえし。"+
       "<span class='hot'>わる数より 小さい</span>。";
  }
  $("msgIn").innerHTML=m;

  $("kBack").disabled=(S.kCount<=1);
  $("kNext").disabled=(S.kCount>=14);
  $("sVal").textContent=S.kStart;
}

/* ================= 共通 ================= */
function paintModeBtn(){
  $("mZutsu").textContent=S.D+inf().c+"ずつ ふくろに";
  $("mNin").textContent=S.D+"人で 同じ数ずつ";
}
function paintMondai(){
  var f=inf();
  paintModeBtn();
  if(S.view==="kimari"){
    $("mondai").innerHTML="わられる数を 1ずつ 大きく すると、<b>"+S.D+"</b>で わった あまりは どう かわりますか。";
  } else {
    $("mondai").innerHTML=(S.mode==="zutsu")
      ?"<b>"+S.N+f.c+"</b>の"+f.name+"を、1ふくろに <b>"+S.D+f.c+"</b>ずつ 入れていきます。何ふくろ できて、何"+f.c+" あまりますか。"
      :f.name+" <b>"+S.N+f.c+"</b>を、<b>"+S.D+"人</b>で 同じ数ずつ 分けます。1人分は 何"+f.c+"に なって、何"+f.c+" あまりますか。";
  }
  $("dLab").textContent=(S.view==="kimari")?"わる数":((S.mode==="zutsu")?"1ふくろの数":"分ける人数");
}
function renderAll(){
  if(S.view==="drill"){ if(!W.N) dNew(); else dRender(); return; }
  paintMondai();
  $("nVal").textContent=S.N; $("dVal").textContent=S.D;
  if(S.view==="kimari"){ paintK(); }
  else{
    relayout(); drawW();
    $("bBack").disabled=(S.step===0); $("bNext").disabled=(S.step>=S.N);
  }
}
function rebuild(){ S.step=0; stopAuto(); buildItems(); buildConts(); renderAll(); unfreeze(); save(); }

function setView(v){
  S.view=v; stopAuto();
  document.body.classList.toggle("kimari", v==="kimari");
  document.body.classList.toggle("drill",  v==="drill");
  $("tabW").setAttribute("aria-selected", v==="wake");
  $("tabK").setAttribute("aria-selected", v==="kimari");
  $("tabD").setAttribute("aria-selected", v==="drill");
  requestAnimationFrame(function(){ renderAll(); if(v==="wake") unfreeze(); });
}

var fixT=0;
function drawW(){
  paint(); paintShiki(); paintKuku(); paintMsgW();
  /* メッセージの 行数で ステージの 高さが かわるので、1フレームあとに ならべ直す */
  if(fixT) cancelAnimationFrame(fixT);
  fixT=requestAnimationFrame(function(){ fixT=0; relayout(); paint(); });
}
function next(){ if(S.step<S.N){ S.step++; drawW();
  $("bBack").disabled=false; $("bNext").disabled=(S.step>=S.N); } if(S.step>=S.N) stopAuto(); }
function back(){ if(S.step>0){ S.step--; stopAuto(); drawW();
  $("bBack").disabled=(S.step===0); $("bNext").disabled=false; } }
function reset(){ S.step=0; stopAuto(); drawW();
  $("bBack").disabled=true; $("bNext").disabled=false; }
function stopAuto(){ if(timer){ clearInterval(timer); timer=null; $("bAuto").textContent="じどう"; } }
function toggleAuto(){
  if(timer){ stopAuto(); return; }
  if(S.step>=S.N) S.step=0;
  $("bAuto").textContent="とめる";
  timer=setInterval(function(){ if(S.step>=S.N){ stopAuto(); return; } next(); },850);
}

/* =========================================================
   やって みよう（ドリル）
   ・レベルは はじめから ぜんぶ えらべる（鍵をかけない）
   ・こたえと あまりを 入れ終わるまで 丸つけしない
   ・とちゅうは 青「あまりへ ▶」、さいごだけ 金「こたえ」、
     つぎの もんだいは みどり（ほかの算数アプリと そろえる）
========================================================= */
var DGOAL=10;
var DLV=[{k:"a25",t:"2〜5で わる"},{k:"a69",t:"6〜9で わる"},
         {k:"moto",t:"わられる数"},{k:"bun",t:"あまりを 考える"}];
var W={lv:"a25",N:0,D:0,Q:0,R:0,f:["",""],idx:0,locked:false,
       hint:false,pick:-1,wp:0,c:0,t:0,st:{},stamp:{}};

/* あまりを どうするか。up:true＝1つ ふやす（切り上げ） */
var WPS=[
 {up:false,u:"ふくろ",
  q:function(N,D){ return "<b>"+N+"こ</b>の あめを、1ふくろに <b>"+D+"こ</b>ずつ 入れます。"+
    D+"こ 入った ふくろは 何ふくろ できますか。"; },
  why:function(N,D,Q,R){ return "あまりの "+R+"こ では "+D+"こ に たりないから、ふくろには できないよ"; },
  hint:function(N,D,Q,R){ return "あまりの <em>"+R+"こ</em> で、もう 1ふくろ できるかな"; }},
 {up:true,u:"きゃく",
  q:function(N,D){ return "<b>"+N+"人</b>が、長いす 1きゃくに <b>"+D+"人</b>ずつ すわります。"+
    "みんなが すわるには、長いすは 何きゃく いりますか。"; },
  why:function(N,D,Q,R){ return "あまりの "+R+"人 も すわるから、長いすが もう 1きゃく いるね"; },
  hint:function(N,D,Q,R){ return "あまりの <em>"+R+"人</em> は、どこに すわるのかな"; }},
 {up:false,u:"本",
  q:function(N,D){ return "<b>"+N+"cm</b>の リボンから、<b>"+D+"cm</b>の リボンを 何本 とれますか。"; },
  why:function(N,D,Q,R){ return "あまりの "+R+"cm では "+D+"cm に たりないから、1本には ならないよ"; },
  hint:function(N,D,Q,R){ return "あまりの <em>"+R+"cm</em> で、もう 1本 とれるかな"; }},
 {up:true,u:"回",
  q:function(N,D){ return "<b>"+N+"こ</b>の にもつを、1回に <b>"+D+"こ</b>ずつ はこびます。"+
    "ぜんぶ はこぶには 何回 かかりますか。"; },
  why:function(N,D,Q,R){ return "あまりの "+R+"こ も はこぶから、もう 1回 いるね"; },
  hint:function(N,D,Q,R){ return "あまりの <em>"+R+"こ</em> は、はこばなくて いいのかな"; }}
];

function dRnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function dTwo(){ return W.lv==="a25"||W.lv==="a69"; }

function dLoad(){ try{ var o=JSON.parse(localStorage.getItem("warizanDrill")||"null");
  if(o){ W.c=o.c|0; W.t=o.t|0; W.st=o.st||{}; W.stamp=o.stamp||{}; if(o.lv) W.lv=o.lv; } }catch(e){} }
function dSave(){ try{ localStorage.setItem("warizanDrill",
  JSON.stringify({c:W.c,t:W.t,st:W.st,stamp:W.stamp,lv:W.lv})); }catch(e){} }

var dLast=0;
function dtap(el,fn){
  var last=0;
  function fire(){ var n=Date.now(); if(n-last<80) return; last=n; fn(); }
  if(window.PointerEvent){
    el.addEventListener("pointerdown",function(ev){
      if(ev.pointerType==="mouse"&&ev.button!==0) return; ev.preventDefault(); fire(); });
    el.addEventListener("click",function(){ if(Date.now()-last<500) return; fire(); });
  }else{
    el.addEventListener("touchstart",function(ev){ ev.preventDefault(); fire(); },{passive:false});
    el.addEventListener("click",function(){ if(Date.now()-last<500) return; fire(); });
  }
}
/* こたえ・つぎ の 二重押しよけ（となりのボタンに 入れかわるため） */
function dGuard(fn){ return function(){ var n=Date.now(); if(n-dLast<420) return; dLast=n; fn(); }; }

function dNew(){
  var D,tries=0;
  /* わられる数が 10 より 小さい（5÷2 のような）もんだいは 出さない */
  do{
    if(W.lv==="a25")      D=dRnd(2,5);
    else if(W.lv==="a69") D=dRnd(6,9);
    else if(W.lv==="bun") D=dRnd(2,6);
    else                  D=dRnd(2,9);
    W.D=D;
    W.Q=(W.lv==="bun")?dRnd(2,8):dRnd(2,9);
    W.R=dRnd(1,D-1);
    W.N=W.D*W.Q+W.R;
    tries++;
  }while(W.N<10&&tries<40);
  if(W.lv==="bun") W.wp=dRnd(0,WPS.length-1);
  /* W.hint は ここで 消さない＝ヒントは 押したままに する。
     まえは もんだいが かわるたび 消えていたので、計算が 苦手な子が
     20問ぶん 押し直すことに なっていた（2026-09-12 教室で）。
     いらない子は はじめから 押さないだけ */
  W.f=["",""]; W.idx=0; W.locked=false; W.pick=-1;
  $("dStage").className="";
  /* 色だけでなく 文も 消す。まえは 消していなかったので、つぎの もんだいに
     うつっても 前の「せいかい！」と 前の たしかめ算が のこっていた
     （16÷3 の 画面に「たしかめ 4 × 4 ＋ 1 ＝ 17」。2026-09-12 指摘） */
  $("dVerdict").className=""; $("dVerdict").innerHTML="";
  dRender();
}

function dFld(i,extra){
  var v=W.f[i];
  var c="dfld"+(extra?" "+extra:"")+((v||W.locked)?" has":"")+
        (W.locked?" fixed":((W.idx===i)?" on":""));
  return '<span class="'+c+'" data-i="'+i+'">'+(v||"?")+'</span>';
}
function dAma(){ return '<span class="amw">あまり</span>'; }
/* Q こずつの かたまり ＋ あまり を ブロックで 見せる（こたえあわせの あとだけ） */
function dStrip(){
  var h='<span class="strip">',g,i;
  for(g=0;g<W.Q;g++){ h+='<span class="grpx">';
    for(i=0;i<W.D;i++) h+='<i></i>'; h+='</span>'; }
  if(W.R>0){ h+='<span class="grpx rem">';
    for(i=0;i<W.R;i++) h+='<i></i>'; h+='</span>'; }
  return h+'</span>';
}

function dRender(){
  dOpsPaint(); dScorePaint();
  var q=$("dQ"), eq=$("dEq"), pk=$("dPick"), hn=$("dHint");
  if(W.lv==="bun"){
    var wp=WPS[W.wp];
    q.innerHTML=wp.q(W.N,W.D);
    eq.innerHTML=W.N+" ÷ "+W.D+" ＝ "+W.Q+" "+dAma()+" "+W.R;
    var a1=W.Q, a2=W.Q+1, right=wp.up?a2:a1, ph="";
    for(var b=0;b<2;b++){
      var v=(b===0)?a1:a2;
      ph+='<button class="dpick'+((W.locked&&v===right)?" right":"")+'" type="button" data-v="'+v+'"'+
          ' aria-pressed="'+(W.pick===v)+'"'+(W.locked?" disabled":"")+'>'+v+wp.u+'</button>';
    }
    pk.innerHTML=ph;
    hn.className=""; hn.innerHTML=W.hint?wp.hint(W.N,W.D,W.Q,W.R):"";
  }else if(W.lv==="moto"){
    q.innerHTML="<b>"+W.D+"</b>で わったら <b>"+W.Q+"</b> あまり <b>"+W.R+"</b> でした。わられる数は いくつですか。";
    eq.innerHTML=dFld(0)+" ÷ "+W.D+" ＝ "+W.Q+" "+dAma()+" "+W.R;
    pk.innerHTML="";
    hn.className=W.hint?"eqs":"";
    hn.innerHTML=W.hint?('<span class="hq">'+W.D+' × '+W.Q+' ＋ '+W.R+' ＝ ?</span>'):"";
  }else{
    q.innerHTML="こたえと あまりを 入れよう。";
    eq.innerHTML=W.N+" ÷ "+W.D+" ＝ "+dFld(0)+" "+dAma()+" "+dFld(1,"rr");
    pk.innerHTML="";
    /* ことばで 説明しない。式を 2つ ならべるだけ。
       左（金）＝こたえの ます、右（だいだい）＝あまりの ます。
       「5 × ? ＝ 15」の 形なので、15 を こたえに 書く まちがいが 起きない */
    hn.className=W.hint?"eqs":"";
    hn.innerHTML=W.hint?(
      '<span class="hq">'+W.D+' × ? ＝ '+(W.D*W.Q)+'</span>'+
      '<span class="hr">'+W.N+' − '+(W.D*W.Q)+' ＝ ?</span>'
    ):"";
  }
  $("dHintBtn").setAttribute("aria-pressed",W.hint);
  $("dPic").innerHTML=(W.locked&&W.lv!=="moto")?dStrip():"";

  if(!W.locked){
    var fs=eq.querySelectorAll(".dfld[data-i]");
    for(var i=0;i<fs.length;i++)
      dtap(fs[i],(function(n){ return function(){ W.idx=n; dRender(); }; })(Number(fs[i].getAttribute("data-i"))));
    var ps=pk.getElementsByTagName("button");
    for(var j=0;j<ps.length;j++)
      dtap(ps[j],(function(n){ return function(){ W.pick=n; dRender(); }; })(Number(ps[j].getAttribute("data-v"))));
  }
  dPadPaint();
}

function dOpsPaint(){
  var h="",i;
  for(i=0;i<DLV.length;i++)
    h+='<button class="dlv" type="button" data-k="'+DLV[i].k+'" aria-pressed="'+
       (W.lv===DLV[i].k)+'">'+DLV[i].t+(W.stamp[DLV[i].k]?" ⭐":"")+'</button>';
  var el=$("dOps"); el.innerHTML=h;
  var bs=el.getElementsByTagName("button");
  for(i=0;i<bs.length;i++)
    dtap(bs[i],(function(k){ return function(){ if(W.lv!==k){ W.lv=k; dSave(); dNew(); } }; })(bs[i].getAttribute("data-k")));
}
function dScorePaint(){
  $("dC").textContent=W.c; $("dT").textContent=W.t;
  $("dS").textContent=W.stamp[W.lv]?"⭐":((W.st[W.lv]|0)+"/"+DGOAL);
}
function dPadPaint(){
  var el=$("dPad"); el.innerHTML=""; el.className=(W.lv==="bun")?"one":"";
  function add(label,cls,fn){
    var b=document.createElement("button"); b.type="button";
    b.className="dkey"+(cls?" "+cls:""); b.textContent=label; dtap(b,fn); el.appendChild(b);
  }
  if(W.lv!=="bun"){
    for(var i=1;i<=9;i++)(function(n){ add(String(n),"",function(){ dPress(String(n)); }); })(i);
    add("けす","dkdel",function(){ dPress("del"); });
    add("0","",function(){ dPress("0"); });
  }
  if(W.locked) add("つぎの もんだい→","dknext",dGuard(dNew));
  else if(dTwo()&&W.idx===0) add("あまりへ ▶","dkgo",function(){ W.idx=1; dRender(); });
  else add("こたえ","dkans",dGuard(dCheck));
}
function dPress(v){
  if(W.locked) return;
  var i=W.idx, max=(W.lv==="moto")?2:1;
  if(v==="del") W.f[i]=W.f[i].slice(0,-1);
  else{ if(W.f[i].length>=max) W.f[i]=W.f[i].slice(1); W.f[i]+=v; }
  dRender();
}
function dWhy(){
  var wp;
  if(W.lv==="bun"){
    wp=WPS[W.wp];
    return "おしい！ こたえは <span class=\"hot\">"+(wp.up?W.Q+1:W.Q)+wp.u+"</span>。"+
           wp.why(W.N,W.D,W.Q,W.R);
  }
  if(W.lv==="moto")
    return "おしい！ こたえは <span class=\"hot\">"+W.N+"</span>。"+
           W.D+" × "+W.Q+" ＋ "+W.R+" ＝ "+W.N;
  if(Number(W.f[1])>=W.D)
    return "あまりの "+W.f[1]+" が わる数の "+W.D+" と おなじか 大きいね。"+
           "それなら もう 1つ 分けられるよ。こたえは <span class=\"hot\">"+W.Q+" あまり "+W.R+"</span>";
  return "おしい！ こたえは <span class=\"hot\">"+W.Q+" あまり "+W.R+"</span>。"+
         W.D+" × "+W.Q+" ＝ "+(W.D*W.Q)+"、のこりが "+W.R;
}
function dCheck(){
  if(W.locked) return;
  var v=$("dVerdict");
  /* 入れ終わっていないうちは 丸つけしない（まちがいに しない） */
  if(W.lv==="bun"){
    if(W.pick<0){ v.className="ng"; v.innerHTML="どちらかを えらんでね"; return; }
  }else if(W.f[0]===""){
    /* 案内する ことばと、光る ますを そろえる */
    v.className="ng"; v.innerHTML="まだ とちゅうだよ。こたえの ますを 入れよう";
    W.idx=0; dRender(); return;
  }else if(dTwo()&&W.f[1]===""){
    v.className="ng";
    v.innerHTML="まだ とちゅうだよ。つぎは <span class=\"hot\">あまり</span>";
    W.idx=1; dRender(); return;
  }
  W.locked=true; W.t++;
  var ok;
  if(W.lv==="bun")       ok=(W.pick===(WPS[W.wp].up?W.Q+1:W.Q));
  else if(W.lv==="moto") ok=(Number(W.f[0])===W.N);
  else                   ok=(Number(W.f[0])===W.Q&&Number(W.f[1])===W.R);

  var st=$("dStage");
  if(ok){
    W.c++; st.className="ok"; v.className="ok";
    W.st[W.lv]=(W.st[W.lv]|0)+1;
    var ex;
    if(dTwo())                ex="<small>たしかめ　"+W.D+" × "+W.Q+" ＋ "+W.R+" ＝ "+W.N+"</small>";
    else if(W.lv==="moto")    ex="<small>たしかめ　"+W.N+" ÷ "+W.D+" ＝ "+W.Q+" あまり "+W.R+"</small>";
    else                      ex="<small>"+WPS[W.wp].why(W.N,W.D,W.Q,W.R)+"</small>";
    if(!W.stamp[W.lv]&&W.st[W.lv]>=DGOAL){
      W.stamp[W.lv]=true; W.st[W.lv]=0;
      v.innerHTML="スタンプ ゲット！ 10もん れんぞく せいかい！"+ex;
    }else if(W.stamp[W.lv]) v.innerHTML="せいかい！ 🎉"+ex;
    else v.innerHTML="せいかい！ 🎉（あと "+(DGOAL-W.st[W.lv])+"もん で スタンプ）"+ex;
  }else{
    st.className="ng"; v.className="ng"; W.st[W.lv]=0;
    v.innerHTML=dWhy();
  }
  dSave(); dRender();
}

function tap(id,fn){ var el=$(id); if(el) el.addEventListener("click",function(e){ e.preventDefault(); fn(); }); }

/* iPad では 画面の いちばん下の ボタンが おしにくいので、絵そのものを おせるように する */
function flash(el){ el.classList.add("tapped");
  setTimeout(function(){ el.classList.remove("tapped"); },140); }
stage.addEventListener("click",function(){
  if(S.view!=="wake"||S.step>=S.N) return;
  stopAuto(); flash(stage); next();
});
$("ktable").addEventListener("click",function(){
  if(S.view!=="kimari"||S.kCount>=14) return;
  flash($("ktable")); S.kCount++; paintK();
});

tap("tabW",function(){ setView("wake"); });
tap("tabK",function(){ setView("kimari"); });
tap("tabD",function(){ setView("drill"); });

tap("bNext",next); tap("bBack",back); tap("bReset",reset); tap("bAuto",toggleAuto);
tap("kNext",function(){ if(S.kCount<14){ S.kCount++; paintK(); } });
tap("kBack",function(){ if(S.kCount>1){ S.kCount--; paintK(); } });
tap("kAll", function(){ S.kCount=Math.min(14,S.D+3); paintK(); });
tap("kReset",function(){ S.kCount=1; paintK(); });

tap("nUp",  function(){ if(S.N<40){ S.N++; rebuild(); } });
tap("nDown",function(){ if(S.N>2 ){ S.N--; rebuild(); } });
tap("dUp",  function(){ if(S.D<9 ){ S.D++; onD(); } });
tap("dDown",function(){ if(S.D>2 ){ S.D--; onD(); } });
tap("sUp",  function(){ if(S.kStart<50){ S.kStart++; paintK(); } });
tap("sDown",function(){ if(S.kStart>0 ){ S.kStart--; paintK(); } });

function onD(){
  if(S.view==="kimari"){ S.kStart=S.D*3; S.kCount=1; $("dVal").textContent=S.D;
    paintMondai(); paintK(); save(); }
  else rebuild();
}
function setMode(m){
  S.mode=m;
  $("mZutsu").setAttribute("aria-pressed",m==="zutsu");
  $("mNin").setAttribute("aria-pressed",m==="nin");
  rebuild();
}
tap("mZutsu",function(){ setMode("zutsu"); });
tap("mNin",  function(){ setMode("nin"); });


tap("bStrip",function(){ S.kStrip=!S.kStrip; $("bStrip").setAttribute("aria-pressed",S.kStrip);
  paintK(); save(); });
tap("bFocus",function(){ S.focus=!S.focus;
  $("bFocus").setAttribute("aria-pressed",!S.focus);
  $("bFocus").textContent=S.focus?"せってい":"とじる";
  $("settings").classList.toggle("hide",S.focus);
  setTimeout(function(){ if(S.view==="wake"){ relayout(); paint(); } },30); });

document.addEventListener("keydown",function(e){
  if(e.target.tagName==="SELECT") return;
  if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter")) return;
  if(S.view==="drill"){
    if(e.key>="0"&&e.key<="9"&&W.lv!=="bun"){ e.preventDefault(); dPress(e.key); }
    else if(e.key==="Backspace"&&W.lv!=="bun"){ e.preventDefault(); dPress("del"); }
    else if(e.key==="Enter"||e.key===" "){ e.preventDefault();
      if(W.locked) dNew(); else if(dTwo()&&W.idx===0){ W.idx=1; dRender(); } else dCheck(); }
    return;
  }
  var K=(S.view==="kimari");
  if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){ e.preventDefault();
    if(K){ if(S.kCount<14){ S.kCount++; paintK(); } } else next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault();
    if(K){ if(S.kCount>1){ S.kCount--; paintK(); } } else back(); }
  else if(e.key==="r"||e.key==="R"){ if(K){ S.kCount=1; paintK(); } else reset(); }
  else if(e.key==="p"||e.key==="P"){ if(!K) toggleAuto(); }
});

if(window.ResizeObserver){
  new ResizeObserver(function(){
    if(S.view==="wake"){ relayout(); paint(); }
  }).observe(stage);
}

var rt=null;
window.addEventListener("resize",function(){
  clearTimeout(rt); rt=setTimeout(function(){ setH();
    if(S.view==="wake"){ relayout(); paint(); } },90);
});

load(); dLoad(); setH();
dtap($("dHintBtn"),function(){ W.hint=!W.hint; dRender(); });
S.kStart=S.D*3;
$("mZutsu").setAttribute("aria-pressed",S.mode==="zutsu");
$("mNin").setAttribute("aria-pressed",S.mode==="nin");
$("bStrip").setAttribute("aria-pressed",S.kStrip);
$("sVal").textContent=S.kStart;
buildItems(); buildConts();
requestAnimationFrame(function(){ renderAll(); unfreeze(); });

})();
</script>
</body>
</html>
