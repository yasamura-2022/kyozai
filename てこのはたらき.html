<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>てこのはたらき</title>
<style>
/* =========================================================
   てこの はたらき（6年 理科 A(3) てこの規則性）
   学習指導要領解説 理科編 p.80-81 より
   ・「力を加える位置や力の大きさを変えると，てこを傾ける働きが変わり，
   　　てこがつり合うときにはそれらの間に規則性があること」
   ・「身の回りには，てこの規則性を利用した道具があること」
   ・「ここで扱う対象としては，(ｱ) については，てこ実験器，
   　　(ｲ) については，ペンチ，釘抜き，空き缶つぶし，トングなどが考えられる」
   ・「支点からの距離とおもりの重さとの関係を表などに整理する」
   ・「（力点にかかるおもりの重さ）×（支点から力点までの距離）」が
   　　左右で 等しい ときに つり合う
   ・「算数科の反比例の学習と関連を図る」
   ・「『支点』『力点』『作用点』等の言葉を用いて説明したり，
   　　どのような便利さが得られるかについて話し合ったり」

   だから この アプリは 「3つの点 → 手ごたえ → つり合い → きまり → 道具」で 組む。
   力の 単位 N（ニュートン）・力の 合成分解・モーメント・仕事の原理は
   中学校 第1分野「(1)ア(ｲ)力の働き」の 内容なので 入れない。
   数で 出すのは 「おもりの 数」「支点からの きょり（目もり）」「手ごたえ(g)」だけ。
   てこを 第1種・第2種・第3種 と 分類する ことばも 使わない
   （「支点が 真ん中」「作用点が 真ん中」「力点が 真ん中」と 位置で 言う）。

   【この 教材の 立ち位置】実験の 代わりでは ない。実験が 主役で、
   アプリは 3つの ところだけ 受けもつ:
   　① 子どもが いちばん 苦手な「支点・力点・作用点の 区別」
   　　（動かした あとの 通り道を のこして「支点だけ 動かない」を 目で 見せる。
   　　 ほんものの てこでは 通り道は のこらない）
   　② 条件を 1つずつ 変えて くらべる ところ（手ごたえ）
   　③ 結果を 表に 整理して きまりを 見つける ところ（解説の かなめ）
   外部読み込みは なし。1ファイルで 動く。
   ========================================================= */
:root{
  --paper:#fdf6e3;
  --card:#fffdf7;
  --ink:#2b2118;
  --dim:#7a6a52;
  --line:#e7d9b8;
  --gold:#c9a227;      /* こたえ合わせ */
  --blue:#2f6fa8;      /* 同じ 画面の 中で すすむ */
  --ok:#5a8a4c;        /* べつの もんだいへ */
  --sub:#a99a7c;       /* もどる・やりなおす */
  --ng:#d34b4b;
  /* 3つの 点の 色。この 3色は 全ステップで そろえる。
     色だけで 見分けさせない ために、形（▲／手／もの）と 名前を かならず つける */
  --fu:#2f6fa8;        /* 支点　ささえる。動かない */
  --ri:#c0392b;        /* 力点　力を 加える */
  --sa:#1f7a5a;        /* 作用点　ものに 力が はたらく */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  /* 外から フォントを 読まない。端末に 入って いる まるい 書体を 上から さがす */
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Klee One','BIZ UDPGothic','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
  background:var(--paper);color:var(--ink);font-weight:700;-webkit-text-size-adjust:100%;
  user-select:none;-webkit-user-select:none;
}
#app{height:100%;display:flex;flex-direction:column;padding:8px 10px 8px;gap:6px;max-width:1240px;margin:0 auto;}

/* ---- 見出しと タブ ---- */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
h1{margin:0;font-size:clamp(15px,2.1vw,21px);letter-spacing:.04em;}
h1 .sub{color:#9a7c1e;font-size:.7em;margin-left:8px;}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tab{
  font:inherit;font-size:clamp(11px,1.42vw,15px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;min-height:40px;cursor:pointer;
}
.tab.on{color:#3a2c05;background:#f5d97a;border-color:var(--gold);}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ---- ステージ ---- */
#main{flex:1;min-height:0;position:relative;}
.stage{position:absolute;inset:0;display:none;flex-direction:column;gap:6px;}
.stage.on{display:flex;}
/* たて長の 画面では 表に 場所を まわす（1.35fr の ままだと ③の 記録の 表が
   1行 16px に つぶれて 字が 切れた。768×1024 で 実測） */
.cols{flex:1;min-height:0;display:grid;grid-template-rows:1.18fr 1fr;grid-template-columns:1fr;gap:6px;}
@media (orientation:landscape) and (min-width:700px){
  .cols.two{grid-template-columns:1.44fr .56fr;grid-template-rows:1fr;}
  /* 表が 主役の ④は 表を 広く とる */
  .cols.tall{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
  .segs{flex-direction:column;}
}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;min-height:0;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;}
.side{display:flex;flex-direction:column;gap:6px;min-height:0;}
.msg{
  /* display:flex に すると <b> や <span> が flex の 子に なり、語の とちゅうで
     折り返して しまう。block の まま 中央ぞろえに する */
  flex:0 0 auto;background:#f7f0dd;border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;font-size:clamp(12px,1.55vw,16px);line-height:1.5;text-align:center;
  min-height:44px;display:block;
}
.msg b{color:#9a7c1e;}
.msg .ok{color:#3f7a33;}
.msg .ng{color:#b33c3c;}
.msg .fu{color:var(--fu);}
.msg .ri{color:var(--ri);}
.msg .sa{color:var(--sa);}

/* ---- ボタン ---- */
.bar{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{
  font:inherit;font-size:clamp(12px,1.42vw,15px);color:#fff;border:none;border-radius:14px;
  padding:10px 15px;min-height:44px;cursor:pointer;background:#6a7f9b;
}
.btn:active{transform:scale(.97);}
.btn.play{background:var(--blue);}               /* 同じ 画面の 中で すすむ */
.btn.show{background:var(--gold);color:#3a2c05;} /* こたえ合わせ */
.btn.next{background:var(--ok);}                 /* べつの もんだいへ */
.btn.sub{background:var(--sub);}                 /* もどる・やりなおす */
.btn.ghost{background:#f6eed9;color:var(--dim);border:1px solid var(--line);}
.btn.ghost.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.btn[disabled]{opacity:.42;}

/* ---- 右の パネル ---- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:7px 8px;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;
}
.segs{flex:0 0 auto;display:flex;flex-direction:row;gap:6px;}
.segs .panel{flex:1;min-width:0;}
.panel .ttl{font-size:clamp(11px,1.22vw,13px);color:var(--dim);text-align:center;}
.seg{display:flex;gap:4px;}
.seg button{
  flex:1;font:inherit;font-size:clamp(11px,1.22vw,14px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);border-radius:11px;
  padding:7px 2px;min-height:40px;cursor:pointer;
}
.seg button.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.seg button[disabled]{opacity:.42;}

/* ---- 表 ----
   【大事】読ませる 表は かならず HTML で 組む。canvas に かくと
   画面が 小さい とき 字が 10px 以下まで 縮んで 読めなく なる。
   字の 大きさは vw だけで 決めない（たて長の iPad で ずっと 小さい ままに なる）。
   たて幅も 足す */
.tbl{flex:1;min-height:0;display:grid;gap:3px;font-size:clamp(11px,calc(0.74vw + 0.7vh),16px);}
.tbl div{
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:9px;padding:1px 3px;line-height:1.15;overflow:hidden;
}
/* 【大事】見出しの 字は 本文の 字に つられない 大きさに する（em では なく 実寸）。
   em に すると「字を 大きく する → 見出しが 折り返して 高く なる → 行が つぶれる →
   字を 小さく する」を くりかえして 決まらない（768×600 で 見出しが 119px に なって いた）。
   2026-09-20 に 実測して 直した。**em に もどさないこと** */
.tbl .h{background:#f1e6c8;color:#6a5a3a;flex-direction:column;gap:0;
  font-size:clamp(10.5px,calc(0.62vw + 0.6vh),16px);}
.tbl .h small{font-size:.82em;opacity:.85;font-weight:700;}
.tbl .h.fu{background:#e4edf7;color:var(--fu);}
.tbl .h.ri{background:#fbe9e4;color:var(--ri);}
.tbl .h.sa{background:#e2efe9;color:var(--sa);}
.tbl .r{background:#f6eed9;color:#6a5a3a;font-size:.9em;}
.tbl .c{background:#fbf6e8;border:1px solid var(--line);color:var(--dim);}
.tbl .c.on{background:#fff3cf;border-color:var(--gold);color:#5a4718;}
.tbl .c.now{box-shadow:0 0 0 2px var(--blue) inset;}
.tbl .c.pick{cursor:pointer;}
/* ④の □＝子どもが 入れる ます。表の 中で 目立たせる */
.tbl .c.blank{background:#fff8e6;border:3px solid var(--gold);color:#3a2c05;font-weight:700;}
.tbl .c.blank.mark-o{border-color:var(--ok);background:#e6f0e0;color:#3f7a33;}
.tbl .c.blank.mark-x{border-color:var(--ng);background:#fbecec;color:#b33c3c;}
.tbl .row-on{box-shadow:0 0 0 2px var(--blue) inset;}
/* 【大事】読ませる 表の 字は CSS の clamp では きめない。
   2026-09-20 の 指摘＝「②③は 表が 小さくて 見えません」。
   clamp（vw+vh）は 行数と パネルの 高さの ちがいに ついて いけず、
   ある 画面では 小さすぎ、別の 画面では 大きすぎて 切れる。
   `fitTbl()` が **行の 高さを 実測して 字の 大きさを きめる**。
   ここの clamp は その 前の 見た目（1こまだけ）を きめる だけ */
.tbl .h small{display:block;}
/* たて長の 画面では 表が 主役。絵より 表に 場所を まわす
   （④は 表を 読んで 考える ところなので いちばん 広く） */
@media (orientation:portrait){
  #s2 .cols{grid-template-rows:.74fr 1fr;}
  #s3 .cols{grid-template-rows:.82fr 1fr;}
  #s4 .cols{grid-template-rows:.72fr 1fr;}
}

/* えらぶ ボタン（予想・3択） */
.opts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
.opts.two{grid-template-columns:repeat(2,1fr);}
.opt{
  font:inherit;font-size:clamp(11px,1.3vw,15px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:12px;padding:8px 4px;min-height:44px;
  cursor:pointer;line-height:1.25;
}
.opt.sel{border-color:var(--gold);background:#fff3cf;color:#5a4718;}
.opt.right{border-color:var(--ok);background:#e6f0e0;color:#3f7a33;}
.opt.wrong{border-color:var(--ng);background:#fbecec;}
.opt[disabled]{opacity:.45;}
/* 3つの 点を えらぶ ボタンは その 点の 色の わくに する（色だけに たよらず 字も 出す） */
.opt.p-fu{color:var(--fu);border-color:#b9cde2;}
.opt.p-ri{color:var(--ri);border-color:#e6c4bd;}
.opt.p-sa{color:var(--sa);border-color:#bcd8cd;}
.opt.p-fu.sel{background:#e4edf7;border-color:var(--fu);}
.opt.p-ri.sel{background:#fbe9e4;border-color:var(--ri);}
.opt.p-sa.sel{background:#e2efe9;border-color:var(--sa);}

/* 予想の わく。まだ えらんで いない ときは 金の 実線で 強く 出す。
   これが ないと「ボタンが グレーで 動かない＝こわれた」に 見える */
.guess{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap;
  background:#f3ecd8;border:1px dashed var(--gold);border-radius:12px;padding:5px 8px;
}
.guess.need{border:2px solid var(--gold);background:#fff3cf;box-shadow:0 0 0 3px rgba(201,162,39,.18);}
.guess .gl{font-size:clamp(10.5px,1.22vw,14px);color:#8a6a10;white-space:nowrap;}
/* ⑤の 問いは たてに 1行 まるごと つかって 大きく 出す。
   2026-09-20 の 指摘＝「『支点は どれ？』などの 問題文が 小さくて、
   あ・い・う に 支点などの カードを 動かすのかと 思った」。
   問いが 小さいと「見出し」に 見えて、ボタンが えらぶ ところだと 伝わらない。
   **小さく もどさないこと** */
#g1,#g5{flex-direction:column;align-items:stretch;gap:6px;padding:7px 9px;}
#g1 .gl{white-space:normal;text-align:center;font-size:clamp(14px,calc(0.95vw + 0.92vh),22px);color:#6a5a3a;}
#g1 .opt{font-size:clamp(14px,calc(1.05vw + 1.0vh),24px);min-height:clamp(44px,6.2vh,58px);}
/* 自由に 動かす の 4つの えらびは たてに ひろげる（下に 大きな あきが できない ように） */
#p3free{justify-content:space-evenly;}
#g5 .gl{white-space:normal;text-align:center;line-height:1.3;
  font-size:clamp(15px,calc(1.05vw + 1.0vh),25px);color:#6a5a3a;}
#g5 .opts{min-width:0;}
#g5 .opt{font-size:clamp(18px,calc(1.5vw + 1.4vh),34px);min-height:clamp(46px,7vh,64px);}
.guess .opts{flex:1;min-width:170px;}

/* 数を 入れる ところ（③） */
.num{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  background:#fbf6e8;border:1px solid var(--line);border-radius:12px;padding:6px;
}
.num .lb{font-size:clamp(11px,1.25vw,14px);color:var(--dim);}
.num .v{
  min-width:2.4em;text-align:center;font-size:clamp(20px,2.7vw,30px);color:#3a2c05;
  background:#fff8e6;border:2px solid var(--gold);border-radius:10px;padding:1px 6px;
}
.num button{
  font:inherit;font-size:clamp(15px,1.9vw,21px);color:#fff;background:var(--blue);
  border:none;border-radius:11px;width:clamp(42px,5vw,52px);min-height:44px;cursor:pointer;
}
.num button[disabled]{opacity:.42;}

/* ⑤ 道具の 進み具合 */
/* 6つ を よこ3列 × たて2段。1列に ならべると「空きかんつぶし」が 折り返して つぶれる */
.tools{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.tool{
  font:inherit;font-size:clamp(10.5px,1.2vw,13.5px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:12px;padding:6px 2px;min-height:46px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;
}
.tool.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.tool .st{font-size:.85em;opacity:.8;}
.tool.done .st{color:var(--ok);opacity:1;}

/* ⑤の まとめカード */
.sum{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;}
.sumbox{
  background:#fbf6e8;border:1px solid var(--line);border-radius:12px;padding:6px 8px;
  font-size:clamp(10.5px,calc(0.7vw + 0.66vh),15px);line-height:1.4;color:#5a4a30;
}
.sumbox .t{color:#8a6a10;font-size:.9em;}
.sumbox b.fu{color:var(--fu);} .sumbox b.ri{color:var(--ri);} .sumbox b.sa{color:var(--sa);}
.sumbox.hide{display:none;}
.order{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:3px;}
.order span{
  border-radius:8px;padding:2px 7px;font-size:.95em;border:2px solid;
}
.order .o-fu{color:var(--fu);border-color:var(--fu);background:#e4edf7;}
.order .o-ri{color:var(--ri);border-color:var(--ri);background:#fbe9e4;}
.order .o-sa{color:var(--sa);border-color:var(--sa);background:#e2efe9;}
.order i{font-style:normal;color:var(--dim);opacity:.7;}

/* きまりの ふだ（②④の まとめ） */
.rule{
  flex:0 0 auto;background:#fff8e6;border:2px solid var(--gold);border-radius:12px;
  padding:6px 9px;font-size:clamp(11px,calc(0.72vw + 0.68vh),16px);line-height:1.45;
  color:#5a4718;text-align:center;
}
.rule.hide{display:none;}
.rule b{color:#9a6a10;}

/* いちばん下の 注意 */
#safety{
  flex:0 0 auto;text-align:center;color:#8a6a10;background:#f7eccd;
  border:1px solid var(--line);border-radius:10px;padding:3px 7px;
  font-size:clamp(9px,1.05vw,12.5px);line-height:1.3;
}
#safety b{color:#b3541e;}

@media (max-height:640px){
  #app{padding:5px 8px 5px;gap:4px;}
  .msg{padding:6px 9px;min-height:36px;font-size:clamp(11px,1.45vw,15px);}
  .btn{min-height:40px;padding:8px 11px;}
  .tab{min-height:36px;padding:5px 11px;}
  .opt{min-height:40px;}
  .num button{min-height:40px;}
  .seg button{min-height:36px;}
  .tool{min-height:42px;}
}
@media (max-height:560px){
  .panel .ttl{display:none;}
  h1 .sub{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>てこの はたらき<span class="sub">支点・力点・作用点</span></h1>
    <nav id="tabs">
      <button class="tab on" data-s="1">① 3つの 点を 見つける</button>
      <button class="tab" data-s="2">② 手ごたえを くらべる</button>
      <button class="tab" data-s="3">③ つり合いを 調べる</button>
      <button class="tab" data-s="4">④ きまりを 見つける</button>
      <button class="tab" data-s="5">⑤ 道具を 調べる</button>
    </nav>
  </header>

  <div id="main">

    <!-- ① 3つの 点を 見つける -->
    <section class="stage on" id="s1">
      <div class="cols two">
        <div class="card"><canvas id="c1"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">3つの 点</div>
            <div class="tbl" id="t1" style="grid-template-rows:repeat(3,1fr);grid-template-columns:1fr;"></div>
          </div>
          <div class="guess" id="g1" style="display:none">
            <span class="gl" id="g1l">光って いる 点の 名前は？</span>
            <div class="opts" id="o1">
              <button class="opt p-fu" data-v="fu">支点</button>
              <button class="opt p-ri" data-v="ri">力点</button>
              <button class="opt p-sa" data-v="sa">作用点</button>
            </div>
          </div>
        </div>
      </div>
      <div class="msg" id="m1"></div>
      <div class="bar" id="b1"></div>
    </section>

    <!-- ② 手ごたえを くらべる -->
    <section class="stage on" id="s2" style="display:none">
      <div class="cols two">
        <div class="card"><canvas id="c2"></canvas></div>
        <div class="side">
          <div class="guess" id="g2">
            <span class="gl" id="g2l"></span>
            <div class="opts" id="o2">
              <button class="opt" data-v="up">大きく なる</button>
              <button class="opt" data-v="down">小さく なる</button>
              <button class="opt" data-v="same">変わらない</button>
            </div>
          </div>
          <!-- 【大事】絵と 同じ ならびに する＝<作用点が 左・力点が 右>。
               2026-09-20 の 指摘＝「図は 作用点が 左なのに、数字を 入力する ところは

          <div class="segs">

    <!-- ③ つり合いを 調べる -->
    <section class="stage on" id="s3" style="display:none">

        <div class="side">
          <div class="tools" id="q5"></div>
          <!-- 2026-09-20 の 指摘＝「3つの 点を どう 答えたら いいのか 分からない」。
               絵の ○に <b>あ・い・う</b> の 名前を つけ、下に 同じ 3つの ボタンを 出す。
               ○を おしても ボタンを おしても 入る（ほかの アプリと 同じ 二とおり）。
               **この ボタンを 消さないこと** -->

              <div class="ttl">3つの 点</div>

    <b>気を つける こと</b>　実験器の おもりは 落とさない。ペンチや くぎぬきは <b>指を はさまない</b>。
    てこの うでの 下に 手を 入れない。

<script>
"use strict";
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const BW=1000,BH=560;                 /* 絵の 基準の 大きさ */
const C={fu:'#2f6fa8',ri:'#c0392b',sa:'#1f7a5a'};
const NAME={fu:'支点',ri:'力点',sa:'作用点'};
const MEAN={
  fu:'ささえる ところ。ここだけ 動かない',
  ri:'力を 加える ところ。手で おす',
  sa:'ものに 力が はたらく ところ',
};
let step=1,dirty=true,last=0;

/* ========================= 下じき ========================= */
function fit(cv){
  const r=cv.getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d;}
  const g=cv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,w,h);
  return {g,w,h};
}
/* 基準の 大きさで かいて、画面に 合わせて 縮める。どの iPad でも はみ出さない */
function base(g,w,h){
  const s=Math.min(w/BW,h/BH);
  g.save();g.translate((w-BW*s)/2,(h-BH*s)/2);g.scale(s,s);
  return s;
}
/* canvas を おした ところを 基準の 座標に なおす（絵の 中の 点を タップする ため） */
function toBase(cv,ev){
  const r=cv.getBoundingClientRect();
  const s=Math.min(r.width/BW,r.height/BH);
  return {x:(ev.clientX-r.left-(r.width-BW*s)/2)/s,
          y:(ev.clientY-r.top -(r.height-BH*s)/2)/s};
}
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans",sans-serif';
function txt(g,s,x,y,size,color,align,baseline,weight){
  g.save();
  g.font=(weight||700)+' '+size+'px '+FONT;
  g.textAlign=align||'center';g.textBaseline=baseline||'middle';
  g.fillStyle=color||'#2b2118';g.fillText(s,x,y);
  g.restore();
}
/* 表の 字を 行の 高さから きめる。行数も パネルの 高さも 画面ごとに ちがうので、
   実測しないと「小さすぎて 読めない」か「大きすぎて 切れる」の どちらかに なる。
   cols＝見出しの ます の 数、chars＝ますに 入る 字数の めやす */
/* 【大事】ますごとに「その ますに 入って いる 字の 数」で 計算する。
   表ぜんたいで 1つの 字数を 決めうちすると、1けたしか 入らない ほそい 列が
   よこ幅の 上限を 決めて しまい、字が むだに 小さく なる
   （②が 18px まで 下がって いた。2026-09-20 に 実測して 直した）。
   全角は 1.0、半角は 0.56 として 数える */
function txtw(str){
  let w=0;
  for(const c of String(str))w+=(/\s/.test(c))?0.4:((c.charCodeAt(0)<128)?0.62:1.0);
  return Math.max(1,w);
}
function fitTbl(el,cols,maxPx,lines){
  const L=lines||1;
  const run=()=>{
    const kids=el.children;
    if(kids.length<=cols)return;
    let fs=1e9;
    for(let i=cols;i<kids.length;i++){
      const e=kids[i],r=e.getBoundingClientRect();
      if(r.height<=1)continue;
      fs=Math.min(fs, r.height*0.62/L, (r.width-14)*0.97/(txtw(e.textContent)/L));
    }
    if(fs>1e8)return;
    el.style.fontSize=clamp(fs,9.5,maxPx||24).toFixed(1)+'px';
  };
  /* 見出しは auto の 高さなので、字を 変えると 行の 高さも 変わる。
     1回や 2回では 落ちつかない ことが あるので 3回 まわす */
  requestAnimationFrame(()=>{run();requestAnimationFrame(()=>{run();requestAnimationFrame(run);});});
}
function tw(g,s,size,weight){
  g.save();g.font=(weight||700)+' '+size+'px '+FONT;
  const w=g.measureText(s).width;g.restore();return w;
}
function rrp(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
function box(g,x,y,w,h,r,fill,stroke,lw){
  rrp(g,x,y,w,h,r);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}
}
function circ(g,x,y,r,fill,stroke,lw){
  g.beginPath();g.arc(x,y,r,0,TAU);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}
}
function line(g,x0,y0,x1,y1,col,lw,dash){
  g.save();g.strokeStyle=col;g.lineWidth=lw||2;g.lineCap='round';
  if(dash)g.setLineDash(dash);
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.restore();
}
/* 教室の 明るい 地。3つの 点の 色が よく 見える ように、地は しずかな 色に する */
/* 地は letterbox の 帯まで ぬる。ぬらないと カードの 上下に 白い 帯が 出て
   絵が 宙に ういて 見える（水よう液の bench() と 同じ） */
const OVER=900;
function room(g){
  const gr=g.createLinearGradient(0,-OVER,0,BH+OVER);
  gr.addColorStop(0,'#f4ecd8');gr.addColorStop(1,'#e8dcc0');
  g.fillStyle=gr;g.fillRect(-OVER,-OVER,BW+OVER*2,BH+OVER*2);
}
function floor(g,y,col){
  g.fillStyle=col||'#cdb894';g.fillRect(-OVER,y,BW+OVER*2,BH+OVER-y);
  line(g,-OVER,y,BW+OVER,y,'#a89170',3);
}
/* 絵の 上に 出す 字は うすい 板を しいてから（もようの 上だと 読めない） */
function tag(g,s,x,y,size,col,bg){
  size=size||16;
  const w=tw(g,s,size)+16;
  box(g,x-w/2,y-size*.82,w,size*1.64,8,bg||'rgba(255,255,255,.88)','rgba(0,0,0,.10)',1.5);
  txt(g,s,x,y,size,col||'#4a3c22');
}
/* 矢じるし */
function arrow(g,x0,y0,x1,y1,col,lw,head){
  const a=Math.atan2(y1-y0,x1-x0);head=head||12;
  line(g,x0,y0,x1-Math.cos(a)*head*.6,y1-Math.sin(a)*head*.6,col,lw||5);
  g.save();g.translate(x1,y1);g.rotate(a);g.fillStyle=col;
  g.beginPath();g.moveTo(head,0);g.lineTo(-head*.75,head*.72);g.lineTo(-head*.75,-head*.72);g.closePath();g.fill();
  g.restore();
}

/* ========================= 3つの 点の しるし =========================
   色だけで 見分けさせない。かならず 名前を そえ、力の 向きの 矢も つける。
   ・支点  … 動かない ことを しめす ため 二重の 輪
   ・力点  … 下へ 力を 加える 矢
   ・作用点 … ものが 上がる 矢
   ========================================================= */
function markPoint(g,x,y,k,o){
  o=o||{};
  const r=o.r||17, col=C[k];
  if(o.pulse){
    g.save();g.globalAlpha=.30+.28*Math.sin(o.pulse*5);
    circ(g,x,y,r+12+4*Math.sin(o.pulse*5),col,null);g.restore();
  }
  if(o.dim){g.save();g.globalAlpha=.42;}
  circ(g,x,y,r,'#fffdf7',col,5);
  circ(g,x,y,r*0.42,col,null);
  if(k==='fu'){circ(g,x,y,r+6,null,col,2);}
  if(o.dim)g.restore();
  if(o.label!==false){
    const s=o.label||NAME[k];
    const dx=o.lx||0, dy=o.ly||(k==='ri'?-40:38);
    tag(g,s,x+dx,y+dy,o.ls||17,col,'rgba(255,255,255,.93)');
  }
}
/* 力の 向き（力点は 下へ おす、作用点は ものが 上がる） */
function forceArrow(g,x,y,k,len){
  len=len||46;
  if(k==='ri')arrow(g,x,y-len-22,x,y-24,C.ri,6,13);
  if(k==='sa')arrow(g,x,y-24,x,y-len-22,C.sa,6,13);
}
/* 通った あと（弧）。①の かなめ＝支点だけ 弧が えがけない */
function trail(g,cx,cy,rad,a0,a1,col,lw){
  if(Math.abs(a1-a0)<0.004||rad<6)return;
  g.save();g.strokeStyle=col;g.lineWidth=lw||7;g.lineCap='round';g.globalAlpha=.55;
  g.beginPath();g.arc(cx,cy,rad,Math.min(a0,a1),Math.max(a0,a1));g.stroke();
  g.restore();
}
/* 三角の ささえ（支点の 実物） */
function fulcrum(g,x,y,w,h,col){
  g.beginPath();g.moveTo(x,y);g.lineTo(x-w,y+h);g.lineTo(x+w,y+h);g.closePath();
  g.fillStyle=col||'#8c7a5c';g.fill();g.strokeStyle='#6b5c42';g.lineWidth=3;g.stroke();
}
/* にぎる 手（まるい 4本指＋おやゆび）。力点の 目じるし */
function hand(g,x,y,k,flip){
  g.save();g.translate(x,y);if(flip)g.scale(-1,1);g.scale(k||1,k||1);
  g.fillStyle='#f0c9a6';g.strokeStyle='#c79b74';g.lineWidth=2.4;
  box(g,-20,-6,40,30,13,'#f0c9a6','#c79b74',2.4);
  for(let i=0;i<3;i++){box(g,-16+i*12,-16,11,16,5,'#f0c9a6','#c79b74',2);}
  box(g,14,-2,16,12,6,'#f0c9a6','#c79b74',2);
  g.restore();
}

/* =========================================================
   ① 3つの 点を 見つける
   子どもが いちばん つまずく ところ。
   ことばで「支点は ささえる ところ」と 言っても おぼえられないので、
   **動かした あとの 通り道を のこして** 見せる。
   　力点  … 大きな 弧
   　作用点 … 小さな 弧
   　支点  … 弧が ない（動かない）
   ほんものの てこでは 通り道は のこらない。ここが アプリの 役わり。
   ========================================================= */
/* 石は 地面に あって、棒の 先が その 下に 入って いる。
   手を 下げる（TH0→TH1）と 石が 持ち上がる。
   うでの 長さを 330 と 120 に して、力点が 大きく・作用点が 少し 動く ように した
   （ここが ①の かなめ。動いた 長さの ちがいが 目で 分かる） */
const FX1=440,FY1=370,ARM_SA=120,ARM_RI=330,GY1=433;
const TH0=-0.53,TH1=-0.115;
/* 【①は「見る → 答える」】
   2026-09-20 の 指摘＝「**1つ 進んでは 答えを 出すのでは なく、子どもが
   チカチカして いる 点が 何点か 答える 方が いい**」。
   まえは ph3〜5 で 支点→力点→作用点 を アプリが 順に 名のって いた。
   いまは **見る のは 3こま（動かす／通った 道／どこが 動かない）だけ**で、
   そのあと **3つの 点を 1つずつ 光らせて 子どもが 名前を 答える**。
   名前と 意味は 右の 表に ぜんぶ 出して おく＝**かくすのは「どこか」だけ**。
   **アプリが 順に 答えを 出す 形に もどさないこと** */
const S1={ph:0,th:TH0,anim:false,quiz:false,qi:0,bad:[],mark:null,doneK:{},t:0};
const Q1=['fu','ri','sa'];   /* 支点から（②の「まん中は 動かない」の つづき）。ランダムに しない */

/* 名前の ふだを 出す 向き。力の 矢や 通った あとと かさならない ように ずらす */
const LP1={fu:{lx:0,ly:-48},ri:{lx:60,ly:6},sa:{lx:-30,ly:48}};
function p1(arm,th){return {x:FX1+Math.cos(th)*arm,y:FY1+Math.sin(th)*arm};}
function pts1(){
  return {fu:{x:FX1,y:FY1},sa:p1(-ARM_SA,S1.th),ri:p1(ARM_RI,S1.th)};
}
function rock1(g,x,y){
  g.save();g.translate(x,y);
  g.beginPath();
  g.moveTo(-52,0);g.lineTo(-60,-34);g.lineTo(-26,-60);g.lineTo(28,-56);
  g.lineTo(58,-26);g.lineTo(46,0);g.closePath();
  g.fillStyle='#9aa0a6';g.fill();g.strokeStyle='#6f757b';g.lineWidth=3;g.stroke();
  g.globalAlpha=.35;g.fillStyle='#cfd4d8';
  g.beginPath();g.moveTo(-40,-8);g.lineTo(-44,-30);g.lineTo(-20,-48);g.lineTo(-6,-22);g.closePath();g.fill();
  g.globalAlpha=1;
  txt(g,'20kg',0,-28,17,'#4c5257');
  g.restore();
}
function done1(){return S1.quiz&&S1.qi>=Q1.length;}
function draw1(){
  const {g,w,h}=fit($('c1'));base(g,w,h);
  room(g);floor(g,GY1);
  const P=pts1(), sh=S1.ph;
  /* てこの 棒 */
  g.save();g.translate(FX1,FY1);g.rotate(S1.th);
  box(g,-ARM_SA-30,-11,ARM_SA+ARM_RI+62,22,7,'#c08f4e','#8d6431',3);
  g.globalAlpha=.30;g.fillStyle='#e0b176';g.fillRect(-ARM_SA-24,-8,ARM_SA+ARM_RI+50,6);g.globalAlpha=1;
  g.restore();
  fulcrum(g,FX1,FY1+9,40,GY1-FY1-9);
  rock1(g,P.sa.x-52,P.sa.y+4);
  hand(g,P.ri.x+2,P.ri.y-28,1,false);
  /* 通った あと（絵の 上に のせる。棒の 下だと 見えない） */
  if(sh>=1){
    trail(g,FX1,FY1,ARM_RI,TH0,S1.th,C.ri,sh>=2?10:8);
    trail(g,FX1,FY1,ARM_SA,Math.PI+TH0,Math.PI+S1.th,C.sa,sh>=2?10:8);
  }
  if(sh===2&&!S1.quiz){
    tag(g,'大きく 動いた',P.ri.x+66,(P.ri.y+FY1+Math.sin(TH0)*ARM_RI)/2,17,C.ri);
    tag(g,'少し 動いた',P.sa.x-14,P.sa.y+58,17,C.sa);
    tag(g,'ぜんぜん 動かない',FX1+22,FY1-58,17,C.fu);
  }
  if(S1.quiz){
    const k=Q1[Math.min(S1.qi,Q1.length-1)];
    ['fu','ri','sa'].forEach(j=>{
      const q=P[j];
      if(S1.doneK[j]){
        forceArrow(g,j==='sa'?q.x+34:q.x,q.y,j);
        markPoint(g,q.x,q.y,j,{lx:LP1[j].lx,ly:LP1[j].ly,r:19});
      }else if(j===k&&!done1()){
        /* いま 答える 点。大きく ゆっくり 光らせる */
        g.save();g.globalAlpha=.26+.22*Math.sin(S1.t*3.2);
        circ(g,q.x,q.y,36+6*Math.sin(S1.t*3.2),'#c9a227',null);g.restore();
        circ(g,q.x,q.y,26,'#fffdf7','#9c8f76',5);
        txt(g,'？',q.x,q.y+1,26,'#6a5a3a');
      }else{
        circ(g,q.x,q.y,17,'#fffdf7','#b6a98f',4);

function step1(dt){
  S1.t+=dt;

    if(S1.th>=TH1-1e-4){S1.th=TH1;S1.anim=false;up1();}
    return true;
  }
  return false;
}

/* =========================================================
   ② 手ごたえを くらべる
   解説「力を加える位置や力の大きさを変えると，てこを傾ける働きが変わり」。
   変えられる ものは <力点の きょり> と <作用点の きょり> の 2つだけに する
   （変える ものを ふやすと、どれが きいて いるのか 分からなく なる）。
   おもりの 重さは 600g で 固定。
   予想を えらぶまで 動かせない。結果だけ 見せると 実験の 記録映像に なる。
   ========================================================= */
/* 【②を ③と ちがう 画面に する】
   2026-09-20 の 指摘＝「②は 何を どう するのか 分かりません。③と 似て いるので…」。
   原因は 絵が ③の てこ実験器と そっくり だった こと（同じ 支柱・同じ 目もりの うで）。
   だから ②は **①と 同じ 場面（石を 棒で 持ち上げる）**の つづきに した。
   ・支柱の ある 実験器では なく、**地面・三角の ささえ・石・手** で かく
   ・**数（g）を 出さない**＝手ごたえは **バーと ことば** だけ。
   　（400g の ばねばかりが「2つめの おもり」に 見えた ため。数を あつかうのは ③④）
   ・**「てこを つかわない とき」の 目もり**を バーに 立てる＝
   　そこより 左なら「てこの おかげで 軽い」が 目で わかる
   ・**ねらいは「いちばん 軽く なる ところを さがす」**＝やる ことが 一言で 言える
   ③は 数で つり合いを 調べる ところ。②は 手ごたえを くらべる ところ。**混ぜないこと** */
/* 【②を ③と ちがう 画面に する】
   2026-09-20 の 指摘①＝「②は 何を どう するのか 分かりません。③と 似て いるので…」。
   原因は 絵が ③の てこ実験器と そっくり だった こと（同じ 支柱・同じ 目もりの うで）。
   だから ②は **地面・三角の ささえ・おもり・手** で かく。支柱の ある 実験器では ない。
   2026-09-20 の 指摘②＝「**力点に かかる 力が わからないので 答えられません**」。
   いちど 数（g）を 消して バーと ことばだけに したが、それでは
   「いちばん 小さい 力に なる ところ」を 決められなかった。**数は かならず 出す**。
   ただし **数は 1か所だけ（下の バーの 中）**に 置く。
   まえに 400g を ばねばかりの よこに 出したら「2つめの おもり」に 見えたので、
   **おもりと 同じ 見た目の ものを 右に 置かない**（ばねばかりの 絵を 出さない）。
   ========================================================= */
const FX2=400,FY2=268,U2=72,GY2=372,WT2=600;
const S2={ri:3,sa:2,g:{ri:null,sa:null},tried:{ri:{},sa:{}},done:{ri:false,sa:false},rows:[]};
/* 600 は 1〜5 の どれで わっても 整数に なる＝はんぱな 数が 出ない */
function force2(){return Math.round(WT2*S2.sa/S2.ri);}
function word2(f){
  return f<=150?'とても 軽い':f<=350?'軽い':f<=700?'ふつう':f<=1200?'重い':'とても 重い';
}
function best2(){return S2.ri===5&&S2.sa===1;}
/* 手で おす 力の バー。**数は ここだけ**。
   「てこを つかわない とき（600g）」の 目もりを 立てて、そこより 左なら
   てこの おかげで 小さい 力で すむ ことが 目で わかる */
function meter2(g){
  const x0=272,x1=846,y=452,h=36,f=force2();
  txt(g,'手で おす 力',216,y+h/2,19,'#6a5a3a','right');
  box(g,x0,y,x1-x0,h,10,'#f0e6cf','#d9c9a4',2);
  const t=clamp(f/1800,0,1);
  const gr=g.createLinearGradient(x0,0,x1,0);
  gr.addColorStop(0,'#e8b15a');gr.addColorStop(1,'#c0392b');
  box(g,x0,y,Math.max(16,(x1-x0)*t),h,10,gr,null);
  const xm=x0+(x1-x0)/3;
  line(g,xm,y-12,xm,y+h+12,'#6a5a3a',3,[6,5]);
  txt(g,'てこを つかわない とき 600g',xm,y+h+26,15,'#6a5a3a');
  tag(g,f+'g　'+word2(f),clamp(x0+(x1-x0)*t+8,x0+92,x1-92),y+h/2,21,'#3a2c05','#fffdf7');
}
/* 持ち上げる おもり（600g の はこ）。石だと 重さが 見た目と 合わない */
function load2(g,x,y){
  box(g,x-46,y-62,92,62,8,'#b08a5a','#7b6a52',3);
  g.save();g.strokeStyle='#7b6a52';g.lineWidth=4;g.lineCap='round';

}
function draw2(){
  const {g,w,h}=fit($('c2'));base(g,w,h);
  room(g);
  g.fillStyle='#cdb894';g.fillRect(-900,GY2,BW+1800,34);
  line(g,-900,GY2,BW+900,GY2,'#a89170',3);

  /* めあて＝やる ことを 一言で */
  box(g,100,14,800,44,12,'#fff8e6','#c9a227',3);
  txt(g,'600g の おもりを、いちばん 小さい 力で 持ち上げるには？',BW/2,36,21,'#8a6a10');
  /* 棒 */
  box(g,xs-56,FY2-11,(xr-xs)+112,22,7,'#c08f4e','#8d6431',3);
  for(let i=1;i<=5;i++){const x=FX2+i*U2;
    if(x<=xr+30){line(g,x,FY2-11,x,FY2-21,'#8d6431',3);txt(g,String(i),x,FY2-32,14,'#8a7250');}}
  for(let i=1;i<=3;i++){const x=FX2-i*U2;
    if(x>=xs-30){line(g,x,FY2-11,x,FY2-21,'#8d6431',3);txt(g,String(i),x,FY2-32,14,'#8a7250');}}
  fulcrum(g,FX2,FY2+9,46,GY2-FY2-9);
  load2(g,xs,FY2-12);
  hand(g,xr,FY2-54,1.1,false);
  arrow(g,xr+54,FY2-122,xr+54,FY2-42,C.ri,6,13);
  tag(g,'手で おす',xr+126,FY2-84,16,C.ri);
  /* きょりの 矢 */
  const ay=FY2+80;
  arrow(g,FX2,ay,xs,ay,'rgba(31,122,90,.6)',3,9);
  arrow(g,xs,ay,FX2,ay,'rgba(31,122,90,.6)',3,9);
  tag(g,'支点→作用点　'+S2.sa,(FX2+xs)/2,ay,16,C.sa);
  arrow(g,FX2,ay,xr,ay,'rgba(192,57,43,.6)',3,9);
  arrow(g,xr,ay,FX2,ay,'rgba(192,57,43,.6)',3,9);
  tag(g,'支点→力点　'+S2.ri,(FX2+xr)/2,ay,16,C.ri);
  /* 3つの 点 */
  markPoint(g,FX2,FY2,'fu',{ly:-58,r:15});
  markPoint(g,xr,FY2,'ri',{lx:-6,ly:44,r:15});
  markPoint(g,xs,FY2,'sa',{lx:-14,ly:44,r:15});
  meter2(g);
  /* いちばん 小さい ときは バーの 右が あいて いるので そこに 出す */
  if(best2())tag(g,'いちばん 小さい 力！',690,470,20,'#3f7a33','#e6f0e0');
  g.restore();
}
function seg2(id,n,key){
  const el=$(id);
  el.innerHTML=Array.from({length:n},(_,i)=>
    '<button data-v="'+(i+1)+'"'+(S2[key]===i+1?' class="on"':'')+'>'+(i+1)+'</button>').join('');
  const lock=!S2.g[key];

function tbl2(){
  const el=$('t2');
  /* 列の ならびも 絵と 同じ＝作用点が 左。行は 3つ
     （4つに すると 1行が ひくく なって 字が 小さく なる。2026-09-20 の 指摘） */
  el.style.gridTemplateColumns='1fr 1fr 1.7fr';

function rec2(){
  const f=force2()+'g';
  const key=S2.ri+'-'+S2.sa;
  if(S2.rows.some(r=>r.k===key))return;
  S2.rows.unshift({k:key,ri:S2.ri,sa:S2.sa,f:f});
  if(S2.rows.length>3)S2.rows.pop();
}
function up2(){
  seg2('q2ri',5,'ri');seg2('q2sa',3,'sa');tbl2();
  const gb=$('g2'),gl=$('g2l'),ob=$('o2');

    if(S2.done.sa)s+=(s?'<br>':'')+'支点から <b>作用点</b>までを <b>短く</b> すると、手で おす 力は <b>小さく</b> なる。';

      '<b>手で おす 力</b>が どう 変わるか 見よう。調べた ものは <b>表</b>に たまる。'+

  }else if(!S2.g.sa){
    $('m2').innerHTML=judge2('ri')+' つぎは <b>作用点</b>の ばんだよ。予想を えらぼう。';
  }else if(!S2.done.sa){
    $('m2').innerHTML='<b style="color:'+C.sa+'">支点から 作用点まで</b>の <b>数の ボタン</b>を おして、くらべよう。'+
      '（あと '+Math.max(0,2-Object.keys(S2.tried.sa).length)+' とおり）';
  }else if(best2()){
    $('m2').innerHTML='<span class="ok">これが いちばん 小さい 力（'+force2()+'g）！</span> '+
      '<span class="ri">力点</span>を いちばん <b>遠く</b>、<span class="sa">作用点</span>を いちばん <b>近く</b>に した とき。';
  }else{
    $('m2').innerHTML=judge2('sa')+' <span class="ri">力点</span>を 遠く、'+
      '<span class="sa">作用点</span>を 近くに すると 小さい 力で すむ。'+
      '<b>いちばん 小さい 力に なる ところ</b>を さがして みよう。';
  }
  $('b2').innerHTML='<button class="btn sub" id="b2reset">はじめから</button>';
  $('b2reset').onclick=()=>{
    S2.ri=3;S2.sa=2;S2.g={ri:null,sa:null};S2.tried={ri:{},sa:{}};
    S2.done={ri:false,sa:false};S2.rows=[];up2();
  };
  dirty=true;
}
function judge2(k){
  return S2.g[k]==='down'
    ? '<span class="ok">予想は あたり！</span>'
    : '<span class="ng">予想と ちがったね。</span>';

$('o2').addEventListener('click',e=>{

  const q=$('o2').dataset.q;if(!q)return;

});
function pick2(key,v){
  if(!S2.g[key])return;
  S2[key]=v;S2.tried[key][v]=true;rec2();

}
$('q2ri').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)pick2('ri',Number(b.dataset.v));});

/* =========================================================
   ③ つり合いを 調べる（てこ実験器）
   解説の 内容の取扱い「(ｱ) については，てこ実験器」。
   ここでは まだ <重さ×きょり> の きまりは 言わない。
   数を 表に ためる ところまで。きまりを 見つけるのは ④の しごと。
   ========================================================= */
const CX3=500,CY3=212,U3=60,GY3=456,MAXTH=0.22;
const Q3=[
  {ln:2,ld:6,rd:4,ans:3},{ln:3,ld:2,rd:3,ans:2},{ln:5,ld:2,rd:5,ans:2},
  {ln:4,ld:6,rd:4,ans:6},{ln:6,ld:2,rd:3,ans:4},{ln:2,ld:5,rd:2,ans:5},
];
const S3={mode:'free',qi:0,rn:1,rel:false,mark:null,th:0,tgt:0,
          f:{ln:3,ld:4,rn:4,rd:3}};
/* いま 画面に 出て いる 4つの 数 */
function cur3(){
  if(S3.mode==='free')return {...S3.f};
  const q=Q3[S3.qi];
  return {ln:q.ln,ld:q.ld,rn:S3.rn,rd:q.rd};
}
function tilt3(){
  const c=cur3();
  if(S3.mode==='quiz'&&!S3.rel)return 0;         /* 手で ささえて いる */
  return clamp((c.rn*c.rd-c.ln*c.ld)*0.020,-MAXTH,MAXTH);
}
function arm3(d,side,th){   /* d=きょり side=-1左 +1右 */
  const x=side*d*U3;
  return {x:CX3+Math.cos(th)*x,y:CY3+Math.sin(th)*x};
}
function weights3(g,x,y,n,col){
  line(g,x,y,x,y+16,'#6b5c42',3);
  for(let i=0;i<n;i++){
    box(g,x-22,y+16+i*15,44,14,4,col||'#7f8b96','#5a6570',2);
  }
  tag(g,n+'こ',x,y+16+n*15+18,15,'#4a3c22');
}
function draw3(){
  const {g,w,h}=fit($('c3'));base(g,w,h);
  room(g);floor(g,GY3);
  const c=cur3(),th=S3.th;
  /* 支柱 */
  box(g,CX3-90,GY3-16,180,20,8,'#8c7a5c','#6b5c42',3);
  box(g,CX3-13,CY3,26,GY3-CY3-8,6,'#a99a7c','#8a7a5c',3);
  /* うで */
  g.save();g.translate(CX3,CY3);g.rotate(th);
  box(g,-6.6*U3,-10,13.2*U3,20,6,'#d9b26a','#9c7838',3);
  for(let s=-1;s<=1;s+=2){
    for(let i=1;i<=6;i++){
      circ(g,s*i*U3,0,4.6,'#fffdf7','#9c7838',2);
      txt(g,String(i),s*i*U3,-21,13,'#8a7250');
    }
  }
  circ(g,0,0,7,'#9c7838',null);
  g.restore();
  /* おもり */
  const L=arm3(c.ld,-1,th),R=arm3(c.rd,1,th);
  weights3(g,L.x,L.y,c.ln,'#6f8aa6');
  weights3(g,R.x,R.y,c.rn,'#a6826f');
  /* まん中＝支点 */
  markPoint(g,CX3,CY3,'fu',{ly:-38,r:14});
  /* 手で ささえて いる あいだ */
  if(S3.mode==='quiz'&&!S3.rel){
    hand(g,CX3+2*U3,CY3+52,.9,false);
    hand(g,CX3-2*U3,CY3+52,.9,true);
    tag(g,'手で ささえて いる',CX3,CY3+104,16,'#6a5a3a');
  }
  /* 左右の 数を 大きく 出す（表と 見くらべる ため） */
  tag(g,'左　おもり '+c.ln+'こ　'+c.ld+'の ところ',250,506,17,'#40525e');
  tag(g,'右　おもり '+c.rn+'こ　'+c.rd+'の ところ',750,506,17,'#6b4a3a');
  if(S3.mode==='quiz'&&S3.rel&&S3.mark==='o'){
    tag(g,'水平に つり合った！',CX3,64,21,'#3f7a33','rgba(255,255,255,.95)');
  }
  g.restore();
}
const REC3=[];
function tbl3(){
  const el=$('t3');
  el.style.gridTemplateColumns='1fr 1fr 1fr 1fr';
  /* 見出しは 1行だけ（2行 つかうと その ぶん 行が つぶれて 数が 読めない） */
  el.style.gridTemplateRows='auto repeat(6,1fr)';
  let s='<div class="h" style="background:#e6edf3;color:#40525e">左<small>おもり</small></div>'+
        '<div class="h" style="background:#e6edf3;color:#40525e">左<small>きょり</small></div>'+
        '<div class="h" style="background:#f3e9e3;color:#6b4a3a">右<small>おもり</small></div>'+
        '<div class="h" style="background:#f3e9e3;color:#6b4a3a">右<small>きょり</small></div>';
  for(let i=0;i<6;i++){
    const r=REC3[i];
    if(!r){s+='<div class="c"></div>'.repeat(4);continue;}
    s+='<div class="c on">'+r.ln+'</div><div class="c on">'+r.ld+'</div>'+
       '<div class="c on">'+r.rn+'</div><div class="c on">'+r.rd+'</div>';
  }
  el.innerHTML=s;
  fitTbl(el,4,30);
}
function seg3(id,key){
  const el=$(id);
  el.innerHTML=Array.from({length:6},(_,i)=>
    '<button data-v="'+(i+1)+'"'+(S3.f[key]===i+1?' class="on"':'')+'>'+(i+1)+'</button>').join('');
}
function up3(){
  const free=S3.mode==='free';
  $('p3quiz').style.display=free?'none':'flex';
  $('p3free').style.display=free?'flex':'none';
  if(free){
    seg3('q3ln','ln');seg3('q3ld','ld');seg3('q3rn','rn');seg3('q3rd','rd');
    const c=cur3(),d=c.rn*c.rd-c.ln*c.ld;
    $('m3').innerHTML=(d===0
      ? '<span class="ok">水平に つり合った！</span> ほかにも つり合う 組み合わせが ないか さがそう。'
      : (d>0?'<b>右</b>が 下がった。':'<b>左</b>が 下がった。')+' 4つの 数を 変えて、つり合う ところを さがそう。')+
      ' なれたら <b>もんだい</b>に ちょうせん しよう。';
    $('b3').innerHTML=mode3()+'<button class="btn sub" id="b3reset">はじめに もどす</button>';
    $('b3reset').onclick=()=>{S3.f={ln:3,ld:4,rn:4,rd:3};up3();};
  }else{
    tbl3();
    const q=Q3[S3.qi];
    $('n3v').textContent=S3.rn;
    $('n3m').disabled=S3.rel||S3.rn<=1;
    $('n3p').disabled=S3.rel||S3.rn>=6;
    if(!S3.rel){
      $('m3').innerHTML='もんだい '+(S3.qi+1)+' / '+Q3.length+'　左に おもり <b>'+q.ln+'こ</b>を '+
        '<b>'+q.ld+'</b>の ところに つるした。右の <b>'+q.rd+'</b>の ところに '+
        '<b>何こ</b> つるすと つり合う？';
      $('b3').innerHTML=mode3()+'<button class="btn show" id="b3go">手を はなす</button>'+
        '<button class="btn sub" id="b3reset">記録を けす</button>';
      $('b3go').onclick=()=>{S3.rel=true;S3.mark=(S3.rn===q.ans)?'o':'x';
        if(S3.mark==='o')rec3();up3();};
      $('b3reset').onclick=()=>{REC3.length=0;tbl3();};
    }else if(S3.mark==='o'){
      $('m3').innerHTML='<span class="ok">つり合った！</span> 右の '+q.rd+'の ところに '+q.ans+'こ。'+
        '記録に 入れた よ。';
      $('b3').innerHTML=mode3()+(S3.qi<Q3.length-1
        ? '<button class="btn next" id="b3next">つぎの もんだい →</button>'
        : '<button class="btn next" id="b3to4">④で きまりを さがす →</button>')+
        '<button class="btn sub" id="b3again">もう一度</button>';
      const n=$('b3next');if(n)n.onclick=()=>{S3.qi++;S3.rn=1;S3.rel=false;S3.mark=null;up3();};
      const t=$('b3to4');if(t)t.onclick=()=>show(4);
      $('b3again').onclick=()=>{S3.rel=false;S3.mark=null;up3();};
    }else{
      const d=S3.rn*q.rd-q.ln*q.ld;
      $('m3').innerHTML=(d>0
        ? '<span class="ng">右が 下がったね。</span> 右が <b>重すぎる</b> みたい。'
        : '<span class="ng">左が 下がったね。</span> 右が <b>軽すぎる</b> みたい。')+
        ' おもりの 数を 変えて、もう一度。';
      $('b3').innerHTML=mode3()+'<button class="btn sub" id="b3again">もう一度</button>';
      $('b3again').onclick=()=>{S3.rel=false;S3.mark=null;up3();};
    }
  }
  dirty=true;
}
$('n3m').onclick=()=>{if(S3.rn>1){S3.rn--;up3();}};
$('n3p').onclick=()=>{if(S3.rn<6){S3.rn++;up3();}};
/* やり方の えらび は 下の ボタンの 列に 置く（右の パネルに 置くと
   その ぶん 記録の 表が つぶれて 数が 読めなく なる。2026-09-20） */
/* **「自由に 動かす」が 左**（2026-09-20 の 指摘＝「自由に 動かすで ためした あとに
   もんだいに ちょうせん させたい」）。はじめに ひらく ときも 自由から。**順を 入れかえないこと** */
function mode3(){
  return '<button class="btn ghost'+(S3.mode==='free'?' on':'')+'" data-m="free">自由に 動かす</button>'+
         '<button class="btn ghost'+(S3.mode==='quiz'?' on':'')+'" data-m="quiz">もんだい</button>'+
         '<span style="width:10px"></span>';
}
$('b3').addEventListener('click',e=>{
  const b=e.target.closest('[data-m]');if(!b)return;
  S3.mode=b.dataset.m;S3.rel=false;S3.mark=null;up3();
});
['q3ln','q3ld','q3rn','q3rd'].forEach(id=>{
  $(id).addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    S3.f[id.slice(2)]=Number(b.dataset.v);up3();
  });
});
function rec3(){
  const q=Q3[S3.qi];
  const r={ln:q.ln,ld:q.ld,rn:q.ans,rd:q.rd};
  if(REC3.some(x=>x.ln===r.ln&&x.ld===r.ld&&x.rn===r.rn&&x.rd===r.rd))return;
  REC3.push(r);
}
function step3(dt){
  const t=tilt3();
  if(Math.abs(S3.th-t)<0.0008){S3.th=t;return false;}
  S3.th+=(t-S3.th)*Math.min(1,dt*6);
  return true;
}

/* =========================================================
   ④ きまりを 見つける
   解説の かなめ＝「支点からの距離とおもりの重さとの関係を表などに整理する」
   「（力点にかかるおもりの重さ）×（支点から力点までの距離）」が 左右で 等しい。
   そして「算数科の反比例の学習と関連を図る」。
   【大事】いっぺんに 答えを 出さない。1つずつ 出す（S4.rev が 0〜4）。
   ③を やって いなくても 成り立つ ように、はじめから 4行 入れて おく
   （先生が ④だけ 出す ことが ある）。③で つり合った ものは 下に 足される。
   ========================================================= */
/* お手本の 4行。③を やって いなくても ④だけ 出せる ように、はじめから 入れて おく */
const BASE4=[{ln:2,ld:3,rn:3,rd:2},{ln:3,ld:4,rn:6,rd:2},{ln:4,ld:3,rn:2,rd:6},{ln:1,ld:6,rn:2,rd:3}];
/* もんだい 5問（固定。ランダムに しない）。h＝かくす ところ。
   おもりを かくす ものと きょりを かくす ものを まぜる＝
   「おもり×きょりが 左右で 同じ」と 分かれば どちらも 出せる */
/* お手本の 4行と 同じ 組み合わせを 出さない（表から 写せて しまう）。
   こたえは 4・2・6・4・5 と ばらけさせる */
const P4=[
  {ln:2,ld:6,rn:4,rd:3,h:'rn'},
  {ln:2,ld:5,rn:5,rd:2,h:'rd'},
  {ln:3,ld:2,rn:6,rd:1,h:'rn'},
  {ln:4,ld:3,rn:6,rd:2,h:'ln'},
  {ln:5,ld:2,rn:2,rd:5,h:'rd'},
];
const LB4={rn:['右の おもり','こ'],rd:['右の きょり','の ところ'],
           ln:['左の おもり','こ'],ld:['左の きょり','の ところ']};
const S4={qi:0,val:1,mark:null,hint:false,phase:'quiz',th:0};
const CX4=500,CY4=176,U4=46;
function q4(){return P4[Math.min(S4.qi,P4.length-1)];}
/* いま 画面に 出て いる 4つの 数＝かくした ところに 入れた 数を あてはめた もの */
function cur4(){
  const q=q4(),r={ln:q.ln,ld:q.ld,rn:q.rn,rd:q.rd};
  r[q.h]=S4.val;return r;
}
function ok4(){return S4.val===q4()[q4().h];}
function tilt4(){
  if(S4.mark!=='x')return 0;
  const c=cur4();
  return clamp((c.rn*c.rd-c.ln*c.ld)*0.020,-0.22,0.22);
}
function lever4(g,r,th){
  box(g,CX4-80,398,160,16,7,'#8c7a5c','#6b5c42',3);
  box(g,CX4-12,CY4,24,398-CY4,6,'#a99a7c','#8a7a5c',3);
  g.save();g.translate(CX4,CY4);g.rotate(th);
  box(g,-6.6*U4,-9,13.2*U4,18,6,'#d9b26a','#9c7838',3);
  for(let s=-1;s<=1;s+=2)for(let i=1;i<=6;i++){
    circ(g,s*i*U4,0,4.2,'#fffdf7','#9c7838',2);
    txt(g,String(i),s*i*U4,-19,13,'#8a7250');
  }
  g.restore();
  const L={x:CX4+Math.cos(th)*(-r.ld*U4),y:CY4+Math.sin(th)*(-r.ld*U4)},
        R={x:CX4+Math.cos(th)*( r.rd*U4),y:CY4+Math.sin(th)*( r.rd*U4)};
  weights3(g,L.x,L.y+9,r.ln,'#6f8aa6');
  weights3(g,R.x,R.y+9,r.rn,'#a6826f');
  markPoint(g,CX4,CY4,'fu',{ly:-34,r:13,ls:15});
}
/* ヒントは ことばで 説明しない＝式を 2つ ならべるだけ。
   分かって いる ほうの 式（金）と、□の ある ほうの 式（青）。
   あまりのあるわり算 と 同じ きまり。もんだいが かわっても 消さない */
function hint4(g,r,q){
  const P=(q.h==='rn'||q.h==='rd')?(r.ln*r.ld):(r.rn*r.rd);
  const known=(q.h==='rn'||q.h==='rd')
    ? {x:250,s:q.ln+' × '+q.ld+' ＝ '+P} : {x:750,s:q.rn+' × '+q.rd+' ＝ '+P};
  const ask=(q.h==='rn') ? {x:750,s:'？ × '+q.rd+' ＝ '+P}
          :(q.h==='rd') ? {x:750,s:q.rn+' × ？ ＝ '+P}
          :(q.h==='ln') ? {x:250,s:'？ × '+q.ld+' ＝ '+P}
                        : {x:250,s:q.ln+' × ？ ＝ '+P};
  tag(g,known.s,known.x,478,26,'#3a2c05','#f5d97a');
  tag(g,ask.s,ask.x,478,26,'#24557f','#e2ecf5');
}
/* 反比例（算数6年との 関連）。きょりが 2倍に なると おもりは 半分 */
const HIRE=[{d:2,n:6},{d:3,n:4},{d:4,n:3},{d:6,n:2}];
function hanpi4(g){
  txt(g,'おもり × きょり ＝ 12 に なる 組み合わせ',BW/2,54,21,'#6a5a3a');
  const x0=180,dx=214;
  HIRE.forEach((p,i)=>{
    const x=x0+i*dx;
    box(g,x-84,92,168,300,14,'#fffdf7','#e0d0a8',2);
    txt(g,'きょり',x,124,16,'#8a7250');
    txt(g,String(p.d),x,160,34,'#9c7838');
    txt(g,'おもり',x,206,16,'#8a7250');
    for(let k=0;k<p.n;k++)box(g,x-26,234+k*20,52,18,5,'#6f8aa6','#5a6570',2);
    txt(g,p.n+'こ',x,368,18,'#40525e');
  });
  arrow(g,x0+22,80,x0+2*dx-22,80,'#9c7838',4,11);
  tag(g,'きょり 2ばい',x0+dx,80,17,'#8a6a10');
  arrow(g,x0+22,424,x0+2*dx-22,424,'#2f6fa8',4,11);
  tag(g,'おもり 半分',x0+dx,424,17,C.fu);
  txt(g,'いっぽうが 2ばいに なると、もういっぽうは 半分。算数で ならった <反比例> と 同じ。',
      BW/2,494,18,'#6a5a3a');
}
function draw4(){
  const {g,w,h}=fit($('c4'));base(g,w,h);
  room(g);
  if(S4.phase==='hanpi'){hanpi4(g);g.restore();return;}
  const r=cur4(),q=q4();
  lever4(g,r,S4.th);
  tag(g,'おもり '+r.ln+'こ　きょり '+r.ld,250,432,17,'#40525e');
  tag(g,'おもり '+r.rn+'こ　きょり '+r.rd,750,432,17,'#6b4a3a');
  if(S4.mark==='o'||S4.phase==='rule'){
    const P=r.ln*r.ld;
    tag(g,r.ln+' × '+r.ld+' ＝ '+P,250,478,26,'#3a2c05','#f5d97a');
    tag(g,r.rn+' × '+r.rd+' ＝ '+P,750,478,26,'#3a2c05','#f5d97a');
    tag(g,'同じ！',500,478,20,'#3f7a33','#e6f0e0');
  }else if(S4.hint){
    hint4(g,r,q);
  }
  if(S4.phase==='rule'){
    box(g,90,16,820,72,14,'#fff8e6','#c9a227',3);
    txt(g,'（おもりの 重さ）×（支点からの きょり）が',BW/2,42,20,'#8a6a10');
    txt(g,'左と 右で 同じ とき、てこは つり合う',BW/2,70,22,'#3a2c05');
  }
  g.restore();
}
/* お手本 4行 ＋ いまの もんだい だけ。
   2026-09-20 の 指摘＝「問題を 解くたびに 表が せまく なる。挑戦した 問題は 残さなくても いい」。
   **といた もんだいを 表に ためないこと**（行が ふえると 字が 小さく なる） */
function rows4(){
  const rs=BASE4.map(r=>({...r,kind:'base'}));
  if(S4.phase==='quiz'){
    const q=q4(),r=cur4();
    rs.push({...r,kind:'now',h:q.h});
  }
  return rs;
}
function tbl4(){
  const el=$('t4'),rs=rows4();
  el.style.gridTemplateColumns='1fr 1fr 1fr 1fr';
  el.style.gridTemplateRows='auto repeat('+rs.length+',1fr)';
  let s='<div class="h" style="background:#e6edf3;color:#40525e">左<small>おもり</small></div>'+
        '<div class="h" style="background:#e6edf3;color:#40525e">左<small>きょり</small></div>'+
        '<div class="h" style="background:#f3e9e3;color:#6b4a3a">右<small>おもり</small></div>'+
        '<div class="h" style="background:#f3e9e3;color:#6b4a3a">右<small>きょり</small></div>';
  rs.forEach(r=>{
    ['ln','ld','rn','rd'].forEach(k=>{
      if(r.kind==='now'&&k===r.h){
        s+='<div class="c blank'+(S4.mark==='o'?' mark-o':S4.mark==='x'?' mark-x':'')+'">'+r[k]+'</div>';
      }else{
        s+='<div class="c'+(r.kind==='base'?'':' on')+'">'+r[k]+'</div>';
      }
    });
  });
  el.innerHTML=s;
  fitTbl(el,4,32);
}
function up4(){
  tbl4();
  const q=q4(),lb=LB4[q.h];
  const n4=$('n4');
  n4.style.display=(S4.phase==='quiz')?'flex':'none';
  $('n4lb').textContent=lb[0];$('n4u').textContent=lb[1];
  $('n4v').textContent=S4.val;
  $('n4m').disabled=(S4.mark==='o')||S4.val<=1;
  $('n4p').disabled=(S4.mark==='o')||S4.val>=6;
  $('t4ttl').textContent='つり合った ときの 表';
  const r=$('r4');
  if(S4.phase!=='quiz'){
    r.classList.remove('hide');
    r.innerHTML='（おもりの 重さ）×（支点からの きょり）が<br>左と 右で <b>同じ</b> とき、てこは つり合う';
  }else r.classList.add('hide');

  if(S4.phase==='hanpi'){
    $('m4').innerHTML='きょりが <b>2ばい</b>に なると、おもりは <b>半分</b>。算数で ならった <b>反比例</b>だね。';
    $('b4').innerHTML='<button class="btn sub" id="b4back">◀ もどる</button>';
    $('b4back').onclick=()=>{S4.phase='rule';up4();};
  }else if(S4.phase==='rule'){
    $('m4').innerHTML='これが <b>てこの きまり</b>。②で 分かった「力点を 遠く、作用点を 近く」も、この 式で せつめいできる。';
    $('b4').innerHTML='<button class="btn play" id="b4hp">きょりと おもりで 見る ▶</button>'+
      '<button class="btn sub" id="b4again">はじめから</button>';
    $('b4hp').onclick=()=>{S4.phase='hanpi';up4();};
    $('b4again').onclick=()=>reset4();
  }else if(S4.mark==='o'){

    const n=$('b4next');if(n)n.onclick=()=>{S4.qi++;S4.val=1;S4.mark=null;up4();};
    const u=$('b4rule');if(u)u.onclick=()=>{S4.phase='rule';S4.mark=null;up4();};
  }else{

      : 'もんだい '+(S4.qi+1)+' / '+P4.length+'　表の <b>金の わく</b>の ます に 入る 数は いくつ？ '+
        '上の お手本を 見て、<b>きまり</b>を さがそう。');
    $('b4').innerHTML='<button class="btn show" id="b4go">こたえ</button>'+

    $('b4hint').onclick=()=>{S4.hint=!S4.hint;up4();};
  }
  dirty=true;
}
function reset4(){

}

function step4(dt){
  const t=tilt4();
  if(Math.abs(S4.th-t)<0.0008){S4.th=t;return false;}
  S4.th+=(t-S4.th)*Math.min(1,dt*6);

}

/* =========================================================
   ⑤ 道具を 調べる
   解説の 内容の取扱い「(ｲ) については，ペンチ，釘抜き，空き缶つぶし，トング」。
   【出す 道具は この 4つだけ】岩石の 名前・発電の 道具と 同じ きまり。
   はさみ・せんぬき・ホチキスなどを 足さない。
   解説「『支点』『力点』『作用点』等の言葉を用いて説明したり，
   どのような便利さが得られるかについて話し合ったり」から、
   3つの 点を あてた あとに かならず <ならび> と <便利さ> を 出す。
   てこを 第1種・第2種・第3種 と 呼ぶ 分類は 使わない。
   【大事】クイズの あいだは 手を かかない。手が あると 力点が すぐ 分かって しまう。
   手は「使って みる」の ときと、3つ あてた あとだけ 出す。

function wood5(g,x,y,w,h){
  box(g,x,y,w,h,5,'#c99c62','#9a7440',3);
  g.save();g.globalAlpha=.25;g.strokeStyle='#8a6431';g.lineWidth=2;
  for(let i=1;i<4;i++){g.beginPath();g.moveTo(x+6,y+h*i/4);g.lineTo(x+w-6,y+h*i/4);g.stroke();}
  g.restore();
}
function metal5(g,pts,wd,col){
  g.save();g.strokeStyle=col||'#9aa7b2';g.lineWidth=wd;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);
  g.stroke();
  g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=wd*.3;
  g.beginPath();g.moveTo(pts[0].x,pts[0].y-wd*.25);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y-wd*.25);
  g.stroke();g.restore();
}

    tag(g,'支点→作用点',(P.fu.x+P.sa.x)/2,y,15,C.sa);
    arrow(g,P.fu.x,y2,P.ri.x,y2,'rgba(192,57,43,.55)',3,9);
    arrow(g,P.ri.x,y2,P.fu.x,y2,'rgba(192,57,43,.55)',3,9);
    tag(g,'支点→力点',(P.fu.x+P.ri.x)/2,y2,15,C.ri);
  }
  g.restore();
}
function tools5(){
  $('q5').innerHTML=TOOLS.map((t,i)=>
    '<button class="tool'+(i===S5.ti?' on':'')+(done5(t.k)?' done':'')+'" data-i="'+i+'">'+
    t.n+'<span class="st">'+(done5(t.k)?'○ できた':t.sub)+'</span></button>').join('');
}
function tbl5(){
  const el=$('t5');
  /* 1行ずつ。説明は メッセージに 出て いるので ここは 名前と しるしだけ
     （2行に すると 3つ ぶんが 入らず 字が 切れる） */
  el.innerHTML=Q5.map(k=>{
    const ok=S5.got[k]||S5.ph==='done';
    /* まだ こたえて いない 点に 文字を 出さない（答えが 分かって しまう） */
    if(!ok)return '<div class="c">'+NAME[k]+'　？</div>';
    return '<div class="c on" style="border-color:'+C[k]+';background:#fff;gap:.4em">'+
      '<b style="color:'+C[k]+'">'+NAME[k]+'</b><span style="color:#3f7a33">○ '+LET5(k)+'</span></div>';
  }).join('');
  fitTbl(el,0,24);
}
function up5(){
  const T=tool5();
  tools5();tbl5();
  const ord=$('s5ord'),ben=$('s5ben');
  /* こたえが 出たら 3つの 点の 表は 用ずみ。ならびと 便利さに 場所を まわす
     （せまい 画面では 3つ ぜんぶは 入らない） */
  $('p5tbl').style.display=(S5.ph==='see')?'flex':'none';
  const g5=$('g5');
  if(S5.ph==='quiz'){
    const k=Q5[S5.qi];
    g5.style.display='flex';
    g5.classList.toggle('need',!S5.bad);
    $('g5l').innerHTML='<b style="color:'+C[k]+';font-size:1.18em">'+NAME[k]+'</b>は どれ？'+
      '<span style="font-size:.78em;color:#8a7c63">　あ・い・う から えらぶ</span>';
    [...$('o5').children].forEach((b,i)=>{
      const kk=T.ord[i];
      b.textContent=LET[i];
      b.disabled=!!S5.got[kk];
      b.className='opt'+(S5.got[kk]?' right':'')+(S5.bad===kk?' wrong':'');
    });
  }else{g5.style.display='none';g5.classList.remove('need');}
  if(S5.ph==='done'){
    ord.classList.remove('hide');ben.classList.remove('hide');
    ord.innerHTML='<div class="t">3つの 点の ならび</div><div class="order">'+
      T.ord.map(k=>'<span class="o-'+k+'">'+NAME[k]+'</span>').join('<i>―</i>')+
      '</div><div style="text-align:center;margin-top:3px;font-size:.92em">'+
      '<b class="'+T.mid+'">'+NAME[T.mid]+'</b>が まん中に ある なかま</div>';
    ben.innerHTML='<div class="t">どんな 便利さ？</div>'+T.ben;
  }else{
    ord.classList.add('hide');ben.classList.add('hide');
  }
  if(S5.ph==='see'){
    $('m5').innerHTML=T.use+' まず <b>使って みる</b>と、どこが 動いて どこが 動かないか 分かる よ。';
    $('b5').innerHTML='<button class="btn play" id="b5go">使って みる ▶</button>'+
      (S5.seen[T.k]?'<button class="btn next" id="b5q">3つの 点を 答える →</button>':'');
    $('b5go').onclick=()=>{S5.playing=true;up5();};
    const q=$('b5q');if(q)q.onclick=()=>{S5.ph='quiz';S5.qi=0;S5.got={};S5.bad=null;S5.a=0;up5();};
  }else if(S5.ph==='quiz'){
    const k=Q5[S5.qi];
    $('m5').innerHTML=S5.bad
      ? '<span class="ng">「'+LET5(S5.bad)+'」は ちがう よ。</span> <b>'+NAME[k]+'</b>は 「'+MEAN[k]+'」。'
      : '<b style="color:'+C[k]+'">'+NAME[k]+'</b>は 「'+MEAN[k]+'」。'+
        '<b>あ・い・う</b>の どれかな？';
    $('b5').innerHTML='<button class="btn sub" id="b5back">◀ 使って みるに もどる</button>';
    $('b5back').onclick=()=>{S5.ph='see';S5.bad=null;up5();};
  }else{
    $('m5').innerHTML='<span class="ok">3つとも 答えられた！</span> '+T.n+'は '+
      '<b>'+NAME[T.mid]+'</b>が まん中に ある なかま。';
    $('b5').innerHTML='<button class="btn next" id="b5next">つぎの 道具 →</button>'+
      '<button class="btn sub" id="b5again">もう一度 答える</button>';
    $('b5next').onclick=()=>{S5.ti=(S5.ti+1)%TOOLS.length;S5.ph='see';S5.a=0;S5.got={};S5.qi=0;S5.bad=null;up5();};
    $('b5again').onclick=()=>{S5.ph='quiz';S5.qi=0;S5.got={};S5.bad=null;up5();};
  }
  dirty=true;
}
$('q5').addEventListener('click',e=>{
  const b=e.target.closest('.tool');if(!b)return;
  S5.ti=Number(b.dataset.i);S5.ph='see';S5.a=0;S5.got={};S5.qi=0;S5.bad=null;up5();
});
$('o5').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b||b.disabled||S5.ph!=='quiz')return;
  ans5(tool5().ord[Number(b.dataset.v)]);
});
$('c5').addEventListener('click',e=>{
  if(S5.ph!=='quiz')return;
  const P=tool5().pts(S5.a),p=toBase($('c5'),e);
  let hit=null,best=54;
  Q5.forEach(k=>{
    const d=Math.hypot(P[k].x-p.x,P[k].y-p.y);
    if(d<best){best=d;hit=k;}
  });
  if(hit)ans5(hit);
});
function ans5(hit){
  const k=Q5[S5.qi];
  if(hit===k){
    S5.got[k]=true;S5.bad=null;S5.qi++;
    if(S5.qi>=Q5.length){
      S5.ph='done';S5.doneAll=S5.doneAll||{};S5.doneAll[tool5().k]=true;
    }
  }else{S5.bad=hit;setTimeout(()=>{S5.bad=null;up5();},2200);}
  up5();
}
function step5(dt){
  S5.t+=dt;
  if(S5.playing){
    S5.a+=dt*0.55;
    if(S5.a>=1){S5.a=1;S5.playing=false;S5.seen[tool5().k]=true;up5();}
    return true;
  }
  return false;
}

/* ========================= 入れかえと 時計 ========================= */
function show(n){
  step=n;
  [...document.querySelectorAll('.stage')].forEach((el,i)=>{
    const on=(i===n-1);
    el.classList.toggle('on',on);
    el.style.display=on?'flex':'none';
  });
  [...document.querySelectorAll('.tab')].forEach(b=>b.classList.toggle('on',Number(b.dataset.s)===n));
  /* 出て きた ステップの 表を はかり直す。
     かくれて いる あいだは 高さが 0 なので `fitTbl()` が はかれない */
  if(n===1)up1();else if(n===2)up2();else if(n===3)up3();else if(n===4)up4();else up5();
  dirty=true;
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;show(Number(b.dataset.s));
});
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  let anim=false;
  try{
    if(step===1)anim=step1(dt);
    if(step===3)anim=step3(dt);
    if(step===4)anim=step4(dt);
    if(step===5)anim=step5(dt);
  }catch(err){console.error(err);}
  if(dirty||anim){
    dirty=false;
    try{
      if(step===1)draw1();
      if(step===2)draw2();
      if(step===3)draw3();
      if(step===4)draw4();
      if(step===5)draw5();
    }catch(err){console.error(err);}
  }
  requestAnimationFrame(frame);
}
let rzT=null;
addEventListener('resize',()=>{
  dirty=true;
  clearTimeout(rzT);
  rzT=setTimeout(()=>{up1();up2();up3();up4();up5();},140);
});
addEventListener('orientationchange',()=>{setTimeout(()=>{dirty=true;},250);});

up1();up2();up3();up4();up5();
show(1);
requestAnimationFrame(frame);
</script>
</body>
</html>
