:root{
  --ink:#2b2118;--paper:#fdf6e3;--card:#fffdf7;--line:#e7d9b8;
  --gold:#c9a227;--gold-d:#a5811a;--ok:#5a8a4c;--ok-d:#446838;
  --blue:#2f6fa8;--blue-d:#224f7a;--sub:#a99a7c;--sub-d:#85795f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:'KleeTD',"UD Digi Kyokasho NP-R","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;font-weight:600;color:inherit;cursor:pointer;touch-action:manipulation}
ruby rt{font-size:.5em;letter-spacing:0}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px;gap:6px}
header{display:flex;align-items:center;gap:10px;flex:none}
h1{margin:0;font-size:24px;white-space:nowrap;line-height:1.1}

.bar{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:flex-end}
.bar .cap{font-size:14px;color:#7a6a52;white-space:nowrap}
.seg{display:flex;border:2px solid #cdbd9c;border-radius:12px;overflow:hidden;background:#efe9dc;min-width:0}
.sg{border:0;border-left:1px solid rgba(0,0,0,.1);background:transparent;padding:0 12px;min-height:40px;font-size:16px;color:#a0937a;white-space:nowrap;position:relative}
.sg:first-child{border-left:0}
.sg.in{color:#3d3122}
.sg.on{box-shadow:inset 0 -4px 0 var(--gold)}
.sg.on::after{content:'';position:absolute;inset:0;border:2px solid var(--gold);border-radius:inherit;pointer-events:none}

#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.pane{flex:1;min-height:0;display:none;gap:10px}
#v1{display:flex}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px}

/* にがお絵 */
.face{display:block;width:100%;height:100%}
.pic{border-radius:14px;overflow:hidden;position:relative}
.nm{line-height:1.15;text-align:center;white-space:nowrap}
.nm rt{font-size:.52em}

/* ボタン */

function shade(c,k){ // c を こく(k<0)・うすく(k>0)
  const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(k<0?v*(1+k):v+(255-v)*k);
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

    [[36,84],[40,87.5],[45,89.6],[55,89.6],[60,87.5],[64,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.7" fill="#3f8f6c"/>`).join('')+`<path d="M50,90 a3,3 0 1 1 -0.1,0 q2,4 -2,6" fill="#2f7a5a"/>`;

  return `<path d="${SH}" fill="${col}"/>`;
}
function hairFront(p,o){
  const {sk,hc,rx,ry,cx,cy,top}=o;
  // かみの ぼうし（生えぎわ つき）
  const cap=(c,h=9,sideY=cy-1,part=0)=>`<path d="M${cx-rx-0.8},${sideY} C${cx-rx-1.5},${top-7} ${cx+rx+1.5},${top-7} ${cx+rx+0.8},${sideY} C${cx+rx-2},${top+h+2} ${cx+part+6},${top+h-2} ${cx+part},${top+h-1} C${cx+part-6},${top+h} ${cx-rx+2},${top+h+2} ${cx-rx-0.8},${sideY}Z" fill="${c}"/>`;
  if(p.hat==='kanmuri'){
    let s=cap(hc,9,cy-2);
    s+=`<path d="M${cx-12.5},${top+5} L${cx-11.5},${top-7} Q${cx},${top-11} ${cx+11.5},${top-7} L${cx+12.5},${top+5} Q${cx},${top+2} ${cx-12.5},${top+5}Z" fill="#15130f"/>`;
    s+=`<rect x="${cx-5.5}" y="${top-17}" width="11" height="12" rx="4.5" fill="#15130f"/>`;
    s+=`<path d="M${cx-12},${top+2} Q${cx},${top-1} ${cx+12},${top+2}" stroke="#3a3530" stroke-width=".9" fill="none"/>`;
    if(p.tall) s+=`<path d="M${cx+1},${top-15} C${cx+3},${top-24} ${cx+5},${top-30} ${cx+8},${top-34} L${cx+11},${top-33} C${cx+8},${top-28} ${cx+6},${top-22} ${cx+5},${top-14}Z" fill="#15130f"/>`;
    return s;
  }
  if(p.hat==='eboshi'){
    let s=cap(hc,9,cy-2);
    s+=`<path d="M${cx-rx+1},${top+7} C${cx-rx},${top-6} ${cx-9},${top-23} ${cx+1},${top-25} C${cx+11},${top-25} ${cx+rx},${top-9} ${cx+rx-1},${top+7} Q${cx},${top+3} ${cx-rx+1},${top+7}Z" fill="#15130f"/>`;
    s+=`<path d="M${cx-4},${top-18} Q${cx+5},${top-12} ${cx+9},${top+2}" stroke="#3d3833" stroke-width="1" fill="none"/>`;
    return s;
  }
  if(p.hat==='navy'){
    let s=cap(hc,11,cy-3);
    s+=`<path d="M${cx-rx-3},${top+7} C${cx-rx-5},${top-8} ${cx+rx+5},${top-8} ${cx+rx+3},${top+7}Z" fill="#1a2238"/>`;
    s+=`<rect x="${cx-rx-2}" y="${top+3}" width="${2*rx+4}" height="4" fill="#0e1322"/><path d="M${cx-rx+1},${top+7} Q${cx},${top+13} ${cx+rx-1},${top+7}Z" fill="#0b0b0b"/>`;
    s+=`<circle cx="${cx}" cy="${top-1}" r="3" fill="#e0b84a"/>`;
    return s;
  }
  switch(p.hair){
  case 'bozu': return `<path d="M${cx-rx+1},${cy-4} C${cx-rx},${top-2} ${cx+rx},${top-2} ${cx+rx-1},${cy-4} C${cx+rx-5},${top+6} ${cx-rx+5},${top+6} ${cx-rx+1},${cy-4}Z" fill="#6a5a50" opacity=".1"/>`;
  case 'mage': {
    let s=cap(hc,11,cy-1);
    s+=`<ellipse cx="${cx}" cy="${top+4}" rx="${rx*.66}" ry="8.5" fill="${shade(sk,-.06)}"/>`;
    s+=`<path d="M${cx-2.6},${top+1} L${cx+2.6},${top+1} L${cx+2.2},${top-8} Q${cx},${top-10} ${cx-2.2},${top-8}Z" fill="${hc}"/>`;
    return s;
  }
  case 'short': return cap(hc,9,cy-2,-5)+`<path d="M${cx-rx+0.5},${cy-3} l0,5 M${cx+rx-0.5},${cy-3} l0,5" stroke="${hc}" stroke-width="2.4"/>`;
  case 'wavy': return cap(hc,10,cy-2,-4)+`<path d="M${cx-12},${top+3} q4,-4 8,0 q4,-4 8,0 q4,-4 8,0" stroke="${shade(hc,.25)}" stroke-width="1" fill="none"/>`;
  case 'tonsure': return cap(hc,12,cy+2)+`<ellipse cx="${cx}" cy="${top+6}" rx="${rx-1.5}" ry="11" fill="${sk}"/>`;
  case 'side': return `<ellipse cx="${cx-rx+1}" cy="${cy-7}" rx="5.5" ry="9" fill="${hc}"/><ellipse cx="${cx+rx-1}" cy="${cy-7}" rx="5.5" ry="9" fill="${hc}"/>`+cap(hc,6,cy-10,6);
  case 'long': return cap(hc,8,cy+3,0)+`<path d="M${cx-rx-1},${cy} L${cx-rx-2},${cy+18} L${cx-rx+3},${cy+16}Z M${cx+rx+1},${cy} L${cx+rx+2},${cy+18} L${cx+rx-3},${cy+16}Z" fill="${hc}"/>`;
  case 'himiko': return cap(hc,8,cy+2,0)+`<ellipse cx="${cx}" cy="${top-5}" rx="9" ry="6.5" fill="${hc}"/><rect x="${cx-9.5}" y="${top-4}" width="19" height="2.6" rx="1.2" fill="#d4a52a"/><circle cx="${cx-rx-1}" cy="${cy+4}" r="2" fill="#b8323a"/><circle cx="${cx+rx+1}" cy="${cy+4}" r="2" fill="#b8323a"/>`;
  }
  return '';
}
function acc(p){
  switch(p.acc){
  case 'shaku': return `<rect x="46.5" y="84" width="7" height="22" rx="2.5" fill="#dcbc7e" stroke="#a8864a" stroke-width=".8"/>`;
  case 'scroll': return `<rect x="36" y="88" width="28" height="9" rx="2" fill="#f4ecd4" stroke="#b39a66" stroke-width=".8"/><rect x="34" y="87" width="3" height="11" rx="1.2" fill="#8a5a2a"/><rect x="63" y="87" width="3" height="11" rx="1.2" fill="#8a5a2a"/>`;
  case 'ogi': return `<path d="M62,104 L58,84 A18,18 0 0 1 80,88 Z" fill="#f4dca0" stroke="#b8323a" stroke-width="1"/>`;
  case 'book': return `<rect x="58" y="86" width="20" height="16" rx="1.5" fill="#f1e6c8" stroke="#8a6a3a" stroke-width="1"/><path d="M62,91 h12 M62,95 h12" stroke="#a88a5a" stroke-width=".8"/>`;
  case 'brush': return `<path d="M62,104 L74,82" stroke="#8a5a2a" stroke-width="2.6" stroke-linecap="round"/><path d="M74,82 l2.5,-5 l1,1 z" fill="#1d1a18" stroke="#1d1a18" stroke-width="2"/>`;
  case 'cross': return `<path d="M50,86 v12 M45.5,90 h9" stroke="#d6ad3a" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  return '';
}

/* ---------- 状態 ---------- */
const S={g:6,q:[null,null],tlPile:{}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* 「カードを 完成させる」は「えらんだ 時代まで」の 人から 出す。
   時代を 1つに しぼると「いつごろ？」の 答えが みな 同じに なって 問題に ならない。
   授業は 古い 順に 進むので、室町を やって いる ころには それより 前は 習って いる */
const GMAX=[2,3,4,5,6,7,9]; // まとまりごとの 年表の さいごの 帯
const upTo=()=>P.filter(x=>x.g<=S.g);
const maxBand=()=>GMAX[S.g];
const pool=()=>upTo();
const nameHTML=x=>x.y?`<ruby>${x.n}<rt>${x.y}</rt></ruby>`:`<ruby>${x.n}<rt>&nbsp;</rt></ruby>`;
const eraText=x=>x.b.length>1?`${bandName(x.b[0])}時代〜${bandName(x.b[1])}時代`:`${bandName(x.b[0])}時代`;

/* ---------- 時代の ボタン ---------- */
const SEG=['奈良','平安','鎌倉','室町','安土桃山','江戸','明治']; // 帯に 出す みじかい 名前（まとまりの さいごの 時代）
function buildRange(){
  const r=$('range');
  r.innerHTML=SEG.map((n,i)=>`<button class="sg" data-v="${i}">${n}</button>`).join('');
  r.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
    S.g=+b.dataset.v; S.q=[null,null];
    paintRange(); buildTL(); render();
    setMsg(S.g===SEG.length-1?`<span class="bl">全部の 時代の ${upTo().length}人が 出るよ</span>`:`<span class="bl">弥生時代から ${SEG[S.g]}時代までの ${upTo().length}人が 出るよ</span>`);
  });
  paintRange();
}
// 選んだ 時代までを 年表と 同じ 色で ぬる
function paintRange(){
  $('range').querySelectorAll('.sg').forEach(b=>{
    const v=+b.dataset.v, inn=v<=S.g;
    b.classList.toggle('in',inn); b.classList.toggle('on',v===S.g);
    b.style.background=inn?GROUPS[v].c:'';
    b.textContent=v===S.g&&v<SEG.length-1?SEG[v]+'まで':SEG[v];
  });
}

/* ---------- 問題の じゅんばん ----------
  まとまりの 人を まぜて 1人ずつ。はじめに まちがえた 人は 3問 あとに もう一度 */
function newQ(mode){
  let st=S.q[mode];
  if(!st) st=S.q[mode]={deck:shuffle(pool(mode).map(x=>x.id)),cur:-1,miss:false,done:false,round:false};
  if(!st.deck.length){ st.deck=shuffle(pool(mode).map(x=>x.id)); st.round=true; }
  st.cur=st.deck.shift(); st.miss=false; st.done=false; st.ng=[];
  return st;
}
function finishQ(mode){
  const st=S.q[mode]; st.done=true;
  if(st.miss) st.deck.splice(Math.min(3,st.deck.length),0,st.cur);
  $('next').disabled=false;
}
const rangeName=()=>S.g===SEG.length-1?'全部':`弥生〜${SEG[S.g]}`;
function leftText(mode){ const st=S.q[mode]; return st?`${rangeName()}　のこり ${st.deck.length+(st.done?0:1)}人`:''; }

// まちがいの せんたくし：同じ まとまり → となりの まとまり → ほか の 順に とる
function distract(id,k){
  const me=P[id], out=[], L=pool();
  const same=shuffle(L.filter(x=>x.g===me.g&&x.id!==id));
  const near=shuffle(L.filter(x=>Math.abs(x.g-me.g)===1));
  const rest=shuffle(L.filter(x=>Math.abs(x.g-me.g)>1));
  for(const x of same){ if(out.length>=2) break; out.push(x); }
  for(const x of near.concat(rest)){ if(out.length>=k) break; out.push(x); }
  for(const x of same){ if(out.length>=k) break; if(!out.includes(x)) out.push(x); }
  return out.slice(0,k);
}

/* ---------- カードを 完成させる ----------
  1人ずつ。1 いつごろ？（年表）→ 2 何を した？（4択）→ カードが 完成して くわしい 説明が 出る。
  まちがえても 先に 進まない。1つでも まちがえた 人は 3人 あとに もう一度 */
function card(fresh){
  let st=S.q[1];
  if(fresh||!st||st.done){
    st=newQ(1); st.step=1; st.ng2=[];
    st.opts=shuffle([P[st.cur]].concat(distract(st.cur,3))).map(y=>y.id);
  }
  drawCard();
}
function drawCard(){
  const st=S.q[1], x=P[st.cur], bg=shade(GROUPS[x.g].c,.45);
  const row=(n,k,v,done)=>`<div class="srow${st.step===n?' now':''}${done?' fin':''}"><span class="k"><b>${n}</b>${k}</span><span class="v${done?'':' blank'}">${done?v:'？？？'}</span></div>`;
  $('cc').style.background=GROUPS[x.g].c;
  $('cc').innerHTML=`<span class="pic" style="background:${bg}">${portrait(x.p,bg)}</span><div class="who"><span class="nm">${nameHTML(x)}</span>`+
    row(1,'いつごろ？',eraText(x),st.step>1)+row(2,'何を した？',rb(x.does),st.step>2)+`</div>`;
  $('v1').dataset.step=st.step;
  if(st.step===1){
    $('tl').querySelectorAll('.band').forEach(b=>{b.classList.remove('ng','ok');b.disabled=false});
    reNg(st,'#tl .band','b'); drawPiles();
    roundMsg(st);
    if(!$('msg').innerHTML) setMsg('この 人は いつごろの 人？ 下の 年表から 選ぼう');
  }
  if(st.step===2){
    $('c2').innerHTML=st.opts.map(i=>`<button class="opt" data-id="${i}">${rb(P[i].does)}</button>`).join('');
    $('c2').querySelectorAll('.opt').forEach(b=>b.onclick=()=>ansD(+b.dataset.id,b));
    document.querySelectorAll('#c2 .opt').forEach(b=>{ if(st.ng2.includes(+b.dataset.id)){b.classList.add('ng');b.disabled=true} });
  }
  if(st.step===3){
    $('eMemo').innerHTML=x.memo.map(m=>`<li>${rb(m)}</li>`).join('')+`<li class="yr">${x.yr}</li>`;
    requestAnimationFrame(fitMemo);
  }
  $('next').disabled=st.step<3; $('left').textContent=leftText(1);
}
// 「もっと くわしく」は 人に よって 長さが ちがう。わくに 入る いちばん 大きな 字に する
function fitMemo(){
  const box=$('ansE'), ul=$('eMemo'); if(!box.offsetParent) return;
  let f=Math.min(28,Math.max(15,Math.round(Math.min(innerWidth,innerHeight)*0.034)));
  ul.style.fontSize=f+'px';
  while(f>12&&box.scrollHeight>box.clientHeight+1){ f--; ul.style.fontSize=f+'px'; }
}
// 2 何を した？
function ansD(id,b){
  const st=S.q[1]; if(st.step!==2) return;
  const x=P[st.cur];
  if(id===x.id){
    b.classList.add('ok'); $('c2').querySelectorAll('.opt').forEach(o=>o.disabled=true);
    st.step=3; finishQ(1); drawCard();
    setMsg(`<span class="good">${st.miss?'よくできました！':'すごい！'}</span>　下の 説明も 読んで みよう`);
  }else{
    st.miss=true; b.classList.add('ng'); b.disabled=true; st.ng2.push(id);
    setMsg(`もう一回！　それは ${nameHTML(P[id])}が した ことだよ`);
  }
}

/* ---------- ④ いつごろ？ ---------- */
function buildTL(){
  const n=maxBand()+1;
  const tl=$('tl');
  // たて長で 6つ以上なら 2だん
  const two=matchMedia('(orientation:portrait)').matches&&n>5;
  tl.style.gridTemplateColumns=`repeat(${two?Math.ceil(n/2):n},1fr)`;
  tl.style.gridTemplateRows=two?'1fr 1fr':'1fr';
  tl.innerHTML=BANDS.slice(0,n).map((b,i)=>`<button class="band" data-b="${i}" style="background:${b.c}"><span class="bn">${rb(b.n)}</span><span class="pile" id="pile${i}"></span></button>`).join('');
  $('tl').querySelectorAll('.band').forEach(b=>b.onclick=()=>ans3(+b.dataset.b,b));
  drawPiles();
}
function drawPiles(){
  for(let i=0;i<=maxBand();i++){
    // いま 聞いて いる 人は、1 に 答える まで 年表から かくす（2回目・もう一度 出た ときに 答えが 見えて しまう）
    const st=S.q[1], hide=st&&st.step===1?st.cur:-1;
    const ids=(S.tlPile[i]||[]).filter(id=>id!==hide), el=$('pile'+i);
    el.innerHTML=ids.map(id=>`<span class="mini">${P[id].n}</span>`).join('');
  }
  fitPiles();
}
// 年表に ならべた 名前の 字の 大きさ＝いちばん 長い 名前が はばに 入り、いちばん 多い 帯が たかさに 入る 大きさ
function fitPiles(){
  const el=$('pile0'); if(!el) return;
  const W=el.clientWidth-6, H=el.clientHeight-8;
  let fw=18, fh=18;
  for(let i=0;i<=maxBand();i++){
    const ids=S.tlPile[i]||[]; if(!ids.length) continue;
    const len=Math.max(...ids.map(id=>P[id].n.length));
    fw=Math.min(fw,W/len);
    fh=Math.min(fh,(H/ids.length-4)/1.25);
  }
  $('tl').style.setProperty('--mf',Math.max(9,Math.floor(Math.min(fw,fh)))+'px');
}
// 1 いつごろ？
function ans3(bi,btn){
  const st=S.q[1]; if(!st||st.step!==1) return;
  const x=P[st.cur];
  if(x.b.includes(bi)){
    btn.classList.add('ok'); $('tl').querySelectorAll('.band').forEach(o=>o.disabled=true);
    (S.tlPile[bi]=S.tlPile[bi]||[]); if(!S.tlPile[bi].includes(x.id)) S.tlPile[bi].push(x.id);
    st.step=1.5; drawPiles();
    const both=x.b.length>1?`${bandName(x.b[0])}時代から ${bandName(x.b[1])}時代に かけての 人。`:`${bandName(bi)}時代の 人。`;
    setMsg(`<span class="good">${st.miss?'よくできました！':'すごい！'}</span>　${both}つぎは 何を した 人？`);
    const id=st.cur;
    setTimeout(()=>{ if(S.q[1]===st&&st.cur===id&&st.step===1.5){ st.step=2; drawCard(); } },900); // 年表に 名前が のるのを 見せてから
  }else{
    st.miss=true; btn.classList.add('ng'); btn.disabled=true; st.ng.push(bi);
    setMsg(`もう一回！　もっと <b class="bl">${bi<x.b[0]?'新しい':'古い'}</b> 時代だよ`);
  }
}
$('tlClear').onclick=()=>{S.tlPile={};drawPiles()};

/* ---------- 共通 ---------- */
function roundMsg(st){ setMsg(st.round?'<span class="bl">ひとまわり おわり！ また まぜたよ</span>':''); st.round=false; }
function reNg(st,sel,key='id'){ document.querySelectorAll(sel).forEach(b=>{ if(st.ng.includes(+b.dataset[key])){b.classList.add('ng');b.disabled=true} }); }
function setMsg(h){ $('msg').innerHTML=h; }
$('next').onclick=()=>{ if($('next').disabled) return; card(true); };
function render(){
  card(false); requestAnimationFrame(fitPiles);
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{buildTL();drawCard();fitMemo()},120)});

buildRange(); buildTL(); render();
</script>
</body>
