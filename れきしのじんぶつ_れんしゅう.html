  --gold:#c9a227;--gold-d:#a5811a;--ok:#5a8a4c;--ok-d:#446838;
  --blue:#2f6fa8;--blue-d:#224f7a;--sub:#a99a7c;--sub-d:#85795f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:'KleeTD',"UD Digi Kyokasho NP-R","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;font-weight:600;color:inherit;cursor:pointer;touch-action:manipulation}
ruby rt{font-size:.5em;letter-spacing:0}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px;gap:6px}
header{display:flex;align-items:center;gap:10px;flex:none}
h1{margin:0;font-size:24px;white-space:nowrap;line-height:1.1}
.tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{flex:1;min-width:0;border:2px solid #d8c9a8;background:#efe6d2;border-radius:12px;padding:6px 4px;font-size:17px;line-height:1.15;
  color:#6b5a40;white-space:nowrap;overflow:hidden}
.tab .no{font-size:12px;display:block;opacity:.8}
.tab.on{color:#fff;border-color:#5a4a33;background:#6b5a40;box-shadow:0 3px 0 #3f3322}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;flex:none}
.chip{border:2px solid rgba(0,0,0,.12);border-radius:10px;padding:3px 9px;font-size:16px;line-height:1.1;min-height:38px;color:#3d3122}
.chip.on{border-color:var(--gold);border-width:3px;padding:2px 8px;box-shadow:0 2px 0 var(--gold-d)}
.chip.on::before{content:'✓ ';color:var(--gold-d)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.pane{flex:1;min-height:0;display:none;gap:10px}
body.t0 #v0,body.t1 #v1,body.t2 #v2,body.t3 #v3{display:flex}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px}

/* にがお絵 */
.face{display:block;width:100%;height:100%}
.pic{border-radius:14px;overflow:hidden;position:relative}
.nm{line-height:1.15;text-align:center;white-space:nowrap}
.nm rt{font-size:.52em}

/* ① 人物を 見る */
#v0{flex-direction:row}
#grid{flex:1.35 1 0;min-width:0;min-height:0;padding:8px;display:grid;gap:6px;align-content:center;justify-content:center}
.tile{border:2px solid rgba(0,0,0,.08);border-radius:12px;padding:3px 3px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;min-height:0;box-shadow:0 2px 0 rgba(0,0,0,.08);position:relative}
.tile .pic{width:100%;flex:1 1 0;min-height:0;border-radius:9px}
.tile .nm{font-size:var(--tf,14px);overflow:hidden;max-width:100%}
.tile.on{border-color:var(--gold);border-width:3px;padding:2px 2px 1px;box-shadow:0 2px 0 var(--gold-d)}
.dots{position:absolute;top:3px;right:4px;display:flex;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.18)}
.dots i.y{background:var(--gold);border-color:var(--gold-d)}
#detail{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px 12px}
#dTop{display:flex;gap:12px;align-items:center;flex:none}
#dPic{flex:none;width:clamp(100px,21vmin,210px);aspect-ratio:1/1}
#dName{font-size:clamp(24px,4.2vmin,40px);text-align:left;white-space:normal}
#dEra{display:inline-block;margin-top:4px;border-radius:8px;padding:2px 10px;font-size:clamp(15px,2.2vmin,20px)}
#dDoes{font-size:clamp(18px,2.9vmin,27px);line-height:1.6;flex:none;word-break:keep-all;overflow-wrap:anywhere}
#dMemo{margin:0;padding:0;list-style:none;font-size:clamp(15px,2.3vmin,21px);line-height:1.55;flex:1 1 auto;min-height:0;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
#dMemo li{padding-left:1.1em;text-indent:-1.1em}
#dMemo li::before{content:'・';color:var(--gold-d)}
#dMemo .yr{color:#7a6a52}
#dNav{display:flex;gap:8px;flex:none}
#dNote{font-size:12px;color:#8a7a60;text-align:right;flex:none}

/* ボタン */
.btn{border:0;border-radius:14px;color:#fff;font-size:clamp(18px,2.5vmin,23px);padding:8px 14px;min-height:50px}
.btn:active{transform:translateY(2px)}
.btn.play{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.next{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.sub{background:var(--sub);box-shadow:0 4px 0 var(--sub-d);min-height:40px;padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.4;box-shadow:none}
#dNav .btn{flex:1}

/* もんだい 共通 */
#qfoot{flex:none;display:none;align-items:center;gap:10px}
body.t1 #qfoot,body.t2 #qfoot,body.t3 #qfoot{display:flex}
#msg{flex:1;min-width:0;min-height:2.9em;font-size:clamp(16px,2.4vmin,22px);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;display:block}
#msg .good{color:var(--gold-d);font-size:1.15em}
#msg .bl{color:var(--blue)}
#left{font-size:14px;color:#7a6a52;white-space:nowrap}
#next{flex:none;width:clamp(180px,26vw,280px)}

/* ② だれ？ */
#v1{flex-direction:column}
#q1{flex:none;padding:10px 16px;font-size:clamp(20px,3.6vmin,34px);line-height:1.55;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
#q1 .lab{display:block;font-size:.55em;color:#7a6a52}
#c1{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.popt{border:2px solid var(--line);border-radius:16px;background:#fff;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;min-width:0;box-shadow:0 3px 0 #d9ccae}
.popt .pic{flex:1 1 0;min-height:0;width:100%;border-radius:12px}
.popt .pic svg{width:100%;height:100%}
.popt .nm{font-size:clamp(17px,2.8vmin,26px)}
.popt:active{transform:translateY(2px);box-shadow:none}
.popt.ng,.opt.ng{background:#eef1f5;color:#8b95a3;border-color:#c5cfdb;box-shadow:none;border-style:dashed}
.popt.ng .pic{opacity:.35}
.popt.ok,.opt.ok{background:#fbefc6;border-color:var(--gold);border-width:3px;box-shadow:0 3px 0 var(--gold-d)}
.popt:disabled,.opt:disabled{cursor:default}

/* ③ 何を した？ */
#v2{flex-direction:row}
#p2{flex:0 0 clamp(200px,30vw,340px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
#p2 .pic{width:100%;max-width:300px;aspect-ratio:1/1;max-height:calc(100% - 4.5em)}
#p2 .pic svg{width:100%;height:100%}
#p2 .nm{font-size:clamp(26px,4.6vmin,44px)}
#p2 .lab{font-size:clamp(14px,2vmin,18px);color:#7a6a52}
#p2 .who{display:flex;flex-direction:column;align-items:center}
#c2{flex:1;min-width:0;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;background:#fff;font-size:clamp(18px,3.1vmin,30px);line-height:1.45;padding:4px 14px;box-shadow:0 3px 0 #d9ccae;text-align:left;
  word-break:keep-all;overflow-wrap:anywhere;min-height:0}
.opt:active{transform:translateY(2px);box-shadow:none}

/* ④ いつごろ？ */
#v3{flex-direction:column}
#p3{flex:none;display:flex;align-items:center;gap:12px;padding:6px 12px}
#p3 .pic{flex:none;width:clamp(70px,12vmin,120px);aspect-ratio:1/1}
#p3 .pic svg{width:100%;height:100%}
#p3 .nm{font-size:clamp(24px,4vmin,38px);text-align:left}
#p3 .does{font-size:clamp(16px,2.5vmin,23px);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
#p3 .q{font-size:clamp(15px,2.1vmin,19px);color:#7a6a52}
#tl{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;position:relative}
.band{border:2px solid rgba(0,0,0,.12);border-radius:12px;display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:0;padding:0;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.band .bn{flex:none;font-size:clamp(14px,2.2vmin,21px);line-height:1.15;padding:6px 2px 4px;text-align:center;border-bottom:2px dashed rgba(0,0,0,.12)}
.band .bn rt{font-size:.5em}
.band .pile{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:2px;padding:4px 2px;overflow:hidden}
.band .pile{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start}
.band .pile .mini{background:rgba(255,255,255,.8);border-radius:6px;font-size:var(--mf,14px);line-height:1.25;padding:1px 1px;text-align:center;white-space:nowrap;overflow:hidden;color:#3d3122}
.band.ng{opacity:.35;border-style:dashed;box-shadow:none}
.band.ok{border-color:var(--gold);border-width:3px;box-shadow:0 3px 0 var(--gold-d)}
.band:active{transform:translateY(2px);box-shadow:none}
#tlArrow{position:absolute;left:0;right:0;bottom:-2px;height:0;pointer-events:none}
#tlFoot{flex:none;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#7a6a52;gap:8px}
#tlFoot .ar{flex:1;height:2px;background:linear-gradient(90deg,transparent,#b5a482);position:relative;margin:0 8px}
#tlFoot .ar::after{content:'';position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid #b5a482;border-right:0}

/* たて長 */
@media (orientation:portrait){
  #v0{flex-direction:column}
  #grid{flex:1 1 0}
  #detail{flex:1 1 0}
  #dPic{width:clamp(96px,17vmin,170px)}
  #c1{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  #v2{flex-direction:column}
  #p2{flex:0 1 auto;flex-direction:row;padding:8px 14px;gap:14px;min-height:0}
  #p2 .pic{width:clamp(110px,22vw,200px);max-height:none;flex:none}
  #p2 .who{display:flex;flex-direction:column;align-items:flex-start}
  #tlFoot{display:none}
}
@media (max-height:640px){
  #app{padding:5px 8px;gap:4px}
  h1{font-size:20px}
  .tab{padding:3px 4px;font-size:15px}
  .tab .no{display:none}
  .chip{min-height:34px;padding:2px 8px;font-size:14px}
  .chip.on{padding:1px 7px}
  #q1{padding:6px 12px}
  #msg{min-height:2.6em}
  .btn{min-height:44px;padding:6px 12px}
  #p3{padding:4px 10px}
  .band .bn{padding:3px 2px 2px}
}
</style>
</head>
<body class="t0">
<div id="app">
  <header>

    <div class="pane" id="v1">
      <div class="card" id="q1"></div>
      <div id="c1"></div>
    </div>
    <!-- ③ -->
    <div class="pane" id="v2">
      <div class="card" id="p2"></div>
      <div id="c2"></div>
    </div>
    <!-- ④ -->
    <div class="pane" id="v3">
      <div class="card" id="p3"></div>

      <div id="msg"></div>
      <span id="left"></span>
      <button class="btn next" id="next" disabled>次の 問題 →</button>
    </div>
  </div>
</div>

<script>

const rb=s=>s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');

/* ---------- 時代 ---------- */

  {n:'弥生〜奈良',c:'#f3e1c4'},

  {n:'平安',c:'#f6dbe3'},
  {n:'鎌倉',c:'#dbe6f3'},
  {n:'室町',c:'#e2eed6'},
  {n:'{安土桃山|あづちももやま}',c:'#f7e7b8'},
  {n:'江戸',c:'#e6def2'},
  {n:'明治',c:'#d6ece8'},

const bandName=i=>plain(BANDS[i].n);

/* ---------- 人物 42人 ----------

  does＝②③の 問題に つかう 一文  memo＝①で 出す こと

function shade(c,k){ // c を こく(k<0)・うすく(k>0)
  const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(k<0?v*(1+k):v+(255-v)*k);
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ---------- ほぞん（localStorage / sessionStorage / window.name の 3か所） ---------- */
const KEY='rekishi6';
const store={
  read(){
    const out=[];
    try{out.push(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}
    try{out.push(JSON.parse(sessionStorage.getItem(KEY)||'null'))}catch(e){}
    try{const w=JSON.parse(window.name||'null');if(w&&w[KEY])out.push(w[KEY])}catch(e){}
    const m={};
    for(const o of out){ if(!o||!o.m) continue;
      for(const k in o.m){ const a=m[k]||[0,0,0],b=o.m[k]; m[k]=a.map((v,i)=>v||b[i]?1:0); } }
    return {m};
  },
  write(d){
    const cur=store.read();
    for(const k in d.m){ const a=cur.m[k]||[0,0,0]; cur.m[k]=a.map((v,i)=>v||d.m[k][i]?1:0); }
    const s=JSON.stringify(cur);
    try{localStorage.setItem(KEY,s)}catch(e){}
    try{sessionStorage.setItem(KEY,s)}catch(e){}
    try{let w={};try{w=JSON.parse(window.name||'{}')||{}}catch(e){} if(typeof w!=='object')w={}; w[KEY]=cur; window.name=JSON.stringify(w)}catch(e){}
    return cur;
  }
};
let SAVE=store.read();
function mark(id,mode){ const m={};m[id]=[0,0,0];m[id][mode-1]=1; SAVE=store.write({m}); }

  }).join('');
  g.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.id;showDetail();g.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',t===b))});
  fitGrid();

function fitGrid(){
  const g=$('grid'), n=g.children.length; if(!n) return;
  const W=g.clientWidth-16, H=g.clientHeight-16, gap=6, ratio=1.22; // たて／よこ
  let best=null;
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c);
    let w=(W-gap*(c-1))/c, h=w*ratio;
    if(h*r+gap*(r-1)>H){ h=(H-gap*(r-1))/r; w=h/ratio; }
    if(!best||w>best.w) best={c,w,h};
  }
  const w=Math.floor(Math.min(best.w,170)), h=Math.floor(w*ratio);
  g.style.gridTemplateColumns=`repeat(${best.c},${w}px)`;
  g.style.gridAutoRows=h+'px';
  const len=Math.max(...inRange().map(x=>x.n.length));
  g.style.setProperty('--tf',Math.max(10,Math.min(18,Math.floor((w-6)/Math.max(len,3.2))))+'px');
}

/* ---------- 問題の じゅんばん ----------
  まとまりの 人を まぜて 1人ずつ。はじめに まちがえた 人は 3問 あとに もう一度 */
function newQ(mode){
  let st=S.q[mode];
  if(!st) st=S.q[mode]={deck:shuffle(pool(mode).map(x=>x.id)),cur:-1,miss:false,done:false,round:false};
  if(!st.deck.length){ st.deck=shuffle(pool(mode).map(x=>x.id)); st.round=true; }
  st.cur=st.deck.shift(); st.miss=false; st.done=false; st.ng=[];
  return st;
}
function finishQ(mode){
  const st=S.q[mode]; st.done=true;
  if(st.miss) st.deck.splice(Math.min(3,st.deck.length),0,st.cur);
  else mark(st.cur,mode);
  $('next').disabled=false;
}
function leftText(mode){ const st=S.q[mode]; return st?`のこり ${st.deck.length+(st.done?0:1)}人`:''; }

// まちがいの せんたくし：同じ まとまり → となりの まとまり → ほか の 順に とる
function distract(id,k){
  const me=P[id], out=[];
  const same=shuffle(P.filter(x=>x.g===me.g&&x.id!==id));
  const near=shuffle(P.filter(x=>Math.abs(x.g-me.g)===1));
  const rest=shuffle(P.filter(x=>Math.abs(x.g-me.g)>1));
  for(const x of same){ if(out.length>=2) break; out.push(x); }
  for(const x of near.concat(rest)){ if(out.length>=k) break; out.push(x); }
  for(const x of same){ if(out.length>=k) break; if(!out.includes(x)) out.push(x); }
  return out.slice(0,k);
}

  const st=fresh||!S.q[1]||S.q[1].done?newQ(1):S.q[1];
  const x=P[st.cur];
  if(!st.opts) st.opts={};
  if(!st.opts[st.cur]) st.opts[st.cur]=shuffle([x].concat(distract(x.id,3))).map(y=>y.id);
  const ids=st.opts[st.cur];
  $('q1').innerHTML=`<span class="lab">この ことを した のは だれ？</span>${rb(x.does)}`;
  $('c1').innerHTML=ids.map(i=>{const y=P[i];return `<button class="popt" data-id="${i}"><span class="pic" style="background:${shade(GROUPS[y.g].c,.45)}">${portrait(y.p,shade(GROUPS[y.g].c,.45))}</span><span class="nm">${nameHTML(y)}</span></button>`}).join('');
  $('c1').querySelectorAll('.popt').forEach(b=>b.onclick=()=>ans1(+b.dataset.id,b));
  roundMsg(st); reNg(st,'#c1 .popt');
  $('next').disabled=true; $('left').textContent=leftText(1);
}
function ans1(id,b){
  const st=S.q[1]; if(st.done) return;
  const x=P[st.cur];
  if(id===x.id){
    b.classList.add('ok'); $('c1').querySelectorAll('.popt').forEach(o=>o.disabled=true);
    setMsg(`<span class="good">${st.miss?'よくできました！':'すごい！'}</span>　${x.n}は ${eraText(x)}の 人。`);
    delete st.opts[st.cur]; finishQ(1); $('left').textContent=leftText(1);
  }else{
    st.miss=true; b.classList.add('ng'); b.disabled=true; st.ng.push(id);
    const y=P[id];
    setMsg(`もう一回！　${y.n}は「${rb(y.does)}」人だよ`);
  }
}

  }else{
    st.miss=true; b.classList.add('ng'); b.disabled=true; st.ng.push(id);
    setMsg(`もう一回！　それは ${nameHTML(P[id])}が した ことだよ`);
  }
}

/* ---------- ④ いつごろ？ ---------- */
function buildTL(){
  const n=maxBand()+1;
  const tl=$('tl');
  // たて長で 6つ以上なら 2だん
  const two=matchMedia('(orientation:portrait)').matches&&n>5;
  tl.style.gridTemplateColumns=`repeat(${two?Math.ceil(n/2):n},1fr)`;
  tl.style.gridTemplateRows=two?'1fr 1fr':'1fr';
  tl.innerHTML=BANDS.slice(0,n).map((b,i)=>`<button class="band" data-b="${i}" style="background:${b.c}"><span class="bn">${rb(b.n)}</span><span class="pile" id="pile${i}"></span></button>`).join('');
  $('tl').querySelectorAll('.band').forEach(b=>b.onclick=()=>ans3(+b.dataset.b,b));
  drawPiles();
}
function drawPiles(){
  for(let i=0;i<=maxBand();i++){
    const ids=S.tlPile[i]||[], el=$('pile'+i);
    el.innerHTML=ids.map(id=>`<span class="mini">${P[id].n}</span>`).join('');
  }
  fitPiles();
}
// 年表に ならべた 名前の 字の 大きさ＝いちばん 長い 名前が はばに 入り、いちばん 多い 帯が たかさに 入る 大きさ
function fitPiles(){
  const el=$('pile0'); if(!el) return;
  const W=el.clientWidth-6, H=el.clientHeight-8;
  let fw=18, fh=18;
  for(let i=0;i<=maxBand();i++){
    const ids=S.tlPile[i]||[]; if(!ids.length) continue;
    const len=Math.max(...ids.map(id=>P[id].n.length));
    fw=Math.min(fw,W/len);
    fh=Math.min(fh,(H/ids.length-4)/1.25);
  }
  $('tl').style.setProperty('--mf',Math.max(9,Math.floor(Math.min(fw,fh)))+'px');
}
function q3(fresh){
  const st=fresh||!S.q[3]||S.q[3].done?newQ(3):S.q[3];
  const x=P[st.cur];
  $('p3').style.background=GROUPS[x.g].c;
  $('p3').innerHTML=`<span class="pic">${portrait(x.p,shade(GROUPS[x.g].c,.45))}</span><span><span class="nm">${nameHTML(x)}</span><div class="does">${rb(x.does)}</div><div class="q">この 人は いつごろの 人？ 下の 年表から えらぼう${S.g<0?'':`（${S.g===0?'':'弥生から '}${GROUPS[S.g].n}までの 人が 出るよ）`}</div></span>`;
  $('tl').querySelectorAll('.band').forEach(b=>{b.classList.remove('ng','ok');b.disabled=false});
  roundMsg(st); reNg(st,'#tl .band','b'); $('next').disabled=true; $('left').textContent=leftText(3);
}
function ans3(bi,btn){
  const st=S.q[3]; if(!st||st.done) return;
  const x=P[st.cur];
  if(x.b.includes(bi)){
    btn.classList.add('ok'); $('tl').querySelectorAll('.band').forEach(o=>o.disabled=true);
    const pb=bi;
    (S.tlPile[pb]=S.tlPile[pb]||[]); if(!S.tlPile[pb].includes(x.id)) S.tlPile[pb].push(x.id);
    drawPiles();
    const both=x.b.length>1?`${bandName(x.b[0])}時代から ${bandName(x.b[1])}時代に かけて 活やくした 人。`:`${bandName(bi)}時代の 人。`;
    setMsg(`<span class="good">${st.miss?'よくできました！':'すごい！'}</span>　${x.n}は ${both}（${x.yr}）`);
    finishQ(3); $('left').textContent=leftText(3);
  }else{
    st.miss=true; btn.classList.add('ng'); btn.disabled=true; st.ng.push(bi);
    const ans=x.b[0];
    setMsg(`もう一回！　もっと <b class="bl">${bi<ans?'新しい':'古い'}</b> 時代だよ`);
  }
}
$('tlClear').onclick=()=>{S.tlPile={};drawPiles()};

/* ---------- 共通 ---------- */
function roundMsg(st){ setMsg(st.round?'<span class="bl">ひとまわり おわり！ また まぜたよ</span>':''); st.round=false; }
function reNg(st,sel,key='id'){ document.querySelectorAll(sel).forEach(b=>{ if(st.ng.includes(+b.dataset[key])){b.classList.add('ng');b.disabled=true} }); }
function setMsg(h){ $('msg').innerHTML=h; }
$('next').onclick=()=>{ if($('next').disabled) return; [null,q1,q2,q3][S.tab](true); };
function chipNames(){
  $('range').querySelectorAll('.chip').forEach(c=>{
    const v=+c.dataset.v;
    c.textContent=S.tab===3&&v>0?`〜${c.dataset.n} まで`:c.dataset.n;
  });
}
function render(){
  document.body.className='t'+S.tab;
  chipNames();
  $('tabs').querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',+t.dataset.t===S.tab));
  if(S.tab===0){ if(!inRange().some(x=>x.id===S.sel)) S.sel=inRange()[0].id; buildGrid(); showDetail(); }
  if(S.tab===1) q1(false);
  if(S.tab===2) q2(false);
  if(S.tab===3){ q3(false); requestAnimationFrame(fitPiles); }
}
$('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=+t.dataset.t;render()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{fitGrid();if(S.tab===3){buildTL();q3(false)}},120)});

buildRange(); buildTL(); render();
</script>
</body>
</html>
