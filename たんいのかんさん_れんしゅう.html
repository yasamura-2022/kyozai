<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たんいの かんさん れんしゅう</title>
<style>
  :root{
    --ink:#2b2118;
    --paper:#fdf6e3;
    --card:#fffdf7;
    --line:#e7d9b8;
    --gold:#c9a227;
    --ok:#5a8a4c;
    --ng:#d34b4b;
    --flash:#ffe14d;
  }
  /* 学習する量ごとに色をかえる（ながさ＝緑・おもさ＝茶・かさ＝青） */
  body[data-cat="len"]{--accent:#4f8a3d;--accent-dark:#3a6a2c;--accent-soft:#e8f3e2}
  body[data-cat="wt" ]{--accent:#c9772a;--accent-dark:#a35c1a;--accent-soft:#fbeadb}
  body[data-cat="vol"]{--accent:#2f7fb5;--accent-dark:#21617f;--accent-soft:#dceef8}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    background:
      radial-gradient(circle at 15% 10%,#fef0d0 0,transparent 40%),
      radial-gradient(circle at 85% 90%,#fbe6cf 0,transparent 45%),
      var(--paper);
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    position:fixed;inset:0;width:100%;
    height:var(--fh,100dvh);
    padding:6px 8px 10px;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  /* iPadでのダブルタップ拡大・長押し選択によるタップ抜けを防ぐ */
  button{
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  .app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
  #viewFind,#viewDrill{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

  header{text-align:center}
  h1{font-size:clamp(17px,4.6vw,24px);letter-spacing:.04em}
  h1 .em{color:var(--accent)}

  /* 学習ステップ タブ */
  .tabs{display:flex;gap:8px;margin-bottom:2px}
  .tab{
    flex:1;border:2px solid var(--line);border-radius:14px;background:var(--card);
    padding:10px 6px;cursor:pointer;color:#8a7a5f;font-weight:800;
    font-size:clamp(14px,3.9vw,17px);display:flex;flex-direction:column;align-items:center;gap:1px;
    transition:transform .08s;
  }
  .tab .step{font-size:11px;font-weight:700;opacity:.7}
  .tab.on{color:var(--ink);border-color:var(--gold);background:#fffdf7;box-shadow:0 3px 0 #a5811a}
  .tab.on .step{color:var(--gold);opacity:1}
  .tab:active{transform:translateY(1px)}

  /* ながさ／おもさ／かさ */
  .modes{display:flex;gap:8px;justify-content:center}
  .mode-btn{
    flex:1;border-radius:14px;padding:9px 6px;
    font-size:clamp(14px,4vw,17px);font-weight:700;cursor:pointer;
    background:var(--card);color:var(--ink);border:2px solid var(--line);transition:transform .08s;
  }
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 0 var(--accent-dark)}
  .mode-btn:active{transform:translateY(2px)}

  /* くみあわせえらび */
  .picker{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .picker .lbl{font-size:13px;color:#8a7a5f;white-space:nowrap}
  .chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .chip{
    position:relative;min-height:44px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);
    background:#fff;font-size:clamp(14px,3.8vw,17px);font-weight:800;cursor:pointer;color:var(--ink);
    transition:transform .08s;white-space:nowrap;
  }
  .chip:active{transform:scale(.94)}
  .chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
  .chip .arw{opacity:.6;margin:0 2px}
  .chip .stamp{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--gold);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
  }

  /* 式カード（共通） */
  .stage{
    background:var(--card);border:3px solid var(--line);border-radius:18px;
    padding:12px;text-align:center;transition:border-color .2s,background .2s;
  }
  .stage.correct{border-color:var(--ok);background:#f2f9ee}
  .stage.wrong{border-color:var(--ng);background:#fcf0f0}
  .eq{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;
    font-size:calc(clamp(22px, calc(var(--fh,100vh) * 0.058), 46px) * var(--shrink,1));line-height:1;
  }
  .unit{font-size:.62em;margin-left:.12em;color:var(--accent-dark)}
  .op{opacity:.55}
  .field{min-width:2.2ch;padding:0 6px;color:var(--ink);font-size:inherit;font-weight:800}
  .field.empty{color:#c7b891}
  .verdict{margin-top:8px;min-height:1.3em;font-size:clamp(13px,3.5vw,17px);font-weight:800}
  .verdict.ok{color:var(--ok)}
  .verdict.ng{color:var(--ng)}
  .verdict em{font-style:normal;color:var(--accent-dark)}

  /* ===== はっけんビュー ===== */
  /* たんいの かんけい（◯◯ばい）を、やじるしで見せる */
  .ladder{display:flex;align-items:center;justify-content:center;gap:6px;
    font-weight:800;font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.032), 24px) * var(--shrink,1))}
  .ladder .u{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;
    padding:5px 10px;color:var(--accent-dark);min-width:3.2em}
  .ladder .arrows{display:flex;flex-direction:column;gap:3px;font-size:.78em;color:#6f5d3d}
  .ladder .arrows span{white-space:nowrap}
  .ladder .rate{color:var(--ng)}
  .ladder .rate.blank{color:#c7b891}

  /* きまり見つけの表 */
  .table{margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
  .row{display:flex;align-items:center;justify-content:center;gap:5px;
    font-weight:800;font-variant-numeric:tabular-nums;
    font-size:calc(clamp(17px, calc(var(--fh,100vh) * 0.04), 30px) * var(--shrink,1));line-height:1.1}
  .row .r{min-width:4.6ch;text-align:right}
  .row .r.blank{color:#c7b891}
  .zeros{background:var(--flash);border-radius:6px;padding:0 2px;animation:pop .4s}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  .actions{display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:clamp(15px,4.2vw,19px);
    font-weight:800;cursor:pointer;transition:transform .08s;color:#fff}
  .btn:active{transform:translateY(2px)}
  .btn.show{background:var(--gold);box-shadow:0 4px 0 #a5811a}
  .btn.next{background:#5a8a4c;box-shadow:0 4px 0 #446838}

  /* ===== ドリルビュー ===== */
  .score{display:flex;gap:8px}
  .score .box{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
  .score .n{font-size:clamp(19px,5.5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .score .t{font-size:10px;color:#8a7a5f;margin-top:2px}
  .score .streak .n{color:var(--gold)}
  .score .correct .n{color:var(--ok)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(min(6px, calc(var(--fh,100vh) * 0.009)) * var(--shrink,1));flex-shrink:0}
  .key{border:2px solid var(--line);border-radius:14px;background:#fff;
    font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.038), 24px) * var(--shrink,1));
    font-weight:800;cursor:pointer;color:var(--ink);
    padding:calc(clamp(2px, calc(var(--fh,100vh) * 0.011), 9px) * var(--shrink,1)) 0;transition:transform .07s,background .1s}
  .key:active{transform:translateY(2px);background:#fff4df}
  .key.del{background:#e6d3a8;box-shadow:0 3px 0 #c9b47f}
  .key.enter{background:var(--ok);color:#fff;box-shadow:0 3px 0 #446838}
  .key.next{background:var(--gold);color:#fff;box-shadow:0 3px 0 #a5811a}

  .drill-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

  .tabs,.modes,.picker,.score,.actions{flex-shrink:0}
  .hidden{display:none !important}

  @media(max-height:720px){
    h1{font-size:16px}
    .tab{padding:7px 6px;font-size:14px}
    .tab .step{font-size:10px}
    .mode-btn{padding:6px}
    .picker{padding:6px 8px}
    .chip{min-height:40px;padding:5px 10px;font-size:15px}
    .score .box{padding:3px}
    .score .n{font-size:20px}
    .score .t{font-size:9px}
  }
  @media(max-height:560px){
    header{display:none}
    .app{gap:5px}
    #viewFind,#viewDrill{gap:5px}
    .chip{min-height:36px;padding:4px 9px;font-size:14px}
  }
  /* 横向き（iPad横など）：式とテンキーを左右2列に */
  @media(orientation:landscape) and (max-height:820px){
    header{display:none}
    .app{gap:5px}
    #viewDrill{gap:5px}
    .drill-main{flex-direction:row;gap:10px;align-items:stretch}
    .drill-main .stage{flex:1 1 60%;min-width:0;padding:10px 14px}
    .drill-main .pad{flex:0 0 auto;width:min(40%,300px);align-content:center}
    .eq{font-size:calc(clamp(22px, calc(var(--fh,100vh) * 0.055), 42px) * var(--shrink,1))}
    .key{font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.042), 23px) * var(--shrink,1));padding:calc(clamp(4px, calc(var(--fh,100vh) * 0.018), 13px) * var(--shrink,1)) 2px;white-space:nowrap}
    .tab{padding:6px;font-size:13px}
    .tab .step{font-size:10px}
    .mode-btn{padding:6px;font-size:14px}
    .picker{padding:5px 8px}
    .chip{min-height:36px;padding:4px 9px;font-size:14px}
    .score .box{padding:3px}
    .score .n{font-size:19px}
  }
</style>
</head>
<body data-cat="len">
<div class="app">
  <header><h1>たんいの <span class="em">かんさん</span> れんしゅう</h1></header>

  <div class="tabs">
    <button class="tab on" data-v="find"><span class="step">ステップ１</span>きまり はっけん！</button>
    <button class="tab" data-v="drill"><span class="step">ステップ２</span>ドリル</button>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-c="len">ながさ</button>
    <button class="mode-btn" data-c="wt">おもさ</button>
    <button class="mode-btn" data-c="vol">かさ</button>
  </div>

  <div class="picker">
    <div class="lbl">くみあわせ</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- はっけんビュー -->
  <div id="viewFind">
    <div class="stage" style="flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:120px">
      <div class="ladder" id="fLadder"></div>
      <div class="table" id="fTable"></div>
    </div>
    <div class="actions">
      <button class="btn show" id="fShow">こたえを見る</button>
      <button class="btn next" id="fNext">むきを かえる</button>
    </div>
  </div>

  <!-- ドリルビュー -->
  <div id="viewDrill" class="hidden">
    <div class="score">
      <div class="box correct"><div class="n" id="sCorrect">0</div><div class="t">正かい</div></div>
      <div class="box"><div class="n" id="sTotal">0</div><div class="t">といた数</div></div>
      <div class="box streak"><div class="n" id="sStreak">0/10</div><div class="t">スタンプまで</div></div>
    </div>
    <div class="drill-main">
      <div class="stage" id="dStage" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="eq" id="dEq"></div><div class="verdict" id="dVerdict"></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   たんいの かんさん（3年：ながさ・おもさ・かさ）
   ・くみあわせごとに 10もん れんぞく正かいで スタンプ
   ・数の大きさは「0のつけたし・とりのぞき」で気づけるものだけ出す
========================================================= */
const CATS={
  len:[
    {big:'cm',small:'mm',r:10},
    {big:'m' ,small:'cm',r:100},
    {big:'km',small:'m' ,r:1000}
  ],
  wt:[
    {big:'kg',small:'g' ,r:1000},
    {big:'t' ,small:'kg',r:1000}
  ],
  vol:[
    {big:'L' ,small:'dL',r:10},
    {big:'dL',small:'mL',r:100},
    {big:'L' ,small:'mL',r:1000}
  ]
};
const S={view:'find',cat:'len',pi:2};   // pi = くみあわせの番号
const body=document.body;
function pair(){return CATS[S.cat][S.pi];}
function pkey(){return S.cat+':'+S.pi;}

/* =========================================================
   タップ処理の一本化（iPad対策・くりあがりアプリと同じ）
   pointerdown で確実に反応させ、遅れて届く click は無視する。
========================================================= */
function bindTap(el,fn){
  let lastFire=0;
  const fire=()=>{
    const now=Date.now();
    if(now-lastFire<60)return;   // 同じ瞬間の二重発火を防ぐ
    lastFire=now;
    fn();
  };
  if(window.PointerEvent){
    el.addEventListener('pointerdown',ev=>{
      if(ev.pointerType==='mouse'&&ev.button!==0)return;
      ev.preventDefault();
      fire();
    });
    el.addEventListener('click',()=>{
      if(Date.now()-lastFire<500)return;
      fire();
    });
  }else{
    el.addEventListener('touchstart',ev=>{ev.preventDefault();fire();},{passive:false});
    el.addEventListener('click',()=>{if(Date.now()-lastFire<500)return;fire();});
  }
}

/* ---------- ことばづくり ---------- */
const KAZU={1:'ひとつ',2:'ふたつ',3:'みっつ'};
function zerosOf(r){return String(r).length-1;}   // 10→1, 100→2, 1000→3
function unitHTML(u){return '<span class="unit">'+u+'</span>';}
/* 大きい方から小さい方へ変えたときに ふえる 0 を光らせる */
function zeroLightHTML(n,z){
  return String(n)+'<span class="zeros">'+'0'.repeat(z)+'</span>';
}

/* =========================================================
   ステップ１：きまり はっけん！
   1・2・3 をならべて「0が◯こ ふえる／へる」に気づかせる
========================================================= */
const F={dir:'b2s',revealed:false};   // b2s = 大きいたんい→小さいたんい
const fLadder=document.getElementById('fLadder');
const fTable=document.getElementById('fTable');

function fNew(){                       // むきを かえる
  F.dir=(F.dir==='b2s')?'s2b':'b2s';
  F.revealed=false;
  fRender();
}
function fReset(){F.revealed=false;fRender();}

function fRender(){
  const p=pair(),z=zerosOf(p.r);
  const from=(F.dir==='b2s')?p.big:p.small;
  const to  =(F.dir==='b2s')?p.small:p.big;
  const rate=F.revealed
    ? '<span class="rate">'+p.r+'ばい</span>'
    : '<span class="rate blank">？ばい</span>';
  const back=F.revealed
    ? '<span class="rate">'+p.r+'</span>でわる'
    : '<span class="rate blank">？</span>でわる';
  fLadder.innerHTML=
    '<span class="u">'+p.big+'</span>'+
    '<span class="arrows"><span>─ '+rate+' →</span><span>← '+back+' ─</span></span>'+
    '<span class="u">'+p.small+'</span>';

  let rows='';
  [1,2,3].forEach(n=>{
    const bigN=n, smallN=n*p.r;
    const l=(F.dir==='b2s')?bigN:smallN;
    const rv=(F.dir==='b2s')?smallN:bigN;
    const right=F.revealed
      ? ((F.dir==='b2s')?zeroLightHTML(bigN,z):'<span class="zeros">'+bigN+'</span>')
      : '？';
    rows+='<div class="row">'+l+unitHTML(from)+'<span class="op">＝</span>'+
          '<span class="r'+(F.revealed?'':' blank')+'">'+right+'</span>'+unitHTML(to)+'</div>';
  });
  fTable.innerHTML=rows;
}
bindTap(document.getElementById('fShow'),()=>{if(!F.revealed){F.revealed=true;fRender();}});
bindTap(document.getElementById('fNext'),fNew);

/* =========================================================
   ステップ２：ドリル
========================================================= */
const GOAL=10;

/* --- 記録の読み書き（とじても消えないように保存） --- */
let stamps={},setStreak={};
try{const s=JSON.parse(localStorage.getItem('tanniStamps')||'null');if(s)stamps=s;}catch(e){}
try{const s=JSON.parse(localStorage.getItem('tanniStreak')||'null');if(s)setStreak=s;}catch(e){}
function saveStamps(){try{localStorage.setItem('tanniStamps',JSON.stringify(stamps));}catch(e){}}
function saveStreak(){try{localStorage.setItem('tanniStreak',JSON.stringify(setStreak));}catch(e){}}

let correct=0,total=0;
try{const sc=JSON.parse(sessionStorage.getItem('tanniScore')||'null');
  if(sc){correct=sc.c|0;total=sc.t|0;}}catch(e){}
function saveScore(){try{sessionStorage.setItem('tanniScore',JSON.stringify({c:correct,t:total}));}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 出す数：1000ばいのくみあわせは1〜9だけ（けたが多くなりすぎないように）。
   10ばい・100ばいのときは 2けたの数も入れて、0のつけたしを味わわせる。 */
let queue=[];
function refillQueue(){
  const r=pair().r;
  let ns=[1,2,3,4,5,6,7,8,9];
  if(r<=100){
    const twos=shuffle([12,15,18,24,25,30,36,45,60,75])
      .slice(0,5);              // 2けたは5つだけ混ぜる
    ns=ns.concat(twos);
  }
  queue=shuffle(ns);
}

const D={n:0,dir:'b2s',from:'',to:'',ans:0,input:'',locked:false};
const dEq=document.getElementById('dEq'),dVerdict=document.getElementById('dVerdict'),
      dStage=document.getElementById('dStage'),padEl=document.getElementById('pad');
const el={c:document.getElementById('sCorrect'),t:document.getElementById('sTotal'),s:document.getElementById('sStreak')};

function dNew(){
  D.input='';D.locked=false;
  dStage.className='stage';dVerdict.className='verdict';dVerdict.textContent='';
  if(!queue.length)refillQueue();
  const p=pair(),n=queue.shift();
  D.dir=Math.random()<0.5?'b2s':'s2b';
  if(D.dir==='b2s'){                 // 3km ＝ □m
    D.from=p.big;D.to=p.small;D.q=n;D.ans=n*p.r;
  }else{                             // 3000m ＝ □km
    D.from=p.small;D.to=p.big;D.q=n*p.r;D.ans=n;
  }
  D.n=n;
  dRender();buildPad();dScore();
}
function dRender(){
  const field=D.locked
    ? '<span class="field">'+D.ans+'</span>'
    : '<span class="field'+(D.input?'':' empty')+'">'+(D.input||'?')+'</span>';
  dEq.innerHTML=D.q+unitHTML(D.from)+'<span class="op">＝</span>'+field+unitHTML(D.to);
}
function dScore(){
  el.c.textContent=correct;el.t.textContent=total;
  const k=pkey();
  el.s.textContent=stamps[k]?'⭐':((setStreak[k]||0)+'/'+GOAL);
}
function hintFor(){
  const z=zerosOf(pair().r),w=KAZU[z];
  return (D.dir==='b2s')
    ? D.from+' から '+D.to+' は <em>'+pair().r+'ばい</em>。0を '+w+' つけるよ'
    : D.from+' から '+D.to+' は <em>'+pair().r+'でわる</em>。0を '+w+' とるよ';
}
function dCheck(){
  if(D.locked||D.input==='')return;
  D.locked=true;total++;
  const ok=Number(D.input)===D.ans,k=pkey();
  if(ok){
    correct++;dStage.classList.add('correct');dVerdict.className='verdict ok';
    setStreak[k]=(setStreak[k]||0)+1;
    if(!stamps[k]&&setStreak[k]>=GOAL){
      stamps[k]=true;saveStamps();buildChips();
      dVerdict.innerHTML='スタンプ ゲット！ ⭐ １０もん せいかい！';
      setStreak[k]=0;refillQueue();
    }else if(stamps[k]){dVerdict.textContent='せいかい！ 🎉';}
    else{dVerdict.textContent='せいかい！ 🎉（あと '+(GOAL-setStreak[k])+'もん で スタンプ）';}
    saveStreak();
  }else{
    if(!stamps[k])queue.push(D.n);      // まちがえた数は もう一度 出す
    setStreak[k]=0;saveStreak();        // れんぞく正かいは やりなおし
    dStage.classList.add('wrong');dVerdict.className='verdict ng';
    dVerdict.innerHTML='おしい！ こたえは '+D.ans+D.to+'　'+hintFor();
  }
  saveScore();
  dRender();dScore();buildPad();
}
function dPress(v){
  if(D.locked)return;
  const maxLen=String(D.ans).length;    // こたえのけた数まで（押しすぎ防止）
  if(v==='del')D.input=D.input.slice(0,-1);
  else if(D.input.length<maxLen)D.input+=v;
  dRender();
}
let lastAction=0;
function buildPad(){
  padEl.innerHTML='';
  for(let i=1;i<=9;i++)addKey(String(i),'key',()=>dPress(String(i)),false);
  addKey('けす','key del',()=>dPress('del'),false);
  addKey('0','key',()=>dPress('0'),false);
  if(D.locked)addKey('つぎ →','key next',dNew,true);
  else addKey('こたえ','key enter',dCheck,true);
  function addKey(label,cls,fn,guard){
    const b=document.createElement('button');b.className=cls;b.textContent=label;b.type='button';
    bindTap(b,()=>{
      if(guard){                        // こたえ／つぎ のみ 連打を防ぐ
        const now=Date.now();
        if(now-lastAction<450)return;
        lastAction=now;
      }
      fn();
    });
    padEl.appendChild(b);
  }
}

/* =========================================================
   共通コントロール（タブ・ながさ/おもさ/かさ・くみあわせ）
========================================================= */
function buildChips(){
  const chips=document.getElementById('chips');chips.innerHTML='';
  CATS[S.cat].forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='chip'+(i===S.pi?' on':'');
    b.innerHTML=p.big+'<span class="arw">⇄</span>'+p.small+
      (stamps[S.cat+':'+i]?'<span class="stamp">⭐</span>':'');
    bindTap(b,()=>{
      if(i===S.pi)return;               // 同じくみあわせの再タップでは何もしない
      S.pi=i;
      refillQueue();buildChips();refreshView();
    });
    chips.appendChild(b);
  });
}
function refreshView(){
  if(S.view==='find')fReset();
  else dNew();
  fitShrink();
}
document.querySelectorAll('.tab').forEach(t=>{
  bindTap(t,()=>{
    if(S.view===t.dataset.v)return;     // 同じタブの再タップでは作り直さない
    S.view=t.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.getElementById('viewFind').classList.toggle('hidden',S.view!=='find');
    document.getElementById('viewDrill').classList.toggle('hidden',S.view!=='drill');
    refreshView();
  });
});
document.querySelectorAll('.mode-btn').forEach(btn=>{
  bindTap(btn,()=>{
    if(S.cat===btn.dataset.c)return;    // 同じ量の再タップでは作り直さない
    S.cat=btn.dataset.c;body.dataset.cat=S.cat;
    S.pi=CATS[S.cat].length-1;          // いちばん大きいくみあわせ（1000ばい）から
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b===btn));
    refillQueue();buildChips();refreshView();
  });
});
document.addEventListener('keydown',e=>{
  if(S.view!=='drill'||e.repeat)return; // キー押しっぱなしの連続入力を防ぐ
  if(e.key.length===1&&e.key>='0'&&e.key<='9')dPress(e.key);
  else if(e.key==='Backspace')dPress('del');
  else if(e.key==='Enter'){
    const now=Date.now();
    if(now-lastAction<450)return;
    lastAction=now;
    D.locked?dNew():dCheck();
  }
});

/* ===== 枠の高さを実測して、その中に必ず収める ===== */
function frameHeight(){
  const c=document.documentElement.clientHeight||0;
  const w=window.innerHeight||0;
  const v=(window.visualViewport&&window.visualViewport.height)||0;
  return Math.min.apply(null,[c,w,v].filter(x=>x>0))||w||c;
}
function fitToFrame(){
  document.documentElement.style.setProperty('--fh',frameHeight()+'px');
  fitShrink();
}
/* ===== はみ出す場合は --shrink で自動縮小して必ず1画面に収める ===== */
let shrinkPass=0;
function fitShrink(){
  document.documentElement.style.setProperty('--shrink','1');
  shrinkPass=0;
  requestAnimationFrame(shrinkStep);
}
function shrinkStep(){
  const appEl=document.querySelector('.app');
  if(!appEl)return;
  const over=appEl.scrollHeight-appEl.clientHeight;
  if(over>2&&shrinkPass<6){
    const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--shrink'))||1;
    const next=Math.max(.55,cur*Math.max(.8,appEl.clientHeight/appEl.scrollHeight));
    document.documentElement.style.setProperty('--shrink',next.toFixed(3));
    shrinkPass++;
    requestAnimationFrame(shrinkStep);
  }
}
window.addEventListener('resize',fitToFrame);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitToFrame);
window.addEventListener('orientationchange',()=>setTimeout(fitToFrame,200));
window.addEventListener('load',fitToFrame);

/* ---------- はじめの表示 ---------- */
refillQueue();buildChips();fRender();dNew();fitToFrame();
</script>
