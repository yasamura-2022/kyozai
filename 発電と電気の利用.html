<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>発電と電気の利用</title>
<style>
/* =========================================================
   発電と電気の利用（6年 理科 A(4) 電気の利用）
   学習指導要領解説 理科編 より
   ・「電気は，つくりだしたり蓄えたりすることができること」
   ・「電気は，光，音，熱，運動などに変換することができること」
   ・「身の回りには，電気の性質や働きを利用した道具があること」
   ・内容の取扱い「電気をつくりだす道具として，手回し発電機，光電池などを扱う」
   ・「電気を蓄える物として，例えば，コンデンサーなどの蓄電器」
   ・「蓄電した電気を使って，発光ダイオードと豆電球の点灯時間を比較する」
   ・「目的に合わせてセンサーを使い，モーターの動きや発光ダイオードの点灯を制御する」
   だから この アプリは 「つくる → ためる → かえる → くらべる → くらしの中」で 組む。
   電流の 大きさ（A）・電圧（V）・オームの法則・エネルギー保存は
   中学校 第1分野の 内容なので 入れない。数で 表すのは
   「回した 回数」と「光って いた 時間」だけに する。
   電気は 目に 見えないので、導線の 中を すすむ 金色の 矢を 出して
   「向き」と「量（数と 速さ）」だけを 表す。これは モデルだと 画面に 明記する。
   外部読み込みは なし。1ファイルで 動く。
   ========================================================= */
:root{
  --paper:#fdf6e3;
  --card:#fffdf7;
  --ink:#2b2118;
  --dim:#7a6a52;
  --line:#e7d9b8;
  --gold:#c9a227;      /* こたえ合わせ */
  --blue:#2f6fa8;      /* 同じ 画面の 中で すすむ */
  --ok:#5a8a4c;        /* べつの もんだいへ */
  --sub:#a99a7c;       /* もどる・やりなおす */
  --ng:#d34b4b;
  /* はたらきの 色（③⑤で そろえる。ここを 変えると 全部 変わる） */
  --k-light:#d9a520;   /* 光 */
  --k-sound:#6b5bb5;   /* 音 */
  --k-heat:#d2622a;    /* 熱 */
  --k-move:#2f8a7e;    /* 運動 */
  --elec:#ffd45e;      /* 電気の 流れ */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  /* 外から フォントを 読まない。端末に 入って いる まるい 書体を 上から さがす */
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Klee One','BIZ UDPGothic','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
  background:var(--paper);color:var(--ink);font-weight:700;-webkit-text-size-adjust:100%;
}
#app{height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;gap:6px;max-width:1240px;margin:0 auto;}

/* ---- 見出しと タブ ---- */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
h1{margin:0;font-size:clamp(15px,2.1vw,21px);letter-spacing:.04em;}
h1 .sub{color:#9a7c1e;font-size:.7em;margin-left:8px;}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tab{
  font:inherit;font-size:clamp(11px,1.45vw,15px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;min-height:40px;cursor:pointer;
}
.tab.on{color:#3a2c05;background:#f5d97a;border-color:var(--gold);}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ---- ステージ ---- */
#main{flex:1;min-height:0;position:relative;}
.stage{position:absolute;inset:0;display:none;flex-direction:column;gap:6px;}
.stage.on{display:flex;}
.cols{flex:1;min-height:0;display:grid;grid-template-rows:1.5fr 1fr;grid-template-columns:1fr;gap:6px;}
@media (orientation:landscape) and (min-width:700px){
  .cols.two{grid-template-columns:1.42fr .58fr;grid-template-rows:1fr;}
  .cols.wide{grid-template-columns:1.72fr .28fr;grid-template-rows:1fr;}
  .segs{flex-direction:column;}
}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;min-height:0;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.side{display:flex;flex-direction:column;gap:6px;min-height:0;}
.msg{
  /* display:flex に すると <b> や <span> が flex の 子に なり、語の とちゅうで
     折り返して しまう。block の まま 中央ぞろえに する */
  flex:0 0 auto;background:#f7f0dd;border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;font-size:clamp(12px,1.55vw,16px);line-height:1.5;text-align:center;
  min-height:44px;display:block;
}
.msg b{color:#9a7c1e;}
.msg .ok{color:#3f7a33;}
.msg .ng{color:#b33c3c;}

/* ---- ボタン ---- */
.bar{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{
  font:inherit;font-size:clamp(12px,1.45vw,15px);color:#fff;border:none;border-radius:14px;
  padding:10px 15px;min-height:44px;cursor:pointer;background:#6a7f9b;
}
.btn:active{transform:scale(.97);}
.btn.play{background:var(--blue);}            /* 同じ 画面の 中で すすむ */
.btn.show{background:var(--gold);color:#3a2c05;} /* こたえ合わせ */
.btn.next{background:var(--ok);}              /* べつの もんだいへ */
.btn.sub{background:var(--sub);}              /* もどる・やりなおす */
.btn.ghost{background:#f6eed9;color:var(--dim);border:1px solid var(--line);}
.btn.ghost.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.btn[disabled]{opacity:.42;}

/* ---- 右の パネル ---- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:7px 8px;min-height:0;display:flex;flex-direction:column;gap:5px;
  overflow:hidden;   /* 場所が せまい ときに 下の 文の 上へ はみ出さない ため */
}
/* えらぶ ところ。たてに 長い 画面では 2つを よこに ならべて、
   表の 場所を あける（たてに ならべると 表が つぶれる） */
.segs{flex:0 0 auto;display:flex;flex-direction:row;gap:6px;}
.segs .panel{flex:1;min-width:0;}
.panel .ttl{font-size:clamp(11px,1.25vw,13px);color:var(--dim);text-align:center;}
.seg{display:flex;gap:4px;}
.seg button{
  flex:1;font:inherit;font-size:clamp(11px,1.25vw,14px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);border-radius:11px;
  padding:7px 2px;min-height:40px;cursor:pointer;
}
.seg button.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}

/* 記録の 表（①） */
.tbl{flex:1;min-height:0;display:grid;gap:3px;font-size:clamp(10px,1.18vw,13px);}
.tbl div{
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:9px;padding:2px 3px;line-height:1.25;
}
.tbl .h{background:#f1e6c8;color:#6a5a3a;font-size:.92em;}
.tbl .r{background:#f6eed9;color:#6a5a3a;font-size:.92em;}
.tbl .c{background:#fbf6e8;border:1px solid var(--line);color:var(--dim);}
.tbl .c.on{background:#fff3cf;border-color:var(--gold);color:#5a4718;}
.tbl .c.now{box-shadow:0 0 0 2px var(--blue) inset;}

/* 記録の 棒（②） */
.recs{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;justify-content:center;}
.rec{display:grid;grid-template-columns:3.6em 1fr;gap:5px;align-items:center;font-size:clamp(10px,1.2vw,13px);}
.rec .lb{color:var(--dim);text-align:right;}
.rec .bw{position:relative;height:clamp(16px,2.4vh,24px);background:#f2ead6;border-radius:7px;overflow:hidden;}
.rec .bf{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f0c94f,#d9a520);border-radius:7px;}
.rec .vt{position:absolute;right:5px;top:50%;transform:translateY(-50%);color:#4a3c1a;font-size:.95em;}

/* はたらきの カード（③） */
.kinds{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);gap:5px;}
.kind{
  border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;color:var(--dim);
  font-size:clamp(10px,1.2vw,13px);background:#fbf6e8;padding:2px;
}
.kind b{font-size:clamp(13px,1.7vw,18px);}
.kind span{font-size:.92em;line-height:1.2;text-align:center;}
.kind.on{border-style:solid;}
.kind.k-light.on{border-color:var(--k-light);background:#fdf3d8;color:#8a6a10;}
.kind.k-sound.on{border-color:var(--k-sound);background:#eeecf8;color:#4b3f8f;}
.kind.k-heat.on{border-color:var(--k-heat);background:#fceadf;color:#a34a1c;}
.kind.k-move.on{border-color:var(--k-move);background:#e4f2ef;color:#1f6b60;}

/* えらぶ ボタン（④の 予想） */
.opts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.opt{
  font:inherit;font-size:clamp(11px,1.35vw,15px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:13px;padding:8px 4px;min-height:46px;cursor:pointer;line-height:1.3;
}
.opt.sel{border-color:var(--gold);background:#fff3cf;color:#5a4718;}
.opt.right{border-color:var(--ok);background:#e6f0e0;color:#3f7a33;}
.opt.wrong{border-color:var(--ng);}

/* ⑤ なかま分け */
#sortWrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;}
.chips{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px;min-height:56px;
}
.chip{
  font:inherit;font-size:clamp(11px,1.4vw,15px);color:var(--ink);background:#f5d97a;
  border:2px solid var(--gold);border-radius:12px;padding:7px 12px;min-height:42px;cursor:pointer;
}
.chip.sel{background:#fff;box-shadow:0 0 0 3px var(--blue);}
.bins{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
@media (max-width:640px){.bins{grid-template-columns:repeat(2,1fr);}}
.bin{
  border:2px dashed var(--line);border-radius:14px;background:var(--card);
  display:flex;flex-direction:column;gap:3px;padding:5px 4px;min-height:0;cursor:pointer;overflow:hidden;
}
.bin .bt{text-align:center;font-size:clamp(12px,1.5vw,16px);}
.bin .bi{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;justify-content:center;overflow:hidden;}
.bin .bi span{
  font-size:clamp(9px,1.1vw,12px);background:#f6eed9;border:1px solid var(--line);
  border-radius:8px;padding:3px 6px;color:var(--dim);
}
.bin.k-light{border-color:var(--k-light);} .bin.k-light .bt{color:#8a6a10;}
.bin.k-sound{border-color:var(--k-sound);} .bin.k-sound .bt{color:#4b3f8f;}
.bin.k-heat{border-color:var(--k-heat);}   .bin.k-heat .bt{color:#a34a1c;}
.bin.k-move{border-color:var(--k-move);}   .bin.k-move .bt{color:#1f6b60;}
.bin.hit{background:#fff3cf;}

/* まどが 小さい ときは、えらぶ ところの 見出しを 消して 表に 場所を まわす
   （ボタンの ことばだけで 何を えらぶか わかる） */
@media (max-height:620px) and (max-width:700px){
  .segs .ttl{display:none;}
}
@media (max-height:620px){
  #app{padding:5px 8px 7px;gap:4px;}
  .msg{padding:6px 10px;min-height:38px;font-size:clamp(11px,1.5vw,15px);}
  .btn{min-height:40px;padding:8px 12px;}
  .seg button{min-height:36px;}
  .opt{min-height:42px;}
  .chip{min-height:38px;padding:5px 10px;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>発電と 電気の 利用<span class="sub">つくる・ためる・かえる</span></h1>
    <nav id="tabs">
      <button class="tab on" data-s="1">① 電気を つくる</button>
      <button class="tab" data-s="2">② 電気を ためる</button>
      <button class="tab" data-s="3">③ 電気を かえる</button>
      <button class="tab" data-s="4">④ くらべる</button>
      <button class="tab" data-s="5">⑤ くらしの 中</button>
    </nav>
  </header>

  <div id="main">

    <!-- ① 電気を つくる -->
    <section class="stage on" id="s1">
      <div class="cols two">
        <div class="card"><canvas id="c1"></canvas></div>
        <div class="side">
          <div class="segs">
            <div class="panel">
              <div class="ttl">電気を つくる もの</div>
              <div class="seg" id="g1dev">
                <button data-v="hand" class="on">手回し発電機</button>
                <button data-v="solar">光電池</button>
              </div>
            </div>
            <div class="panel">
              <div class="ttl">つなぐ もの</div>
              <div class="seg" id="g1load">
                <button data-v="bulb" class="on">豆電球</button>
                <button data-v="motor">モーター</button>
              </div>
            </div>
          </div>
          <div class="panel" style="flex:1">
            <div class="ttl" id="t1ttl">しらべた こと</div>
            <div class="tbl" id="t1"></div>
          </div>
        </div>
      </div>
      <div class="msg" id="m1"></div>
      <div class="bar" id="b1"></div>
    </section>

    <!-- ② 電気を ためる -->
    <section class="stage" id="s2">
      <div class="cols two">
        <div class="card"><canvas id="c2"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">回した 回数 と 光って いた 時間</div>
            <div class="recs" id="r2"></div>
          </div>
        </div>
      </div>
      <div class="msg" id="m2"></div>
      <div class="bar">
        <button class="btn play" id="b2crank">ハンドルを 回す ▶</button>
        <button class="btn ghost" data-t="10">10回まで</button>
        <button class="btn ghost" data-t="20">20回まで</button>
        <button class="btn ghost" data-t="30">30回まで</button>
        <button class="btn play" id="b2use">豆電球に つなぐ ▶</button>
        <button class="btn sub" id="b2reset">はじめから</button>
      </div>
    </section>

    <!-- ③ 電気を かえる -->
    <section class="stage" id="s3">
      <div class="cols two">
        <div class="card"><canvas id="c3"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">電気が かわった もの</div>
            <div class="kinds" id="k3">
              <div class="kind k-light" data-k="light"><b>光</b><span id="k3light">まだ</span></div>
              <div class="kind k-sound" data-k="sound"><b>音</b><span id="k3sound">まだ</span></div>
              <div class="kind k-heat"  data-k="heat"><b>熱</b><span id="k3heat">まだ</span></div>
              <div class="kind k-move"  data-k="move"><b>運動</b><span id="k3move">まだ</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="msg" id="m3"></div>
      <div class="bar" id="b3sel"></div>
      <div class="bar">
        <button class="btn play on" id="b3run">回して いる ▶</button>
        <button class="btn ghost" id="b3rev">つなぐ 向きを 逆に する</button>
        <button class="btn ghost on" id="b3snd">音 あり</button>
      </div>
    </section>

    <!-- ④ くらべる -->
    <section class="stage" id="s4">
      <div class="cols wide">
        <div class="card"><canvas id="c4"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">予想</div>
            <div class="opts" id="o4" style="grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);flex:1"></div>
          </div>
        </div>
      </div>
      <div class="msg" id="m4"></div>
      <div class="bar">
        <button class="btn play" id="b4start">じっけん スタート ▶</button>
        <button class="btn ghost on" id="b4fast">10倍 早送り</button>
        <button class="btn sub" id="b4reset">もう 一度</button>
      </div>
    </section>

    <!-- ⑤ くらしの 中 -->
    <section class="stage" id="s5">
      <div id="sortWrap">
        <div class="chips" id="chips5"></div>
        <div class="bins" id="bins5">
          <div class="bin k-light" data-k="light"><div class="bt">光</div><div class="bi"></div></div>
          <div class="bin k-sound" data-k="sound"><div class="bt">音</div><div class="bi"></div></div>
          <div class="bin k-heat"  data-k="heat"><div class="bt">熱</div><div class="bi"></div></div>
          <div class="bin k-move"  data-k="move"><div class="bt">運動</div><div class="bi"></div></div>
        </div>
      </div>
      <div class="card" id="w5s" style="flex:1;min-height:0;display:none"><canvas id="c5"></canvas></div>
      <div class="msg" id="m5"></div>
      <div class="bar">
        <button class="btn ghost on" id="b5m1">なかま分け</button>
        <button class="btn ghost" id="b5m2">センサーで むだなく</button>
        <span style="width:8px"></span>
        <button class="btn play" id="b5go">スタート ▶</button>
        <button class="btn sub" id="b5reset">はじめから</button>
      </div>
    </section>

  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ========================= 下じき ========================= */
function fit(cv){
  const r=cv.getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d;}
  const g=cv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,w,h);
  return {g,w,h};
}
/* 基準の 大きさで かいて、画面に 合わせて 縮める。
   どの iPad でも はみ出さない ように するため */
function base(g,w,h,bw,bh){
  const s=Math.min(w/bw,h/bh);
  g.save();g.translate((w-bw*s)/2,(h-bh*s)/2);g.scale(s,s);
  return s;
}
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans",sans-serif';
function txt(g,s,x,y,size,color,align,baseline,weight){
  g.save();
  g.font=(weight||700)+' '+size+'px '+FONT;
  g.textAlign=align||'center';g.textBaseline=baseline||'middle';
  g.fillStyle=color||'#2b2118';g.fillText(s,x,y);
  g.restore();
}
function rrp(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
function box(g,x,y,w,h,r,fill,stroke,lw){
  rrp(g,x,y,w,h,r);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}
}
function circ(g,x,y,r,fill,stroke,lw){
  g.beginPath();g.arc(x,y,r,0,TAU);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}
}
/* 理科室の 机（写真と 同じ 灰色）。金の 矢が よく 見える */
function desk(g,w,h){
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#5d646c');gr.addColorStop(1,'#3d4349');

/* ========================= 線と 流れ ========================= */
function bez(x0,y0,cx,cy,x1,y1,n){
  n=n||34;const p=[];
  for(let i=0;i<=n;i++){
    const t=i/n,u=1-t;
    p.push({x:u*u*x0+2*u*t*cx+t*t*x1, y:u*u*y0+2*u*t*cy+t*t*y1});
  }
  return p;
}
function plen(pts){
  let L=0;for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);}
  return L;
}
function pat(pts,d){
  let L=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],seg=Math.hypot(b.x-a.x,b.y-a.y);
    if(L+seg>=d){
      const t=seg<1e-6?0:(d-L)/seg;
      return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),a:Math.atan2(b.y-a.y,b.x-a.x)};
    }
    L+=seg;
  }
  const a=pts[pts.length-2],b=pts[pts.length-1];
  return {x:b.x,y:b.y,a:Math.atan2(b.y-a.y,b.x-a.x)};
}
function wire(g,pts,col,wd){
  g.save();g.strokeStyle=col;g.lineWidth=wd||9;g.lineJoin='round';g.lineCap='round';
  g.beginPath();g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);
  g.stroke();g.restore();
}
/* 電気の 流れ。向きは 矢の むき、量は 数と 大きさで 表す */
function arrowDot(g,x,y,r,ang,alpha){
  g.save();g.translate(x,y);g.rotate(ang);g.globalAlpha=alpha;
  g.fillStyle='#ffd45e';
  g.beginPath();
  g.moveTo(r*1.25,0);g.lineTo(-r*.8,r*.85);g.lineTo(-r*.35,0);g.lineTo(-r*.8,-r*.85);
  g.closePath();g.fill();
  g.globalAlpha=alpha*.9;g.fillStyle='#fff8dc';
  g.beginPath();g.moveTo(r*.55,0);g.lineTo(-r*.3,r*.34);g.lineTo(-r*.3,-r*.34);g.closePath();g.fill();
  g.restore();
}
function flow(g,pts,phase,amt){
  const a=Math.abs(amt);
  if(a<0.03)return;
  const L=plen(pts);
  /* 量が 多い ほど 矢の 数が ふえ、大きく なる */
  const gap=lerp(64,28,clamp(a,0,1));
  const n=Math.max(1,Math.floor(L/gap));
  const r=lerp(5.5,9.5,clamp(a,0,1));
  const al=lerp(.55,1,clamp(a,0,1));
  const dir=amt<0?-1:1;
  for(let i=0;i<n;i++){
    const d=(((i*(L/n))+phase*dir)%L+L)%L;
    const p=pat(pts,d);
    arrowDot(g,p.x,p.y,r,p.a+(dir<0?Math.PI:0),al);
  }
}
/* 回す 向きの 矢 */
function spinArrow(g,cx,cy,r,dir,col){
  g.save();g.strokeStyle=col;g.lineWidth=5;g.lineCap='round';
  g.beginPath();g.arc(cx,cy,r,-0.35*Math.PI*dir,1.15*Math.PI*dir,dir<0);g.stroke();
  const a=1.15*Math.PI*dir, hx=cx+Math.cos(a)*r, hy=cy+Math.sin(a)*r;
  g.translate(hx,hy);g.rotate(a+(dir>0?Math.PI/2:-Math.PI/2));
  g.fillStyle=col;g.beginPath();g.moveTo(11,0);g.lineTo(-7,7);g.lineTo(-7,-7);g.closePath();g.fill();
  g.restore();
}

/* =========================================================

const S2={turns:0,level:0,crank:false,use:false,ang:0,phase:0,t:0,start:0,recs:[],shown:0};
const S2FULL=40, S2SEC=30;           /* 40回 回すと いっぱい。いっぱいで 30秒 光る */

  const K=S2K;

  const bx=736,by=392, TL={x:bx-26*K,y:by+52*K}, TR={x:bx+26*K,y:by+52*K};
  const sw={x:430,y:470}, swL={x:sw.x-34*K,y:sw.y}, swR={x:sw.x+34*K,y:sw.y};

    capIn:[{x:R.x,y:R.y},{x:cx+20,y:R.y},{x:cx+20,y:K2.y},{x:K2.x,y:K2.y}],
    genIn:[{x:gK.x,y:gK.y},{x:gx-36*K,y:gK.y},{x:gx-36*K,y:gR.y},{x:gR.x,y:gR.y}]};
})();
function draw2(){
  const {g,w,h}=fit($('c2'));

  if(S2.use||S2.shown>0)tag(g,'光って いた 時間　'+(S2.use?S2.t:S2.shown).toFixed(1)+'秒',P.bx,P.by-118,21,'#fff3cf');

function recs2(){

function up2btn(){

function s2end(){

  S2.shown=S2.t;S2.use=false;S2.level=0;S2.turns=0;

    if(a.turns!==c.turns)m+='<br>回した 回数が '+(c.turns>a.turns?'ふえる':'へる')+'と、光る 時間も <b>'+(c.turns>a.turns?'長く':'短く')+'</b> なった。電気の 量が 変わったんだね。';

  b.addEventListener('click',()=>{

    up2btn();
    $('m2').innerHTML='<b>'+S2.turns+'回</b> 回した。めもりを 見て みよう。';

function step2(dt){
  let anim=false;
  if(S2.crank&&!S2.use){
    S2.ang+=dt*TAU*2.2;
    const before=Math.floor(S2.turns);
    S2.turns=Math.min(S2FULL,S2.turns+dt*2.2);
    S2.level=clamp(S2.turns/S2FULL,0,1);
    if(S2.level>=1){S2.crank=false;up2btn();$('m2').innerHTML='コンデンサーが <b>いっぱい</b>に なった。これ以上は ためられない。';}
    if(Math.floor(S2.turns)!==before)anim=true;
    anim=true;
  }
  if(S2.use){
    S2.t+=dt;
    S2.level=Math.max(0,S2.level-dt/S2SEC);
    if(S2.level<=0.02)s2end();
    anim=true;
  }
  if(anim){S2.phase+=dt*170;}
  return anim;
}

/* =========================================================
   ③ 電気を かえる（変換）
   「電気は，光，音，熱，運動などに変換することができること」
   豆電球・発光ダイオード（光）／電子オルゴール（音）／電熱線（熱）／モーター（運動）
   ========================================================= */
const DEV3=[
  {k:'bulb',  n:'豆電球',        kind:'light',y:248,msg:'電気が <b>光</b>に かわった。豆電球は さわると あたたかい。光の ほかに <b>熱</b>にも かわって いる。'},
  {k:'led',   n:'発光ダイオード',kind:'light',y:248,msg:'電気が <b>光</b>に かわった。'},
  {k:'buzzer',n:'電子オルゴール',kind:'sound',y:258,msg:'電気が <b>音</b>に かわった。'},
  {k:'heater',n:'電熱線',        kind:'heat', y:262,msg:'電気が <b>熱</b>に かわった。電熱線が 熱く なる。'},
  {k:'motor', n:'モーター',      kind:'move', y:248,msg:'電気が <b>運動</b>に かわった。'}
];
const KN={light:'光',sound:'音',heat:'熱',move:'運動'};
const S3={sel:'bulb',rev:false,run:true,snd:true,ang:0,mang:0,phase:0,t:0,heat:0,done:{}};
function dev3(){return DEV3.find(d=>d.k===S3.sel);}
/* 逆に つないだ とき、はたらくか どうか */
function s3works(){
  if(!S3.run)return false;
  if(!S3.rev)return true;
  return !(S3.sel==='led'||S3.sel==='buzzer');
}
function draw3(){
  const {g,w,h}=fit($('c3'));

  const K=1.3, d=dev3(), DX=286, DY=d.y-40;
  const A={x:DX-26*K,y:DY+52*K}, B={x:DX+26*K,y:DY+52*K};
  const TL=S3.rev?B:A, TR=S3.rev?A:B;
  const gx=768,gy=392,gR={x:gx-71*K,y:gy-20*K},gK={x:gx-71*K,y:gy+20*K};
  const red=bez(gR.x,gR.y,480,96,TL.x,TL.y), blk=bez(TR.x,TR.y,520,534,gK.x,gK.y);
  const genIn=[{x:gK.x,y:gK.y},{x:gx-36*K,y:gK.y},{x:gx-36*K,y:gR.y},{x:gR.x,y:gR.y}];
  const amt=S3.run?0.8:0, on=s3works();
  wire(g,red,'#c4302b',9);wire(g,blk,'#1d2126',9);

  post(g,A.x,A.y,S3.rev?'#2c3238':'#d94b4b');post(g,B.x,B.y,S3.rev?'#d94b4b':'#2c3238');
  const b=on?1:0;
  at(g,DX,DY,K,(q,x,y)=>{

    if(S3.sel==='led')drawLED(q,x,y,b);
    if(S3.sel==='buzzer')drawBuzzer(q,x,y,on,S3.t);
    if(S3.sel==='heater')drawHeater(q,x,y,S3.heat,S3.t);
    if(S3.sel==='motor')drawMotor(q,x,y,S3.mang,on?(S3.rev?-0.8:0.8):0);

  if(S3.run&&!on){

    tag(g,'電気　→　'+KN[kd],DX,50,26,col);

  if(n===4)m+='<br>電気は <b>光・音・熱・運動</b>に かえて つかう ことが できる。';

/* 音は その場で つくる（外の 音の ファイルは 読めない）。
   30台 いっせいに 鳴ると 教室が 成り立たないので 先生が 消せる ように する */
let AC=null,melT=null,melI=0;
function audio(){
  if(AC===null){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}}
  return AC||null;
}
function beep(f,dur,vol){
  const a=audio();if(!a)return;
  if(a.state==='suspended')a.resume();
  const o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(vol,a.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+0.05);
}
const MEL=[523.25,587.33,659.25,783.99,659.25,587.33,523.25,659.25];
function sound3(){
  const want=(step===3&&S3.sel==='buzzer'&&s3works()&&S3.snd);
  if(want&&!melT){
    melI=0;
    melT=setInterval(()=>{beep(MEL[melI%MEL.length],0.3,0.1);melI++;},340);
  }else if(!want&&melT){clearInterval(melT);melT=null;}
}
function step3(dt){
  if(!S3.run)return false;
  S3.ang+=dt*TAU*1.6*(S3.rev?-1:1);
  S3.phase+=dt*170;
  S3.t+=dt;
  if(s3works()){
    if(S3.sel==='motor')S3.mang+=dt*TAU*2.2*(S3.rev?-1:1);
    if(S3.sel==='heater')S3.heat=Math.min(1,S3.heat+dt*0.5);
  }else if(S3.sel==='heater')S3.heat=Math.max(0,S3.heat-dt*0.6);
  return true;
}

/* =========================================================
   ④ くらべる（豆電球と 発光ダイオード）
   「蓄電した電気を使って，発光ダイオードと豆電球の点灯時間を比較することが考えられる」
   ＝ 授業で つかった ワークシート（２枚目）と 同じ しらべ方。
   ========================================================= */
const S4={phase:'yosou',guess:-1,t:0,fast:true,ph:0};
const T_BULB=30, T_LED=300;          /* 同じだけ ためた 電気で 光る 時間 */
const O4=['豆電球の ほうが 長い','発光ダイオードの ほうが 長い','どちらも 同じくらい'];
function fmtT(s){
  if(s<60)return s.toFixed(1)+'秒';
  return Math.floor(s/60)+'分'+String(Math.floor(s%60))+'秒';
}
function s4lv(){
  return {b:clamp(1-S4.t/T_BULB,0,1), l:clamp(1-S4.t/T_LED,0,1)};
}
function group4(g,cx,kind,lv,tSec,alive){
  const K=1.16;
  const cy=326, R={x:cx-146+67*K,y:cy-19*K}, KK={x:cx-146+67*K,y:cy+19*K};
  const DX=cx+116, DY=214, TL={x:DX-26*K,y:DY+52*K}, TR={x:DX+26*K,y:DY+52*K};
  const red=bez(R.x,R.y,cx+10,196,TL.x,TL.y), blk=bez(TR.x,TR.y,cx+36,430,KK.x,KK.y);
  const capIn=[{x:R.x,y:R.y},{x:cx-146+20,y:R.y},{x:cx-146+20,y:KK.y},{x:KK.x,y:KK.y}];
  wire(g,red,'#c4302b',8);wire(g,blk,'#1d2126',8);
  if(alive&&S4.phase==='run')flow(g,red.concat([TL,TR],blk,capIn),S4.ph,clamp(lv*2.6,0.25,1));
  post(g,TL.x,TL.y,'#d94b4b');post(g,TR.x,TR.y,'#2c3238');
  const b=alive?clamp(lv*3.4,0,1):0;
  at(g,DX,DY,K,(q,x,y)=>{if(kind==='bulb')drawBulb(q,x,y,b);else drawLED(q,x,y,b);});
  at(g,cx-146,cy,K,(q,x,y)=>drawCap(q,x,y,lv));
  /* たまって いる 電気の めもり */
  const bx=cx-152,by=452,bw=304;
  box(g,bx,by,bw,24,8,'rgba(0,0,0,.35)','rgba(255,255,255,.3)',2);
  g.save();rrp(g,bx+3,by+3,bw-6,18,5);g.clip();
  const gr=g.createLinearGradient(bx,0,bx+bw,0);
  gr.addColorStop(0,'#e0a52a');gr.addColorStop(1,'#ffe083');
  g.fillStyle=gr;g.fillRect(bx+3,by+3,(bw-6)*lv,18);g.restore();
  txt(g,'のこって いる 電気',bx+bw/2,by+42,16,'#d9dde1');
  tag(g,fmtT(tSec),cx,106,32,alive?'#fff3cf':'#c8ccd0');
  if(!alive&&S4.phase!=='yosou')tag(g,'消えた',DX,DY-110,21,'#ffd0a0');
  if(kind==='bulb'&&alive&&S4.phase==='run'&&S4.t>T_BULB*0.25){
    g.save();g.strokeStyle='rgba(255,180,130,.9)';g.lineWidth=3;g.lineCap='round';
    for(let i=0;i<3;i++){
      const px=DX-28+i*28, ph=(S4.ph/90+i*0.33)%1;
      g.beginPath();
      for(let k=0;k<=7;k++){const yy=DY-52-ph*30-k*6,xx=px+Math.sin(k*0.8+S4.ph/30+i)*6;k?g.lineTo(xx,yy):g.moveTo(xx,yy);}
      g.globalAlpha=1-ph;g.stroke();
    }
    g.restore();
    tag(g,'あつく なる',DX-96,DY-52,19,'#ffc2a0');
  }
}
function draw4(){
  const {g,w,h}=fit($('c4'));
  desk(g,w,h);

  const lv=s4lv();
  const go=S4.phase!=='yosou';
  group4(g,250,'bulb',lv.b,go?Math.min(S4.t,T_BULB):0,go&&lv.b>0);
  group4(g,750,'led', lv.l,go?Math.min(S4.t,T_LED):0, go&&lv.l>0);
  g.save();g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=2;g.setLineDash([9,9]);

}

/* ========================= きりかえ ========================= */
let step=1, dirty=true, last=0;
function step1(dt){
  const a=s1amt();
  S1.t+=dt;
  if(Math.abs(a)<0.03)return false;
  S1.ang+=dt*TAU*a*1.1;
  S1.mang+=dt*TAU*a*2.4;
  S1.phase+=dt*(60+150*Math.abs(a));
  return true;
}
function show(n){
  step=n;
  [...document.querySelectorAll('.stage')].forEach((el,i)=>el.classList.toggle('on',i===n-1));
  [...document.querySelectorAll('.tab')].forEach(b=>b.classList.toggle('on',Number(b.dataset.s)===n));
  sound3();
  dirty=true;
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;show(Number(b.dataset.s));
});
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  let anim=false;
  try{
    if(step===1)anim=step1(dt);
    if(step===2)anim=step2(dt);
    if(step===3)anim=step3(dt);
    if(step===4)anim=step4(dt);
    if(step===5)anim=step5(dt);
  }catch(err){console.error(err);}
  if(dirty||anim){
    dirty=false;
    try{
