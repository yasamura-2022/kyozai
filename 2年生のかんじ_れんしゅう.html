  :root{
    --paper:#fdf8ef; --ink:#3a3226; --line:#e6dcc8;
    --sun:#f6b23c; --sun-d:#e0921a; --leaf:#6fa96a; --leaf-d:#4f8a4b;
    --sky:#7cb6d6; --coral:#e8836b; --shadow:rgba(90,70,40,.14);
    --guide:#d9cdb3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #fff3da 0%, transparent 40%),
      radial-gradient(circle at 85% 92%, #eaf3ea 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
    overflow-x:hidden;
  }
  /* header */
  header{
    display:flex; align-items:center; gap:.6rem;
    padding:.7rem 1rem .5rem; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:.5rem; font-weight:800; font-size:1.25rem;}
  .owl{width:2.6rem; height:2.6rem; flex:none;}
  .stamps{
    margin-left:auto; display:flex; align-items:center; gap:.35rem;
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:.3rem .8rem; box-shadow:0 2px 0 var(--shadow); font-weight:700;
  }
  .stamps .star{color:var(--sun-d); font-size:1.1rem;}

  /* 練習モード: 画面高に固定してスクロールさせず、ボタンが必ず見えるようにする */
  /* iOS Safari対策: JSで実測した高さ --appvh を使う(dvhだけでは不確実) */
  body.practice-mode{ height:var(--appvh, 100dvh); min-height:0; overflow:hidden; }
  body.practice-mode header{ display:none; }
  body.practice-mode .wrap{
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding:.4rem 1rem calc(1.4rem + env(safe-area-inset-bottom));
  }
  body.practice-mode #selectScreen{ display:none; }
  body.practice-mode .practice.on{
    flex:1; min-height:0; width:100%;
  }
  /* pick screen */
  .wrap{flex:1; padding:.4rem 1rem 1.4rem; width:100%; max-width:760px; margin:0 auto;}
  .filters{display:flex; gap:.5rem; margin:.3rem 0 .9rem; flex-wrap:wrap;}
  .chip{
    border:2px solid var(--line); background:#fff; color:var(--ink);
    padding:.4rem .95rem; border-radius:999px; font-weight:700; font-size:.95rem;
    cursor:pointer; transition:.15s;
  }
  .chip.on{background:var(--sun); border-color:var(--sun-d); color:#4a3410;}
  .chip.toggle{margin-left:auto; border-style:dashed;}
  .chip.toggle.on{background:var(--leaf); border-color:var(--leaf-d); border-style:solid; color:#fff;}
  .progressline{
    font-weight:700; font-size:.9rem; color:#8a7c63; margin:0 0 .7rem;
    display:flex; align-items:center; gap:.5rem;
  }
  .progressline .bar{
    flex:1; height:.7rem; background:#efe6d3; border-radius:999px; overflow:hidden; max-width:240px;
  }
  .progressline .bar>i{display:block; height:100%; background:var(--leaf); border-radius:999px; transition:width .3s;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:.7rem;
  }
  .card{
    background:#fff; border:2px solid var(--line); border-radius:18px;
    padding:.7rem .4rem .55rem; text-align:center; cursor:pointer;
    box-shadow:0 3px 0 var(--shadow); transition:transform .12s;
    position:relative;
  }
  .card:active{transform:translateY(2px);}
  .card .k{
    font-size:2.5rem; line-height:1; font-weight:600;
    font-family:"KleeKanji","UD Digi Kyokasho NP-R","游教科書体",
      "Hiragino Mincho ProN","ヒラギノ明朝 ProN",serif;
  }
  .card .ex{font-size:.72rem; color:#8a7c63; margin-top:.35rem;}
  .card .g{position:absolute; top:.4rem; left:.4rem; font-size:.6rem; font-weight:800;
    background:var(--sky); color:#fff; border-radius:999px; padding:.1rem .4rem;}
  .card.done{
    background:#eefae9; border-color:var(--leaf);
    box-shadow:0 3px 0 rgba(79,138,75,.35);
  }
  .card.done .k{color:var(--leaf-d);}
  .card.done::after{content:"⭐"; position:absolute; top:.3rem; right:.4rem; font-size:1.05rem;}
  .card .pass{display:none;}
  .card.done .pass{
    display:block; margin-top:.3rem; font-size:.62rem; font-weight:800;
    color:#fff; background:var(--leaf); border-radius:999px; padding:.08rem 0;
  }
  /* practice screen */
  .practice{display:none; flex-direction:column; align-items:center;}
  .practice.on{display:flex;}
  .pbar{width:100%; display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; flex-wrap:wrap;}
  .back{border:none; background:#fff; border:2px solid var(--line); border-radius:12px;
    padding:.4rem .8rem; font-weight:700; cursor:pointer; box-shadow:0 2px 0 var(--shadow); flex:none;}
  .info{font-weight:700; flex:none;}
  .info .yomi{font-size:.85rem; color:#8a7c63; font-weight:600; margin-left:.4rem;}
  .info .kaku{
    font-size:.8rem; font-weight:800; color:#4a3410; margin-left:.5rem;
    background:var(--sun); border:2px solid var(--sun-d); border-radius:999px;
    padding:.05rem .55rem; white-space:nowrap; vertical-align:middle;
  }
  .steps{margin-left:auto; display:flex; gap:.3rem; flex:none;}
  .dot{width:.9rem; height:.9rem; border-radius:50%; background:var(--line);}
  .dot.on{background:var(--sun);}
  .dot.done{background:var(--leaf);}
  .stagelabel{
    font-weight:800; font-size:.9rem; margin:0;
    padding:.3rem .8rem; border-radius:999px; background:#fff; border:2px dashed var(--guide);
    white-space:nowrap;
  }
  .jukubox{
    display:flex; flex-wrap:wrap; gap:.35rem; justify-content:center;
    margin:0;
  }
  .jukubox .word{
    background:#fff; border:2px solid var(--line); border-radius:12px;
    padding:.25rem .55rem; box-shadow:0 2px 0 var(--shadow); text-align:center; line-height:1.1;
  }
  .jukubox .word .rb{display:block; font-size:.58rem; color:#a48c62; font-weight:700;}
  .jukubox .word .kj{font-size:1.05rem; font-weight:800;}
  .pbar2{width:100%; display:flex; align-items:center; gap:.5rem; margin:.1rem 0 .3rem;}
  .canvas-box{
    position:relative;
    width:min(88vw, 420px, var(--canvas-max, 420px));
    aspect-ratio:1/1;
    background:#fff; border-radius:22px; box-shadow:0 4px 0 var(--shadow);
    border:3px solid var(--line); touch-action:none;
  }
  /* 練習モードでは、残りの縦スペースに収まる正方形にする */
  body.practice-mode .pbar,
  body.practice-mode .pbar2,
  body.practice-mode .stagelabel,
  body.practice-mode .jukubox,
  body.practice-mode .tools{ flex:none; }
  body.practice-mode .canvas-wrap{
    flex:1; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    margin:.3rem 0;
  }
  body.practice-mode .canvas-box{
    /* 一辺はJSで算出して --side に設定 */
    width:var(--side, 300px);
    height:var(--side, 300px);
    aspect-ratio:auto;
    margin:0;
  }
  .canvas-box svg, .canvas-box canvas{position:absolute; inset:0; width:100%; height:100%; border-radius:22px;}
  #guides{pointer-events:none;}
  #model{pointer-events:none;}
  #ink{z-index:3;}
  .tools{display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap; justify-content:center;}
  .btn{
    border:none; border-radius:14px; padding:.65rem 1.1rem; font-weight:800; font-size:1rem;
    cursor:pointer; box-shadow:0 3px 0 var(--shadow); transition:transform .1s;
  }
  .btn:active{transform:translateY(2px);}
  .btn.play{background:var(--sky); color:#fff;}
  .btn.clear{background:#fff; border:2px solid var(--line); color:var(--ink); box-shadow:0 3px 0 var(--shadow);}
  .btn.check{background:var(--leaf); color:#fff;}
  .btn.next{background:var(--sun); color:#4a3410;}
  .msg{min-height:1.6rem; margin-top:.6rem; font-weight:800; font-size:1.1rem; text-align:center;}
  .toast{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.85);
    background:rgba(255,255,255,.96); border-radius:18px; padding:.9rem 1.3rem;
    font-weight:800; font-size:1.15rem; text-align:center; line-height:1.35;
    box-shadow:0 6px 20px rgba(90,70,40,.28); border:3px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    z-index:6; max-width:82%;
  }
  .toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .toast.good{border-color:var(--leaf); color:var(--leaf-d);}
  .toast.hint{border-color:var(--coral); color:var(--coral);}
  .toast .em{display:block; font-size:2rem; margin-bottom:.15rem;}
  .msg.good{color:var(--leaf-d);}
  .msg.hint{color:var(--coral);}
  /* celebrate */
  .pop{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(58,50,38,.35); z-index:50;
  }
  .pop.on{display:flex;}
  .pop .box{
    background:#fff; border-radius:24px; padding:1.6rem 2rem; text-align:center;
    box-shadow:0 8px 0 var(--shadow); animation:pop .35s;
  }
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .pop .big{font-size:3rem;}
  .pop .t{font-weight:800; font-size:1.3rem; margin:.4rem 0 .9rem;}
  footer{text-align:center; font-size:.68rem; color:#b3a888; padding:.6rem;}
</style>

// ---- 状態の保存 ----
const store = {
  get(){ try{return JSON.parse(localStorage.getItem('kanji_prog_g2')||'{}');}catch(e){return{};} },
  set(o){ try{localStorage.setItem('kanji_prog_g2',JSON.stringify(o));}catch(e){} }
};
let prog = store.get();
function totalStamps(){ return Object.values(prog).reduce((a,b)=>a+(b||0),0); }
function refreshStamps(){ document.getElementById('stampCount').textContent = totalStamps(); }

// ---- 一覧 ----
const grid = document.getElementById('grid');
let remainOnly=false;
function renderGrid(){
  grid.innerHTML='';
  let shown=0, done=0, visible=0;
  KANJI.forEach((k,i)=>{
    const isDone=(prog[k.char]||0)>0;
    shown++; if(isDone) done++;
    if(remainOnly && isDone) return;      // 練習がまだの漢字だけ表示
    visible++;
    const c=document.createElement('div');
    c.className='card'+(isDone?' done':'');
    c.innerHTML=`<span class="g">2年</span><div class="k">${k.char}</div><div class="ex">${k.example||k.yomi}</div><div class="pass">ごうかく</div>`;
    c.onclick=()=>openPractice(i);
    grid.appendChild(c);
  });
  const pl=document.getElementById('progressLine');
  if(pl){
    const pct = shown? Math.round(done/shown*100):0;
    pl.innerHTML=`<span>⭐ 2年生：${done} / ${shown} 字</span><span class="bar"><i style="width:${pct}%"></i></span>`;
  }
  // 全部合格して「練習がまだの漢字」表示が空になったときの案内
  if(remainOnly && visible===0){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:1.5rem;font-weight:800;color:var(--leaf-d)">🎉 ぜんぶ ごうかく！すごい！</div>`;
  }
}
document.getElementById('remainBtn').onclick=function(){
  remainOnly=!remainOnly;
  this.classList.toggle('on', remainOnly);
  renderGrid();
};

// ---- 練習画面 ----
const selectScreen=document.getElementById('selectScreen');
const practiceScreen=document.getElementById('practiceScreen');
const guides=document.getElementById('guides');
const model=document.getElementById('model');
const ink=document.getElementById('ink');
const ctx=ink.getContext('2d');
const toast=document.getElementById('toast');
const stageLabel=document.getElementById('stageLabel');

let toastTimer=null;
function showToast(text, kind, emoji){
  if(toastTimer){clearTimeout(toastTimer);}
  toast.className='toast show'+(kind?' '+kind:'');
  toast.innerHTML=(emoji?`<span class="em">${emoji}</span>`:'')+text;
  toastTimer=setTimeout(hideToast, 2600);
}
function hideToast(){ toast.className='toast'; }

let cur=0;      // 現在の漢字index
let stage=0;    // 0=見本アニメ 1=なぞり 2=自力
let animGen=0;  // 書き順アニメの世代(古いアニメの描画を打ち切るため)

const STAGES=[
  {label:'① かきじゅんを みてみよう', modelOpacity:0},
  {label:'② うすい おてほんを なぞろう', modelOpacity:0.38},
  {label:'③ じぶんで かいてみよう', modelOpacity:0.0}
];

function setupGuides(){
  guides.innerHTML=`
    <rect x="2" y="2" width="105" height="105" rx="8" fill="none" stroke="#eee4d0" stroke-width="1.5"/>
    <line x1="54.5" y1="4" x2="54.5" y2="105" stroke="#e9dfca" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="4" y1="54.5" x2="105" y2="54.5" stroke="#e9dfca" stroke-width="1" stroke-dasharray="4 4"/>`;
}

function drawModel(opacity){
  const k=KANJI[cur];
  let paths=k.strokes.map(d=>`<path d="${d}" fill="none" stroke="#9a9a9a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  model.innerHTML=paths;
  model.style.opacity=opacity;
}

function openPractice(i){
  cur=i; stage=0;
  document.body.classList.add('practice-mode');
  setAppHeight();
  practiceScreen.classList.add('on');
  const k=KANJI[i];
  document.getElementById('pKanji').textContent=k.char;
  document.getElementById('pYomi').textContent = k.example ? (k.yomi+' ／ '+k.example) : k.yomi;
  document.getElementById('pKaku').textContent = 'ぜんぶで '+k.strokes.length+'かく';
  renderJukugo(k);
  setupGuides();
  // practice-mode適用でレイアウトが確定するのを待ってから測定(二重rAF)
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ sizeCanvas(); gotoStage(0); }));
}
function renderJukugo(k){
  const box=document.getElementById('jukuBox');
  box.innerHTML='';
  (k.juku||[]).forEach(j=>{
    // 対象の字を色付き強調
    const kanjiHtml=[...j.w].map(c=> c===k.char ? `<span style="color:var(--sun-d)">${c}</span>` : c).join('');
    const el=document.createElement('div');
    el.className='word';
    el.innerHTML=`<span class="rb">${j.r||''}</span><span class="kj">${kanjiHtml}</span>`;
    box.appendChild(el);
  });
}
function backToSelect(){
  animGen++;   // 進行中の書き順アニメを止める
  document.body.classList.remove('practice-mode');
  practiceScreen.classList.remove('on');
  renderGrid(); refreshStamps();
}
document.getElementById('backBtn').onclick=backToSelect;

function gotoStage(s){
  animGen++;   // 進行中の書き順アニメを止める
  stage=s;
  stageLabel.textContent=STAGES[s].label;
  drawModel(STAGES[s].modelOpacity);
  clearInk();
  ['d0','d1','d2'].forEach((id,idx)=>{
    const d=document.getElementById(id);
    d.className='dot'+(idx<s?' done':(idx===s?' on':''));
  });
  hideToast();
  // 見本ステージでは自動でアニメ再生(画面を離れたら発火しない)
  if(s===0){
    const g=animGen;
    setTimeout(()=>{ if(g===animGen) playStrokeOrder(); },350);
  }
}

// ---- 書き順ばんごう(お手本に ①②③… を つける) ----
function addStrokeNumbers(){
  const k=KANJI[cur];
  const ns='http://www.w3.org/2000/svg';
  // 画数が多い字は番号を小さめにして重なりを ゆるめる
  const many=k.strokes.length>=12;
  const r=many?5.2:6.5, fs=many?6.4:8;
  k.strokes.forEach((d,i)=>{
    // 各画の書き始め(パス長0の点)を109座標系で測る
    const tmp=document.createElementNS(ns,'path'); tmp.setAttribute('d',d);
    model.appendChild(tmp);
    let sp; try{ sp=tmp.getPointAtLength(0); }catch(e){ sp={x:0,y:0}; }
    model.removeChild(tmp);
    const g=document.createElementNS(ns,'g'); g.setAttribute('class','snum');
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',sp.x); c.setAttribute('cy',sp.y); c.setAttribute('r',r);
    c.setAttribute('fill','#e0921a'); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.1');
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',sp.x); t.setAttribute('y',sp.y);
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size',fs); t.setAttribute('font-weight','700'); t.setAttribute('fill','#fff');
    t.setAttribute('font-family','sans-serif');
    t.textContent=(i+1);
    g.appendChild(c); g.appendChild(t);
    model.appendChild(g);   // 画の上に番号がのるよう最後に足す
  });
}

// ---- 書き順アニメ ----
function playStrokeOrder(){
  const myGen=++animGen;   // これより古いアニメはすべて無効化
  const k=KANJI[cur];
  model.innerHTML='';
  model.style.opacity=1;
  const ns='http://www.w3.org/2000/svg';
  let idx=0;
  function nextStroke(){
    if(myGen!==animGen) return;   // 中断された古いアニメは描かない
    if(idx>=k.strokes.length){
      // アニメ完成後、ステージに応じた見え方に戻す
      setTimeout(()=>{
        if(myGen!==animGen) return;
        if(stage===0){ model.style.opacity=0.9; addStrokeNumbers(); }
        else { drawModel(STAGES[stage].modelOpacity); }
      },300);
      return;
    }
    const p=document.createElementNS(ns,'path');
    p.setAttribute('d',k.strokes[idx]);
    p.setAttribute('fill','none');
    p.setAttribute('stroke','#e0921a');
    p.setAttribute('stroke-width','5');
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('stroke-linejoin','round');
    model.appendChild(p);
    const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    p.style.transition='none';
    p.getBoundingClientRect();
    const dur=Math.max(350,len*14);
    p.style.transition=`stroke-dashoffset ${dur}ms linear`;
    p.style.strokeDashoffset=0;
    // 描き終えた画は黒っぽく残す
    setTimeout(()=>{
      if(myGen!==animGen) return;
      p.setAttribute('stroke','#3a3226'); p.setAttribute('stroke-width','4');
    },dur);
    idx++;
    setTimeout(nextStroke,dur+250);
  }
  nextStroke();
}
document.getElementById('playBtn').onclick=playStrokeOrder;

// ---- 手書きキャンバス ----
let dpr=1;
function setAppHeight(){
  // iOS Safariの実効表示高さを測ってCSSに反映(ツールバー変動に追従)
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--appvh', h+'px');
}
function computeSide(){
  const wrap=document.querySelector('.canvas-wrap');
  if(!wrap) return;
  const r=wrap.getBoundingClientRect();
  // 利用可能な幅と高さの短い辺を一辺に。画面幅の88%と420pxも上限に。
  const avail = Math.min(r.width, r.height);
  const side=Math.max(200, Math.min(avail>0?avail:300, window.innerWidth*0.88, 420));
  document.documentElement.style.setProperty('--side', Math.floor(side)+'px');
}
function sizeCanvas(){
  setAppHeight();
  computeSide();
  const box=document.getElementById('cbox');
  const r=box.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  ink.width=Math.round(r.width*dpr); ink.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#1f6fd6'; ctx.lineWidth=9;
}
function relayout(){
  if(!document.body.classList.contains('practice-mode')) return;
  requestAnimationFrame(()=>{
    const oldW=ink.getBoundingClientRect().width;
    sizeCanvas();
    const newW=ink.getBoundingClientRect().width;
    // 画面サイズが変わったら、書いた線も同じ比率で拡大縮小して位置ズレを防ぐ
    if(oldW>0 && newW>0 && Math.abs(newW-oldW)>0.5){
      const f=newW/oldW;
      strokes.forEach(s=>s.forEach(p=>{ p.x*=f; p.y*=f; }));
    }
    redraw();
    if(typeof drawModel==='function'){ drawModel(STAGES[stage].modelOpacity); }
  });
}
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', ()=>{ setTimeout(relayout, 250); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize', relayout); }

let drawing=false, strokes=[], curStroke=[];
function pos(e){
  const r=ink.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function start(e){ e.preventDefault(); drawing=true; curStroke=[pos(e)]; }
function move(e){
  if(!drawing)return; e.preventDefault();
  const p=pos(e); curStroke.push(p);
  const n=curStroke.length;
  if(n>=2){ ctx.beginPath(); ctx.moveTo(curStroke[n-2].x,curStroke[n-2].y); ctx.lineTo(p.x,p.y); ctx.stroke(); }
}
function end(e){ if(!drawing)return; drawing=false; if(curStroke.length)strokes.push(curStroke); curStroke=[]; }
ink.addEventListener('mousedown',start); ink.addEventListener('mousemove',move);
window.addEventListener('mouseup',end);
ink.addEventListener('touchstart',start,{passive:false});
ink.addEventListener('touchmove',move,{passive:false});
ink.addEventListener('touchend',end);
function clearCanvas(){
  // 変形(dpr)が掛かった状態でも確実に全面を消すため、一時的に等倍へ戻す
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,ink.width,ink.height); ctx.restore();
}
function redraw(){
  clearCanvas();
  strokes.forEach(s=>{ for(let i=1;i<s.length;i++){ctx.beginPath();ctx.moveTo(s[i-1].x,s[i-1].y);ctx.lineTo(s[i].x,s[i].y);ctx.stroke();} });
}
function clearInk(){ strokes=[]; curStroke=[]; clearCanvas(); }
document.getElementById('clearBtn').onclick=()=>{ clearInk(); hideToast(); };

// ---- おまけ簡易判定 ----
// 見本の各ストロークの点を109座標系→canvas座標に変換し、
// 「書いた線が各見本ストロークの近くを通ったか」をゆるく照合(甘め)。
function samplePath(d,n){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  const p=document.createElementNS(ns,'path'); p.setAttribute('d',d);
  svg.appendChild(p); document.body.appendChild(svg);
  const L=p.getTotalLength(); const pts=[];
  for(let i=0;i<=n;i++){ const pt=p.getPointAtLength(L*i/n); pts.push({x:pt.x,y:pt.y}); }
  document.body.removeChild(svg);
  return pts;
}
function checkWriting(){
  const box=document.getElementById('cbox').getBoundingClientRect();
  const scale=box.width/109; // 109座標→px
  if(strokes.length===0){ showToast('まだ かいてないみたい。<br>かいてみよう！','hint','✏️'); return; }
  // 書いた全点
  const allInk=[]; strokes.forEach(s=>s.forEach(p=>allInk.push(p)));
  const k=KANJI[cur];
  // 見本の各ストローク中点付近を、書いた線が通ったか
  let covered=0;
  k.strokes.forEach(d=>{
    const mpts=samplePath(d,6).map(p=>({x:p.x*scale,y:p.y*scale}));
    const hit=mpts.some(mp=> allInk.some(ip=>{
      const dx=ip.x-mp.x, dy=ip.y-mp.y; return dx*dx+dy*dy < (box.width*0.13)**2;
    }));
    if(hit) covered++;
  });
  const ratio=covered/k.strokes.length;
  // 画数の目安(甘め): 書いた線が少なすぎないか
  const enough = strokes.length >= Math.max(2, Math.ceil(k.strokes.length*0.4));
  if(ratio>=0.7 && enough){
    showToast('いいかたち！<br>おてほんに ちかいよ','good','⭕');
  }else if(ratio>=0.45){
    showToast('おしい！ もう少し<br>おてほんに あわせてみよう','hint','💪');
  }else{
    showToast('がんばろう！<br>▶かきじゅん を見てもう一回','hint','🔍');
  }
}
document.getElementById('checkBtn').onclick=checkWriting;

// ---- できた！(自己申告) ----
document.getElementById('doneBtn').onclick=()=>{
  if(stage<2){
    // 次の段階へ
    celebrate(stage);
  }else{
    // 完了 → スタンプ付与
    prog[KANJI[cur].char]=(prog[KANJI[cur].char]||0)+1;
    store.set(prog); refreshStamps();
    celebrate(2);
  }
};

const pop=document.getElementById('pop');
const popEmoji=document.getElementById('popEmoji');
const popText=document.getElementById('popText');
function celebrate(fromStage){
  if(fromStage<2){
    popEmoji.textContent='👍';
    popText.textContent = fromStage===0 ? 'かきじゅん バッチリ！つぎは なぞろう' : 'なぞり かんぺき！つぎは じぶんで';
    document.getElementById('popBtn').textContent='つぎへ';
    pop.dataset.act='stage';
  }else{
    popEmoji.textContent='⭐🎉⭐';
    popText.textContent='スタンプ ゲット！ よくできました！';
    document.getElementById('popBtn').textContent='いちらんに もどる';
    pop.dataset.act='finish';
  }
  pop.classList.add('on');
}
document.getElementById('popBtn').onclick=()=>{
  pop.classList.remove('on');
  if(pop.dataset.act==='stage'){ gotoStage(stage+1); }
  else{ backToSelect(); }
};

// init
renderGrid(); refreshStamps();
</script>
