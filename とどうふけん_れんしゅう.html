:root{
  --ink:#2b2118;--paper:#fdf6e3;--card:#fffdf7;--line:#e7d9b8;
  --gold:#c9a227;--gold-d:#a5811a;--ok:#5a8a4c;--ok-d:#446838;
  --blue:#2f6fa8;--blue-d:#224f7a;--sub:#a99a7c;--sub-d:#85795f;
  --red:#d0342c;--sea:#dcecf2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:'KleeTD',"UD Digi Kyokasho NP-R","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;font-weight:600;color:inherit;cursor:pointer;touch-action:manipulation}
ruby rt{font-size:.46em;letter-spacing:0}
body.nofuri ruby.nm rt{visibility:hidden}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px;gap:6px}
header{display:flex;align-items:center;gap:10px;flex:none}
h1{margin:0;font-size:24px;white-space:nowrap;line-height:1.1}
.tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{flex:1;min-width:0;border:2px solid var(--line);background:#f6eedb;border-radius:12px;padding:6px 4px;font-size:16px;line-height:1.15;
  color:#7a6a52;white-space:nowrap;overflow:hidden}
.tab .no{font-size:12px;display:block;opacity:.8}
.tab.on{color:var(--ink);border-color:var(--gold);background:var(--card);box-shadow:0 3px 0 var(--gold-d)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;flex:none}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:3px 8px;font-size:15px;line-height:1.1;min-height:38px}
.chip.on{background:#fbefc6;border-color:var(--gold);box-shadow:0 2px 0 var(--gold-d)}
.bar .lab{font-size:13px;color:#7a6a52}

#main{flex:1;min-height:0;display:flex;gap:10px}
#mapcard{flex:1 1 auto;min-width:0;min-height:0;position:relative;background:var(--sea);border:2px solid var(--line);border-radius:16px;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#back{position:absolute;left:8px;top:8px;display:none}
#credit{position:absolute;right:8px;bottom:4px;font-size:10px;color:#6f8791;pointer-events:none}
#side{flex:0 0 clamp(290px,33vw,400px);min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
#qbox,#msg,.hint,#pickNote{word-break:keep-all;overflow-wrap:anywhere}
#qbox{font-size:clamp(18px,2.6vmin,26px);line-height:1.55;flex:none}
#qbox .big{font-size:1.25em}
#hints{flex:none;display:none;flex-direction:column;gap:4px}
.hint{font-size:clamp(15px,2.1vmin,20px);line-height:1.55;background:#fbf4e2;border-radius:10px;padding:3px 10px 3px 2.1em;text-indent:-1.5em}
.hint .n{display:inline-block;width:1.5em;text-indent:0;color:var(--gold-d)}
.hint.new{animation:pop .35s ease}
@keyframes pop{from{background:#fbe39a}to{background:#fbf4e2}}
#choices{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;max-height:min(300px,40vh)}
.opt{border:2px solid var(--line);border-radius:14px;background:#fff;font-size:clamp(20px,3.4vmin,32px);line-height:1.2;padding:2px 4px;box-shadow:0 3px 0 #d9ccae;min-height:52px}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.ng{background:#eef1f5;color:#8b95a3;border-color:#c5cfdb;box-shadow:none;border-style:dashed}
.opt.ok{background:#fbefc6;border-color:var(--gold);box-shadow:0 3px 0 var(--gold-d)}
.opt:disabled{cursor:default}
#pick{display:none;flex:1 1 auto;min-height:0;flex-direction:column;justify-content:center;gap:8px}
#pickNote{font-size:clamp(15px,2.1vmin,19px);line-height:1.5;color:#6b5c45;text-align:center}
#msg{flex:none;min-height:2.9em;font-size:clamp(16px,2.3vmin,22px);line-height:1.45;text-align:center}
#msg .good{color:var(--gold-d);font-size:1.15em}
#msg .bl{color:var(--blue)}
.btn{border:0;border-radius:14px;color:#fff;font-size:clamp(18px,2.5vmin,23px);padding:10px 14px;min-height:50px;width:100%}
.btn:active{transform:translateY(2px)}
.btn.play{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.show{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.btn.next{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.sub{background:var(--sub);box-shadow:0 4px 0 var(--sub-d);width:auto;min-height:40px;padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.45;box-shadow:none}
#more{flex:none;display:none}
#next{flex:none;margin-top:auto}

/* 地図 */
.pf{stroke:#8c7e66;stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-hk{fill:#dfe7f7}.r-th{fill:#d4eaf2}.r-kt{fill:#f9e3c8}.r-cb{fill:#dcefd2}
.r-kk{fill:#f6efbf}.r-cg{fill:#e8def3}.r-sk{fill:#d3eee4}.r-ks{fill:#eee0cc}
.pf.out{fill:#efe9dc;opacity:.55}
.lake{fill:var(--sea);stroke:#8c7e66;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.inset{fill:none;stroke:#a89a7e;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
#fx *{pointer-events:none}
.ring{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* たて長 */
@media (orientation:portrait){
  #main{flex-direction:column}
  #mapcard{flex:1 1 auto}
  #side{flex:none}
  #choices{flex:none;grid-auto-rows:minmax(56px,auto)}
  #pick{flex:none}
}
@media (max-height:640px){
  #app{padding:5px 8px;gap:4px}
  h1{font-size:20px}
  .tab{padding:3px 4px;font-size:15px}
  .tab .no{display:none}
  .chip{min-height:34px;padding:2px 7px;font-size:14px}
  #side{padding:6px 10px;gap:5px}
  #msg{min-height:2.6em}
  .btn{min-height:44px;padding:6px 12px}
}
</style>
</head>

      <div id="msg"></div>

  </div>

/* ===== じゅんび ===== */
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const INFO={};PREF.forEach(p=>{INFO[p[0]]={c:p[0],n:p[1],y:p[2],o:p[3],cap:p[4],capy:p[5]}});
const ALL=PREF.map(p=>p[0]);
const REGOF={};REG.forEach(r=>r.c.forEach(c=>REGOF[c]=r));
const isDiff=c=>INFO[c].cap.replace(/市$/,'')!==INFO[c].n.replace(/[都道府県]$/,'');
const DIFF=ALL.filter(isDiff);
const OFFICE={'県':['県庁','けんちょう'],'都':['都庁','とちょう'],'道':['道庁','どうちょう'],'府':['府庁','ふちょう']};
function rb(k,y,cls){return `<ruby class="${cls||''}">${k}<rt>${y}</rt></ruby>`}
const nm=c=>rb(INFO[c].n,INFO[c].y,'nm');
const capnm=c=>rb(INFO[c].cap,INFO[c].capy,'nm');
const office=c=>{const o=OFFICE[INFO[c].o];return rb(o[0]+'所在地',o[1]+'しょざいち','nm')};
const mk=s=>s.replace(/\{([^|}]+)\|([^}]+)\}/g,(m,a,b)=>rb(a,b)).replace(/(県)/g,(m)=>m);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function dist(a,b){const A=G.P[a],B=G.P[b];return Math.hypot(A.lx-B.lx,A.ly-B.ly)}

/* ===== 地図 ===== */
const svg=$('map');
el('rect',{x:-3000,y:-3000,width:7000,height:7000,fill:'#dcecf2'},svg);
const gBase=el('g',{},svg);
const I=G.inset;
el('rect',{x:I[0],y:I[1],width:I[2]-I[0],height:I[3]-I[1],rx:4,class:'inset'},gBase);
const PATH={};
ALL.forEach(c=>{PATH[c]=el('path',{d:G.P[c].d,class:'pf r-'+REGOF[c].k,'data-c':c},gBase)});
el('path',{d:G.biwa,class:'lake'},gBase);
const gFx=el('g',{id:'fx'},svg);

function boxOf(cs){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;cs.forEach(c=>{const b=G.P[c].mb;x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])});
  if(cs.includes(47)){x0=Math.min(x0,I[0]);y0=Math.min(y0,I[1]);x1=Math.max(x1,I[2]);y1=Math.max(y1,I[3])}
  return [x0,y0,x1-x0,y1-y0]}
function pad(b,f,min){const p=Math.max(min||0,Math.max(b[2],b[3])*f);return [b[0]-p,b[1]-p,b[2]+2*p,b[3]+2*p]}
const FULL=pad(boxOf(ALL),.012);
const regBox=k=>pad(boxOf(REG.find(r=>r.k===k).c),.1,14);
let VB=FULL.slice(),TGT=FULL.slice(),anim=null;
function fitBox(b){const r=svg.getBoundingClientRect();const ca=(r.width||4)/(r.height||3);let[x,y,w,h]=b;
  if(w/h<ca){const nw=h*ca;x-=(nw-w)/2;w=nw}else{const nh=w/ca;y-=(nh-h)/2;h=nh}return [x,y,w,h]}
function setVB(b){svg.setAttribute('viewBox',b.map(v=>v.toFixed(2)).join(' '))}
function upp(){const r=svg.getBoundingClientRect();return TGT[2]/(r.width||1)}
function goView(box,animate){const t=fitBox(box);TGT=t;if(anim)cancelAnimationFrame(anim);
  if(!animate){VB=t;setVB(VB);return}
  const s=VB.slice(),t0=performance.now(),D=380;
  const step=now=>{let k=Math.min(1,(now-t0)/D);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;VB=s.map((v,i)=>v+(t[i]-v)*k);setVB(VB);if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
function viewBoxNow(){
  if(S.tab===2&&S.pick==='map'&&S.zoom)return regBox(S.zoom);
  return S.range==='all'?FULL:regBox(S.range)}

/* ===== ようす ===== */
const S={tab:0,range:'all',capDiff:false,pick:'choice',zoom:null,furi:true,q:[null,null,null],decks:{},last:[0,0,0],streak:0,guard:0};

function poolFor(t){let cs=S.range==='all'?ALL:REG.find(r=>r.k===S.range).c;if(t===1&&S.capDiff)cs=cs.filter(isDiff);return cs.length?cs:ALL}
function deckKey(t){return t+'|'+S.range+'|'+(t===1&&S.capDiff?1:0)}
function draw(t){const key=deckKey(t);let d=S.decks[key],round=false;
  if(!d||!d.length){if(d)round=true;d=shuffle(poolFor(t).slice());if(d.length>1&&d[d.length-1]===S.last[t]){[d[0],d[d.length-1]]=[d[d.length-1],d[0]]}S.decks[key]=d}
  const c=d.pop();S.last[t]=c;return {c,round}}
function requeue(t,c){const d=S.decks[deckKey(t)];if(!d||d.includes(c))return;d.splice(Math.max(0,d.length-3),0,c)}

function options(t,c){
  let base=(t===1&&S.capDiff)?DIFF:ALL;
  let cand;
  if(S.range!=='all'){const rc=REG.find(r=>r.k===S.range).c;
    cand=[...base.filter(x=>x!==c&&rc.includes(x)).sort((a,b)=>dist(a,c)-dist(b,c)),...base.filter(x=>x!==c&&!rc.includes(x)).sort((a,b)=>dist(a,c)-dist(b,c))];
    if(cand.length<3)cand=cand.concat(ALL.filter(x=>x!==c&&!cand.includes(x)).sort((a,b)=>dist(a,c)-dist(b,c)))
  }else{cand=base.filter(x=>x!==c).sort((a,b)=>dist(a,c)-dist(b,c))}
  const near=shuffle(cand.slice(0,4)).slice(0,2);
  const far=shuffle(cand.slice(4,10).filter(x=>!near.includes(x)));
  const o=[c,...near,far[0]||cand.find(x=>!near.includes(x))];
  return shuffle(o)}

function newQ(t){const {c,round}=draw(t);
  S.q[t]={c,opts:options(t,c),wrong:[],done:false,first:true,hintN:1,sel:null,round};
  if(t===2)S.zoom=null}

/* ===== 画面 ===== */
function render(anim){
  const t=S.tab,q=S.q[t];
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));
  $('capMode').style.display=t===1?'':'none';
  $('pickMode').style.display=t===2?'':'none';
  document.body.classList.toggle('nofuri',!S.furi);
  // 範囲の外は うすく
  const rc=S.range==='all'?null:REG.find(r=>r.k===S.range).c;
  ALL.forEach(c=>PATH[c].classList.toggle('out',!!rc&&!rc.includes(c)));
  // 問い
  if(t===0)$('qbox').innerHTML='<b style="color:var(--red)">あかい</b> '+rb('県','けん')+'の なまえは？';
  else if(t===1)$('qbox').innerHTML='<span class="big">'+nm(q.c)+'</span>の<br><b>'+office(q.c)+'</b>は？　<span style="color:var(--red)">★</span>の ところ';
  else $('qbox').innerHTML='この とくちょうが ある <b>'+rb('県','けん')+'</b>は？';
  // とくちょう
  const hs=$('hints');
  if(t===2){hs.style.display='flex';const H=HINT[q.c];const n=q.done?4:q.hintN;
    hs.innerHTML=H.slice(0,n).map((h,i)=>`<div class="hint${i===n-1&&S.newHint?' new':''}"><span class="n">${'①②③④'[i]}</span>${mk(h)}</div>`).join('');
    S.newHint=false;
    $('more').style.display=n<4?'block':'none';$('more').disabled=q.done;
  }else{hs.style.display='none';$('more').style.display='none'}
  // こたえかた
  const useMap=t===2&&S.pick==='map';
  $('choices').style.display=useMap?'none':'grid';
  $('pick').style.display=useMap?'flex':'none';
  if(!useMap){
    $('choices').innerHTML=q.opts.map(o=>{const cls=o===q.c&&q.done?' ok':(q.wrong.includes(o)?' ng':'');
      return `<button class="opt${cls}" data-o="${o}"${q.done?' disabled':''}>${t===1?capnm(o):nm(o)}</button>`}).join('');
  }else{
    const zoomed=S.range!=='all'||S.zoom;
    $('pickNote').innerHTML=q.done?'':(!zoomed?'ちずの 中の、この あたりと おもう ところを おそう。<br>ちかくが おおきく なるよ':(q.sel?'えらんだ '+rb('県','けん')+'で よければ「こたえ」を おそう':'ちずで '+rb('県','けん')+'を ひとつ えらぼう'));
    const j=$('judge');j.disabled=q.done||!q.sel;
    
  }
  $('back').style.display=(useMap&&S.range==='all'&&S.zoom)?'block':'none';
  goView(viewBoxNow(),anim);
  drawFx();
}

function setMsg(h){$('msg').innerHTML=h}
function startMsg(){const q=S.q[S.tab];
  let h='';
  if(q.round){const r=S.range==='all'?'ぜんこくの':(REG.find(x=>x.k===S.range).n+'の');h='<span class="good">'+(S.range==='all'?'ぜんこく':rb(REG.find(x=>x.k===S.range).n+'地方',REG.find(x=>x.k===S.range).y+'ちほう'))+'を ひとまわり できたよ！ すごい！</span>';q.round=false}
  setMsg(h)}

/* 地図の しるし */
function star(cx,cy,r,p,fill,stroke,u){let pts='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;pts+=(cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2)+' '}
  return el('polygon',{points:pts,fill,stroke,'stroke-width':1.5*u,'stroke-linejoin':'round'},p)}
function label(x,y,html,u,color,size){const t=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':(size||18)*u,fill:color||'#2b2118',stroke:'#fffdf7','stroke-width':5*u,'paint-order':'stroke','stroke-linejoin':'round','font-family':"KleeTD,'Hiragino Maru Gothic ProN',sans-serif",'font-weight':600},gFx);t.textContent=html;return t}
function drawFx(){
  while(gFx.firstChild)gFx.removeChild(gFx.firstChild);
  const t=S.tab,q=S.q[t],u=upp();
  // えらんだが ちがった 県（あお）
  q.wrong.forEach(w=>{const P=G.P[w];
    el('path',{d:P.d,fill:'#c9d9ea',stroke:'#2f6fa8','stroke-width':2.2*u,'stroke-dasharray':(6*u)+' '+(4*u),'stroke-linejoin':'round'},gFx);
    if(t===1){star(P.cx,P.cy,9*u,gFx,'#2f6fa8','#fff',u);label(P.cx,P.cy-17*u,INFO[w].cap,u,'#224f7a',15)}
    else label(P.lx,P.ly,INFO[w].n,u,'#224f7a',15)});
  // ちずで えらんで いる 県
  if(t===2&&q.sel&&!q.done){el('path',{d:G.P[q.sel].d,fill:'#9fc0e2',stroke:'#2f6fa8','stroke-width':3*u,'stroke-linejoin':'round'},gFx)}
  // こたえの 県を うかびあがらせる
  const showT=t!==2||q.done;
  if(showT){const P=G.P[q.c],dx=-3*u,dy=-6*u;
    el('path',{d:P.d,fill:'rgba(60,40,20,.28)'},gFx);
    const g=el('g',{transform:`translate(${dx},${dy})`},gFx);
    el('path',{d:P.d,fill:'#f6b3a6',stroke:'#d0342c','stroke-width':3*u,'stroke-linejoin':'round'},g);
    const M=P.mb,bw=(M[2]-M[0])/u,bh=(M[3]-M[1])/u;
    if(bw<46&&bh<46){const cx=(M[0]+M[2])/2+dx,cy=(M[1]+M[3])/2+dy;
      const r=Math.max(Math.hypot(M[2]-M[0],M[3]-M[1])/2+7*u,24*u);
      el('circle',{cx,cy,r,fill:'none',stroke:'#d0342c','stroke-width':3*u,'stroke-dasharray':(7*u)+' '+(5*u),class:'ring'},gFx)}
    if(t===1){star(P.cx+dx,P.cy+dy,11*u,gFx,q.done?'#c9a227':'#d0342c','#fff',u);
      if(q.done)label(P.cx+dx,P.cy+dy-20*u,INFO[q.c].cap,u,'#2b2118',19)}
    else if(q.done)label(P.lx+dx,P.ly+dy,INFO[q.c].n,u,'#2b2118',19);
  }
}

/* ===== こたえる ===== */
function praise(q){if(q.first){S.streak++;return S.streak>=3&&S.streak%3===0?'すごい！':'よくできました！'}S.streak=0;return 'よくできました！'}
function correct(q){q.done=true;S.guard=Date.now();const t=S.tab;let h='<span class="good">'+praise(q)+'</span>';
  if(t===1){if(q.c===13)h+='<br>'+rb('都庁','とちょう')+'は '+rb('新宿区','しんじゅくく')+'に あるよ';
    else if(isDiff(q.c))h+='<br>'+rb('県','けん')+'の なまえと ちがう なまえだね'}
  if(t===2)h+='<br>'+nm(q.c)+'だよ';
  setMsg(h);render(false)}
function wrongAns(q,o){if(!q.wrong.includes(o))q.wrong.push(o);if(q.first)requeue(S.tab,q.c);q.first=false;S.streak=0;
  const t=S.tab;let h='もう一回！<br>';
  if(t===1)h+='<b>'+capnm(o)+'</b>は <span class="bl">あおい ★</span>の '+nm(o)+'だよ';
  else h+='<span class="bl">あおい ところ</span>が '+nm(o)+'だよ';
  setMsg(h);render(false)}
$('choices').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const q=S.q[S.tab];if(q.done)return;const o=+b.dataset.o;
  if(q.wrong.includes(o))return;
  if(o===q.c)correct(q);else wrongAns(q,o)});
$('more').addEventListener('click',()=>{const q=S.q[2];if(q.hintN<4){q.hintN++;S.newHint=true;render(false)}});
$('judge').addEventListener('click',()=>{const q=S.q[2];if(q.done||!q.sel)return;const s=q.sel;q.sel=null;if(s===q.c)correct(q);else wrongAns(q,s)});
$('next').addEventListener('click',()=>{if(Date.now()-S.guard<420)return;newQ(S.tab);startMsg();render(true)});
$('back').addEventListener('click',()=>{S.zoom=null;S.q[2].sel=null;render(true)});

// ちずを おす
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function nearest(p,maxd){let best=null,bd=1e9;ALL.forEach(c=>{const b=G.P[c].bb;const dx=Math.max(b[0]-p.x,0,p.x-b[2]),dy=Math.max(b[1]-p.y,0,p.y-b[3]);const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=c}});return bd<=maxd?best:null}
svg.addEventListener('click',e=>{
  if(!(S.tab===2&&S.pick==='map'))return;const q=S.q[2];if(q.done)return;
  let c=e.target.closest&&e.target.closest('[data-c]');c=c?+c.dataset.c:null;
  if(!c)c=nearest(svgPt(e),26*upp());
  if(!c)return;
  if(S.range==='all'&&!S.zoom){S.zoom=REGOF[c].k;setMsg('');render(true);return}
  q.sel=c;render(false)});

/* ===== せってい ===== */
$('range').innerHTML='<button class="chip on" data-v="all">ぜんこく</button>'+REG.map(r=>`<button class="chip" data-v="${r.k}">${rb(r.n,r.y)}</button>`).join('');
function seg(id,fn){$(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$(id).querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)})}
seg('range',v=>{S.range=v;S.zoom=null;[0,1,2].forEach(newQ);startMsg();render(true)});
seg('capMode',v=>{S.capDiff=v==='1';newQ(1);startMsg();render(true)});
seg('pickMode',v=>{S.pick=v;S.zoom=null;S.q[2].sel=null;render(true)});
seg('furi',v=>{S.furi=v==='1';render(false)});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=+b.dataset.t;S.zoom=null;if(S.q[S.tab].done){newQ(S.tab)}startMsg();render(true)});

let rsz=null;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>render(false),120)});

[0,1,2].forEach(newQ);startMsg();
requestAnimationFrame(()=>render(false));
</script>
</body>
