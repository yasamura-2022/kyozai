<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>水よう液の 性質と はたらき</title>
<style>
/* =========================================================
   水よう液の 性質と はたらき（6年 理科 A(2) 水溶液の性質）
   学習指導要領解説 理科編 p.78-80 より
   ・(ｱ)「水溶液には，酸性，アルカリ性及び中性のものがあること」
   ・(ｲ)「水溶液には，気体が溶けているものがあること」
   ・(ｳ)「水溶液には，金属を変化させるものがあること」
   ・「同じように無色透明な水溶液でも，溶けている物を取り出すと
     違った物が出てくることがある」
   ・「リトマス紙などを用いて調べることにより，酸性，アルカリ性，中性の
     三つの性質にまとめられることを捉える」
   ・「水溶液を振り動かしたり温めたりすると，気体を発生するものがある」
     「発生した気体は再び水に溶ける」
     「加熱すると，固体が溶けている場合と違って，何も残らないものがある」
   ・「金属が溶けた水溶液から溶けている物を取り出して調べると，
     元の金属とは違う新しい物ができていることがある」
   ・扱う対象「炭酸水，薄い塩酸，薄い水酸化ナトリウム水溶液」
     金属は「鉄やアルミニウムなど」
   ・「多面的に調べた結果を表に整理したり，そこから考えたことを
     図や絵，文を用いて表現したり」→ ⑤の 表が この アプリの 芯
   ・「薬品については，その危険性や扱い方について十分指導するとともに，
     保護眼鏡を使用するなど，安全に配慮する」
     「使用した廃液などについても，環境に配慮し適切に処理する」
     → 画面の いちばん下に つねに 出す。消さない こと

   入れない もの（中学校 第1分野「(2)ア(ｲ)水溶液」「(4)ア(ｲ)化学変化」）:
   ・pH の 数字。酸性・中性・アルカリ性の 3つだけ
   ・中和（酸と アルカリを まぜる）
   ・化学式・原子・分子・「塩化アルミニウム」などの 物質名
     →「元の 金属とは ちがう 新しい物」まで で 止める
   ・濃度（％・溶解度）

   このアプリは 実験の 代わりでは ない。
   ・実験の 前 … 予想を えらばないと 進めない
   ・実験の 後 … 結果が 表に たまり、⑤で 一つの 表に なる
   ・実験では 見にくい ところ（出てきた 物の 正体しらべ・気体が 再び とける）を 補う

   外部読み込みは なし。1ファイルで 動く。
   ========================================================= */
:root{
  --paper:#fdf6e3;
  --card:#fffdf7;
  --ink:#2b2118;
  --dim:#7a6a52;
  --line:#e7d9b8;
  --gold:#c9a227;      /* こたえ合わせ */
  --blue:#2f6fa8;      /* 同じ 画面の 中で すすむ */
  --ok:#5a8a4c;        /* べつの もんだいへ */
  --sub:#a99a7c;       /* もどる・やりなおす */
  --ng:#d34b4b;
  /* 性質の 色。ここを 変えると 表も 絵も 変わる */
  --acid:#cf5138;      /* 酸性 */
  --neut:#4f8a44;      /* 中性 */
  --alka:#3a6ea8;      /* アルカリ性 */
  --gas:#4b8fa8;       /* 気体が とけている */
  --solid:#96693f;     /* 固体が とけている */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* ドラッグ中に 字が 青く えらばれて しまうのを ふせぐ */
.ncard,.tbl div,.bar,.cards,header{-webkit-user-select:none;user-select:none;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  /* 外から フォントを 読まない。端末に 入って いる まるい 書体を 上から さがす */
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Klee One','BIZ UDPGothic','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
  background:var(--paper);color:var(--ink);font-weight:700;-webkit-text-size-adjust:100%;
}
#app{height:100%;display:flex;flex-direction:column;padding:7px 10px 6px;gap:5px;max-width:1240px;margin:0 auto;}

/* ---- 見出しと タブ ---- */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
h1{margin:0;font-size:clamp(14px,2vw,20px);letter-spacing:.04em;}
h1 .sub{color:#9a7c1e;font-size:.7em;margin-left:8px;}
nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.tab{
  font:inherit;font-size:clamp(10.5px,1.4vw,15px);color:var(--dim);
  background:#f6eed9;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;min-height:40px;cursor:pointer;
}
.tab.on{color:#3a2c05;background:#f5d97a;border-color:var(--gold);}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ---- ステージ ---- */
#main{flex:1;min-height:0;position:relative;}
.stage{position:absolute;inset:0;display:none;flex-direction:column;gap:5px;}
.stage.on{display:flex;}
/* たて長（iPad をたてに 持つ）の ときの 絵と 表の 分けまえ。
   1.35fr 1fr に して いたら ②④の 表が 1行 21px・字 9px に つぶれて 読めなかった。
   表が ある ステップは 表の ほうを 広く とる */
.cols{flex:1;min-height:0;display:grid;grid-template-rows:1.2fr 1fr;grid-template-columns:1fr;gap:5px;}
.cols.tall{grid-template-rows:1fr 1.32fr;}
@media (orientation:landscape) and (min-width:700px){
  .cols.two{grid-template-columns:1.32fr .68fr;grid-template-rows:1fr;}
  .cols.tall{grid-template-columns:1.22fr .78fr;grid-template-rows:1fr;}
}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;min-height:0;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.side{display:flex;flex-direction:column;gap:5px;min-height:0;}
.msg{
  /* display:flex に すると <b> や <span> が flex の 子に なり、
     語の とちゅうで 折り返す。block の まま 中央ぞろえに する */
  flex:0 0 auto;background:#f7f0dd;border:1px solid var(--line);border-radius:13px;
  padding:8px 11px;font-size:clamp(11.5px,1.5vw,16px);line-height:1.45;text-align:center;
  min-height:42px;display:block;
}
.msg b{color:#9a7c1e;}
.msg .ok{color:#3f7a33;}
.msg .ng{color:#b33c3c;}
.msg .ac{color:var(--acid);} .msg .nu{color:var(--neut);} .msg .al{color:var(--alka);}

/* ---- ボタン ---- */
.bar{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{
  font:inherit;font-size:clamp(11.5px,1.4vw,15px);color:#fff;border:none;border-radius:13px;
  padding:9px 14px;min-height:44px;cursor:pointer;background:#6a7f9b;
}
.btn:active{transform:scale(.97);}
.btn.play{background:var(--blue);}               /* 同じ 画面の 中で すすむ */
.btn.show{background:var(--gold);color:#3a2c05;} /* こたえ合わせ */
.btn.next{background:var(--ok);}                 /* べつの もんだいへ */
.btn.sub{background:var(--sub);}                 /* もどる・やりなおす */
.btn.ghost{background:#f6eed9;color:var(--dim);border:1px solid var(--line);}
.btn.ghost.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}
.btn[disabled]{opacity:.4;}

/* ---- 右の パネル ---- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:6px 7px;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden;
}
.panel .ttl{font-size:clamp(10px,1.2vw,13px);color:var(--dim);text-align:center;}

/* えらぶ ところを よこに ならべる。たてに 2段 つむと
   ④の「じっけんの すすみ方」が つぶれて 字が かさなる */
.segs{flex:0 0 auto;display:flex;flex-direction:row;gap:5px;}
.segs .panel{flex:1;min-width:0;}
/* 水よう液を えらぶ ボタン（①②④で 同じ 見た目） */
.liqs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.liq{
  font:inherit;font-size:clamp(9.5px,1.12vw,13px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:10px;padding:6px 2px;min-height:40px;
  cursor:pointer;line-height:1.15;
}
.liq.on{background:#f5d97a;color:#3a2c05;border-color:var(--gold);}

/* 表（①②⑤で 共通） */
/* 字の 大きさは よこ幅だけで 決めない。
   clamp(9px,1.08vw,13px) に して いたら、iPad の はば（768〜1194px）では
   計算値が 8〜13px に しかならず、たて長の 画面で ずっと 9px の まま だった。
   たて幅も 足して 決める。**vw だけに もどさない こと** */
.tbl{flex:1;min-height:0;display:grid;gap:3px;font-size:clamp(11px,calc(0.78vw + 0.72vh),16px);}
.tbl div{
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:8px;padding:2px 3px;line-height:1.2;overflow:hidden;
}
.tbl .h{background:#f1e6c8;color:#6a5a3a;font-size:.9em;}
.tbl .r{background:#f6eed9;color:#5a4a2a;font-size:.92em;}
.tbl .c{background:#fbf6e8;border:1px solid var(--line);color:#b9ad93;}
.tbl .c.on{background:#fff;border-color:#d9cba8;color:#4a3c22;}
.tbl .c.now{box-shadow:0 0 0 2px var(--blue) inset;}
/* .tbl .c.on と 同じ 重み。かならず その あとに 書く こと
   （前に 書くと 色が 消えて、性質の 色分けが 白く なる） */
.tbl .c.s-acid, .tbl .r.s-acid{background:#fbe9e4;border-color:var(--acid);color:var(--acid);}
.tbl .c.s-neut, .tbl .r.s-neut{background:#e8f1e5;border-color:var(--neut);color:var(--neut);}
.tbl .c.s-alka, .tbl .r.s-alka{background:#e4edf7;border-color:var(--alka);color:var(--alka);}
.tbl .c.s-gas,  .tbl .r.s-gas{background:#e3eff3;border-color:var(--gas);color:var(--gas);}
.tbl .c.s-solid,.tbl .r.s-solid{background:#f4ece3;border-color:var(--solid);color:var(--solid);}
/* 表の 見出しを おして 調べる（①）。ボタンを 下に 置くより 直感的
   ＝「どの らんを うめるか」を おす。2026-09-19 の 指摘 */
.tbl .h.test{
  cursor:pointer;background:var(--blue);color:#fff;
  flex-direction:column;gap:0;line-height:1.15;border:2px solid #24557f;
}
.tbl .h.test .tap{font-size:.76em;opacity:.9;}
.tbl .h.test.done{background:#f1e6c8;color:#6a5a3a;border-color:#e2d3ab;cursor:default;}
/* 水よう液を おして えらぶ（②） */
.tbl .r.pick{cursor:pointer;background:#f6eed9;border:2px solid var(--line);}
.tbl .r.pick.on{background:#f5d97a;border-color:var(--gold);color:#3a2c05;}
/* ④の じゅんばん */
.tbl .stp{justify-content:flex-start;text-align:left;padding:2px 8px;gap:.5em;
  background:#fbf6e8;border:1px solid var(--line);color:#b9ad93;}
.tbl .stp.done{background:#fff;border-color:#d9cba8;color:#4a3c22;}
.tbl .stp.now{background:#e8f0f7;border:2px solid var(--blue);color:#24557f;}
.tbl .stp i{font-style:normal;font-weight:700;opacity:.75;}
/* ①で「ここが ちがう」と 分かった ます（あわ／つんと／白い物） */
.tbl .c.hot-look {background:#fdf3d8;border-color:var(--gold);color:#8a6a10;}
.tbl .c.hot-smell{background:#fbe9e4;border-color:var(--acid);color:#a8402c;}
.tbl .c.hot-evap {background:#f4ece3;border-color:var(--solid);color:#7d5730;}

/* 予想の ボタン */
.opts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
.opts.two{grid-template-columns:repeat(2,1fr);}
.opt{
  font:inherit;font-size:clamp(11px,1.32vw,15px);color:var(--dim);background:#f6eed9;
  border:2px solid var(--line);border-radius:12px;padding:8px 4px;min-height:44px;
  cursor:pointer;line-height:1.25;
}
.opt.sel{border-color:var(--gold);background:#fff3cf;color:#5a4718;}
.opt.right{border-color:var(--ok);background:#e6f0e0;color:#3f7a33;}
.opt.wrong{border-color:var(--ng);background:#fbecec;}
.opt[disabled]{opacity:.45;}
.guess{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap;
  background:#f3ecd8;border:1px dashed var(--gold);border-radius:12px;padding:5px 8px;
}
.guess .gl{font-size:clamp(10.5px,1.25vw,14px);color:#8a6a10;white-space:nowrap;}
.guess .opts{flex:1;min-width:180px;}

/* ⑤ の 表は 画面いっぱい */
#s5 .tbl{font-size:clamp(12px,calc(0.92vw + 0.86vh),20px);}
#s5 .tbl .c{cursor:pointer;}
#s5 .tbl .c.blank{background:#fff8e6;border:2px dashed var(--gold);color:#b9a165;}
#s5 .tbl .c.mark-o{box-shadow:0 0 0 2px var(--ok) inset;}
#s5 .tbl .c.mark-x{box-shadow:0 0 0 2px var(--ng) inset;}

/* ドラッグする カード（①の なまえ／⑤の 性質・とけている物）。
   touch-action:none が ないと iPad で 画面ごと 動いて ドラッグできない */
.cards{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
  background:#fbf6e8;border:1px solid var(--line);border-radius:12px;padding:5px;
}
.ncard{
  font:inherit;font-size:clamp(11.5px,1.45vw,16px);color:#3a2c05;background:#f5d97a;
  border:2px solid var(--gold);border-radius:11px;padding:6px 11px;min-height:42px;
  cursor:pointer;touch-action:none;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.ncard .pr{font-size:.72em;color:#6f5a18;font-weight:700;white-space:nowrap;}
.ncard.sel{background:#fff;box-shadow:0 0 0 3px var(--blue);}
.ncard.used{opacity:.3;}
.ncard.v-acid{background:#fbe9e4;border-color:var(--acid);color:var(--acid);}
.ncard.v-neut{background:#e8f1e5;border-color:var(--neut);color:var(--neut);}
.ncard.v-alka{background:#e4edf7;border-color:var(--alka);color:var(--alka);}
.ncard.v-gas{background:#e3eff3;border-color:var(--gas);color:var(--gas);}
.ncard.v-solid{background:#f4ece3;border-color:var(--solid);color:var(--solid);}
.ghostcard{position:fixed;z-index:99;pointer-events:none;opacity:.94;
  transform:translate(-50%,-50%) scale(1.06);margin:0;box-shadow:0 6px 18px rgba(0,0,0,.22);}

/* ①の A・B・C の ます＝ここに なまえの カードを 落とす。
   **canvas に かかない こと**。canvas に かくと 画面が 小さい とき
   字が 9〜10px まで 縮んで 読めない（2026-09-19 に 実測して HTML に 移した） */
.tbl .dz1{
  cursor:pointer;flex-wrap:wrap;gap:0 .4em;
  border:2px dashed var(--gold);background:#fff8e6;color:#8a6a10;
}
.tbl .dz1 b{font-size:1.3em;color:#40525e;}
.tbl .dz1.hit{background:#fff3cf;}
.tbl .dz1.full{border-style:solid;background:#f5d97a;color:#3a2c05;}
.tbl .dz1.mark-o{border-style:solid;border-color:var(--ok);background:#e6f0e0;color:#3f7a33;}
.tbl .dz1.mark-x{border-style:solid;border-color:var(--ng);background:#fbecec;color:#b33c3c;}

/* ⑤ カードを 落とす ます */
#s5 .tbl .c.dz{cursor:pointer;}
#s5 .tbl .c.dz.hit{background:#fff3cf;border-color:var(--gold);}

/* いちばん下の 安全の 注意。解説に 明記が ある。消さない こと */
#safety{
  flex:0 0 auto;text-align:center;color:#8a6a10;background:#f7eccd;
  border:1px solid var(--line);border-radius:10px;padding:3px 7px;
  font-size:clamp(9px,1.08vw,12.5px);line-height:1.3;
}
#safety b{color:#b3541e;}

@media (max-height:640px){
  #app{padding:5px 8px 5px;gap:4px;}
  .msg{padding:6px 9px;min-height:36px;font-size:clamp(11px,1.45vw,15px);}
  .btn{min-height:40px;padding:8px 11px;}
  .liq{min-height:36px;}
  .opt{min-height:40px;}
  .panel .ttl{display:none;}
  #safety{padding:2px 6px;}
}
@media (max-height:540px){
  h1 .sub{display:none;}
  #safety{font-size:9px;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>水よう液の 性質と はたらき<span class="sub">しらべて 表に まとめる</span></h1>
    <nav id="tabs">
      <button class="tab on" data-s="1">① 見分ける</button>
      <button class="tab" data-s="2">② 性質を 調べる</button>
      <button class="tab" data-s="3">③ あわを 調べる</button>
      <button class="tab" data-s="4">④ 金属を 入れる</button>
      <button class="tab" data-s="5">⑤ 表に まとめる</button>
    </nav>
  </header>

  <div id="main">

    <!-- ① 見分ける -->
    <section class="stage on" id="s1">
      <div class="cols two tall">
        <div class="card"><canvas id="c1"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">青い 見出しを おすと 調べられる／左の ますに カードを 入れる</div>
            <div class="tbl" id="t1"></div>
          </div>
          <div class="cards" id="p1cards"></div>
        </div>
      </div>
      <div class="msg" id="m1"></div>
      <div class="bar">
        <button class="btn show" id="b1check">こたえ</button>
        <button class="btn sub" id="b1undo">カードを もどす</button>
        <button class="btn next" id="b1next">つぎの もんだい →</button>
        <button class="btn ghost" id="b1ref">カードに せいしつを 出す</button>
      </div>
    </section>
    <!-- ② 性質を 調べる -->
    <section class="stage" id="s2">
      <div class="cols two">
        <div class="card"><canvas id="c2"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl" id="t2ttl">① 水よう液を おして えらぶ → ② 下で 予想 → ③「つけて たしかめる」</div>
            <div class="tbl" id="t2"></div>
          </div>
        </div>
      </div>
      <div class="guess" id="g2">
        <span class="gl" id="g2lb">予想　この 水よう液は…</span>
        <div class="opts" id="o2">
          <button class="opt" data-v="acid">酸性</button>
          <button class="opt" data-v="neut">中性</button>
          <button class="opt" data-v="alka">アルカリ性</button>
        </div>
      </div>
      <div class="msg" id="m2"></div>
      <div class="bar">
        <button class="btn ghost on" id="b2litmus">リトマス紙</button>
        <button class="btn ghost" id="b2btb">BTB液</button>
        <button class="btn show" id="b2go">リトマス紙を つけて たしかめる</button>
        <button class="btn next" id="b2next">つぎの 水よう液 →</button>
        <button class="btn sub" id="b2reset">はじめから</button>
      </div>
    </section>

    <!-- ③ 気体が とけている -->
    <section class="stage" id="s3">
      <div class="cols two">
        <div class="card"><canvas id="c3"></canvas></div>
        <div class="side">
          <div class="panel" style="flex:1">
            <div class="ttl">分かった こと</div>
            <div class="tbl" id="t3"></div>
          </div>
        </div>
      </div>
      <div class="guess" id="g3" style="display:none">
        <span class="gl">予想　この あわは…</span>
        <div class="opts" id="o3">
          <button class="opt" data-v="air">空気</button>
          <button class="opt" data-v="co2">二酸化炭素</button>
          <button class="opt" data-v="vapor">水じょう気</button>
        </div>
      </div>
      <div class="msg" id="m3"></div>
      <div class="bar">

function fit(cv){
  const r=cv.getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d;}
  const g=cv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,w,h);
  return {g,w,h};
}
/* 基準の 大きさで かいて、画面に 合わせて 縮める。
   どの iPad でも はみ出さない ように する ため。1 に もどさない こと */
function base(g,w,h,bw,bh){
  const s=Math.min(w/bw,h/bh);
  g.save();g.translate((w-bw*s)/2,(h-bh*s)/2);g.scale(s,s);
  return s;
}
/* 器具の かたまりを まとめて 大きく する。

function grp(g,cx,cy,k,fn){
  g.save();g.translate(cx,cy);g.scale(k,k);g.translate(-cx,-cy);
  try{fn();}finally{g.restore();}
}
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans",sans-serif';
function txt(g,s,x,y,size,color,align,baseline,weight){
  g.save();

  g.textAlign=align||'center';g.textBaseline=baseline||'middle';
  g.fillStyle=color||'#2b2118';g.fillText(s,x,y);
  g.restore();
}
function rrp(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
function box(g,x,y,w,h,r,fill,stroke,lw){
  rrp(g,x,y,w,h,r);

}
function circ(g,x,y,r,fill,stroke,lw){

function tag(g,s,x,y,size,color,bg){

/* ビーカー。lev=0〜1 で 液の 高さ */
function beaker(g,cx,by,w,h,lev,col,bub,t){
  const x=cx-w/2,y=by-h;

      const sd=i*127.7, sp=.16+((i*37)%50)/100*.5;
      const p=((t*sp+ (sd%1000)/1000)%1);
      const bx=x+8+((sd*13)%(w-16));
      const byy=by-6-(by-6-ly)*p;
      const r=1.6+((i*31)%10)/10*1.9;

  g.beginPath();g.moveTo(x-2,ty+2);g.lineTo(x+w+2,ty+2);g.stroke();
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;
  g.beginPath();g.moveTo(x+6,ty+12);g.lineTo(x+6,by-r-4);g.stroke();
  g.restore();
}
/* 蒸発皿・金あみ・実験用ガスコンロ */
function burner(g,cx,by,fire){
  /* コンロ */
  box(g,cx-52,by-38,104,38,7,'#cfd6db','#9fadb6',2);
  box(g,cx-40,by-46,80,10,4,'#b9c3ca','#9fadb6',2);
  circ(g,cx+34,by-19,8,'#e0655a','#a84a42',2);
  /* ほのお */
  if(fire>0.01){
    g.save();g.globalAlpha=clamp(fire,0,1);
    for(let i=-1;i<=1;i++){
      const hh=26+Math.abs(i)*-7;
      g.fillStyle=i===0?'rgba(255,170,60,.9)':'rgba(255,200,90,.75)';
      g.beginPath();
      g.moveTo(cx+i*15,by-46);
      g.quadraticCurveTo(cx+i*15-9,by-46-hh*.6,cx+i*15,by-46-hh);
      g.quadraticCurveTo(cx+i*15+9,by-46-hh*.6,cx+i*15,by-46);
      g.closePath();g.fill();
    }
    g.fillStyle='rgba(120,190,255,.7)';
    g.beginPath();g.moveTo(cx,by-46);g.quadraticCurveTo(cx-5,by-56,cx,by-62);
    g.quadraticCurveTo(cx+5,by-56,cx,by-46);g.closePath();g.fill();
    g.restore();
  }
}
function dish(g,cx,cy,w,lev,col,resCol,resAmt){
  const h=w*.28;
  g.save();
  /* 中身 */
  if(lev>0.01){
    g.save();
    g.beginPath();g.ellipse(cx,cy,w/2-4,h,0,0,Math.PI);g.lineTo(cx-w/2+4,cy);g.closePath();g.clip();
    g.fillStyle=col;g.fillRect(cx-w/2,cy-2,w,h*lev+2);
    g.restore();
    g.fillStyle=col;
    g.beginPath();g.ellipse(cx,cy,w/2-4,(h*.34),0,0,TAU);g.fill();
  }
  /* 残った 物 */
  if(resAmt>0.01&&resCol){
    g.save();g.globalAlpha=clamp(resAmt,0,1);
    g.fillStyle=resCol;
    for(let i=0;i<26;i++){
      const a=(i*2.399);const rr=(i/26)*(w/2-14);
      const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*.3;
      circ(g,px,py,2.2+((i*13)%10)/10*2.6,resCol,'#a89b80',1.2);
    }
    g.restore();
  }
  /* 皿 */
  g.strokeStyle='#9aa7ae';g.lineWidth=3;g.fillStyle='rgba(255,255,255,.18)';
  g.beginPath();g.ellipse(cx,cy,w/2,h,0,0,Math.PI);g.stroke();
  g.beginPath();g.ellipse(cx,cy,w/2,h*.34,0,0,TAU);g.stroke();
  g.restore();
}
/* 湯気 */
function steam(g,cx,cy,t,amt,col){
  if(amt<0.01)return;
  g.save();g.globalAlpha=clamp(amt,0,1)*.7;
  g.strokeStyle=col||'#b9c9d2';g.lineWidth=4;g.lineCap='round';
  for(let i=0;i<3;i++){
    const ph=(t*.45+i*.33)%1;
    const x=cx+(i-1)*24, y=cy-10-ph*70;
    g.globalAlpha=clamp(amt,0,1)*.6*(1-ph);
    g.beginPath();
    g.moveTo(x,y);
    g.quadraticCurveTo(x+9,y-13,x,y-26);
    g.quadraticCurveTo(x-9,y-39,x,y-50);
    g.stroke();
  }
  g.restore();
}
/* 人（においを かぐ ところ）。解説の「手であおいで かぐ」を 絵で 見せる */
function person(g,x,y,s,fan){
  /* 左（ビーカーの ほう）を むいて 立ち、手で においを あおぐ。
     鼻と 手を かかない と「ただの かたまり」に 見える */
  g.save();g.translate(x,y);g.scale(s,s);
  const c='#6b7d8a';
  g.fillStyle=c;
  g.beginPath();
  g.moveTo(-18,8);g.lineTo(-11,-30);g.quadraticCurveTo(0,-39,11,-30);g.lineTo(18,8);g.closePath();g.fill();
  circ(g,0,-54,17,c);
  g.fillStyle=c;
  g.beginPath();g.moveTo(-13,-58);g.lineTo(-24,-51);g.lineTo(-13,-46);g.closePath();g.fill();
  const a=Math.sin(fan*7)*0.34;
  g.save();g.translate(-6,-28);g.rotate(0.62+a);
  g.strokeStyle=c;g.lineWidth=9;g.lineCap='round';
  g.beginPath();g.moveTo(0,0);g.lineTo(-30,0);g.stroke();
  g.save();g.translate(-34,0);g.rotate(a*1.6);
  rrp(g,-6,-12,12,24,5.5);g.fillStyle=c;g.fill();
  g.restore();
  g.restore();
  g.restore();
}

/* ===================================================================
   ① 見分ける ― ラベルが はがれた A・B・C を あてる
   解説「同じように無色透明な水溶液でも，溶けている物を取り出すと
   違った物が出てくることがある」
   「水溶液には，色やにおいなどの異なるものがある」

   【2026-09-19 に 2回目の 作り直し。もどさない こと】
   1回目＝1つ えらんで 3つの ボタンで 調べる → 使い方が 分からなかった。
   2回目＝6つを 一度に 調べる → 「押すと いっせいに 答えが 出る。それなら
   はじめから 表に して おくのと 変わらない」（教室で 見せた ときの ことば）。
   いまは **ラベルが はがれた 3本を、自分で 調べ方を えらんで あてる** 形。
   調べるのは 子どもの 判断、答えるのは なまえの カードの ドラッグ。

   【なぜ 3本なのか】①の 3つの 調べ方で 分けられるのは この 3なかまだけ:
   ・炭酸水                          … あわが 出る
   ・塩酸／アンモニア水              … つんと する・何も 残らない（2つは 見分けられない）
   ・食塩水／水酸化ナトリウム／石灰水 … 無色・なし・白い 物（3つも 見分けられない）
   候補は かならず **各なかまから 1つずつ**。すると
   「1つの 調べ方では 1本しか 決まらない。2つ 調べれば 3本とも 決まる」に なり、
   どの 調べ方にも 意味が 出る。**なかまを またいで 2つ えらばない こと**
   （塩酸と アンモニア水を 両方 出すと 答えが 決まらなく なる）。
   見分けられない 組が ある ことが、そのまま ②（リトマス紙）への 橋わたし。
   =================================================================== */
const liqOf=k=>LIQ.find(q=>q.k===k);
const WATER='rgba(176,212,228,.62)';
const G1=[['tan'],['hcl','nh3'],['salt','naoh','lime']];
const SLOT=['A','B','C'];
const TESTS=[{k:'look',n:'見た目'},{k:'smell',n:'におい'},{k:'evap',n:'蒸発させると'}];
const S1={pick:{},cards:[],place:{A:null,B:null,C:null},sel:null,
          done:{look:false,smell:false,evap:false},checked:false,ref:false,
          t:0,an:0,last:'look'};
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const x=a[i];a[i]=a[j];a[j]=x;}return a;}

/* カードを ドラッグして 入れ物に 入れる 仕かけ（①と⑤で 共通）。
   iPad では HTML5 の drag&drop が 効かないので pointer で 自分で 書く。
   **タップ → 入れ物タップ でも 入る**（ドラッグが うまく いかない子の ため）。
   カードの CSS に touch-action:none が いる（ないと 画面ごと 動く） */
function killGhosts(){
  /* 取りのこされた 影の カードを かならず 消す。
     1枚でも 画面に のこると、ずっと 浮いた ままに なって じゃまに なる */
  document.querySelectorAll('.ghostcard').forEach(g=>g.remove());
}
function dragDrop(root,cardCls,binCls,onDrop,onTap){
  let drag=null,ghost=null,moved=false,sx=0,sy=0,justDropped=0;
  const bins=()=>root.querySelectorAll('.'+binCls);
  const hitAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('.'+binCls);};
  root.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.'+cardCls);if(!c)return;
    killGhosts();
    drag=c;moved=false;sx=e.clientX;sy=e.clientY;
  });
  document.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!moved){
      if(Math.hypot(e.clientX-sx,e.clientY-sy)<9)return;
      moved=true;
      ghost=drag.cloneNode(true);
      ghost.classList.add('ghostcard');ghost.classList.remove('sel');
      document.body.appendChild(ghost);
      drag.style.opacity='.35';
    }
    e.preventDefault();
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    const b=hitAt(e.clientX,e.clientY);
    bins().forEach(x=>x.classList.toggle('hit',x===b));
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    if(!drag){killGhosts();return;}
    const card=drag;drag=null;
    card.style.opacity='';
    if(ghost){ghost.remove();ghost=null;}
    killGhosts();
    bins().forEach(x=>x.classList.remove('hit'));
    const b=hitAt(e.clientX,e.clientY);
    /* すばやく 引っぱると pointermove が 1回も 来ない ことが ある。
       指を はなした 先が 入れ物なら、動いて いなくても ドラッグと して あつかう */
    if(b){justDropped=Date.now();onDrop(card,b);}
    else if(!moved)onTap(card);
  });
  document.addEventListener('pointercancel',()=>{
    if(ghost){ghost=null;}
    killGhosts();
    if(drag)drag.style.opacity='';
    drag=null;bins().forEach(x=>x.classList.remove('hit'));
  });
  root.addEventListener('click',e=>{
    const b=e.target.closest('.'+binCls);if(!b)return;
    if(Date.now()-justDropped<350)return;   /* ドラッグの あとの click で 2回 入るのを ふせぐ */
    onDrop(null,b);
  });
}

function new1(){
  const ks=shuffle(G1.map(g=>g[rnd(g.length)]));
  S1.pick={A:ks[0],B:ks[1],C:ks[2]};
  S1.cards=shuffle(ks.slice());
  S1.place={A:null,B:null,C:null};
  S1.sel=null;S1.checked=false;
  S1.done={look:false,smell:false,evap:false};
  S1.an=0;S1.last='look';
}
const SHORT={
  look:q=>q.k==='tan'?'あわ':'無色',
  smell:q=>q.smell==='なし'?'なし':'つんと',
  evap:q=>q.evapLeft?'白い物':'残らない',
};
/* なぜ そう 決まるのか。
   **やって いない 調べ方を 理由に しない こと**
   （におい を 調べて いないのに「つんと した から」と 言うと、
   画面の 表と 合わなく なる）。
   その 本が しぼりこみで 決まって いるなら「のこりが これしか ない」 */
function why1(sl){
  const q=liqOf(S1.pick[sl]);
  if(q.k==='tan'&&S1.done.look)return 'あわが 出て いた';
  if(q.smell!=='なし'&&S1.done.smell)return 'つんと する においが した';
  if(q.evapLeft&&S1.done.evap)return '蒸発させると 白い 物が 残った';
  if(cands1(sl).length===1)return 'のこりが これしか ない';
  return '';
}
/* いまの 調べた 結果で、その 本に あてはまる 候補が いくつ あるか */
function cands1(sl){
  const tr=liqOf(S1.pick[sl]);
  return S1.cards.filter(k=>{
    const q=liqOf(k);
    return (!S1.done.look ||q.look ===tr.look)
        && (!S1.done.smell||q.smell===tr.smell)
        && (!S1.done.evap ||q.evap ===tr.evap);
  });
}
/* かぐ 手。においの ラウンドだけ ビーカーの 上に 出す。
   解説の「保護眼鏡」と 同じで、手で あおいで かぐ ことを 絵で 見せる。
   手のひらと ゆびを かく こと（ぼう1本だと 何か 分からない） */
function fanHand(g,x,y,s,t,strong){
  g.save();g.translate(x,y);g.scale(s,s);
  const c='#6b7d8a';
  const a=Math.sin(t*6)*0.3;
  g.save();g.rotate(a);
  g.strokeStyle=c;g.lineWidth=9;g.lineCap='round';
  g.beginPath();g.moveTo(26,-2);g.lineTo(2,-2);g.stroke();
  rrp(g,-18,-15,20,30,8);g.fillStyle=c;g.fill();
  g.strokeStyle=c;g.lineWidth=5;g.lineCap='round';
  for(let i=0;i<3;i++){
    g.beginPath();g.moveTo(-16,-10+i*10);g.lineTo(-27,-12+i*10);g.stroke();
  }
  g.restore();
  if(strong){
    /* においが 立ちのぼる ようす */
    g.strokeStyle='#cf5138';g.lineWidth=4;g.lineCap='round';g.setLineDash([7,8]);
    for(let i=0;i<3;i++){
      g.globalAlpha=.8-i*.2;
      g.beginPath();g.arc(6,40,22+i*13,-2.55,-0.75);g.stroke();
    }
  }
  g.restore();
}
function p1build(){
  const c=$('p1cards');c.innerHTML='';
  S1.cards.forEach(k=>{
    const q=liqOf(k);
    const used=SLOT.some(s=>S1.place[s]===k);
    const d=document.createElement('div');
    d.className='ncard'+(S1.sel===k?' sel':'')+(used?' used':'');
    d.dataset.k=k;
    d.innerHTML=q.n+(S1.ref?'<span class="pr">'+SHORT.look(q)+'・'+SHORT.smell(q)+'・'+SHORT.evap(q)+'</span>':'');
    c.appendChild(d);
  });
}
function t1build(){
  const t=$('t1');
  t.style.gridTemplateColumns='1.22fr 1.02fr .84fr 1.02fr';
  t.style.gridTemplateRows='repeat(4,1fr)';
  /* 見出しが そのまま ボタン。「どの らんを うめるか」を おす */
  let h='<div class="h">なまえ</div>';
  TESTS.forEach(te=>{
    h+='<div class="h test'+(S1.done[te.k]?' done':'')+'" data-a="'+te.k+'">'+te.n+
       (S1.done[te.k]?'':'<span class="tap">おして 調べる</span>')+'</div>';
  });
  SLOT.forEach(sl=>{
    const q=liqOf(S1.pick[sl]), k=S1.place[sl];
    const mk=S1.checked&&k?(k===S1.pick[sl]?' mark-o':' mark-x'):'';
    h+='<div class="dz1'+(k?' full':'')+mk+'" data-b="'+sl+'"><b>'+sl+'</b>'+(k?liqOf(k).n:'？')+'</div>';
    TESTS.forEach(te=>{
      if(!S1.done[te.k]){h+='<div class="c">まだ</div>';return;}
      const v=te.k==='look'?q.look:te.k==='smell'?q.smell:q.evap;
      const hot=te.k==='look'?(q.k==='tan'):te.k==='smell'?(q.smell!=='なし'):q.evapLeft;
      h+='<div class="c on'+(hot?' hot-'+te.k:'')+'">'+v+'</div>';
    });
  });
  t.innerHTML=h;
}
function up1(){
  p1build();t1build();
  $('b1ref').classList.toggle('on',S1.ref);
  $('b1ref').textContent=S1.ref?'せいしつを かくす':'カードに せいしつを 出す';
  [...$('s1').querySelectorAll('.btn.play')].forEach(b=>b.classList.toggle('on',S1.done[b.dataset.a]));
}
function draw1(){
  const cv=$('c1'),o=fit(cv);if(!o)return;
  const g=o.g;base(g,o.w,o.h,1000,560);
  bench(g,1000,560);
  const t=S1.t,last=S1.last;
  txt(g,'① ラベルが はがれた 3本。どれが どれ？',500,46,26,'#40525e');
  const XS=[250,500,750], by=434;

  SLOT.forEach((sl,i)=>{
    const cx=XS[i], q=liqOf(S1.pick[sl]);
    if(last==='evap'&&S1.done.evap){
      grp(g,cx,by,1.08,()=>{
        burner(g,cx,by,1);
        box(g,cx-62,by-104,124,9,3,'#b6bfc6','#96a2aa',2);
        g.strokeStyle='#96a2aa';g.lineWidth=4;
        g.beginPath();g.moveTo(cx-58,by-95);g.lineTo(cx-58,by-46);g.moveTo(cx+58,by-95);g.lineTo(cx+58,by-46);g.stroke();
        const lev=Math.max(0,1-S1.an*1.05);
        dish(g,cx,by-112,150,lev,WATER,q.res,S1.an>0.8?(S1.an-0.8)/0.2:0);
        steam(g,cx,by-132,t+i*0.7,lev>0.02?1:0);
      });
    }else{
      beaker(g,cx,by,196,268,.58,WATER,q.k==='tan'?18:0,t);
      if(last==='smell'&&S1.done.smell)fanHand(g,cx+14,by-318,1.9,t+i*0.5,q.smell!=='なし');
    }
    txt(g,sl,cx,by+44,40,'#40525e');
  });
  g.restore();
}
function run1(a){
  S1.done[a]=true;S1.last=a;
  if(a==='evap')S1.an=0;
  S1.checked=false;
  const who=SLOT.filter(sl=>{
    const q=liqOf(S1.pick[sl]);
    return a==='look'?q.k==='tan':a==='smell'?q.smell!=='なし':q.evapLeft;
  }).join('・');
  let m=a==='look' ? 'あわが 出て いるのは <b>'+who+'</b> だけ。あとの 2本は 見た目が 同じ。'
      :a==='smell'? 'つんと する においが するのは <b>'+who+'</b>。あとの 2本は においが しない。'
      :             '白い 物が 残ったのは <b>'+who+'</b>。あとの 2本は 何も 残らなかった。';
  const decided=SLOT.filter(sl=>cands1(sl).length===1).length;
  m+= decided===3
    ? '<br>これで <b>3本 とも</b> 決められそうだ。なまえの カードを A・B・C に 入れよう。'
    : '<br>まだ <b>'+(3-decided)+'本</b>は 決められない。ほかの 調べ方も やって みよう。';
  $('m1').innerHTML=m;
  up1();
}
function drop1(cardEl,bin){
  const sl=bin.dataset.b;
  const k=cardEl?cardEl.dataset.k:S1.sel;
  if(!k){
    /* カードを えらんで いない ときに 入って いる ますを おしたら もどす
       ＝置きまちがいの やりなおし（2026-09-19 の 指摘） */
    if(S1.place[sl]){
      S1.place[sl]=null;S1.checked=false;
      $('m1').innerHTML='<b>'+sl+'</b>の カードを もどした。もう 一度 入れてね。';
      up1();
    }
    return;
  }
  SLOT.forEach(s=>{if(S1.place[s]===k)S1.place[s]=null;});   /* 同じ カードは 1か所だけ */
  S1.place[sl]=k;
  S1.sel=null;S1.checked=false;
  const n=SLOT.filter(s=>S1.place[s]).length;
  $('m1').innerHTML=n<3
    ? '<b>'+sl+'</b>に 入れた。のこり <b>'+(3-n)+'本</b>。まちがえたら <b>入って いる ますを おす</b>と もどせるよ。'
    : '3本 とも 入れたね。<b>こたえ</b>を おして たしかめよう。';
  up1();
}
function check1(){
  const miss=SLOT.filter(s=>!S1.place[s]);
  if(miss.length){
    $('m1').innerHTML='まだ とちゅうだよ。<b>'+miss.join('・')+'</b>に カードが 入って いない。';
    return;
  }
  S1.checked=true;up1();
  const ng=SLOT.filter(s=>S1.place[s]!==S1.pick[s]);
  let m=ng.length?'<span class="ng">おしい！</span>　':'<span class="ok">ぜんぶ せいかい！</span>　';
  m+=SLOT.map(s=>{const w=why1(s);return s+'は <b>'+liqOf(S1.pick[s]).full+'</b>'+(w?'（'+w+'）':'');}).join('、')+'。';
  if(SLOT.some(s=>cands1(s).length>1))
    m+='<br>まだ 調べて いない ことが あったね。<b>2つ 調べれば</b> 3本 とも 決められるよ。';
  m+='<br>でも <b>うすい塩酸</b>と <b>うすいアンモニア水</b>は、見た目も においも 蒸発させた あとも 同じ。'+
     'この 3つの 調べ方では 見分けられない。→ ②の <b>リトマス紙</b>の 出番だ。';
  $('m1').innerHTML=m;
}
dragDrop($('s1'),'ncard','dz1',drop1,el=>{
  S1.sel=(S1.sel===el.dataset.k)?null:el.dataset.k;up1();
});
$('t1').addEventListener('click',e=>{
  const h=e.target.closest('.h.test');if(!h||S1.done[h.dataset.a])return;
  run1(h.dataset.a);dirty=true;
});
$('b1check').addEventListener('click',check1);

function step1(dt){
  S1.t+=dt;
  if(S1.last==='evap'&&S1.done.evap&&S1.an<1){S1.an=Math.min(1,S1.an+dt*0.5);}
  return true;
}

/* ===================================================================
   ② 性質を 調べる
   解説「リトマス紙などを用いて調べることにより，酸性，アルカリ性，中性の
   三つの性質にまとめられることを捉える」
   色だけで 決めさせない ため、表にも 絵にも「赤に 変わった」「変わらない」と
   ことばで 出す。色の 見分けが むずかしい 子が いる
   =================================================================== */
const S2={k:'salt',tool:'litmus',t:0,an:0,run:false,shown:false,gs:{},done:{}};
const litBlue=s=>s==='acid'?'赤に 変わった':'変わらない';
const litRed =s=>s==='alka'?'青に 変わった':'変わらない';
const btbName=s=>s==='acid'?'黄色':(s==='neut'?'緑色':'青色');

function t2build(){
  const t=$('t2'),lit=S2.tool==='litmus';
  t.style.gridTemplateColumns=lit?'1.2fr 1.05fr 1.05fr 1fr':'1.3fr 1fr 1.15fr';
  t.style.gridTemplateRows='repeat(7,1fr)';
  let h='<div class="h">水よう液</div>';
  h+=lit?'<div class="h">青い 紙</div><div class="h">赤い 紙</div>':'<div class="h">BTB液</div>';
  h+='<div class="h">性質</div>';
  LIQ.forEach(q=>{
    const d=(S2.done[q.k]||{})[S2.tool];
    const cur=q.k===S2.k?' now':'';
    /* 行の いちばん左を おすと その 水よう液を えらぶ。
       6つの ボタンを べつに 出して いたら「どこを おすのか 分からない」と
       言われた（2026-09-19）。えらぶ 場所と 結果が 出る 場所を 同じに する */
    h+='<div class="r pick'+(q.k===S2.k?' on':'')+'" data-k="'+q.k+'">'+q.n+'</div>';
    if(lit){
      h+='<div class="c'+(d?' on':'')+cur+'">'+(d?litBlue(q.sei):'?')+'</div>';
      h+='<div class="c'+(d?' on':'')+cur+'">'+(d?litRed(q.sei):'?')+'</div>';
    }else{
      h+='<div class="c'+(d?' on':'')+cur+'">'+(d?btbName(q.sei):'?')+'</div>';
    }
    h+='<div class="c'+(d?' on s-'+q.sei:'')+cur+'">'+(d?SEI[q.sei].n:'?')+'</div>';
  });
  t.innerHTML=h;
}
function draw2(){
  const cv=$('c2'),o=fit(cv);if(!o)return;
  const g=o.g;base(g,o.w,o.h,1000,560);
  bench(g,1000,560);
  const q=liqOf(S2.k), t=S2.t, u=S2.an, shown=S2.shown;

  if(S2.tool==='litmus'){
    const cx=300,by=452;
    /* 2まいの リトマス紙。下ろす → 液に つける → 上げる */
    const p=u<=0?0:(u<.45?ease(u/.45):(u<.62?1:1-ease((u-.62)/.38)));
    const changed=shown;
    grp(g,cx,330,1.2,()=>{
    beaker(g,cx,by,190,262,.62,WATER,q.k==='tan'?18:0,t);
    txt(g,q.full,cx,by+40,q.full.length>12?17:21,'#40525e');
    [[-48,'blue'],[48,'red']].forEach(([dx,kind])=>{
      const px=cx+dx, py=118+128*p;
      /* ピンセット */
      g.strokeStyle='#9aa7ae';g.lineWidth=5;g.lineCap='round';
      g.beginPath();g.moveTo(px-9,py-58);g.lineTo(px-4,py-4);
      g.moveTo(px+9,py-58);g.lineTo(px+4,py-4);g.stroke();
      /* 紙 */
      const base0=kind==='blue'?PAPER.blue0:PAPER.red0;
      let col=base0;
      if(changed){
        if(kind==='blue'&&q.sei==='acid')col=PAPER.red1;
        if(kind==='red' &&q.sei==='alka')col=PAPER.blue1;
      }
      box(g,px-15,py-6,30,92,5,col,'rgba(80,95,110,.45)',2);
      if(changed&&((kind==='blue'&&q.sei==='acid')||(kind==='red'&&q.sei==='alka'))){
        /* 変わった ところが ひと目で 分かる ように わくを 光らせる */
        box(g,px-19,py-10,38,100,7,null,'#c9a227',3);
      }
      txt(g,kind==='blue'?'青い 紙':'赤い 紙',px,py+104,16,'#5b6b76');
    });
    });
    if(shown){
      const c=SEI[q.sei].c;
      box(g,590,120,376,290,18,'#ffffff',c,3);
      txt(g,'リトマス紙の 色',778,158,18,'#6f7d86');
      txt(g,'青い 紙 … '+litBlue(q.sei),778,196,19,q.sei==='acid'?'#cd3f56':'#6f7d86');
      txt(g,'赤い 紙 … '+litRed(q.sei),778,228,19,q.sei==='alka'?'#3a5fb8':'#6f7d86');
      g.strokeStyle='#e3e9ed';g.lineWidth=2;
      g.beginPath();g.moveTo(620,258);g.lineTo(936,258);g.stroke();
      txt(g,'この 水よう液は',778,288,19,'#6f7d86');
      txt(g,SEI[q.sei].n,778,340,40,c);
    }
  }else{
    const cx=300,ty=170;
    const col=S2.shown?BTB[q.sei]:WATER;
    const p=u<=0?0:(u<.4?ease(u/.4):1);
    const sy=60+40*p;
    grp(g,cx,290,1.22,()=>{
      tube(g,cx,ty,92,250,.6,col,q.k==='tan'?12:0,t,0);
      txt(g,q.full,cx,ty+292,q.full.length>12?17:21,'#40525e');
      /* スポイト */
      box(g,cx-13,sy,26,58,9,'#dfe6ea','#9aa7ae',2.5);
      box(g,cx-6,sy+56,12,34,4,'#eef3f5','#9aa7ae',2.5);
      txt(g,'BTB液',cx+70,sy+30,17,'#5b6b76','left');
      if(u>.4&&u<.72){
        const dp=(u-.4)/.32;
        circ(g,cx,sy+92+dp*72,7,'#4faa48','#3d8a39',1.5);
      }
    });
    if(S2.shown){
      const c=SEI[q.sei].c;
      box(g,590,120,376,290,18,'#ffffff',c,3);
      txt(g,'BTB液の 色',778,162,19,'#6f7d86');
      box(g,700,192,156,56,12,BTB[q.sei],'rgba(80,95,110,.35)',2);
      txt(g,btbName(q.sei),778,220,26,q.sei==='acid'?'#5a4a10':'#ffffff');
      g.strokeStyle='#e3e9ed';g.lineWidth=2;
      g.beginPath();g.moveTo(620,272);g.lineTo(936,272);g.stroke();
      txt(g,'この 水よう液は',778,300,19,'#6f7d86');
      txt(g,SEI[q.sei].n,778,352,40,c);
    }
  }
  g.restore();
}
function up2(){
  t2build();
  $('b2litmus').classList.toggle('on',S2.tool==='litmus');
  $('b2btb').classList.toggle('on',S2.tool==='btb');
  $('t2ttl').textContent='① 水よう液を おして えらぶ → ② 下で 予想 → ③「'+
    (S2.tool==='litmus'?'つけて':'入れて')+' たしかめる」';
  $('g2lb').innerHTML='予想　<b>'+liqOf(S2.k).full+'</b>は…';
  $('b2go').textContent=S2.tool==='litmus'?'リトマス紙を つけて たしかめる':'BTB液を 入れて たしかめる';
  const q=liqOf(S2.k), g=S2.gs[S2.k];
  [...$('o2').children].forEach(b=>{
    b.className='opt'+(b.dataset.v===g?' sel':'');
    if(S2.shown){
      if(b.dataset.v===q.sei)b.className='opt right';
      else if(b.dataset.v===g)b.className='opt wrong';
    }
    b.disabled=S2.shown;
  });
  $('b2go').disabled=!g||S2.shown||S2.run;
}
function go2(){
  const q=liqOf(S2.k);
  S2.run=true;S2.an=0;S2.shown=false;
  $('m2').innerHTML=S2.tool==='litmus'?'リトマス紙を つけて いる…':'BTB液を 入れて いる…';
  up2();
}
function done2(){
  const q=liqOf(S2.k), g=S2.gs[S2.k], ok=g===q.sei;
  S2.shown=true;
  (S2.done[S2.k]||(S2.done[S2.k]={}))[S2.tool]=1;
  let s=(ok?'<span class="ok">予想の とおり！</span>　':'<span class="ng">予想とは ちがった。</span>　');
  const cls=q.sei==='acid'?'ac':(q.sei==='neut'?'nu':'al');
  if(S2.tool==='litmus'){
    s+=q.sei==='acid'?'<b>青い</b> リトマス紙が <b>赤</b>に 変わった。赤い 紙は 変わらない。'
      :q.sei==='alka'?'<b>赤い</b> リトマス紙が <b>青</b>に 変わった。青い 紙は 変わらない。'
      :'どちらの リトマス紙も 色が <b>変わらない</b>。';
  }else{
    s+='BTB液が <b>'+btbName(q.sei)+'</b>に なった。';
  }
  s+='→ '+q.full+'は <span class="'+cls+'">'+SEI[q.sei].n+'</span>。';
  const n=LIQ.filter(x=>(S2.done[x.k]||{})[S2.tool]).length;
  if(n===6)s+='<br>6つ ぜんぶ 調べた。水よう液は <span class="ac">酸性</span>・<span class="nu">中性</span>・<span class="al">アルカリ性</span> の <b>3つ</b>に まとめられる。';
  $('m2').innerHTML=s;
  up2();
}
function pick2(k){
  S2.k=k;S2.an=0;S2.run=false;
  S2.shown=!!((S2.done[k]||{})[S2.tool]);
  if(S2.shown)S2.an=1;
  if(!S2.shown)$('m2').innerHTML='<b>'+liqOf(k).full+'</b>は 何性だと 思う？　予想を えらんで から 調べよう。';
  else $('m2').innerHTML='<b>'+liqOf(k).full+'</b>は <span class="'+(liqOf(k).sei==='acid'?'ac':liqOf(k).sei==='neut'?'nu':'al')+'">'+SEI[liqOf(k).sei].n+'</span>。もう 調べた よ。';
  up2();
}
$('t2').addEventListener('click',e=>{
  const b=e.target.closest('.r.pick');if(!b)return;pick2(b.dataset.k);dirty=true;
});
$('o2').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b||b.disabled)return;
  S2.gs[S2.k]=b.dataset.v;up2();dirty=true;
});
$('b2go').addEventListener('click',()=>{go2();dirty=true;});
$('b2litmus').addEventListener('click',()=>{S2.tool='litmus';pick2(S2.k);dirty=true;});
$('b2btb').addEventListener('click',()=>{S2.tool='btb';pick2(S2.k);dirty=true;});
$('b2next').addEventListener('click',()=>{
  const i=LIQ.findIndex(q=>q.k===S2.k);pick2(LIQ[(i+1)%LIQ.length].k);dirty=true;
});
$('b2reset').addEventListener('click',()=>{
  S2.done={};S2.gs={};S2.k='salt';S2.shown=false;S2.an=0;S2.run=false;
  $('m2').innerHTML='水よう液を えらんで、何性か 予想して から リトマス紙を つけよう。';
  up2();dirty=true;
});
function step2(dt){
  S2.t+=dt;
  if(S2.run){
    S2.an+=dt*0.62;
    if(S2.an>=(S2.tool==='litmus'?.54:.74)&&!S2.shown)done2();
    if(S2.an>=1){S2.an=1;S2.run=false;up2();}
    return true;
  }
  return liqOf(S2.k).k==='tan';
}

/* ===================================================================
   ③ 気体が とけている（炭酸水）
   解説「水溶液を振り動かしたり温めたりすると，気体を発生するものがある」
   「発生した気体を調べると，その気体特有の性質を示すものがある」
   「発生した気体は再び水に溶ける」
   「加熱すると，固体が溶けている場合と違って，何も残らないものがある」
   → この 4つを 1つずつ 送って 見せる。あわの 正体は 予想して から 調べる
   =================================================================== */
const S3={f:0,t:0,an:0,gs:null};
const F3=[
 {ttl:'炭酸水を そのまま 見る',
  msg:'炭酸水からは <b>あわ</b>が 出て いる。この あわは 何だろう？　上の えを おしても すすむよ。'},
 {ttl:'ふり動かす',
  msg:'ふり動かすと、あわが <b>たくさん</b> 出て きた。'},
 {ttl:'温める',
  msg:'温めても、あわが <b>たくさん</b> 出て きた。水よう液には、ふったり 温めたり すると <b>気体を 出す</b>ものが ある。'},
 {ttl:'あわの 正体を 予想する',
  msg:'この あわは 何だと 思う？　予想を えらぼう。'},
 {ttl:'石灰水で 調べる',
  msg:'あわを 集めて <b>石灰水</b>に 通すと、石灰水が <b>白く にごった</b>。石灰水を 白く にごらせる 気体は <b>二酸化炭素</b>。炭酸水には <b>二酸化炭素</b>が とけて いたんだね。'},
 {ttl:'気体は 水に とけるか',
  msg:'ペットボトルに 二酸化炭素を 入れて 水を 少し 足し、ふって みる。ペットボトルが <b>へこんだ</b>。出て きた 気体は <b>また 水に とける</b>んだね。'},
 {ttl:'炭酸水を 蒸発させる',
  msg:'炭酸水を 蒸発させても <b>何も 残らない</b>。食塩水は 白い つぶが 残ったのに ちがうね。とけて いたのが <b>気体</b>だから、水と いっしょに 空気中へ 出て いった。'},
];
function t3build(){
  const t=$('t3');
  t.style.gridTemplateColumns='1fr';
  t.style.gridTemplateRows='repeat(4,1fr)';
  const its=[
    [2,'ふる・温める と あわが 出る'],
    [4,'あわは 二酸化炭素'],
    [5,'気体は また 水に とける'],
    [6,'蒸発させても 何も 残らない'],
  ];
  t.innerHTML=its.map(([f,s])=>'<div class="c'+(S3.f>=f?' on s-gas':'')+'">'+(S3.f>=f?s:'?')+'</div>').join('');
}
/* ペットボトル。へこみの 深さ d（0〜1） */
function bottle(g,cx,by,w,h,d,water){
  const nw=w*.34, nh=h*.17;
  g.save();
  g.beginPath();
  g.moveTo(cx-nw/2,by-h);
  g.lineTo(cx-nw/2,by-h+nh*.55);
  g.quadraticCurveTo(cx-w/2,by-h+nh,cx-w/2+d*w*.17,by-h+nh+h*.12);
  g.bezierCurveTo(cx-w/2+d*w*.34,by-h*.55, cx-w/2+d*w*.34,by-h*.45, cx-w/2+d*w*.02,by-h*.14);
  g.quadraticCurveTo(cx-w/2,by,cx-w/2+10,by);
  g.lineTo(cx+w/2-10,by);
  g.quadraticCurveTo(cx+w/2,by,cx+w/2-d*w*.02,by-h*.14);
  g.bezierCurveTo(cx+w/2-d*w*.34,by-h*.45, cx+w/2-d*w*.34,by-h*.55, cx+w/2-d*w*.17,by-h+nh+h*.12);
  g.quadraticCurveTo(cx+w/2,by-h+nh,cx+nw/2,by-h+nh*.55);
  g.lineTo(cx+nw/2,by-h);
  g.closePath();
  g.save();g.clip();
  g.fillStyle='rgba(225,238,244,.5)';g.fillRect(cx-w,by-h-10,w*2,h+20);
  if(water>0){g.fillStyle=WATER;g.fillRect(cx-w,by-h*water,w*2,h*water);}
  g.restore();
  g.strokeStyle='#8fa5b3';g.lineWidth=3.2;g.stroke();
  box(g,cx-nw/2-3,by-h-13,nw+6,14,4,'#7fa7c4','#5d8aa8',2);
  g.restore();
}
function draw3(){
  const cv=$('c3'),o=fit(cv);if(!o)return;

      }
      g.restore();
    }
    });
    if(f===3){
      box(g,596,150,368,206,18,'#ffffff','#c9a227',3);
      txt(g,'この あわは 何？',780,200,26,'#8a6a10');
      txt(g,'下で 予想を えらぼう',780,254,20,'#8a96a0');
      txt(g,'空気　二酸化炭素　水じょう気',780,300,19,'#6f7d86');

  }else if(f===4){
    /* あわを 石灰水に 通す。

    grp(g,330,340,1.1,()=>{
      beaker(g,bx,by,186,252,.58,WATER,52,t*2.4);
      txt(g,'炭酸水',bx,by+40,21,'#40525e');
      /* ガラス管 */
      g.strokeStyle='#9aa7ae';g.lineWidth=7;g.lineCap='round';g.lineJoin='round';
      g.beginPath();g.moveTo(bx+32,by-150);g.lineTo(bx+32,by-268);g.lineTo(478,by-268);g.lineTo(478,by-152);g.stroke();
      /* 石灰水の 試験管 */
      tube(g,478,by-200,98,236,.6,p>0.02?milky:WATER,1+Math.round(p*14),t*2.2,0);
      txt(g,'石灰水',478,by+62,21,'#40525e');
    });
    if(p>0.9){
      box(g,642,164,320,208,16,'#ffffff','#3d7f95',3);
      txt(g,'石灰水が',802,206,22,'#3d7f95');
      txt(g,'白く にごった',802,240,22,'#3d7f95');
      g.strokeStyle='#e3e9ed';g.lineWidth=2;
      g.beginPath();g.moveTo(670,268);g.lineTo(934,268);g.stroke();
      txt(g,'→ この 気体は',802,296,19,'#6f7d86');
      txt(g,'二酸化炭素',802,338,30,'#3d7f95');
    }
  }else if(f===5){
    const d=ease(clamp(S3.an,0,1));
    grp(g,330,360,1.16,()=>{
    if(d>0.05){
      /* ふる 前の 形。これが ないと どれだけ へこんだか 分からない */
      g.save();g.setLineDash([7,7]);g.globalAlpha=.55;

    if(d>0.05){
      g.save();g.strokeStyle='#cf5138';g.lineWidth=6;g.lineCap='round';

  const right=col==='tok'?q.st:q.sei;
  const name=v?(col==='tok'?ST[v].n:SEI[v].n):'？';
  let c='c dz';
  if(!v)c+=' blank';
  else c+=' on s-'+v;
  if(S5.checked&&v)c+=(v===right?' mark-o':' mark-x');
  return '<div class="'+c+'" data-k="'+q.k+'" data-c="'+col+'">'+name+'</div>';
}
function up5(){
  p5build();t5build();
  [...$('s5').querySelectorAll('.btn.ghost')].forEach(b=>b.classList.toggle('on',b.dataset.o===S5.ord));
}
function drop5(cardEl,cell){
  const v=cardEl?cardEl.dataset.v:S5.sel;
  if(!v)return;
  const col=P5.find(o=>o.v===v).col;
  if(cell.dataset.c!==col){
    $('m5').innerHTML='その カードは <b>'+(col==='tok'?'とけて いる 物':'性質')+'</b>の らんに 入れる カードだよ。';
    return;
  }
  const a=S5.ans[cell.dataset.k]||(S5.ans[cell.dataset.k]={});
  a[col]=v;
  S5.checked=false;S5.sel=null;
  $('m5').innerHTML='カードを ドラッグして ますに 入れよう。カードを おして から ますを おしても 入るよ。';
  up5();
}
dragDrop($('s5'),'ncard','dz',drop5,el=>{
  S5.sel=(S5.sel===el.dataset.v)?null:el.dataset.v;up5();
});
$('s5').querySelector('.bar').addEventListener('click',e=>{
  const b=e.target.closest('.btn.ghost');if(!b)return;
  S5.ord=b.dataset.o;
  $('m5').innerHTML=S5.ord==='sei'
    ? '<span class="ac">酸性</span>2つ・<span class="nu">中性</span>1つ・<span class="al">アルカリ性</span>3つ に 分かれた。'
    : S5.ord==='tok'
    ? '<b>気体</b>が とけて いる もの 3つ・<b>固体</b>が とけて いる もの 3つ。蒸発させて 何も 残らなかった ものが そのまま 気体の なかまだね。'
    : '同じ 6つでも、<b>分け方</b>を 変えると なかまが 変わる。';
  up5();
});
$('b5check').addEventListener('click',()=>{
  const miss=LIQ.filter(q=>{const a=S5.ans[q.k]||{};return !a.tok||!a.sei;});
  if(miss.length){
    $('m5').innerHTML='まだ とちゅうだよ。<b>'+miss.length+'つ</b>の 水よう液が 空いて いる。';
    return;
  }
  S5.checked=true;up5();
  const ng=LIQ.filter(q=>{const a=S5.ans[q.k];return a.tok!==q.st||a.sei!==q.sei;});
  if(!ng.length){
    $('m5').innerHTML='<span class="ok">ぜんぶ せいかい！</span>　'+
      '水よう液には <span class="ac">酸性</span>・<span class="nu">中性</span>・<span class="al">アルカリ性</span>の ものが あり、'+
      '<b>気体</b>が とけて いる ものも ある。うすい 塩酸は <b>金属を 変化させた</b>ね（④）。';
  }else{
    $('m5').innerHTML='<span class="ng">おしい！</span>　ちがって いたのは <b>'+ng.map(q=>q.n).join('・')+'</b>。'+
      '<b>蒸発させると</b>の らんを 見ると、とけて いるのが 気体か 固体か 分かるよ。';
  }
});
$('b5reset').addEventListener('click',()=>{
  S5.ans={};S5.checked=false;S5.sel=null;
  $('m5').innerHTML='①〜④で 調べた ことを 1つの 表に まとめよう。上の カードを ますに 入れてね。';
  up5();
});

/* ========================= きりかえ ========================= */
let step=1, dirty=true, last=0;
function show(n){
  step=n;killGhosts();
  [...document.querySelectorAll('.stage')].forEach((el,i)=>el.classList.toggle('on',i===n-1));
  [...document.querySelectorAll('.tab')].forEach(b=>b.classList.toggle('on',Number(b.dataset.s)===n));
  dirty=true;
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;show(Number(b.dataset.s));
});
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  let anim=false;
  try{
    if(step===1)anim=step1(dt);
    else if(step===2)anim=step2(dt);
    else if(step===3)anim=step3(dt);
    else if(step===4)anim=step4(dt);
  }catch(err){console.error(err);}
  if((dirty||anim)&&step<=4){
    dirty=false;
    try{
      if(step===1)draw1();
      else if(step===2)draw2();
      else if(step===3)draw3();
      else if(step===4)draw4();
    }catch(err){console.error(err);}
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{dirty=true;});
addEventListener('orientationchange',()=>{setTimeout(()=>{dirty=true;},250);});

new1();
$('m1').innerHTML='ラベルが はがれた 水よう液が <b>3本</b>。下の 3つの 調べ方を つかって、どれが どれか あてよう。';
up1();
$('m2').innerHTML='水よう液を えらんで、何性か 予想して から リトマス紙を つけよう。';
up2();
up3();
up4();
$('m5').innerHTML='①〜④で 調べた ことを 1つの 表に まとめよう。上の カードを ますに 入れてね。';
up5();
show(1);
requestAnimationFrame(frame);
</script>
