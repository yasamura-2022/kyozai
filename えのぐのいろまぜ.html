<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>えのぐの いろまぜ</title>
<style>
:root{
  --bg:#fdf6e3;
  --paper:#fffdf7;
  --ink:#2b2118;
  --dim:#7a6a52;
  --line:#e7d9b8;
  --gold:#c9a227;   /* こたえあわせ・いま えらぶ ところ */
  --blue:#2f6fa8;   /* 同じ ところで すすむ・みず */
  --ok:#5a8a4c;     /* べつの もんだいへ */
  --sub:#a99a7c;    /* もどる・やりなおす */
  --f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Klee One","BIZ UDPGothic","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;color:var(--ink);
  background:radial-gradient(circle at 12% 8%,#fef0d0 0,transparent 42%),
             radial-gradient(circle at 88% 92%,#fbe6cf 0,transparent 46%),var(--bg);
  font-family:var(--f-round);overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none !important}

#app{display:flex;flex-direction:column;height:var(--appH,100vh);padding:6px 10px 7px;gap:6px}

header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(14px,1.9vw,24px);letter-spacing:.04em}
.btn{font-weight:700;border-radius:999px;color:#fff;padding:6px 15px;
  font-size:clamp(11px,1.2vw,16px);box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sub{background:var(--sub)} .btn.gold{background:var(--gold)}
.btn.blue{background:var(--blue)} .btn.ok{background:var(--ok)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btn.ghost{background:var(--paper);color:var(--dim);border:2px solid var(--line);box-shadow:none}

#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#tabs button{background:var(--paper);border:2px solid var(--line);border-radius:12px;
  padding:5px 2px;font-weight:700;font-size:clamp(10px,1.15vw,16px);color:var(--dim)}
#tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}

#main{flex:1 1 auto;min-height:0;display:flex}
section.step{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}

/* ===== ①② まぜる がめん ===== */
#stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px}
.slot{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:5px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-height:0;min-width:0;cursor:pointer}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.22)}
.cap{font-size:clamp(10px,1.1vw,15px);color:var(--dim);font-weight:700}
.dot{width:clamp(40px,9.6vh,86px);height:clamp(40px,9.6vh,86px);border-radius:50%;
  border:4px solid #e3d7bd;background:var(--paper);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center}
.slot.on .dot{border-color:var(--gold)}
.dot span{font-size:clamp(14px,2.1vw,25px);font-weight:700;color:#b9ab90}
.nm{font-size:clamp(11px,1.3vw,18px);font-weight:700;min-height:1em}
.amt{display:flex;align-items:center;gap:6px;width:100%}
.amt .num{font-size:clamp(13px,1.6vw,22px);font-weight:700;min-width:1.5em;text-align:center}
.sml{font-size:clamp(9px,1.0vw,13px);color:var(--dim)}

#center{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:5px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-height:0}
#bowls{display:flex;align-items:center;justify-content:center;gap:12px}
.bwrap{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}
.bowl{position:relative;width:var(--bs);height:var(--bs);border-radius:50%;background:var(--paper);
  border:5px solid #e3d7bd;box-shadow:inset 0 5px 14px rgba(0,0,0,.16);transition:background-color .18s}
.bowl i{position:absolute;left:16%;top:12%;width:26%;height:18%;border-radius:50%;
  background:rgba(255,255,255,.45)}
#center{--bs:clamp(70px,18vh,150px)}
#center.quiz{--bs:clamp(56px,13.5vh,112px)}
#ratio{font-size:clamp(11px,1.35vw,19px);font-weight:700;text-align:center;line-height:1.25;min-height:1.2em}
#made{font-size:clamp(11px,1.3vw,18px);color:var(--dim);min-height:1.2em}
#made b{color:var(--ink);font-size:1.12em}
#paperCap{font-size:clamp(8px,.92vw,12px);color:var(--dim)}
#paperBox{width:100%;max-width:330px;position:relative;height:clamp(20px,5.4vh,42px);
  border-radius:8px;overflow:hidden;border:2px solid var(--line);flex:0 0 auto;
  background:repeating-linear-gradient(90deg,#fffdf7 0 26px,#f3ead6 26px 28px),#fffdf7}
#stroke{position:absolute;inset:0;background:var(--paper);opacity:0;transition:opacity .18s,background-color .18s}
#water{width:100%;max-width:330px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
#water .lb{font-size:clamp(10px,1.15vw,15px);font-weight:700;color:var(--blue);white-space:nowrap}
#water .num{font-size:clamp(12px,1.4vw,19px);font-weight:700;color:var(--blue);min-width:1.3em;text-align:center}

/* ちかさの ぼう */
#near{width:100%;max-width:330px;flex:0 0 auto}
#nbar{height:14px;border-radius:7px;background:#ecdfc4;overflow:hidden}
#nfill{height:100%;width:0;background:var(--ok);transition:width .25s}
#nsay{font-size:clamp(11px,1.3vw,18px);font-weight:700;text-align:center;min-height:1.25em;margin-top:2px}
#qbtns{display:flex;gap:7px;justify-content:center;flex:0 0 auto}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#ecdfc4}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:4px solid var(--gold);margin-top:-7px;box-shadow:0 2px 4px rgba(0,0,0,.22)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#ecdfc4}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;
  border:4px solid var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.22)}
input[type=range]:focus{outline:none}
.wslider::-webkit-slider-thumb{border-color:var(--blue)}
.wslider::-webkit-slider-runnable-track{background:#cfe0ef}
.wslider::-moz-range-thumb{border-color:var(--blue)}
.wslider::-moz-range-track{background:#cfe0ef}

/* ===== した：パレット と よこの パネル ===== */
#bot{flex:0 0 auto;display:grid;grid-template-columns:2.15fr 1fr;gap:6px}
.box{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:5px 7px 4px}
.boxttl{font-size:clamp(9px,1.02vw,14px);color:var(--dim);text-align:center;font-weight:700;margin-bottom:3px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:3px 5px}
.pc{display:flex;flex-direction:column;align-items:center;gap:1px}
.sw{width:clamp(24px,5.2vh,44px);height:clamp(24px,5.2vh,44px);border-radius:50%;
  border:3px solid #e3d7bd;box-shadow:0 2px 3px rgba(0,0,0,.15)}
.pc:active .sw{transform:scale(.88)}
.pc.on .sw{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.3)}
.pl{font-size:clamp(8px,.95vw,13px);font-weight:700;white-space:nowrap}

#side{display:flex;flex-direction:column;gap:3px;min-height:0}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.card{position:relative;border-radius:8px;border:3px solid #e3d7bd;overflow:hidden;
  height:clamp(22px,4.6vh,38px);background:var(--paper);cursor:pointer}
.card.empty{border-style:dashed;opacity:.5;cursor:default}
.card.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.3)}
.card .mix{position:absolute;inset:0}
.card .rec{position:absolute;left:0;right:0;bottom:0;height:5px;display:flex}
.card .wm{position:absolute;right:1px;top:0;font-size:8px;color:#fff;text-shadow:0 0 2px #000}
#qlist{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
#qlist button{background:var(--paper);border:2px solid var(--line);border-radius:8px;
  font-weight:700;font-size:clamp(9px,1.0vw,14px);padding:3px 0;color:var(--dim)}
#qlist button.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* ===== ③ わで くらべる ===== */
#s3 .wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:7px}
#wheelBox{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:center;padding:5px;min-height:0}
#wheel{width:100%;height:100%}
#wheel path{cursor:pointer}
#wpanel{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:0;overflow:hidden}
#wres{width:clamp(48px,12vh,104px);height:clamp(48px,12vh,104px);border-radius:50%;
  border:5px solid #e3d7bd;background:var(--paper);box-shadow:inset 0 4px 12px rgba(0,0,0,.16)}
#wkind{font-size:clamp(11px,1.3vw,18px);font-weight:700;min-height:1.2em;text-align:center}
#wsay{font-size:clamp(10px,1.15vw,15px);color:var(--dim);text-align:center;line-height:1.3}
#opp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
.opair{display:flex;flex-direction:column;align-items:center;gap:1px}
.opair .two{display:flex;width:100%;height:9px;border-radius:3px;overflow:hidden}
.opair .two div{flex:1}
.opair .rr{width:100%;height:clamp(16px,3.4vh,30px);border-radius:5px;border:2px solid #e3d7bd}

/* ===== ④ ぬって みる ===== */
#s4 .wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.35fr 1fr;gap:7px}
#artBox{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:center;padding:5px;min-height:0}
#art{width:100%;height:100%}
#art .rg{cursor:pointer;stroke:#6b5a44;stroke-width:2.5;stroke-linejoin:round}
#apanel{background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
#nowc{display:flex;align-items:center;justify-content:center;gap:7px}
#nowdot{width:clamp(22px,4.6vh,38px);height:clamp(22px,4.6vh,38px);border-radius:50%;
  border:3px solid #e3d7bd;background:var(--paper)}

#tip{flex:0 0 auto;text-align:center;font-size:clamp(10px,1.15vw,16px);color:var(--dim);
  min-height:1.3em;line-height:1.3}

@media (max-height:640px){
  #app{gap:4px;padding:4px 8px 5px}
  #paperBox{height:clamp(18px,4.6vh,30px)}
}
@media (orientation:portrait){
  #stage{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
  #center{grid-column:1 / -1;grid-row:2}
  #s3 .wrap,#s4 .wrap{grid-template-columns:1fr;grid-template-rows:1.15fr 1fr}
  #bot{grid-template-columns:1.7fr 1fr}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>🎨 えのぐの いろまぜ</h1>
    <button id="reset" class="btn sub">やりなおす</button>
  </header>

  <nav id="tabs">
    <button data-s="1" class="on">まぜて みる</button>
    <button data-s="2">いろを つくる</button>
    <button data-s="3">わで くらべる</button>
    <button data-s="4">ぬって みる</button>
  </nav>

  <div id="main">

    <!-- ①② まぜる がめん（おなじ そうさ） -->
    <section class="step" id="s12">
      <div id="stage">
        <section class="slot on" id="slot0">
          <div class="cap">1つめの いろ</div>
          <div class="dot" id="dot0"><span>？</span></div>
          <div class="nm" id="nm0"></div>
          <div class="amt"><input type="range" id="amt0" min="0" max="8" step="1" value="1"><div class="num" id="an0">1</div></div>
          <div class="sml">えのぐの りょう</div>
        </section>

        <section id="center">
          <div id="bowls">
            <div class="bwrap hide" id="tgtWrap">
              <div class="cap">おだいの いろ</div>
              <div class="bowl" id="tgt"><i></i></div>
            </div>
            <div class="bwrap">
              <div class="cap hide" id="mineCap">じぶんの いろ</div>
              <div class="bowl" id="bowl"><i></i></div>
            </div>
          </div>
          <div id="ratio">えのぐを えらんでね</div>
          <div id="made"></div>
          <div id="paperCap">かみに ぬると…</div>
          <div id="paperBox"><div id="stroke"></div></div>
          <div id="water">
            <div class="lb">💧 みず</div>
            <input type="range" id="wt" class="wslider" min="0" max="8" step="1" value="0">
            <div class="num" id="wn">0</div>
          </div>
          <div id="near" class="hide">
            <div id="nbar"><div id="nfill"></div></div>
            <div id="nsay"></div>
          </div>
          <div id="qbtns" class="hide">
            <button id="check" class="btn gold">くらべて みる</button>
            <button id="qnext" class="btn ok">つぎの もんだい →</button>
          </div>
        </section>

        <section class="slot" id="slot1">
          <div class="cap">2つめの いろ</div>
          <div class="dot" id="dot1"><span>？</span></div>
          <div class="nm" id="nm1"></div>
          <div class="amt"><input type="range" id="amt1" min="0" max="8" step="1" value="1"><div class="num" id="an1">1</div></div>
          <div class="sml">えのぐの りょう</div>
        </section>
      </div>

      <div id="bot">
        <div class="box">
          <div class="boxttl" id="palTtl">したの えのぐを おすと、ひかっている まるに 入るよ</div>
          <div class="pal" id="pal12"></div>
        </div>
        <div class="box" id="side">
          <div class="boxttl" id="sideTtl">つくった いろ</div>
          <div id="cards"></div>
          <div id="qlist" class="hide"></div>
          <div style="display:flex;gap:5px;justify-content:center;margin-top:3px">
            <button id="save" class="btn blue">カードに のこす</button>
            <button id="qhint" class="btn ghost hide">つかう えのぐ</button>
          </div>
        </div>
      </div>
      <p id="tip"></p>
    </section>

    <!-- ③ わで くらべる -->
    <section class="step hide" id="s3">
      <div class="wrap">
        <div id="wheelBox"><svg id="wheel" viewBox="0 0 320 320"></svg></div>
        <div id="wpanel">
          <div class="cap">まぜた いろ</div>
          <div id="wres"></div>
          <div id="wkind"></div>
          <div id="wsay">わの 中の いろを 2つ おしてね</div>
          <button id="oppBtn" class="btn blue">むかいあわせを ぜんぶ 見る ▶</button>
          <div id="opp" class="hide"></div>
        </div>
      </div>
      <p id="tip3" style="text-align:center;min-height:1.3em" class="sml"></p>
    </section>

    <!-- ④ ぬって みる -->
    <section class="step hide" id="s4">
      <div class="wrap">
        <div id="artBox"><svg id="art" viewBox="0 0 400 300"></svg></div>
        <div id="apanel">
          <div id="nowc"><div class="cap">えらんだ いろ</div><div id="nowdot"></div></div>
          <div class="boxttl">つくった いろ</div>
          <div id="cards4" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px"></div>
          <div class="boxttl">えのぐ</div>
          <div class="pal" id="pal12b" style="grid-template-columns:repeat(6,1fr)"></div>
        </div>
      </div>
      <p id="tip4" style="text-align:center;min-height:1.3em" class="sml"></p>
    </section>

  </div>
</div>

<script>
"use strict";
/* ============================================================
   えのぐの まぜかた（RYB顔料モデル ＋ 三線形補間）
   くわしい わけは CLAUDE.md に 書いて ある。
   ・ひかりの まぜかた（RGB）の 平均では「きいろ＋あお」が はいいろに なる
   ・ネットの rgbToRyb/rybToRgb の 対は まぜると 暗く なる
     （あか＋きいろ が こげ茶に なった）ので つかわない
   ・顔料（あか・きいろ・あお）の りょうを たし算し、
     RYB の 8つの かどの あいだを とって 見た目に なおす
   ・しろ と くろ は 顔料では なく べつの らん（W・K）で もつ
   ============================================================ */
var CUBE={ w:[255,255,255], r:[230,10,26], y:[255,222,0], b:[0,92,240],
           v:[110,40,158], g:[10,150,50], o:[246,124,6], k:[60,44,32] };
var PAPER=[253,250,244], BLACKP=[36,32,30];
function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function tri(r,y,b){
  var c00=lerp3(CUBE.w,CUBE.r,r), c10=lerp3(CUBE.y,CUBE.o,r);
  var c01=lerp3(CUBE.b,CUBE.v,r), c11=lerp3(CUBE.g,CUBE.k,r);
  return lerp3(lerp3(c00,c10,y), lerp3(c01,c11,y), b);
}
var COLORS=[
  {name:"しろ",      p:[0,0,0],           w:1.00,k:0.00,s:1.40},
  {name:"レモンいろ",p:[0.00,0.97,0.03],  w:0.02,k:0.00,s:0.85},
  {name:"きいろ",    p:[0.09,0.91,0.00],  w:0.00,k:0.00,s:0.90},
  {name:"おうどいろ",p:[0.30,0.58,0.12],  w:0.26,k:0.08,s:0.95},
  {name:"ちゃいろ",  p:[0.42,0.38,0.20],  w:0.00,k:0.20,s:1.10},
  {name:"しゅいろ",  p:[0.58,0.42,0.00],  w:0.00,k:0.00,s:1.05},
  {name:"あか",      p:[0.95,0.03,0.02],  w:0.00,k:0.00,s:1.15},
  {name:"あお",      p:[0.02,0.04,0.94],  w:0.00,k:0.00,s:1.10},
  {name:"あいいろ",  p:[0.12,0.02,0.86],  w:0.00,k:1.15,s:1.45},
  {name:"きみどり",  p:[0.03,0.58,0.39],  w:0.34,k:0.02,s:0.85},
  {name:"みどり",    p:[0.01,0.50,0.49],  w:0.00,k:0.14,s:1.15},
  {name:"くろ",      p:[0,0,0],           w:0.00,k:1.00,s:2.80}
];
function byName(n){for(var i=0;i<COLORS.length;i++) if(COLORS[i].name===n) return COLORS[i]; return null;}

function mixPaint(list){
  var R=0,Y=0,B=0,W=0,K=0,i,q,a;
  for(i=0;i<list.length;i++){
    q=list[i].c; a=list[i].a*q.s; if(a<=0) continue;
    R+=q.p[0]*a; Y+=q.p[1]*a; B+=q.p[2]*a; W+=q.w*a; K+=q.k*a;
  }
  var C=R+Y+B, tot=C+W+K;
  if(tot<=0) return PAPER.slice();
  var base=PAPER.slice();
  if(C>0){ var m=Math.max(R,Y,B); base=tri(R/m,Y/m,B/m); }
  var fc=C/tot, fw=W/tot, fk=K/tot;
  if(fw>0&&C>0){ /* しろを まぜると くすむ。みずでは くすまない */
    var gy=0.299*base[0]+0.587*base[1]+0.114*base[2], t=0.45*fw;
    base=[base[0]+(gy-base[0])*t, base[1]+(gy-base[1])*t, base[2]+(gy-base[2])*t];
  }
  var out=[0,0,0];
  for(i=0;i<3;i++) out[i]=Math.round(base[i]*fc+PAPER[i]*fw+BLACKP[i]*fk);
  return out;
}
/* みず＝かみの しろが すける ぶん */
function waterT(paintAmt,w){ if(w<=0||paintAmt<=0) return 0; return Math.min(0.88, w/(w+paintAmt*1.15)); }
function withWater(base,paintAmt,w){
  var t=waterT(paintAmt,w),o=[0,0,0];
  for(var i=0;i<3;i++) o[i]=Math.round(base[i]+(PAPER[i]-base[i])*t);
  return o;
}
function css(c){return "rgb("+c[0]+","+c[1]+","+c[2]+")";}
/* 2つの いろの ちがい（redmean）。小さいほど 近い */
function cdist(a,b){
  var rm=(a[0]+b[0])/2, dr=a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2];
  return Math.sqrt((2+rm/256)*dr*dr + 4*dg*dg + (2+(255-rm)/256)*db*db);
}

/* ---- できた いろの なまえ ----
   いろの なまえは「きまった なまえの いろ」を ならべて おいて、
   いちばん 近い ものを えらぶ。しきい値で ばあい分け すると
   しろが「うすい やまぶきいろ」に なる（HSLの さいどは 白に 近いほど はねる）。
   合わない 色が 出たら ここに 1行 足すだけで よい。同じ なまえを 2行 書いて よい。 */
var NAMES=[
  ["しろ",253,250,244],["うすい はいいろ",198,194,188],["はいいろ",142,138,132],["はいいろ",108,104,100],
  ["くろ",42,38,36],["うすい ピンク",246,205,206],["ピンク",238,152,160],["こい ピンク",224,84,110],
  ["あか",228,14,28],["あかちゃいろ",155,64,56],["だいだいいろ",238,106,16],["やまぶきいろ",245,163,0],
  ["うすい だいだいいろ",248,196,150],["ちゃいろ",138,72,26],["こげちゃいろ",77,48,22],["うすい ちゃいろ",198,166,142],
  ["おうどいろ",202,166,67],["レモンいろ",247,220,10],["きいろ",254,212,1],["うすい きいろ",248,234,170],
  ["うすい きいろ",226,208,160],["くらい きいろ",94,82,24],["きみどり",134,184,94],["きみどり",175,200,60],
  ["うすい きみどり",196,222,168],["みどり",18,135,46],["ふかい みどり",20,83,45],["ふかい みどり",70,80,45],
  ["うすい みどり",150,200,160],["あおみどり",14,138,125],["みずいろ",157,198,232],["うすい みずいろ",205,222,238],
  ["あお",3,93,230],["こんいろ",26,57,120],["こんいろ",30,44,80],["くすんだ あお",104,120,150],
  ["むらさき",113,39,143],["ふじいろ",183,154,214],["あかむらさき",165,42,110]
];
function colorName(c){
  var best=0,bd=1e9,i,n,rm,dr,dg,db,d;
  for(i=0;i<NAMES.length;i++){
    n=NAMES[i]; rm=(c[0]+n[1])/2; dr=c[0]-n[1]; dg=c[1]-n[2]; db=c[2]-n[3];
    d=(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;
    if(d<bd){bd=d;best=i;}
  }
  return NAMES[best][0];
}

  var c=[],i,o,best=null;
  try{c.push(localStorage.getItem(KEY))}catch(e){}
  try{c.push(sessionStorage.getItem(KEY))}catch(e){}
  try{if((window.name||"").indexOf(KEY+":")===0) c.push(window.name.slice(KEY.length+1))}catch(e){}

/* ============ ①② まぜる ============ */
function curList(){

  return l;
}
function curPaintAmt(){ var l=curList(),t=0,i; for(i=0;i<l.length;i++) t+=l[i].a; return t; }
function curShown(){
  var l=curList(); if(!l.length) return null;
  return withWater(mixPaint(l),curPaintAmt(),S.water);
}
function gcd(a,b){ while(b){var t=a%b;a=b;b=t;} return a; }

function draw(){
  var i;
  for(i=0;i<2;i++){
    var c=S.sel[i], dot=$("dot"+i);

    $("stroke").style.background=css(base);

    var txt;
    if(l.length===2 && S.sel[0]!==S.sel[1]){
      var a=S.amt[0],b=S.amt[1],g=gcd(a,b)||1;
      txt=S.sel[0].name+" "+(a/g)+" : "+S.sel[1].name+" "+(b/g);
    }else txt=l[0].c.name+" だけ";

    $("ratio").textContent=txt;

  }

/* ---- ② クイズ ---- */
function drawQuiz(){
  var q=QUIZ[QI];
  $("tgt").style.background=css(qColor(q));
  var shown=curShown();
  $("check").disabled=(curList().length<2);
  if(!QDONE){ $("nfill").style.width="0%"; $("nsay").textContent=""; }
  var i,bs=$("qlist").children;
  for(i=0;i<bs.length;i++) bs[i].classList.toggle("on",i===QI);
  $("sideTtl").textContent = QHINT
    ? "この 2つの えのぐを つかうよ　→　"+q.c1+"　"+q.c2
    : "もんだいを えらぶ";
}
function judge(){
  if(curList().length<2){ $("nsay").textContent="まだ 2つ えらんで いないよ"; return; }
  var q=QUIZ[QI], t=qColor(q), me=curShown();
  /* ちがい（redmean）で 見る。ぴったり d<=24／おしい d<=75。
     ％は バーの ながさ。ためした 回数は 数えない（点とりに しない） */
  var d=cdist(me,t), sc=Math.max(0,Math.round(100*(1-d/300)));
  var ok=(d<=24), near=(d<=75);
  QDONE=true;
  $("nfill").style.width=sc+"%";
  $("nfill").style.background = ok?"var(--ok)" : near?"var(--gold)" : "#d9a06a";
  var head = ok ? "ぴったり！　" : near ? "おしい！　" : "もう ちょっと　";
  $("nsay").textContent = head+"ちかさ "+sc+"%"+(ok?"":"　"+advice());
  if(ok) $("tip").textContent="よく できました！　つぎの もんだいへ いこう";
}
/* ×で おわらせず、つぎに 何を すれば いいかを 出す。
   【大事】「みずの ちがい」と「色みの ちがい」を 分けて 見る。
   いっしょに 見ると、みずが 多すぎる ときに「あかを ふやそう」と
   出て しまう（えのぐを ふやしても うすさは 減るから。2026-09-22）。
   ①うすさが ちがえば みずの こと だけ 言う
   ②同じなら、みずを のぞいた 色どうしで くらべて、りょうを 1つ 動かす */
function advice(){
  var q=QUIZ[QI];
  var tt=waterT(q.a1+q.a2,q.w), tc=waterT(curPaintAmt(),S.water);
  if(tc-tt>0.10) return "みずを へらして みよう";
  if(tt-tc>0.10) return "みずを ふやして みよう";
  var tb=mixPaint([{c:byName(q.c1),a:q.a1},{c:byName(q.c2),a:q.a2}]);
  var bd=cdist(mixPaint(curList()),tb), best=null, i, dv, keep, d, l;
  for(i=0;i<2;i++){
    if(!S.sel[i]) continue;
    for(dv=-1;dv<=1;dv+=2){
      if(S.amt[i]+dv<0||S.amt[i]+dv>8) continue;
      keep=S.amt[i]; S.amt[i]+=dv;
      l=curList(); d = l.length ? cdist(mixPaint(l),tb) : 9999;
      S.amt[i]=keep;
      if(d<bd-1){ bd=d; best={i:i,dv:dv}; }
    }
  }
  if(!best) return "えのぐの くみあわせを かえて みよう";
  return S.sel[best.i].name+(best.dv>0?"を ふやして みよう":"を へらして みよう");
}

     S.amt[0] を 見て きめては いけない（カードが こわれる） */

function tip(){

  var t="", has=function(n){ return (S.sel[0]&&S.sel[0].name===n)||(S.sel[1]&&S.sel[1].name===n); };
  if(MODE==="quiz"){

/* ============ ③ いろの わ ============
   あか・きいろ・あお の 3つから 作った 12の いろを 輪に する。
   むかいあわせ（6つ はなれた ところ）を まぜると にごる。 */
var WHEEL=[
  [["あか",3]], [["あか",2],["きいろ",1]], [["あか",1],["きいろ",1]], [["あか",1],["きいろ",2]],
  [["きいろ",3]], [["きいろ",2],["あお",1]], [["きいろ",1],["あお",1]], [["きいろ",1],["あお",2]],
  [["あお",3]], [["あお",2],["あか",1]], [["あお",1],["あか",1]], [["あお",1],["あか",2]]
];

   そろえないと「あか3」と「きいろ1＋あお1」を まぜた ときに あかが 勝って しまい、
   むかいあわせなのに にごらない（2026-09-22）。もどさないこと */
function wList(i){
  var l=WHEEL[i].map(function(x){ return {c:byName(x[0]),a:x[1]}; }), t=0, j;
  for(j=0;j<l.length;j++) t+=l[j].a*l[j].c.s;
  var k=3.0/t;
  for(j=0;j<l.length;j++) l[j].a*=k;

}

function buildWheel(){
  var sv=$("wheel"), cx=160, cy=160, R=148, r=62, i, NS="http://www.w3.org/2000/svg";
  sv.innerHTML="";

    var a0=(i*30-105)*Math.PI/180, a1=((i+1)*30-105)*Math.PI/180;
    var p=document.createElementNS(NS,"path");
    var x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    var x2=cx+r*Math.cos(a1), y2=cy+r*Math.sin(a1), x3=cx+r*Math.cos(a0), y3=cy+r*Math.sin(a0);
    p.setAttribute("d","M"+x0+" "+y0+"A"+R+" "+R+" 0 0 1 "+x1+" "+y1+"L"+x2+" "+y2+"A"+r+" "+r+" 0 0 0 "+x3+" "+y3+"Z");

  lb.textContent="いろの わ";

function wMark(){

  SCENE.forEach(function(g){
    var p=document.createElementNS(NS,"path");
    p.setAttribute("d",g.d); p.setAttribute("class","rg"); p.dataset.id=g.id;
    p.setAttribute("fill", ART[g.id]||"#fffdf7");
    p.addEventListener("click",function(){
      if(!PICK4){ $("tip4").textContent="さきに いろを えらんでね"; return; }
      ART[g.id]=PICK4; p.setAttribute("fill",PICK4); sSave();
      $("tip4").textContent=g.nm+"を ぬったよ";
    });
    sv.appendChild(p);
  });
}
function build4Cards(){
  var box=$("cards4"); if(!box) return;
  box.innerHTML="";
  for(var i=0;i<6;i++){
    var d=document.createElement("div"), cd=CARDS[i];
    if(!cd){ d.className="card empty"; }
    else{
      d.className="card";
      d.innerHTML='<div class="mix" style="background:'+css(cd.rgb)+'"></div>'
                 +'<div class="rec">'+recipeBar(cd)+'</div>';
      (function(col,el){ el.addEventListener("click",function(){ pick4(col); }); })(css(cd.rgb),d);
    }
    box.appendChild(d);
  }
}
function pick4(c){ PICK4=c; $("nowdot").style.background=c; $("tip4").textContent="えの 中を おすと ぬれるよ"; }

/* ============ そうさ ============ */
[0,1].forEach(function(i){
  $("slot"+i).addEventListener("click",function(e){
    if(e.target.tagName==="INPUT") return;
    S.active=i; draw();
  });
  $("amt"+i).addEventListener("input",function(e){ S.amt[i]=parseInt(e.target.value,10); QDONE=false; draw(); });
});
$("wt").addEventListener("input",function(e){ S.water=parseInt(e.target.value,10); QDONE=false; draw(); });
$("save").addEventListener("click",saveCard);
$("check").addEventListener("click",judge);
$("qnext").addEventListener("click",function(){ setQ((QI+1)%QUIZ.length); });
$("qhint").addEventListener("click",function(){ QHINT=!QHINT; drawQuiz(); tip(); });
$("oppBtn").addEventListener("click",function(){
  var h=$("opp").classList.toggle("hide");
  $("oppBtn").textContent = h ? "むかいあわせを ぜんぶ 見る ▶" : "わに もどす";
  if(!h) $("wsay").textContent="6つの くみあわせ。どれも くすんで 暗い 色に なるよ";
});

function setQ(i){
  QI=i; QDONE=false;
  S.sel=[null,null]; S.amt=[1,1]; S.water=0; S.active=0;
  $("amt0").value=1; $("amt1").value=1; $("wt").value=0;
  draw();
}
function buildQList(){
  var box=$("qlist"); box.innerHTML="";
  QUIZ.forEach(function(q,i){
    var b=document.createElement("button"); b.textContent=(i+1);
    b.addEventListener("click",function(){ setQ(i); });
    box.appendChild(b);
  });
}

/* ---- タブ ---- */
function show(n){
  STEP=n;
  var tb=$("tabs").children,i;
  for(i=0;i<tb.length;i++) tb[i].classList.toggle("on", i===n-1);
  $("s12").classList.toggle("hide", n>2);
  $("s3").classList.toggle("hide", n!==3);
  $("s4").classList.toggle("hide", n!==4);
  if(n<=2){
    MODE=(n===2)?"quiz":"free";
    var q=(MODE==="quiz");
    $("center").classList.toggle("quiz",q);
    $("tgtWrap").classList.toggle("hide",!q);
    $("mineCap").classList.toggle("hide",!q);
    $("near").classList.toggle("hide",!q);
    $("qbtns").classList.toggle("hide",!q);
    $("made").classList.toggle("hide",q);
    $("paperCap").classList.toggle("hide",q);
    $("paperBox").classList.toggle("hide",q);
    $("cards").classList.toggle("hide",q);
    $("qlist").classList.toggle("hide",!q);
    $("save").classList.toggle("hide",q);
    $("qhint").classList.toggle("hide",!q);
    if(q) setQ(QI); else draw();
  }
  if(n===3){ wShow(); $("tip3").textContent="この わの いろは、ぜんぶ あか・きいろ・あお から 作って あるよ"; }
  if(n===4){ build4Cards(); $("tip4").textContent=PICK4?"えの 中を おすと ぬれるよ":"いろを えらんで、えの 中を おそう"; }
}
var tbs=$("tabs").children;
for(var ti=0;ti<tbs.length;ti++){
  (function(n){ tbs[n-1].addEventListener("click",function(){ show(n); }); })(ti+1);
}

$("reset").addEventListener("click",function(){
  if(STEP===3){ W3={a:null,b:null}; wMark(); wShow(); $("opp").classList.add("hide");
    $("oppBtn").textContent="むかいあわせを ぜんぶ 見る ▶"; return; }
  if(STEP===4){ ART={}; buildArt(); sSave(); $("tip4").textContent="ぜんぶ けしたよ"; return; }
  if(STEP===2){ setQ(QI); return; }
  S.sel=[null,null]; S.amt=[1,1]; S.water=0; S.active=0;
  $("amt0").value=1; $("amt1").value=1; $("wt").value=0;
  draw();
});

/* ---- がめんの 高さ ---- */
function fit(){
  var h=(window.visualViewport?window.visualViewport.height:window.innerHeight);
  document.documentElement.style.setProperty("--appH",h+"px");
}
window.addEventListener("resize",fit);
if(window.visualViewport) window.visualViewport.addEventListener("resize",fit);
fit();

/* ---- はじめ ---- */
var saved=sLoad();
if(saved){ CARDS=saved.cards||[]; ART=saved.art||{}; }
buildPal($("pal12"),function(c){
  S.sel[S.active]=c; S.active=(S.active===0)?1:0; QDONE=false; draw();
});
buildPal($("pal12b"),function(c){ pick4(swatchOf(c)); });
buildQList();
buildWheel();
buildOpp();
buildArt();
show(1);
</script>
</body>
