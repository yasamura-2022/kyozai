<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>体積</title>
<style>
  :root{
    --ink:#2b2118;
    --paper:#fdf6e3;
    --card:#fffdf7;
    --line:#e7d9b8;
    --gold:#c9a227;
    --gold-d:#8f7417;
    --ok:#5a8a4c;
    --flash:#ffe14d;
    --blue:#2f6fa8;          /* 同じ 問題の 中で 進む */
    --acc:#2f8f8a;           /* この アプリの 色＝1だん分（たて × 横） */
    --acc-s:#e2f3f1;
    --dan:#a8691f;           /* だんの 数（高さ） */
    --dan-s:#fbeedb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
    background:
      radial-gradient(circle at 12% 8%,#dff2ef 0,transparent 38%),
      radial-gradient(circle at 88% 92%,#fbe6cf 0,transparent 45%),
      var(--paper);
    color:var(--ink);
    position:fixed;inset:0;width:100%;
    height:var(--fh,100dvh);
    padding:6px 8px 10px;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;
  }
  button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
  .app{width:100%;max-width:1100px;height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
  .hidden{display:none !important}

  header{text-align:center;flex-shrink:0;display:flex;align-items:baseline;justify-content:center;gap:14px}
  h1{font-size:clamp(18px,calc(1.2vw + 1.5vh),28px);letter-spacing:.08em;color:var(--acc)}
  header .sub{font-weight:800;color:#6f5d3d;font-size:clamp(14px,calc(.8vw + 1.1vh),21px)}

  /* ===== ならび：よこ長＝左に 絵、右に はたらく ところ／たて長＝上に 絵 ===== */
  #main{flex:1;min-height:0;display:grid;gap:8px;
    grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage" "work"}
  @media (orientation:landscape){
    #main{grid-template-columns:minmax(0,1.45fr) minmax(310px,1fr);grid-template-rows:minmax(0,1fr);
      grid-template-areas:"stage work"}
  }

  /* ===== 絵 ===== */
  #stage{grid-area:stage;min-height:0;border-radius:18px;border:3px solid #b9d9d5;
    background:linear-gradient(#fbfefd,#eef7f5);
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px;
    contain:size}      /* 絵の 大きさで 行を おし広げない */
  #stage > svg{width:100%;height:100%;display:block}
  #stage.tapped{animation:tapped .25s}
  @keyframes tapped{50%{background:#fff6cf}}
  .nw{animation:drop .42s cubic-bezier(.3,1.35,.6,1) both}
  @keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}

  /* 1cm³ の しるし（左上） */
  .unit{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);
    border:2px solid #cfe5e2;border-radius:12px;padding:4px 10px 4px 6px;font-weight:800;color:#3d5e5b;
    font-size:clamp(12px,calc(.5vw + 1vh),17px);line-height:1.25;pointer-events:none}
  .unit svg{width:clamp(26px,3.6vh,40px);height:auto;flex:none}
  .unit b{color:var(--acc);font-size:1.12em}
  /* だんを 分けて 見る（右上） */
  #explode{position:absolute;right:8px;top:8px;border:2px solid var(--line);background:var(--card);border-radius:12px;
    padding:6px 12px;font-weight:800;color:#6f5d3d;font-size:clamp(13px,calc(.5vw + 1.1vh),18px)}
  #explode.on{background:var(--dan-s);border-color:var(--dan);color:var(--dan)}

  /* ===== はたらく ところ ===== */
  #work{grid-area:work;display:flex;flex-direction:column;gap:8px;min-height:0}
  .prob{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;
    font-weight:800;font-size:clamp(14px,calc(.6vw + 1.3vh),21px);word-break:keep-all;flex-wrap:wrap;justify-content:center}
  .prob .no{color:#8a7a5f;font-size:.82em}
  .prob .dim{white-space:nowrap}
  .prob .dim b{font-size:1.2em}
  .say{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;
    font-weight:800;color:#5d5040;line-height:1.5;text-align:center;word-break:keep-all;
    min-height:calc(3em + 20px);display:flex;align-items:center;justify-content:center;
    font-size:clamp(14px,calc(.7vw + 1.25vh),21px)}
  .say.ok{color:var(--ok);border-color:var(--ok);background:#f2f9ee}
  .say.try{color:#b3566f;border-color:#d9748f;background:#fbe3ea}
  .say .a{color:var(--acc)} .say .d{color:var(--dan)}

  /* 積んで いく ときの 数 */
  .trail{text-align:center;font-weight:800;color:#5d5040;font-variant-numeric:tabular-nums;
    font-size:clamp(20px,calc(1vw + 2.4vh),36px)}
  .trail .a{color:var(--acc)} .trail .d{color:var(--dan)}
  .trail small{font-size:.6em}

  /* しき */
  .shiki{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .eq{display:flex;align-items:flex-start;justify-content:center;gap:6px;font-weight:800;
    font-size:clamp(24px,calc(1.3vw + 3vh),46px);line-height:1;font-variant-numeric:tabular-nums}
  .eq .op{padding-top:.28em}
  .eq .u{padding-top:.42em;font-size:.6em}
  .slotw{display:flex;flex-direction:column;align-items:center;gap:4px}
  .slot,.resbox{min-width:1.7em;height:1.5em;padding:0 .12em;border:3px dashed #cbb98f;border-radius:12px;background:#fff;
    display:flex;align-items:center;justify-content:center}
  .slot.sel{border-color:var(--blue);background:#eaf1f8}
  .slot.fill{border-style:solid;border-color:#9a8763}
  .slot.fix{border:3px solid var(--acc);background:var(--acc-s);color:var(--acc)}
  .slot.good{border-color:var(--ok);background:#eaf5e4}
  .slot.gd-a{border:3px solid var(--acc);background:var(--acc-s);color:var(--acc)}
  .slot.gd-d{border:3px solid var(--dan);background:var(--dan-s);color:var(--dan)}
  .resbox{border-color:transparent;background:transparent;color:#8a7a5f}
  .resbox.good{border:3px solid var(--gold);background:#fff4c9;color:var(--ink)}
  .what{font-size:clamp(11px,calc(.5vw + .95vh),16px);color:#8a7a5f;white-space:nowrap;min-height:1.2em}
  .what.a{color:var(--acc)} .what.d{color:var(--dan)}
  .cards{display:flex;gap:14px;justify-content:center;min-height:clamp(48px,calc(2vw + 4.6vh),74px)}
  .cardn{width:clamp(56px,calc(2.6vw + 5vh),84px);height:clamp(48px,calc(2vw + 4.6vh),74px);border-radius:14px;
    background:#fff;border:3px solid var(--acc);box-shadow:0 4px 0 #1f6763;
    font-weight:800;font-size:clamp(24px,calc(1.2vw + 2.8vh),42px);color:var(--ink);touch-action:none}
  .cardn.sel{background:var(--flash);transform:translateY(-3px)}
  .cardn.gone{visibility:hidden}
  .ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.08)}

  /* まとめ */
  .sum{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;
    font-weight:800;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:4px}
  .fgrid{display:grid;grid-template-columns:repeat(5,auto);column-gap:.3em;row-gap:0;align-items:end;justify-items:center;
    font-size:clamp(20px,calc(1vw + 2.3vh),36px);line-height:1.15}
  .fgrid .lb{font-size:.5em;color:#8a7a5f;padding-bottom:.15em}
  .fgrid .a{color:var(--acc)} .fgrid .d{color:var(--dan)}
  .fgrid .lb.a,.fgrid .lb.d{font-weight:800}
  .fgrid .lb.sp{padding-top:.35em}
  .vol{font-size:clamp(20px,calc(1vw + 2.4vh),36px)}
  .vol .gd{background:#fff4c9;border:2px solid var(--gold);border-radius:8px;padding:0 .25em}
  sup{font-size:.6em;vertical-align:.55em;line-height:0}

  /* ボタン：青＝同じ 問題の 中で 進む／金＝答え合わせ／みどり＝次の 問題／茶＝もどす */
  .actions{display:flex;gap:8px;flex-shrink:0;margin-top:auto}
  .btn{flex:1;border:none;border-radius:14px;padding:13px 4px;font-weight:800;color:#fff;
    font-size:clamp(15px,calc(.7vw + 1.6vh),23px);transition:transform .08s;word-break:keep-all}
  .btn:active{transform:translateY(2px)}
  .btn.play{background:var(--blue);box-shadow:0 4px 0 #214f7a}
  .btn.show{background:var(--gold);box-shadow:0 4px 0 #a5811a}
  .btn.next{background:var(--ok);box-shadow:0 4px 0 #446838}
  .btn.sub{background:#a99a7c;box-shadow:0 4px 0 #85795f;flex:.6}
  .btn:disabled{opacity:.45;box-shadow:none}


  
/* ===== タブ ===== */
  .tabs{display:flex;gap:6px;flex-shrink:0}
  .tab{
    flex:1;border:2px solid var(--line);border-radius:14px;background:var(--card);
    padding:7px 4px;color:#8a7a5f;font-weight:800;
    font-size:clamp(12px,calc(.9vw + .7vh),17px);display:flex;flex-direction:column;align-items:center;gap:1px;
    line-height:1.15;word-break:keep-all;
  }
  .tab .step{font-size:11px;font-weight:700;opacity:.7}
  .tab.on{color:var(--ink);border-color:var(--gold);box-shadow:0 3px 0 #a5811a}
  .tab.on .step{color:var(--gold);opacity:1}

  /* ===== ステップ３：高さを のばす ===== */
  #main1,#main3,#main4{flex:1;min-height:0;display:grid;gap:8px;
    grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage" "work"}
  @media (orientation:landscape){
    #main1,#main3,#main4{grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"stage work"}
    #work1,#work3,#work4{justify-content:center}
  }
  @media (orientation:portrait){ #work1,#work3,#work4{min-height:clamp(300px,46vh,560px)} }
  #stage1,#stage3,#stage4{grid-area:stage;min-height:0;border-radius:18px;border:3px solid #b9d9d5;
    background:linear-gradient(#fbfefd,#eef7f5);position:relative;overflow:hidden;padding:6px;contain:size}
  #stage1 > svg,#stage3 > svg,#stage4 > svg{width:100%;height:100%;display:block}
  #stage1.tapped,#stage3.tapped,#stage4.tapped{animation:tapped .25s}
  #work1,#work3,#work4{grid-area:work;display:flex;flex-direction:column;gap:8px;min-height:0}
  /* 3択と ボタンの 場所は いつも とって おく＝場面が かわっても 絵の 大きさが 動かない */
  #actions1,#actions3,#actions4{min-height:54px}
  @media (max-height:640px){ #actions1,#actions3,#actions4{min-height:46px} }
  .tblwrap{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:calc(1.9em + 4px) 8px calc(1.9em + 4px);font-size:clamp(15px,calc(.7vw + 1.5vh),24px)}
  .tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
  .tbl th{font-size:.72em;color:#6f5d3d;width:5.2em;line-height:1.2;padding:2px;word-break:keep-all}
  .tbl th small{display:block;font-size:.9em;color:#8a7a5f}
  .tbl td{border:2px solid var(--line);background:#fff;height:1.8em;padding:0}
  .tbl tr.h td{color:var(--dan)}
  .tbl tr.v td{color:var(--ink)}
  .tbl td.new{background:#fff6cf}
  .tbl td.hl{background:#fff4c9;border-color:var(--gold)}
  .tbl td.emp{color:transparent}
  #arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .choices{display:flex;gap:10px;justify-content:center}
  .choices.off{visibility:hidden}
  .choice{flex:1;max-width:150px;border:3px solid var(--line);border-radius:16px;background:#fff;font-weight:800;color:var(--ink);
    padding:8px 0;font-size:clamp(20px,calc(1vw + 2.4vh),34px);box-shadow:0 4px 0 #d8c79f}
  .choice:active{transform:translateY(2px)}
  .choice:disabled{opacity:.35;box-shadow:none}
  .choice.good{border-color:var(--ok);background:#eaf5e4}
  /* ことばが 長い 3択は たてに ならべる（「Aが 4cm³ 大きい」） */
  .choices.col .choice{max-width:none;font-size:clamp(17px,calc(.7vw + 1.9vh),28px)}
  @media (orientation:landscape){   /* よこ長は 右の らんが せまいので たてに（たて長は よこ はばが あるので よこの まま＝絵の 大きさが 動かない） */
    .choices.col{flex-direction:column;align-items:stretch;gap:6px}
    .choices.col .choice{padding:5px 0}
  }

  /* ===== ステップ４：大きな 単位 ===== */
  .parts{display:flex;gap:6px}
  .part{flex:1;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 2px;font-weight:800;color:#8a7a5f;
    font-size:clamp(12px,calc(.5vw + 1.1vh),17px);line-height:1.2;word-break:keep-all}
  .part.on{background:var(--acc-s);border-color:var(--acc);color:var(--acc)}
  .choice.long{font-size:clamp(17px,calc(.8vw + 2vh),28px);max-width:190px}
  #utbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
  #utbl table{border-collapse:separate;border-spacing:6px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;
    font-size:clamp(16px,calc(.9vw + 2vh),32px)}
  #utbl th{color:#6f5d3d;font-size:.72em;padding:0 .3em;white-space:nowrap}
  #utbl td{background:#fff;border:3px solid var(--line);border-radius:12px;padding:.35em .5em;min-width:4.6em;white-space:nowrap}
  #utbl td.blank{border-style:dashed;color:#b9a67c}
  #utbl td.cur{border:3px solid var(--gold);background:#fff4c9;color:var(--ink)}
  #utbl td.done{border-color:var(--acc);color:var(--acc)}
  #utbl td.x{background:transparent;border:none;color:#a8691f;font-size:.8em;min-width:3.6em;padding:0 .1em}   /* 「×1000」の 場所を はじめから とって おく */
  #utbl .note{font-size:.55em;color:#8a7a5f;display:block}
  @media (orientation:landscape){ #work{justify-content:center} }
  /* たて長：下の らんの 高さを 先に とって おく（進むたびに 絵の 大きさが 変わらない ように） */
  @media (orientation:portrait){ #work{min-height:clamp(260px,43vh,540px)} }
  @media (max-height:640px){
    header{display:none}
    .tab{padding:5px 4px}
    .tab .step{display:none}
    #work3{gap:5px}
    .choice{padding:4px 0;font-size:22px}
    #work{gap:5px}
    .prob{padding:4px 10px}
    .say{padding:5px 10px;min-height:calc(3em + 10px);font-size:14px}
    .shiki{padding:5px;gap:5px}
    .btn{padding:10px 4px}
    .sum{padding:5px 8px}
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>体積</h1></header>

  <div class="tabs">
    <button class="tab on" data-m="s1"><span class="step">ステップ１</span>1cm³で 測る</button>
    <button class="tab" data-m="s2"><span class="step">ステップ２</span>1だんずつ 積む</button>
    <button class="tab" data-m="s3"><span class="step">ステップ３</span>高さを のばす</button>
    <button class="tab" data-m="s4"><span class="step">ステップ４</span>大きな 単位</button>
  </div>

  <div id="main1">
    <div id="stage1"><svg id="pic1"></svg></div>
    <div id="work1">
      <div class="prob" id="prob1"></div>
      <div class="say" id="say1"></div>
      <div class="choices off" id="choices1"></div>
      <div class="actions" id="actions1"></div>
    </div>
  </div>

  <div id="main" class="hidden">
    <div id="stage">
      <div class="unit" id="unit"></div>
      <button id="explode" type="button" class="hidden">だんを 分けて 見る</button>
      <svg id="pic"></svg>
    </div>

    <div id="work">
      <div class="prob" id="prob"></div>
      <div class="say" id="say"></div>
      <div class="trail hidden" id="trail"></div>
      <div class="shiki hidden" id="shiki">
        <div class="eq" id="eq"></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="sum hidden" id="sum"></div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <div id="main3" class="hidden">
    <div id="stage3"><svg id="pic3"></svg></div>
    <div id="work3">
      <div class="prob" id="prob3"></div>
      <div class="tblwrap" id="tblwrap"><table class="tbl" id="tbl"></table><svg id="arrows"></svg></div>
      <div class="say" id="say3"></div>
      <div class="choices hidden" id="choices3"></div>
      <div class="actions" id="actions3"></div>
    </div>
  </div>

  <div id="main4" class="hidden">
    <div id="stage4"><svg id="pic4"></svg><div id="utbl" class="hidden"></div></div>
    <div id="work4">
      <div class="parts" id="parts4">
        <button class="part" data-p="0">1辺 10cmの 立方体</button>
        <button class="part" data-p="1">1辺 1mの 立方体</button>
        <button class="part" data-p="2">表に まとめる</button>
      </div>
      <div class="say" id="say4"></div>
      <div class="choices off" id="choices4"></div>
      <div class="actions" id="actions4"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

/* ===== 画面の 高さ（Googleサイトの iframe でも ずれないように） ===== */
function setFH(){
  const v=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty('--fh',v+'px');
}
setFH();
addEventListener('resize',()=>{setFH();draw();if(MODE==='s1')draw1();if(MODE==='s3')draw3();if(MODE==='s4')draw4();});
if(window.visualViewport) visualViewport.addEventListener('resize',setFH);

/* ===== 問題（じゅんばんは きめて ある。ランダムに しない）
   解説（算数編 p.259-261 第5学年 B(4) 立体図形の体積）：
   「単位体積の立方体をきちんと敷き詰めた１段分の個数を（縦）×（横），その段の個数を（高さ）で
     それぞれ表すことができることについての理解を確実にする必要がある」
   → 1だん目を しきつめて「たて × 横」、同じ だんを 積んで「× 高さ」。
   d＝たて（おく）、w＝横、h＝高さ。立方体（さいご）の ほかは 3つの 数を みな ちがう 数に する
   （カードで どの 数を 入れたか 見分けられる ように）。
   1・2問目と 3〜5問目は 体積が 同じで 形が ちがう（24・60） ===== */
const P=[{d:2,w:3,h:4},{d:3,w:4,h:2},{d:4,w:5,h:3},{d:2,w:6,h:5},
         {d:5,w:3,h:4},{d:4,w:6,h:2},{d:5,w:6,h:4},{d:3,w:3,h:3}];

const S={pi:0,phase:'intro',rows:0,layers:0,explode:false,newRow:-1,newLayer:-1,
         slots:[],sel:null,cards:[],busy:false};
const Q=()=>P[S.pi];
const base=()=>Q().d*Q().w;

/* ===== 絵：見取図（前の 面は そのままの 形、おくゆきは 右上へ） ===== */
const U=40,DX=U*0.46,DY=-U*0.33,GAP=U*0.62;
const TONE=[{f:'#8fd0c9',t:'#c4ebe6',r:'#62aca4',s:'#2f7f79'},   /* だんごとに 色を かえる＝だんが 見分けられる */
            {f:'#f2c690',t:'#fae2c1',r:'#d6a263',s:'#a0702f'}];
function pt(i,j,k,L){return [i*U+j*DX, -k*U+j*DY-(S.explode?L*GAP:0)];}
const ps=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function cube(i,j,k,L,tone,cls){
  const c=(a,b,e)=>pt(i+a,j+b,k+e,L);
  return `<g class="${cls||''}">`+
    `<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="${tone.f}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/>`+
    `<polygon points="${ps([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)])}" fill="${tone.t}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/>`+
    `<polygon points="${ps([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)])}" fill="${tone.r}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/>`+
    `</g>`;
}
function txt(x,y,s,o={}){
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${o.fs||U*0.5}" font-weight="800" fill="${o.c||'#5d5040'}" `+
    `text-anchor="${o.a||'middle'}" paint-order="stroke" stroke="#fbfefd" stroke-width="${o.sw==null?5:o.sw}" stroke-linejoin="round">${s}</text>`;
}
function draw(){
  const {d:D,w:W,h:H}=Q(),ex=S.explode;
  const M=Math.max(1,(W+0.46*D)/5.2,H/4.6),V=U*M;   /* 大きい 直方体でも 字が 小さく ならない ように */
  const minX=-V*2.5, maxX=Math.max(W*U+D*DX+V*2.6, W*U+D*DX/2+V*3.6);   /* 「たて ○cm」が 右で 切れない ように */
  const topY=-(H*U+(ex?(H-1)*GAP:0))+D*DY-V*0.5, botY=V*1.45;
  let g='';

  /* 入れもの（直方体）の 線。見えない 辺も 点線で かく＝見取図 */
  if(!ex){
    const c=(a,b,e)=>pt(a*W,b*D,e*H,0);
    const E=(p,q,dash)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#7d9a97" stroke-width="2" ${dash?'stroke-dasharray="6 6"':''}/>`;
    g+=`<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="rgba(255,255,255,.55)"/>`;
    g+=E(c(0,1,0),c(1,1,0),1)+E(c(0,1,0),c(0,0,0),1)+E(c(0,1,0),c(0,1,1),1);
  }

  /* 立方体。下の だん → おくの 列 → 左から の じゅんに かく（手前・上が あとに かかれて かくす） */
  const n=S.layers;
  for(let k=0;k<Math.max(n,S.rows>0?1:0);k++){
    const tone=TONE[k%2];
    const rowsHere=k<n?D:S.rows;
    for(let j=D-1;j>=0;j--){
      if(j>=rowsHere)continue;
      for(let i=0;i<W;i++){
        const cls=(k===S.newLayer)||(k===0&&n===0&&j===S.newRow)?'nw':'';
        g+=cube(i,j,k,k,tone,cls);
      }
    }
  }

  if(!ex){
    const c=(a,b,e)=>pt(a*W,b*D,e*H,0);
    const E=(p,q)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#5c7d7a" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round"/>`;
    g+=E(c(0,0,0),c(1,0,0))+E(c(1,0,0),c(1,0,1))+E(c(1,0,1),c(0,0,1))+E(c(0,0,1),c(0,0,0))
      +E(c(0,0,1),c(0,1,1))+E(c(0,1,1),c(1,1,1))+E(c(1,1,1),c(1,0,1))+E(c(1,0,0),c(1,1,0))+E(c(1,1,0),c(1,1,1));
  }

  /* ながさの 名前 */
  const fs=V*0.52, small=Math.min(V*0.4,U*0.56);
  const showCount=S.phase==='fill'||S.phase==='A';
  {
    const a=pt(0,0,0,0),b=pt(W,0,0,0);
    g+=txt((a[0]+b[0])/2,a[1]+V*1.15,`横 ${W}cm`,{fs});
    if(showCount) for(let i=0;i<W;i++) g+=txt((i+.5)*U,V*0.45,i+1,{fs:small,c:'#2f7f79'});
  }
  {
    const a=pt(W,0,0,0),b=pt(W,D,0,0);
    g+=txt((a[0]+b[0])/2+V*0.75,(a[1]+b[1])/2+V*1.0,`たて ${D}cm`,{fs,a:'start'});
    if(showCount) for(let j=0;j<D;j++){const p=pt(W,j+.5,0,0);g+=txt(p[0]+V*0.2,p[1]+V*0.3,j+1,{fs:small,c:'#2f7f79',a:'start'});}
  }
  if(!ex){
    const a=pt(0,0,0,0),b=pt(0,0,H,0);
    g+=txt(a[0]-V*1.55,(a[1]+b[1])/2-V*0.05,'高さ',{fs});
    g+=txt(a[0]-V*1.55,(a[1]+b[1])/2+fs*1.05,`${H}cm`,{fs});
  }
  /* 積んだ だんの 数（左）と 1だんの 数（右） */
  if(n>0){
    for(let k=0;k<n;k++){
      const L=pt(0,0,k+.5,k), R=pt(W,D,k+.5,k);
      g+=txt(L[0]-V*0.3,L[1]+small*0.35,k+1,{fs:small*1.1,c:'#a8691f',a:'end'});
      g+=txt(R[0]+V*0.25,R[1]+small*0.35,`${base()}個`,{fs:small*1.05,c:'#2f7f79',a:'start'});
    }
    if(ex){const L=pt(0,0,0,0);g+=txt(L[0]-V*0.3,L[1]+V*0.95,'だん',{fs:small,c:'#a8691f',a:'end'});}
  }

  const svg=$('pic');
  svg.setAttribute('viewBox',`${minX} ${topY} ${maxX-minX} ${botY-topY}`);
  svg.innerHTML=g;
  S.newRow=-1;S.newLayer=-1;
  $('explode').classList.toggle('hidden',!(n>=2&&(S.phase==='stack'||S.phase==='B'||S.phase==='done')));
  $('explode').classList.toggle('on',ex);
  $('explode').textContent=ex?'もとに もどす':'だんを 分けて 見る';
}
$('explode').addEventListener('click',e=>{e.stopPropagation();S.explode=!S.explode;draw();});

/* 1cm³ の しるし */
$('unit').innerHTML=(()=>{
  const t=TONE[0],u=24,dx=u*0.46,dy=-u*0.33;
  const p=(a,b,c)=>[4+a*u+b*dx,30-c*u+b*dy];
  const pl=a=>a.map(q=>q.join(',')).join(' ');
  return `<svg viewBox="0 0 42 34"><polygon points="${pl([p(0,0,0),p(1,0,0),p(1,0,1),p(0,0,1)])}" fill="${t.f}" stroke="${t.s}" stroke-width="1.4"/>`+
    `<polygon points="${pl([p(0,0,1),p(1,0,1),p(1,1,1),p(0,1,1)])}" fill="${t.t}" stroke="${t.s}" stroke-width="1.4"/>`+
    `<polygon points="${pl([p(1,0,0),p(1,1,0),p(1,1,1),p(1,0,1)])}" fill="${t.r}" stroke="${t.s}" stroke-width="1.4"/></svg>`+
    `<span>1辺が 1cmの 立方体<br><b>1cm<sup>3</sup></b></span>`;
})();

/* ===== ことば・ボタン ===== */
function say(h,cls){const e=$('say');e.className='say'+(cls?' '+cls:'');e.innerHTML=`<span>${h}</span>`;}
function actions(list){
  killGhost();   /* 場面が かわる ときは 影を のこさない */
  const a=$('actions');a.innerHTML='';
  list.forEach(([c,t,f,dis])=>{
    const b=document.createElement('button');b.className='btn '+c;b.innerHTML=t;b.disabled=!!dis;
    b.addEventListener('click',()=>{if(!S.busy)f();});a.appendChild(b);
  });
}
function prob(){
  const {d,w,h}=Q(),cube=d===w&&w===h;
  $('prob').innerHTML=`<span class="no">問題 ${S.pi+1} / ${P.length}</span>`+
    `<span class="dim">たて <b>${d}</b>cm　横 <b>${w}</b>cm　高さ <b>${h}</b>cm の ${cube?'立方体':'直方体'}</span>`;
}

/* ===== すすみ方 ===== */
function start(){
  S.phase='intro';S.rows=0;S.layers=0;S.explode=false;S.busy=false;
  prob();
  $('trail').classList.add('hidden');$('shiki').classList.add('hidden');$('sum').classList.add('hidden');
  say(`この ${Q().d===Q().w&&Q().w===Q().h?'立方体':'直方体'}の 体積は、1cm<sup>3</sup>の 立方体 何個分かな？<br>まず 1だん目に しきつめよう`);
  actions([['play','1だん目を しきつめる ▶',fill]]);
  draw();
}
function fill(){
  if(S.phase!=='intro')return;
  S.phase='fill';S.busy=true;
  say('1列ずつ ならべて いくよ');
  actions([['play','1だん目を しきつめる ▶',()=>{},true]]);
  const tick=()=>{
    S.newRow=S.rows;S.rows++;draw();
    if(S.rows<Q().d)setTimeout(tick,420);
    else setTimeout(()=>{S.busy=false;askA();},450);
  };
  tick();
}

/* 式①：1だん目は 何個？ □ × □ ＝ ？ */
function makeCards(){
  const {d,w,h}=Q();
  S.cards=[{v:d,r:'d'},{v:w,r:'w'},{v:h,r:'h'}].sort((a,b)=>a.v-b.v);   /* 小さい じゅん（ならびで 答えが 分からない ように） */
}
function askA(){
  S.phase='A';makeCards();S.slots=[null,null];S.sel=null;S.fixed=[null,null];
  say('1だん目に 何個 ならんだかな？<br>式に 表そう。カードを □ に 入れてね');
  buildEq(['','×','','＝']);draw();
  $('shiki').classList.remove('hidden');
  actions([['sub','カードを もどす',resetCards],['show','答え',checkA]]);
}
/* 式②：全部で 何個？ 12 × □ ＝ ？（12 は 1だん分＝はじめから 入って いる） */
function askB(){
  S.phase='B';makeCards();S.slots=['fix',null];S.sel=null;
  say(`高さ ${Q().h}cm まで 積めたね。<br>全部で 何個？ 式に 表そう`);
  buildEq(['','×','','＝']);
  $('shiki').classList.remove('hidden');$('trail').classList.add('hidden');
  actions([['sub','カードを もどす',resetCards],['show','答え',checkB]]);
  draw();
}
function buildEq(){
  const eq=$('eq');
  const slot=i=>`<div class="slotw"><div class="slot" data-i="${i}"></div><div class="what" id="what${i}"></div></div>`;
  eq.innerHTML=slot(0)+`<span class="op">×</span>`+slot(1)+`<span class="op">＝</span>`+
    `<div class="slotw"><div class="resbox" id="res">？</div><div class="what" id="whatR"></div></div><span class="u">個</span>`;
  eq.querySelectorAll('.slot').forEach(sl=>sl.addEventListener('click',()=>{
    if(!(S.phase==='A'||S.phase==='B')||Date.now()-justDropped<350)return;
    const i=+sl.dataset.i;if(S.slots[i]==='fix')return;
    if(S.sel!=null){place(S.sel,i);return;}
    if(S.slots[i]!=null){S.slots[i]=null;drawCards();drawSlots();}   /* 入って いる ますを おすと もどる */
  }));
  drawCards();drawSlots();
}
function drawCards(){
  const box=$('cards');box.innerHTML='';
  S.cards.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='cardn'+(S.slots.includes(i)?' gone':'')+(S.sel===i?' sel':'');
    b.textContent=c.v;dragCard(b,i);box.appendChild(b);
  });
}
function drawSlots(){
  document.querySelectorAll('.slot').forEach(sl=>{
    const i=+sl.dataset.i,c=S.slots[i];
    if(c==='fix'){sl.textContent=base();sl.className='slot fix';$('what'+i).textContent='1だん分';$('what'+i).className='what a';return;}
    sl.textContent=c==null?'':S.cards[c].v;
    sl.className='slot'+(c!=null?' fill':'')+(S.sel!=null&&c==null?' sel':'');
  });
}
function place(ci,si){
  if(S.slots[si]==='fix')return;
  const old=S.slots.indexOf(ci);if(old>=0)S.slots[old]=null;
  S.slots[si]=ci;S.sel=null;drawCards();drawSlots();
  if(S.slots.every(s=>s!=null)) say('できたら 金の「答え」を おそう');
}
function resetCards(){
  S.slots=S.slots.map(s=>s==='fix'?'fix':null);S.sel=null;drawCards();drawSlots();
}
let justDropped=0;
/* カードの ドラッグ。
   2026-09-26 指摘＝「4の カードが 四角に うまく 入らなかった ときに カードが ふえた」。
   指を はなした しらせ（pointerup）が とどかないと、影の カードが 画面に のこり、
   次に さわるたびに 1まいずつ ふえて いた。
   → 影は いつも 1まいだけ（`drag`）。はなした・とぎれた・ボタンが はなれて いた、の どれでも かならず 消す（`killGhost`）。
   → □ の 少し 外で はなしても、いちばん 近い □ に 入れる（`nearSlot`） */
let drag=null;
function killGhost(){
  document.querySelectorAll('.ghost').forEach(g=>g.remove());
  drag=null;
}
function nearSlot(x,y){
  let best=null,bd=1e9;
  document.querySelectorAll('.slot').forEach(sl=>{
    if(S.slots[+sl.dataset.i]==='fix')return;
    const r=sl.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=sl;}
  });
  return best&&bd<=Math.max(40,best.getBoundingClientRect().width*0.8)?best:null;
}
function dragCard(el,ci){
  el.addEventListener('pointerdown',e=>{
    if(!(S.phase==='A'||S.phase==='B'))return;
    killGhost();
    drag={ci,el,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,ghost:null};
    try{el.setPointerCapture(e.pointerId);}catch(_){}
  });
}
/* 「ボタンが 押されて いない 移動は やめる」は 入れない。
   2026-09-26 指摘＝「5を 左に 入れようと しても 入らない」。トラックパッドの 3本指ドラッグなどは
   ドラッグ中でも ボタンが 押されて いない あつかいに なり、とちゅうで 打ち切られて いた */
addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.ghost&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){
    drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('ghost');document.body.appendChild(drag.ghost);
  }
  if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';}
},true);
function finishDrag(x,y){
  if(!drag)return;
  const {ci,sx,sy}=drag,moved=Math.hypot(x-sx,y-sy)>8;
  killGhost();
  if(moved){
    const sl=nearSlot(x,y);
    if(sl){place(ci,+sl.dataset.i);justDropped=Date.now();}
  }else{
    S.sel=S.sel===ci?null:ci;drawCards();drawSlots();
  }
}
addEventListener('pointerup',e=>finishDrag(e.clientX,e.clientY),true);
addEventListener('mouseup',e=>finishDrag(e.clientX,e.clientY),true);          /* pointerup が 来なかった ときの 予備 */
/* はなした しらせが どちらも 来ないまま 次に 押した ＝ そこで はなした ことに する */
addEventListener('pointerdown',()=>{if(drag)finishDrag(drag.x,drag.y);},true);
addEventListener('pointercancel',killGhost,true);
addEventListener('blur',killGhost);
document.addEventListener('visibilitychange',killGhost);

/* 答え合わせ①：たて と 横 なら どちらの じゅんでも よい。高さを 入れたら 「まだ 積んで いない」と 言って もどす（×に しない） */
function checkA(){
  if(S.slots.some(s=>s==null)){say('まだ とちゅうだよ。□ を 2つとも うめよう','try');return;}
  const r=S.slots.map(s=>S.cards[s].r),{d,w,h}=Q();
  const cube=d===w&&w===h;
  if(!cube&&r.includes('h')){
    say(`<span class="d">${h}</span> は 高さの 数だよ。<br>1だん目は <b>たて</b>と <b>横</b>で きまるね`,'try');
    resetCards();return;
  }
  document.querySelectorAll('.slot').forEach((sl,i)=>{
    sl.classList.add('gd-a');$('what'+i).textContent=r[i]==='d'?'たて':'横';$('what'+i).className='what a';
  });
  if(cube){$('what0').textContent='たて';$('what1').textContent='横';}
  $('res').textContent=base();$('res').className='resbox good';$('whatR').textContent='1だん分';$('whatR').className='what a';
  $('cards').innerHTML='';   /* のこった カード（高さ）は 次の 式まで しまう */
  S.phase='A2';S.layers=1;S.rows=0;
  say(`よくできました！ 1だん目は <span class="a">${base()}個</span>。<br>この だんを 高さの 分だけ 積んで いこう`,'ok');
  draw();
  actions([['play','1だん 積む ▶',()=>{goStack();stackOne();}]]);
}
function goStack(){
  S.phase='stack';$('shiki').classList.add('hidden');$('trail').classList.remove('hidden');
}
function trail(){
  const n=S.layers,b=base();
  $('trail').innerHTML=`<span class="a">${b}</span> × <span class="d">${n}</span><small>だん</small> ＝ ${b*n}<small>個</small>`;
}
function stackActions(){
  actions([['sub','1だん もどす',unstack,S.layers<=1],['play','1だん 積む ▶',stackOne]]);
}
function stackOne(){
  if(S.phase!=='stack'||S.layers>=Q().h)return;
  S.newLayer=S.layers;S.layers++;
  trail();draw();
  if(S.layers>=Q().h){S.busy=true;setTimeout(()=>{S.busy=false;askB();},650);actions([['play','1だん 積む ▶',()=>{},true]]);return;}
  say(`${S.layers}だん 積んだよ。1だん ふえるたびに <span class="a">${base()}個</span>ずつ ふえるね`);
  stackActions();
}
function unstack(){
  if(S.phase!=='stack'||S.layers<=1)return;
  S.layers--;trail();draw();
  say(`${S.layers}だんに もどしたよ`);stackActions();
}

/* 答え合わせ②：12 × 高さ。たてや 横を 入れたら 「何だん 積んだか」と 言って もどす */
function checkB(){
  if(S.slots[1]==null){say('まだ とちゅうだよ。□ に カードを 入れよう','try');return;}
  const c=S.cards[S.slots[1]],{d,w,h}=Q(),cube=d===w&&w===h;
  if(!cube&&c.r!=='h'){
    say(`<span class="a">${base()}個</span>の だんが 何だん あるかな？ 左の 数を 見てみよう`,'try');
    resetCards();return;
  }
  const v=base()*h;
  document.querySelector('.slot[data-i="1"]').classList.add('gd-d');
  $('what1').textContent='だんの 数';$('what1').className='what d';
  $('res').textContent=v;$('res').className='resbox good';$('whatR').textContent='全部';$('whatR').className='what';
  S.phase='done';
  say(`よくできました！ 1だん分（<span class="a">たて × 横</span>）に だんの 数（<span class="d">高さ</span>）を かけると、全部の 数が 求められるね`,'ok');
  const s=$('sum');s.classList.remove('hidden');
  s.innerHTML=`<div class="fgrid">`+
    `<span class="lb a">1だん分</span><span></span><span class="lb d">だんの 数</span><span></span><span></span>`+
    `<span class="a">${base()}</span><span>×</span><span class="d">${h}</span><span>＝</span><span>${v}</span>`+
    `<span class="lb a sp">たて × 横</span><span></span><span class="lb d sp">高さ</span><span></span><span></span>`+
    `<span class="a">${d} × ${w}</span><span>×</span><span class="d">${h}</span><span>＝</span><span>${v}</span></div>`+
    `<div class="vol">体積は <span class="gd">${v}cm<sup>3</sup></span></div>`;
  $('shiki').classList.add('hidden');
  const last=S.pi===P.length-1;
  actions([['sub','もう一度',start],['next',last?'はじめの 問題へ →':'次の 問題 →',next]]);
  draw();
}
function next(){
  S.pi=(S.pi+1)%P.length;start();
}

/* 絵を おしても 青い ボタンと 同じに 進む（宣伝しない にげ道） */
$('stage').addEventListener('click',()=>{
  if(S.busy)return;
  if(S.phase==='intro'){fill();}
  else if(S.phase==='A2'){goStack();stackOne();}
  else if(S.phase==='stack'){stackOne();}
  else return;
  const st=$('stage');st.classList.remove('tapped');void st.offsetWidth;st.classList.add('tapped');
});


/* =====================================================================
   ステップ３：高さを のばす
   解説（p.260）：「縦と横の長さを固定した直方体について，高さが２倍，３倍，４倍，…になるときの
   体積の変化を考えさせるなどして，体積の公式の意味について，『Ｃ変化と関係』の比例の学習との
   関連で理解を深めさせる」。
   → たて・横は そのまま、高さを 1cmずつ のばして 表に ためる（動きを 見せる）→
     表の 2つの 列を くらべて「高さが □倍 → 体積は 何倍？」（表で きまりを 見つける）。
   答えた あと（まちがえた ときも）右の 直方体を「左の 直方体の かたまり」ごとに 色を かえて 見せる
   ＝ 高さが 2倍 → 同じ かたまりが 2つ分 → 体積も 2倍。
   「比例」と いう ことばは 出さない（教科書に よって 体積と 比例の じゅんばんが ちがう）
   ===================================================================== */
const HMAX=6;
const P3=[{d:2,w:3,q:[[1,2],[1,3],[2,4],[1,4]]},
          {d:3,w:4,q:[[1,3],[2,4],[1,4],[3,6]]},
          {d:2,w:5,q:[[2,4],[1,4],[2,6],[3,6]]},
          {d:4,w:4,q:[[1,2],[2,6],[1,4],[3,6]]}];
const S3={pi:0,h:1,phase:'grow',qi:0,rev:false,newH:-1,busy:false};
const Q3=()=>P3[S3.pi];
const base3=()=>Q3().d*Q3().w;

function box3(W,D,H,ox,toneOf,newK){
  const p=(i,j,k)=>[ox+i*U+j*DX,-k*U+j*DY];
  let g='';
  for(let k=0;k<H;k++){
    const tone=toneOf(k);
    for(let j=D-1;j>=0;j--)for(let i=0;i<W;i++){
      const c=(a,b,e)=>p(i+a,j+b,k+e);
      g+=`<g class="${k===newK?'nw':''}">`+
        `<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="${tone.f}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/>`+
        `<polygon points="${ps([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)])}" fill="${tone.t}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/>`+
        `<polygon points="${ps([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)])}" fill="${tone.r}" stroke="${tone.s}" stroke-width="1.6" stroke-linejoin="round"/></g>`;
    }
  }
  return g;
}
/* かたまりの 色（左の 直方体 1つ分ごとに かえる）。まちがえた ときは かたまりだけ 見せ、右の 体積は 答えるまで「？」の まま */
const CHUNK=[{f:'#8fd0c9',t:'#c4ebe6',r:'#62aca4',s:'#2f7f79'},{f:'#f2c690',t:'#fae2c1',r:'#d6a263',s:'#a0702f'},
             {f:'#b9c6ee',t:'#dce3f8',r:'#8e9fd6',s:'#55679e'},{f:'#e8b3c8',t:'#f6dbe6',r:'#cf8aa6',s:'#9a506f'}];
function draw3(){
  const {d:D,w:W}=Q3(),b=base3();
  const M=Math.max(1,(W+0.46*D)/5.2,HMAX/5.2),V=U*M,fs=V*0.5;
  let g='',minX,maxX,topY,botY;
  const bw=W*U+D*DX;
  if(S3.phase==='grow'||S3.phase==='ready'){
    /* 1つの 直方体。のびる 先（高さ 6cm）を うすい 点線で 見せる */
    const h=S3.h,p=(i,j,k)=>[i*U+j*DX,-k*U+j*DY];
    const E=(a,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#9fb9b6" stroke-width="2" stroke-dasharray="6 6"/>`;
    g+=E(p(0,0,h),p(0,0,HMAX))+E(p(W,0,h),p(W,0,HMAX))+E(p(W,D,h),p(W,D,HMAX))
      +E(p(0,0,HMAX),p(W,0,HMAX))+E(p(W,0,HMAX),p(W,D,HMAX))+E(p(0,0,HMAX),p(0,D,HMAX))+E(p(0,D,HMAX),p(W,D,HMAX));
    g+=box3(W,D,h,0,k=>TONE[k%2],S3.newH);
    const a0=p(0,0,0),a1=p(W,0,0),t0=p(W,D,0);
    g+=txt((a0[0]+a1[0])/2,V*1.0,`横 ${W}cm`,{fs});
    g+=txt((a1[0]+t0[0])/2+V*0.6,(a1[1]+t0[1])/2+V*0.9,`たて ${D}cm`,{fs,a:'start'});
    g+=txt(-V*0.35,-h*U/2-fs*0.1,'高さ',{fs,a:'end',c:'#a8691f'});
    g+=txt(-V*0.35,-h*U/2+fs*0.95,`${h}cm`,{fs,a:'end',c:'#a8691f'});
    minX=-V*2.2;maxX=Math.max(bw+V*0.6,(a1[0]+t0[0])/2+V*3.6);
    topY=-HMAX*U+D*DY-V*0.4;botY=V*1.4;
  }else{
    /* 2つを ならべる：左＝高さ a、右＝高さ b */
    const [a,c]=Q3().q[S3.qi],k=c/a,gap=V*2.4;
    const ox2=bw+gap;
    g+=box3(W,D,a,0,()=>CHUNK[0],-1);
    /* 答える 前は 右も 左と 同じ 1色（2026-09-26 指摘＝「？の 方の 立体の 色が 段ごとに 違うのは なぜ？」。
       ステップ２の 1だんごとの 色分けが のこって いて、「1だんずつの かたまり」を 見せて いるように 読めた）。
       色が かわるのは 答えた あと（まちがえた とき）の「左の 直方体 1つ分」ごとの 色分けだけ */
    g+=box3(W,D,c,ox2,S3.rev?(kk=>CHUNK[Math.floor(kk/a)%CHUNK.length]):(()=>CHUNK[0]),-1);
    const lab=(x,h,v)=>txt(x+bw/2-D*DX/2,V*0.95,`高さ ${h}cm`,{fs,c:'#a8691f'})+txt(x+bw/2-D*DX/2,V*1.95,v,{fs});
    g+=lab(0,a,`${b*a}cm<tspan dy="-${fs*0.4}" font-size="${fs*0.6}">3</tspan>`);
    g+=lab(ox2,c,S3.solved?`${b*c}cm<tspan dy="-${fs*0.4}" font-size="${fs*0.6}">3</tspan>`:'？');
    if(S3.rev){
      /* かたまりの よこに 「12cm³」 */
      for(let m=0;m<k;m++){
        const y0=-m*a*U,y1=-(m+1)*a*U,x=ox2+bw+V*0.3,tone=CHUNK[m%CHUNK.length];
        g+=`<path d="M${x} ${y0+DY*D-3} h${V*0.18} V${y1+DY*D+3} h-${V*0.18}" fill="none" stroke="${tone.s}" stroke-width="3"/>`;
        g+=txt(x+V*0.3,(y0+y1)/2+DY*D+fs*0.35,`${b*a}`,{fs:fs*0.9,c:tone.s,a:'start'});
      }
    }
    minX=-V*0.6;maxX=ox2+bw+V*(S3.rev?1.9:0.8);
    topY=-c*U+D*DY-V*0.5;botY=V*2.4;
    topY=Math.min(topY,-Math.max(...Q3().q.map(x=>x[1]))*U+D*DY-V*0.5);   /* 問題の 中で 大きさを かえない */
  }
  const svg=$('pic3');
  svg.setAttribute('viewBox',`${minX} ${topY} ${maxX-minX} ${botY-topY}`);
  svg.innerHTML=g;S3.newH=-1;
  table3();
}
function table3(){
  const b=base3(),q=(S3.phase==='q'||S3.phase==='end')?Q3().q[S3.qi]:null;
  let r1='<tr class="h"><th>高さ<small>(cm)</small></th>',r2='<tr class="v"><th>体積<small>(cm<sup>3</sup>)</small></th>';
  for(let h=1;h<=HMAX;h++){
    const hl=q&&(h===q[0]||h===q[1])?' hl':'';
    const nw=S3.phase==='grow'&&h===S3.h&&h>1?' new':'';
    r1+=`<td class="${hl}" data-h="${h}">${h}</td>`;
    r2+=`<td class="${hl}${nw}${h>S3.h?' emp':''}" data-v="${h}">${h<=S3.h?b*h:'-'}</td>`;
  }
  $('tbl').innerHTML=r1+'</tr>'+r2+'</tr>';
  requestAnimationFrame(arrows3);
}
/* 表の 上（高さ）と 下（体積）に 「□倍」の 矢じるし */
function arrows3(){
  const svg=$('arrows'),wrap=$('tblwrap');
  if(S3.phase!=='q'&&S3.phase!=='end'){svg.innerHTML='';return;}
  const [a,c]=Q3().q[S3.qi],k=c/a,W0=wrap.getBoundingClientRect();
  const cell=sel=>{const r=wrap.querySelector(sel).getBoundingClientRect();return {x:r.left-W0.left+r.width/2,t:r.top-W0.top,b:r.bottom-W0.top};};
  const fs=parseFloat(getComputedStyle(wrap).fontSize);
  const arc=(p,q,up,label,col)=>{
    const y=up?p.t-3:p.b+3,dy=up?-fs*1.2:fs*1.2,mx=(p.x+q.x)/2;
    return `<path d="M${p.x} ${y} Q${mx} ${y+dy*1.6} ${q.x} ${y}" fill="none" stroke="${col}" stroke-width="3"/>`+
      `<path d="M${q.x} ${y} l${up?-9:-9} ${up?-6:6} M${q.x} ${y} l${up?2:2} ${up?-10:10}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`+
      `<text x="${mx}" y="${y+dy*0.95+(up?0:fs*0.35)}" text-anchor="middle" font-weight="800" font-size="${fs*0.95}" fill="${col}" paint-order="stroke" stroke="#fffdf7" stroke-width="5">${label}</text>`;
  };
  svg.innerHTML=arc(cell(`td[data-h="${a}"]`),cell(`td[data-h="${c}"]`),true,`${k}倍`,'#a8691f')+
                arc(cell(`td[data-v="${a}"]`),cell(`td[data-v="${c}"]`),false,S3.rev&&S3.solved?`${k}倍`:'？倍',S3.solved?'#5a8a4c':'#8f7417');
}
function say3(h,cls){const e=$('say3');e.className='say'+(cls?' '+cls:'');e.innerHTML=`<span>${h}</span>`;}
function actions3(list){
  const a=$('actions3');a.innerHTML='';
  list.forEach(([c,t,f,dis])=>{
    const b=document.createElement('button');b.className='btn '+c;b.innerHTML=t;b.disabled=!!dis;
    b.addEventListener('click',()=>{if(!S3.busy)f();});a.appendChild(b);
  });
}
function s3start(){
  Object.assign(S3,{h:1,phase:'grow',qi:0,rev:false,solved:false,newH:0});
  const {d,w}=Q3();
  $('prob3').innerHTML=`<span class="no">問題 ${S3.pi+1} / ${P3.length}</span>`+
    `<span class="dim">たて <b>${d}</b>cm　横 <b>${w}</b>cm は そのまま。高さを のばす</span>`;
  const ch=$('choices3');ch.classList.remove('hidden');ch.classList.add('off');
  ch.innerHTML=[2,3,4].map(n=>`<button class="choice" disabled>${n}倍</button>`).join('');
  growSay();growActions();draw3();
}
function growSay(){
  const {d,w}=Q3(),h=S3.h;
  say3(`高さ <span class="d">${h}cm</span>　${d} × ${w} × <span class="d">${h}</span> ＝ ${d*w*h}cm<sup>3</sup>`+
       (h<HMAX?'<br>高さを 1cmずつ のばして、表に 書いて いこう':''));
}
function growActions(){
  actions3([['sub','1cm もどす',shrink,S3.h<=1],['play','高さを 1cm のばす ▶',grow]]);
}
function grow(){
  if(S3.phase!=='grow')return;
  S3.h++;S3.newH=S3.h-1;growSay();
  if(S3.h>=HMAX){
    S3.phase='ready';draw3();
    say3(`高さ ${HMAX}cm まで のばしたよ。<br>表を 見て、高さと 体積の きまりを 見つけよう`);
    actions3([['sub','1cm もどす',()=>{S3.phase='grow';shrink();}],['play','きまりを 見つける ▶',askQ]]);
    return;
  }
  growActions();draw3();
}
function shrink(){
  if(S3.h<=1)return;
  S3.phase='grow';S3.h--;growSay();growActions();draw3();
}
function askQ(){
  S3.phase='q';S3.rev=false;S3.solved=false;
  const [a,c]=Q3().q[S3.qi];
  say3(`高さが ${a}cm から ${c}cm に（<span class="d">${c/a}倍</span>に）なると、<br>体積は 何倍？`);
  const ch=$('choices3');ch.classList.remove('hidden','off');ch.innerHTML='';
  [2,3,4].forEach(n=>{
    const b=document.createElement('button');b.className='choice';b.innerHTML=`${n}倍`;
    b.addEventListener('click',()=>pick(n,b));ch.appendChild(b);
  });
  actions3([]);draw3();
}
function pick(n,btn){
  if(S3.phase!=='q'||S3.solved)return;
  const [a,c]=Q3().q[S3.qi],k=c/a,b=base3();
  S3.rev=true;
  if(n!==k){
    btn.disabled=true;
    say3(`もう一回。右の 直方体に、左と 同じ <span class="a">${b*a}cm<sup>3</sup></span>の かたまりが いくつ あるかな？`,'try');
    draw3();return;
  }
  S3.solved=true;btn.classList.add('good');
  $('choices3').querySelectorAll('.choice').forEach(x=>x.disabled=x!==btn);
  say3(`よくできました！ <span class="a">${b*a}cm<sup>3</sup></span>の かたまりが ${k}つ分。<br>高さが ${k}倍 → 体積も ${k}倍 だね`,'ok');
  draw3();
  const last=S3.qi===Q3().q.length-1;
  if(!last){actions3([['play','ほかの 高さで しらべる ▶',()=>{S3.qi++;askQ();}]]);return;}
  S3.phase='end';
  setTimeout(()=>{
    say3('高さが 2倍、3倍、4倍…に なると、<br>体積も 2倍、3倍、4倍…に なるね','ok');
    actions3([['sub','もう一度',s3start],['next',S3.pi===P3.length-1?'はじめの 問題へ →':'次の 問題 →',()=>{S3.pi=(S3.pi+1)%P3.length;s3start();}]]);
  },1400);
}
$('stage3').addEventListener('click',()=>{
  if(S3.busy||S3.phase!=='grow')return;
  grow();const st=$('stage3');st.classList.remove('tapped');void st.offsetWidth;st.classList.add('tapped');
});


/* =====================================================================
   ステップ４：大きな 単位
   解説（p.260-261）：
   ・「実際に１㎥の大きさの立方体を観察する活動などにより，体積の大きさについての感覚が育成されるよう配慮」
   ・「一辺が 10㎝の立方体の体積が１Ｌに当たることにも触れるようにする」
   ・「長さ，面積などの単位間の関係と，体積の単位間の関係を比較し，総合的に考察する」
     （解説の 表：長さ 1cm (10cm) 1m／面積 1cm² (100cm²) 1m²／体積 1cm³ (1000cm³) 1m³／かさ 1mL 1L 1kL）
   → 3つの パート。どれも はじめから えらべる（鍵を かけない）。
     ① 1辺 10cmの 立方体に 1cm³ を しきつめる → 1000cm³ → 水を 入れると ちょうど 1L
     ② 1辺 1mの 立方体（となりに 子どもの 人かげ）→ 100 × 100 × 100 ＝ 1000000cm³ → 1Lますが 1000こ ＝ 1kL
     ③ 解説の 表を うめる → 1辺が 10倍 → 面積 100倍・体積 1000倍
   答えは 3択。見せてから 聞く（1だん目を しきつめてから「何個？」）
   ===================================================================== */
const S4={part:0,ph:0,rows:0,layers:0,water:0,slab:0,grid:false,newK:-1,busy:false,solved:false,ti:0,tdone:[]};
const WATER={f:'rgba(96,165,214,.55)',t:'rgba(150,200,236,.7)',r:'rgba(70,140,196,.6)',s:'#3a78ad'};
const sup3=f=>`<tspan dy="-${f*0.4}" font-size="${f*0.6}">3</tspan><tspan dy="${f*0.4}"> </tspan>`;

/* 見取図の 面を まとめて かく（ちょくほうたい 1つ） */
function slabSVG(W,D,H,k0,tone,ox=0){
  const p=(i,j,k)=>[ox+i*U+j*DX,-k*U+j*DY];
  const c=(a,b,e)=>p(a*W,b*D,k0+e*H);
  return `<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="${tone.f}" stroke="${tone.s}" stroke-width="2" stroke-linejoin="round"/>`+
         `<polygon points="${ps([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)])}" fill="${tone.t}" stroke="${tone.s}" stroke-width="2" stroke-linejoin="round"/>`+
         `<polygon points="${ps([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)])}" fill="${tone.r}" stroke="${tone.s}" stroke-width="2" stroke-linejoin="round"/>`;
}
function outline(W,D,H,col,dash){
  const p=(i,j,k)=>[i*U+j*DX,-k*U+j*DY],c=(a,b,e)=>p(a*W,b*D,e*H);
  const E=(a,b,d)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="2.4" ${d?'stroke-dasharray="7 6"':''} stroke-linecap="round"/>`;
  return E(c(0,1,0),c(1,1,0),1)+E(c(0,1,0),c(0,0,0),1)+E(c(0,1,0),c(0,1,1),1)+
    E(c(0,0,0),c(1,0,0),dash)+E(c(1,0,0),c(1,0,1),dash)+E(c(1,0,1),c(0,0,1),dash)+E(c(0,0,1),c(0,0,0),dash)+
    E(c(0,0,1),c(0,1,1),dash)+E(c(0,1,1),c(1,1,1),dash)+E(c(1,1,1),c(1,0,1),dash)+E(c(1,0,0),c(1,1,0),dash)+E(c(1,1,0),c(1,1,1),dash);
}
/* 面に 10等分の 線（10cmごと） */
function gridLines(N,col){
  const p=(i,j,k)=>[i*U+j*DX,-k*U+j*DY];let g='';
  const L=(a,b)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="1.2"/>`;
  for(let t=1;t<N;t++){
    g+=L(p(t,0,0),p(t,0,N))+L(p(0,0,t),p(N,0,t));            /* 前 */
    g+=L(p(t,0,N),p(t,N,N))+L(p(0,t,N),p(N,t,N));            /* 上 */
    g+=L(p(N,t,0),p(N,t,N))+L(p(N,0,t),p(N,N,t));            /* 右 */
  }
  return g;
}
/* 子どもの 人かげ（身長 135cm＝1辺 1m の 1.35倍） */
function person(x,side){
  const h=side*1.35,hr=h*0.085,sw=h*0.2;
  return `<g fill="#c9b79a" stroke="#8a7a5f" stroke-width="2">`+
    `<circle cx="${x}" cy="${-h+hr}" r="${hr}"/>`+
    `<path d="M${x-sw/2} ${-h+hr*2.3} h${sw} l${sw*0.12} ${h*0.36} h-${sw*0.2} l-${sw*0.06} -${h*0.2} v${h*0.66} h-${sw*0.32} v-${h*0.4} h-${sw*0.04} v${h*0.4} h-${sw*0.32} v-${h*0.66} l-${sw*0.06} ${h*0.2} h-${sw*0.2} z"/></g>`+
    txt(x,-h-hr*0.7,'135cm',{fs:side*0.075,c:'#8a7a5f'});
}
function draw4(){
  const svg=$('pic4'),tb=$('utbl');
  if(S4.part===2){svg.innerHTML='';svg.classList.add('hidden');tb.classList.remove('hidden');table4();return;}
  svg.classList.remove('hidden');tb.classList.add('hidden');
  let g='',vb;
  if(S4.part===0){
    const N=10,fs=U*0.95;
    if(S4.water>0){
      g+=outline(N,N,N,'#5c7d7a',false);
      g+=slabSVG(N,N,N*S4.water,0,WATER);
      g+=outline(N,N,N,'#3f5f5c',false).replace(/stroke-dasharray="7 6"/g,'');
    }else{
      g+=outline(N,N,N,'#7d9a97',true).split('<line').slice(0,4).join('<line');
      for(let k=0;k<Math.max(S4.layers,S4.rows?1:0);k++){
        const rowsHere=k<S4.layers?N:S4.rows;
        g+=box3part(N,N,k,rowsHere,TONE[k%2],k===S4.newK);
      }
      g+=outline(N,N,N,'#5c7d7a',true).split('<line').slice(4).map(x=>'<line'+x).join('');
    }
    const a=[0,0],b=[N*U,0],t=[N*U+N*DX,N*DY];
    g+=txt(N*U/2,U*1.6,'10cm',{fs});
    g+=txt((b[0]+t[0])/2+U*1.1,(b[1]+t[1])/2+U*1.3,'10cm',{fs,a:'start'});
    g+=txt(-U*0.6,-N*U/2+fs*0.35,'10cm',{fs,a:'end'});
    if(S4.water>=1) g+=txt((N*U+N*DX)/2,-N*U+N*DY-U*1.0,'1L',{fs:fs*1.6,c:'#3a78ad'});
    vb=[-U*4.2,-N*U+N*DY-U*2.8,N*U+N*DX+U*8.6,N*U-N*DY+U*5.2];
  }else{
    const N=10,side=N*U,fs=side*0.085;
    g+=person(-side*0.42,side);
    if(S4.grid){
      /* 1Lます（1辺 10cm）が 10 × 10 × 10 */
      g+=slabSVG(N,N,N,0,{f:'#dcefeb',t:'#eef8f6',r:'#c3e2dd',s:'#5c7d7a'});
      g+=gridLines(N,'#7fb3ad');
      g+=slabSVG(1,1,1,0,WATER);   /* かどの 1つ＝1L */
      g+=txt(U*0.5,U*1.25,'1L',{fs:fs*0.8,c:'#3a78ad'});
    }else{
      g+=outline(N,N,N,'#7d9a97',true).split('<line').slice(0,4).join('<line');
      if(S4.slab>0) g+=slabSVG(N,N,Math.max(N*S4.slab,0.09),0,TONE[0]);
      g+=outline(N,N,N,'#5c7d7a',true).split('<line').slice(4).map(x=>'<line'+x).join('');
      if(S4.slab>0&&S4.slab<0.02) g+=magnifier(side,fs);
    }
    const b=[side,0],t=[side+N*DX,N*DY],thin=S4.slab>0&&S4.slab<0.02&&!S4.grid;
    g+=txt(side/2,fs*1.5,thin?'1m ＝ 100cm':'1m',{fs});
    g+=txt((b[0]+t[0])/2+fs*0.9,(b[1]+t[1])/2+fs*1.4,'1m',{fs,a:'start'});
    if(thin){
      g+=txt(side/2,fs*2.8,'横に 100個',{fs,c:'#2f7f79'});
      g+=txt((b[0]+t[0])/2+fs*0.9,(b[1]+t[1])/2+fs*2.7,'たてに 100個',{fs,a:'start',c:'#2f7f79'});
      /* 10cmごとの 目もり */
      const p=(i,j)=>[i*U+j*DX,j*DY];
      for(let q=1;q<N;q++){
        const a1=p(q,0),a2=p(N,q);
        g+=`<line x1="${a1[0]}" y1="${a1[1]}" x2="${a1[0]}" y2="${a1[1]+fs*0.35}" stroke="#2f7f79" stroke-width="2"/>`;
        g+=`<line x1="${a2[0]}" y1="${a2[1]}" x2="${a2[0]+fs*0.35}" y2="${a2[1]}" stroke="#2f7f79" stroke-width="2"/>`;
      }
    }
    g+=txt(side+N*DX+fs*0.4,-side/2+N*DY,'1m',{fs,a:'start'});
    vb=[-side*0.78,-side*1.35-fs*1.6,side*1.78+N*DX+fs*(thin?5.6:2.2),side*1.35+fs*(thin?4.4:3.6)];
  }
  svg.setAttribute('viewBox',vb.join(' '));
  svg.innerHTML=g;S4.newK=-1;
}
/* 虫めがね：うすい 1だんの かどを 大きく して、1cm³ の 立方体が ならんで いる ことを 見せる。
   2026-09-26 指摘＝「ここが 分かりにくい」。板を うすく ぬった だけでは 1cm³ が 見えず、
   ①（1こずつ 見えた）と つながらなかった。問いの 文に 答えの 式（たて 100列 × 横 100個）まで 書いて いたのも やめた */
function magnifier(side,fs){
  const cx=side*0.52,cy=-side*0.6,r=side*0.34,u2=r*0.42,dx2=u2*0.46,dy2=-u2*0.33;
  const ox=cx-r*0.72,oy=cy+r*0.3;           /* 小さい 立方体の かど（左手前）*/
  const P=(i,j,k)=>[ox+i*u2+j*dx2,oy-k*u2+j*dy2];
  let g=`<defs><clipPath id="mag"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>`;
  /* かどへの 引き出し線 */
  const ang=Math.atan2(0-cy,0-cx),ex=cx+Math.cos(ang)*r,ey=cy+Math.sin(ang)*r;
  g+=`<line x1="${ex}" y1="${ey}" x2="${U*0.25}" y2="${-U*0.15}" stroke="#5c7d7a" stroke-width="3"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbfefd"/>`;
  g+=`<g clip-path="url(#mag)">`;
  const t=TONE[0];
  for(let j=5;j>=0;j--)for(let i=0;i<8;i++){
    const c=(a,b,e)=>P(i+a,j+b,e);
    g+=`<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="${t.f}" stroke="${t.s}" stroke-width="2"/>`+
       `<polygon points="${ps([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)])}" fill="${t.t}" stroke="${t.s}" stroke-width="2"/>`+
       `<polygon points="${ps([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)])}" fill="${t.r}" stroke="${t.s}" stroke-width="2"/>`;
  }
  g+=`</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#5c7d7a" stroke-width="5"/>`;
  /* 1こ目に「1cm」 */
  const a0=P(0,0,0),a1=P(1,0,0);
  g+=`<line x1="${a0[0]}" y1="${a0[1]+fs*0.45}" x2="${a1[0]}" y2="${a1[1]+fs*0.45}" stroke="#a8691f" stroke-width="3"/>`;
  g+=txt((a0[0]+a1[0])/2,a0[1]+fs*1.25,'1cm',{fs:fs*0.85,c:'#a8691f'});
  g+=txt(cx,cy-r-fs*0.5,'かどを 大きく すると',{fs:fs*0.8,c:'#5c7d7a'});
  return g;
}
/* 1だん（k）を rowsHere 列ぶん。1000こ かくので 面を まとめない ぶん 手前だけ 見える ように かく */
function box3part(W,D,k,rowsHere,tone,isNew){
  const p=(i,j,kk)=>[i*U+j*DX,-kk*U+j*DY];let g=`<g class="${isNew?'nw':''}">`;
  for(let j=rowsHere-1;j>=0;j--)for(let i=0;i<W;i++){
    const c=(a,b,e)=>p(i+a,j+b,k+e);
    g+=`<polygon points="${ps([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)])}" fill="${tone.t}" stroke="${tone.s}" stroke-width="1.2"/>`;
    if(j===0) g+=`<polygon points="${ps([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)])}" fill="${tone.f}" stroke="${tone.s}" stroke-width="1.2"/>`;
    if(i===W-1) g+=`<polygon points="${ps([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)])}" fill="${tone.r}" stroke="${tone.s}" stroke-width="1.2"/>`;
  }
  return g+'</g>';
}

/* =====================================================================
   ステップ１：1cm³で 測る
   解説（p.260）：「面積を単位となる大きさを基に求めたことからの類推により，体積の単位としては
   空間を隙間なく埋め尽くす立体図形が適当であることについて理解できるようにする。そして，その立体図形
   としては一辺の長さでその大きさが決まる立方体が便利で，その一辺の長さが１㎝や１ｍのように長さの単位の
   大きさであるものが都合がよい」
   → 問題1＝ボールと 立方体、すき間なく 入るのは どっち？ → 1cm³ の 定義
     問題2〜4＝形の ちがう 2つの 箱。見た目で 予想（まるつけ しない）→ 1cm³ を 入れて 何個分か 見る →
     どちらが 何cm³ 大きい？（3択）。4問目は 同じ 大きさ（見た目では わからない）
   立方体は 1色（だんを 数える ステップでは ないので、だんごとの 色分けは しない）
   ===================================================================== */
const P1=[{intro:true},
          {a:[4,3,2],b:[2,2,5]},      /* 24 と 20 */
          {a:[3,3,2],b:[2,2,5]},      /* 18 と 20 */
          {a:[4,2,3],b:[2,3,4]}];     /* 24 と 24 */
const S1={pi:0,ph:0,guess:null,L:0,busy:false,solved:false};
const vol=x=>x[0]*x[1]*x[2];
function draw1(){
  const q=P1[S1.pi];let g='',vb;
  const fs=U*0.62;

    /* 左＝ボール（すき間が できる）、右＝立方体（ぴったり） 3×3×3 */
    const N=3,bw=N*U+N*DX,gap=U*2.6,ox=bw+gap;
    const p=(i,j,k)=>[i*U+j*DX,-k*U+j*DY];
    g+=`<defs><radialGradient id="ball" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3d6"/><stop offset=".6" stop-color="#f2c690"/><stop offset="1" stop-color="#c98f4a"/></radialGradient></defs>`;
    g+=outlineAt(N,N,N,0,'#7d9a97',true,0);
    for(let j=N-1;j>=0;j--)for(let k=0;k<N;k++)for(let i=0;i<N;i++){
      const c=p(i+.5,j+.5,k+.5);g+=`<circle cx="${c[0]}" cy="${c[1]}" r="${U*0.47}" fill="url(#ball)" stroke="#a0702f" stroke-width="1.4"/>`;
    }

  }else{
    const A=q.a,B=q.b,gap=U*2.6;
    const bwA=A[0]*U+A[1]*DX,bwB=B[0]*U+B[1]*DX,ox=bwA+gap;
    const one=(X,x0,name)=>{
      let h='';
      h+=outlineAt(X[0],X[1],X[2],x0,'#7d9a97',true,0);
      h+=box3(X[0],X[1],Math.min(S1.L,X[2]),x0,()=>TONE[0],S1.anim&&S1.L-1<X[2]?S1.L-1:-1);   /* 落ちて くる 動きは 入れた ときだけ */
      h+=outlineAt(X[0],X[1],X[2],x0,'#5c7d7a',true,1);
      const cx=x0+X[0]*U/2;

      h+=txt(cx,U*1.1,`横${X[0]}cm たて${X[1]}cm 高さ${X[2]}cm`,{fs:fs*0.66,c:'#8a7a5f'});
      const n=X[0]*X[1]*Math.min(S1.L,X[2]);
      h+=txt(cx,U*2.2,S1.L===0?'？':(S1.solved?`${n}cm<tspan dy="-${fs*0.4}" font-size="${fs*0.6}">3</tspan>`:`${n}個`),{fs});
      return h;
    };

    vb=[-U*1.8,-hmax*U+dmax*DY-U*1.6,ox+bwB+U*3.6,hmax*U-dmax*DY+U*4.4];   /* 「横3cm たて3cm 高さ2cm」が 箱より 広い */
  }

}
/* 見取図の 入れもの（part 0＝見えない 辺、1＝見える 辺） */
function outlineAt(W,D,H,ox,col,dash,part){
  const p=(i,j,k)=>[ox+i*U+j*DX,-k*U+j*DY],c=(a,b,e)=>p(a*W,b*D,e*H);
  const E=(a,b,d)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="2.2" ${d?'stroke-dasharray="7 6"':''} stroke-linecap="round"/>`;
  if(part===0) return E(c(0,1,0),c(1,1,0),1)+E(c(0,1,0),c(0,0,0),1)+E(c(0,1,0),c(0,1,1),1);
  return E(c(0,0,0),c(1,0,0),dash)+E(c(1,0,0),c(1,0,1),dash)+E(c(1,0,1),c(0,0,1),dash)+E(c(0,0,1),c(0,0,0),dash)+
    E(c(0,0,1),c(0,1,1),dash)+E(c(0,1,1),c(1,1,1),dash)+E(c(1,1,1),c(1,0,1),dash)+E(c(1,0,0),c(1,1,0),dash)+E(c(1,1,0),c(1,1,1),dash);
}
function say1(h,cls){const e=$('say1');e.className='say'+(cls?' '+cls:'');e.innerHTML=`<span>${h}</span>`;}
function actions1(list){
  const a=$('actions1');a.innerHTML='';
  list.forEach(([c,t,f,dis])=>{
    const b=document.createElement('button');b.className='btn '+c;b.innerHTML=t;b.disabled=!!dis;
    b.addEventListener('click',()=>{if(!S1.busy)f();});a.appendChild(b);
  });
}
function noChoices1(){const ch=$('choices1');ch.classList.add('off');ch.classList.remove('col');ch.innerHTML=[1,2,3].map(()=>'<button class="choice" disabled>0</button>').join('');}
/* 3択（judge＝false なら まるつけ しない＝予想） */
function choices1(list,ok,onPick,wrongMsg){
  const ch=$('choices1');ch.classList.remove('off');ch.innerHTML='';S1.solved=false;
  list.forEach(v=>{
    const b=document.createElement('button');b.className='choice'+(v.length>3?' long':'');b.innerHTML=v;
    b.addEventListener('click',()=>{
      if(S1.busy)return;
      if(ok!==null&&v!==ok){b.disabled=true;say1(wrongMsg,'try');return;}
      ch.querySelectorAll('.choice').forEach(x=>x.disabled=x!==b);b.classList.add('good');
      onPick(v);
    });
    ch.appendChild(b);
  });
  actions1([]);
}
function s1start(){
  Object.assign(S1,{ph:0,guess:null,L:0,busy:false,solved:false});
  const q=P1[S1.pi];
  $('prob1').innerHTML=`<span class="no">問題 ${S1.pi+1} / ${P1.length}</span><span class="dim">${q.intro?'何で 測ると いいかな':'A と B、どちらが 大きい？'}</span>`;
  noChoices1();
  if(q.intro){
    say1('箱の 大きさを くらべたい。<br>何を 入れて 数えると いいかな？ すき間なく ぴったり 入るのは どっち？');
    choices1(['ボール','立方体'],'立方体',()=>{
      S1.solved=true;draw1();
      say1('よくできました！ 立方体は すき間なく ぴったり 入るね。<br>1辺が 1cmの 立方体の 体積を <b>1cm<sup>3</sup></b>（1立方センチメートル）と いうよ','ok');
      actions1([['next','次の 問題 →',next1]]);
    },'もう一回。ボールと ボールの あいだを 見てみよう');
  }else{
    say1('A と B、どちらが 大きいと 思う？<br>まず 予想しよう');
    choices1(['A','B','同じ'],null,v=>{
      S1.guess=v;
      say1(`予想は「${v}」だね。<br>1cm<sup>3</sup>の 立方体を 入れて たしかめよう`);
      noChoices1();
      actions1([['play','1cm<sup>3</sup>を 入れる ▶',fill1]]);
    });
  }
  draw1();
}
function fill1(){
  const q=P1[S1.pi],H=Math.max(q.a[2],q.b[2]);
  S1.busy=true;actions1([]);
  const tick=()=>{S1.L++;S1.anim=true;draw1();S1.anim=false;if(S1.L<H)setTimeout(tick,420);else setTimeout(()=>{S1.busy=false;ask1();},450);};
  tick();
}
function ask1(){
  const q=P1[S1.pi],va=vol(q.a),vb=vol(q.b),d=Math.abs(va-vb)||2;
  /* 「Aが 4cm³」だけでは 何が 4cm³ なのか 分かりにくい（2026-09-26 指摘）→「Aが 4cm³ 大きい」 */
  const ans=va>vb?`Aが ${d}cm<sup>3</sup> 大きい`:va<vb?`Bが ${d}cm<sup>3</sup> 大きい`:'同じ';
  say1(`A は 1cm<sup>3</sup>が ${va}個分、B は ${vb}個分。<br>どちらが 何cm<sup>3</sup> 大きい？`);
  $('choices1').classList.add('col');
  choices1([`Aが ${d}cm<sup>3</sup> 大きい`,`Bが ${d}cm<sup>3</sup> 大きい`,'同じ'],ans,()=>{
    S1.solved=true;draw1();
    const hit=S1.guess===(va>vb?'A':va<vb?'B':'同じ');
    const res=va===vb?`A も B も ${va}cm<sup>3</sup>。形が ちがっても 体積は 同じ`:`A は ${va}cm<sup>3</sup>、B は ${vb}cm<sup>3</sup>`;
    say1(`よくできました！ ${res}。<br>${hit?'予想どおり だったね':'見た目では わかりにくいね'}`,'ok');
    const last=S1.pi===P1.length-1;
    actions1([['sub','もう一度',s1start],['next',last?'はじめの 問題へ →':'次の 問題 →',next1]]);
  },`もう一回。${va}個と ${vb}個を くらべよう`);
}
function next1(){S1.pi=(S1.pi+1)%P1.length;s1start();}

/* ===== タブ ===== */
let MODE='s1';
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  MODE=t.dataset.m;killGhost();
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('main1').classList.toggle('hidden',MODE!=='s1');
  $('main').classList.toggle('hidden',MODE!=='s2');
  $('main3').classList.toggle('hidden',MODE!=='s3');
  $('main4').classList.toggle('hidden',MODE!=='s4');
  if(MODE==='s3'){if(!S3.started){S3.started=true;s3start();}else draw3();}
  else if(MODE==='s4'){if(!S4.started){S4.started=true;part4(0);}else draw4();}
  else if(MODE==='s1') draw1();
  else draw();
}));

start();
s1start();
</script>
