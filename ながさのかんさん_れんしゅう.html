<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>長さ</title>
<style>
  :root{
    --ink:#2b2118;
    --paper:#fdf6e3;
    --card:#fffdf7;
    --line:#e7d9b8;
    --gold:#c9a227;
    --ok:#5a8a4c;
    --ng:#d34b4b;
    --flash:#ffe14d;
  }
  /* このアプリの色（長さ） */
  body{--accent:#4f8a3d;--accent-dark:#3a6a2c;--accent-soft:#e8f3e2}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    background:
      radial-gradient(circle at 15% 10%,#fef0d0 0,transparent 40%),
      radial-gradient(circle at 85% 90%,#fbe6cf 0,transparent 45%),
      var(--paper);
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    position:fixed;inset:0;width:100%;
    height:var(--fh,100dvh);
    padding:6px 8px 10px;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  /* iPadでのダブルタップ拡大・長押し選択によるタップ抜けを防ぐ */
  button{
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  .app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
  #viewFind,#viewDrill,#viewMix,#viewCalc{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

  header{text-align:center}
  h1{font-size:clamp(17px,4.6vw,24px);letter-spacing:.04em}
  h1 .em{color:var(--accent)}

  /* 学習ステップ タブ */
  .tabs{display:flex;gap:8px;margin-bottom:2px}
  .tab{
    flex:1;border:2px solid var(--line);border-radius:14px;background:var(--card);
    padding:10px 6px;cursor:pointer;color:#8a7a5f;font-weight:800;
    font-size:clamp(12px,3.2vw,16px);display:flex;flex-direction:column;align-items:center;gap:1px;
    line-height:1.15;word-break:keep-all;
    transition:transform .08s;
  }
  .tab .step{font-size:11px;font-weight:700;opacity:.7}
  .tab.on{color:var(--ink);border-color:var(--gold);background:#fffdf7;box-shadow:0 3px 0 #a5811a}
  .tab.on .step{color:var(--gold);opacity:1}
  .tab:active{transform:translateY(1px)}

  /* くみあわせえらび */
  .picker{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .picker .lbl{font-size:13px;color:#8a7a5f;white-space:nowrap}
  .chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .chip{
    position:relative;min-height:44px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);
    background:#fff;font-size:clamp(14px,3.8vw,17px);font-weight:800;cursor:pointer;color:var(--ink);
    transition:transform .08s;white-space:nowrap;
  }
  .chip:active{transform:scale(.94)}
  .chip.on{color:#fff;border-color:var(--accent);background:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
  .chip .arw{opacity:.6;margin:0 2px}
  .chip .stamp.mx{left:-7px;right:auto;background:#7a5ea8}
  .chip .stamp.pl{top:auto;bottom:-7px;right:-7px;background:#3f7f8c;font-size:10px}
  .chip .stamp.mi{top:auto;bottom:-7px;left:-7px;right:auto;background:#b05a7a;font-size:10px}
  .chip .stamp{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--gold);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
  }

  /* 式カード（共通） */
  .stage{
    background:var(--card);border:3px solid var(--line);border-radius:18px;
    padding:12px;text-align:center;transition:border-color .2s,background .2s;
  }
  .stage.correct{border-color:var(--ok);background:#f2f9ee}
  .stage.wrong{border-color:var(--ng);background:#fcf0f0}
  .eq{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;
    font-size:calc(clamp(22px, calc(var(--fh,100vh) * 0.058), 46px) * var(--shrink,1));line-height:1;
  }
  .unit{font-size:.62em;margin-left:.12em;color:var(--accent-dark)}
  .op{opacity:.55}
  .field{min-width:2.2ch;padding:0 6px;color:var(--ink);font-size:inherit;font-weight:800}
  .field.empty{color:#c7b891}
  .verdict{margin-top:8px;min-height:1.3em;font-size:clamp(13px,3.5vw,17px);font-weight:800}
  .verdict.ok{color:var(--ok)}
  .verdict.ng{color:var(--ng)}
  .verdict em{font-style:normal;color:var(--accent-dark)}

  /* ===== ふたつの たんい（1km500m の かたち）ビュー ===== */
  .eq.mix{flex-wrap:wrap;white-space:normal;gap:4px 8px;
    font-size:calc(clamp(18px, min(6.2vw, calc(var(--fh,100vh) * 0.05)), 38px) * var(--shrink,1))}
  .eq.mix .grp{display:flex;align-items:center}
  /* 数を入れる わく。いま入れる わくだけ 光る */
  .fld{min-width:2.2ch;padding:2px 7px;border-radius:10px;border:3px dashed var(--line);
    background:#fff;color:var(--ink);font-weight:800;font-size:inherit;cursor:pointer;line-height:1.05}
  .fld.empty{color:#c7b891}
  .fld.on{border-style:solid;border-color:var(--accent);background:var(--flash);animation:glow 1.2s infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 5px var(--accent-soft)}}
  .fld.fixed{border:none;background:transparent;padding:0 3px;cursor:default}
  .tapnote{margin-top:6px;min-height:1.1em;font-size:clamp(11px,3vw,14px);color:#8a7a5f}

  /* たす／ひく／まぜる のえらび（ステップ４の中だけに置く） */
  .ops{display:flex;gap:8px;justify-content:center}
  .op-btn{
    flex:1;border-radius:14px;padding:8px 6px;
    font-size:clamp(13px,3.7vw,16px);font-weight:700;cursor:pointer;
    background:var(--card);color:var(--ink);border:2px solid var(--line);transition:transform .08s;
  }
  .op-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
  .op-btn:active{transform:translateY(2px)}

  /* ===== たす・ひくビュー（1km700m ＋ 600m）===== */
  /* 式と こたえを 上下2行にする。ノートに書く形に近づける */
  .calc{display:flex;flex-direction:column;align-items:center;gap:6px}
  .calc .line{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px 7px;
    font-weight:800;font-variant-numeric:tabular-nums;
    font-size:calc(clamp(18px, min(6vw, calc(var(--fh,100vh) * 0.048)), 36px) * var(--shrink,1));line-height:1.15}
  .calc .grp{display:flex;align-items:center}
  .calc .sign{color:var(--ng);padding:0 2px}

  /* ===== はっけんビュー ===== */
  /* たんいの かんけい（◯◯ばい）を、やじるしで見せる */
  .ladder{display:flex;align-items:center;justify-content:center;gap:6px;
    font-weight:800;font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.032), 24px) * var(--shrink,1))}
  .ladder .u{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;
    padding:5px 10px;color:var(--accent-dark);min-width:3.2em}
  .ladder .arrows{display:flex;flex-direction:column;gap:3px;font-size:.78em;color:#6f5d3d}
  .ladder .arrows span{white-space:nowrap}
  .ladder .rate{color:var(--ng)}
  .ladder .rate.blank{color:#c7b891}

  /* きまり見つけの表 */
  .table{margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
  .row{display:flex;align-items:center;justify-content:center;gap:5px;
    font-weight:800;font-variant-numeric:tabular-nums;
    font-size:calc(clamp(17px, calc(var(--fh,100vh) * 0.04), 30px) * var(--shrink,1));line-height:1.1}
  .row .r{min-width:4.6ch;text-align:right}
  .row .r.blank{color:#c7b891}
  .zeros{background:var(--flash);border-radius:6px;padding:0 2px;animation:pop .4s}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  .actions{display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:clamp(15px,4.2vw,19px);
    font-weight:800;cursor:pointer;transition:transform .08s;color:#fff}
  .btn:active{transform:translateY(2px)}
  .btn.show{background:var(--gold);box-shadow:0 4px 0 #a5811a}
  .btn.next{background:#5a8a4c;box-shadow:0 4px 0 #446838}

  /* ===== ドリルビュー ===== */
  .score{display:flex;gap:8px}
  .score .box{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
  .score .n{font-size:clamp(19px,5.5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .score .t{font-size:10px;color:#8a7a5f;margin-top:2px}
  .score .streak .n{color:var(--gold)}
  .score .correct .n{color:var(--ok)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(min(6px, calc(var(--fh,100vh) * 0.009)) * var(--shrink,1));flex-shrink:0}
  .key{border:2px solid var(--line);border-radius:14px;background:#fff;
    font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.038), 24px) * var(--shrink,1));
    font-weight:800;cursor:pointer;color:var(--ink);
    padding:calc(clamp(2px, calc(var(--fh,100vh) * 0.011), 9px) * var(--shrink,1)) 0;transition:transform .07s,background .1s}
  .key:active{transform:translateY(2px);background:#fff4df}
  .key.del{background:#e6d3a8;box-shadow:0 3px 0 #c9b47f}
  .key.enter{background:var(--ok);color:#fff;box-shadow:0 3px 0 #446838}
  .key.next{background:var(--gold);color:#fff;box-shadow:0 3px 0 #a5811a}

  .drill-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

  .tabs,.picker,.score,.actions,.ops{flex-shrink:0}
  .hidden{display:none !important}

  @media(max-height:720px){
    h1{font-size:16px}
    .tab{padding:7px 6px;font-size:14px}
    .tab .step{font-size:10px}
    .picker{padding:6px 8px}
    .chip{min-height:40px;padding:5px 10px;font-size:15px}
    .op-btn{padding:6px;font-size:13px}
    .score .box{padding:3px}
    .score .n{font-size:20px}
    .score .t{font-size:9px}
  }
  @media(max-height:560px){
    header{display:none}
    .app{gap:5px}
    #viewFind,#viewDrill,#viewMix,#viewCalc{gap:5px}
    .chip{min-height:36px;padding:4px 9px;font-size:14px}
  }
  /* 横向き（iPad横など）：式とテンキーを左右2列に */
  @media(orientation:landscape) and (max-height:820px){
    header{display:none}
    .app{gap:5px}
    #viewDrill,#viewMix,#viewCalc{gap:5px}
    .drill-main{flex-direction:row;gap:10px;align-items:stretch}
    .drill-main .stage{flex:1 1 60%;min-width:0;padding:10px 14px}
    .drill-main .pad{flex:0 0 auto;width:min(40%,300px);align-content:center}
    .eq{font-size:calc(clamp(22px, calc(var(--fh,100vh) * 0.055), 42px) * var(--shrink,1))}
    .key{font-size:calc(clamp(15px, calc(var(--fh,100vh) * 0.042), 23px) * var(--shrink,1));padding:calc(clamp(4px, calc(var(--fh,100vh) * 0.018), 13px) * var(--shrink,1)) 2px;white-space:nowrap}
    .tab{padding:6px;font-size:13px}
    .tab .step{font-size:10px}
    .picker{padding:5px 8px}
    .chip{min-height:36px;padding:4px 9px;font-size:14px}
    .score .box{padding:3px}
    .score .n{font-size:19px}
  }
</style>
</head>
<body>
<div class="app">
  <header><h1><span class="em">長さ</span></h1></header>

  <div class="tabs">
    <button class="tab on" data-v="find"><span class="step">ステップ１</span>きまり はっけん！</button>
    <button class="tab" data-v="drill"><span class="step">ステップ２</span>ドリル</button>
    <button class="tab" data-v="mix"><span class="step">ステップ３</span>ふたつの たんい</button>
    <button class="tab" data-v="calc"><span class="step">ステップ４</span>たす・ひく</button>
  </div>

  <div class="picker">
    <div class="lbl">くみあわせ</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- はっけんビュー -->
  <div id="viewFind">
    <div class="stage" style="flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:120px">
      <div class="ladder" id="fLadder"></div>
      <div class="table" id="fTable"></div>
    </div>
    <div class="actions">
      <button class="btn show" id="fShow">こたえを見る</button>
      <button class="btn next" id="fNext">むきを かえる</button>
    </div>
  </div>

  <!-- ドリルビュー -->
  <div id="viewDrill" class="hidden">
    <div class="score">
      <div class="box correct"><div class="n" id="sCorrect">0</div><div class="t">正かい</div></div>
      <div class="box"><div class="n" id="sTotal">0</div><div class="t">といた数</div></div>
      <div class="box streak"><div class="n" id="sStreak">0/10</div><div class="t">スタンプまで</div></div>
    </div>
    <div class="drill-main">
      <div class="stage" id="dStage" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="eq" id="dEq"></div><div class="verdict" id="dVerdict"></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>
  </div>

  <!-- ふたつの たんいビュー（1500m ＝ 1km 500m） -->
  <div id="viewMix" class="hidden">
    <div class="score">
      <div class="box correct"><div class="n" id="mCorrect">0</div><div class="t">正かい</div></div>
      <div class="box"><div class="n" id="mTotal">0</div><div class="t">といた数</div></div>
      <div class="box streak"><div class="n" id="mStreak">0/10</div><div class="t">スタンプまで</div></div>
    </div>
    <div class="drill-main">
      <div class="stage" id="mStage" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="eq mix" id="mEq"></div>
        <div class="tapnote" id="mNote"></div>
        <div class="verdict" id="mVerdict"></div>
      </div>
      <div class="pad" id="padMix"></div>
    </div>
  </div>

  <!-- たす・ひくビュー（1km700m ＋ 600m ＝ □km □m） -->
  <div id="viewCalc" class="hidden">
    <div class="ops">
      <button class="op-btn active" data-o="+">たす</button>
      <button class="op-btn" data-o="-">ひく</button>
      <button class="op-btn" data-o="x">まぜる</button>
    </div>
    <div class="score">
      <div class="box correct"><div class="n" id="cCorrect">0</div><div class="t">正かい</div></div>
      <div class="box"><div class="n" id="cTotal">0</div><div class="t">といた数</div></div>
      <div class="box streak"><div class="n" id="cStreak">0/10</div><div class="t">スタンプまで</div></div>
    </div>
    <div class="drill-main">
      <div class="stage" id="cStage" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="calc" id="cEq"></div>
        <div class="tapnote" id="cNote"></div>
        <div class="verdict" id="cVerdict"></div>
      </div>
      <div class="pad" id="padCalc"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   たんいの かんさん（3年：ながさ・おもさ・かさ）
   ・くみあわせごとに 10もん れんぞく正かいで スタンプ
   ・数の大きさは「0のつけたし・とりのぞき」で気づけるものだけ出す
========================================================= */
const PAIRS=[
  {big:'cm',small:'mm',r:10},
  {big:'m' ,small:'cm',r:100},
  {big:'km',small:'m' ,r:1000}
];
const CAT='len';                          /* 記録のキー。まとめ版と同じにして、進み具合を引きつぐ */
const S={view:'find',pi:PAIRS.length-1}; /* pi = くみあわせの番号。いちばん大きいものから */
function pair(){return PAIRS[S.pi];}
function pkey(){return CAT+':'+S.pi;}

/* =========================================================
   タップ処理の一本化（iPad対策・くりあがりアプリと同じ）
   pointerdown で確実に反応させ、遅れて届く click は無視する。
========================================================= */
function bindTap(el,fn){
  let lastFire=0;
  const fire=()=>{
    const now=Date.now();
    if(now-lastFire<60)return;   // 同じ瞬間の二重発火を防ぐ
    lastFire=now;
    fn();
  };
  if(window.PointerEvent){
    el.addEventListener('pointerdown',ev=>{
      if(ev.pointerType==='mouse'&&ev.button!==0)return;
      ev.preventDefault();
      fire();
    });
    el.addEventListener('click',()=>{
      if(Date.now()-lastFire<500)return;
      fire();
    });
  }else{
    el.addEventListener('touchstart',ev=>{ev.preventDefault();fire();},{passive:false});
    el.addEventListener('click',()=>{if(Date.now()-lastFire<500)return;fire();});
  }
}

/* ---------- ことばづくり ---------- */
const KAZU={1:'ひとつ',2:'ふたつ',3:'みっつ'};
function zerosOf(r){return String(r).length-1;}   // 10→1, 100→2, 1000→3
function unitHTML(u){return '<span class="unit">'+u+'</span>';}
/* 大きい方から小さい方へ変えたときに ふえる 0 を光らせる */
function zeroLightHTML(n,z){
  return String(n)+'<span class="zeros">'+'0'.repeat(z)+'</span>';
}

/* =========================================================
   ステップ１：きまり はっけん！
   1・2・3 をならべて「0が◯こ ふえる／へる」に気づかせる
========================================================= */
const F={dir:'b2s',revealed:false};   // b2s = 大きいたんい→小さいたんい
const fLadder=document.getElementById('fLadder');
const fTable=document.getElementById('fTable');

function fNew(){                       // むきを かえる
  F.dir=(F.dir==='b2s')?'s2b':'b2s';
  F.revealed=false;
  fRender();
}
function fReset(){F.revealed=false;fRender();}

function fRender(){
  const p=pair(),z=zerosOf(p.r);
  const from=(F.dir==='b2s')?p.big:p.small;
  const to  =(F.dir==='b2s')?p.small:p.big;
  const rate=F.revealed
    ? '<span class="rate">'+p.r+'ばい</span>'
    : '<span class="rate blank">？ばい</span>';
  const back=F.revealed
    ? '<span class="rate">'+p.r+'</span>でわる'
    : '<span class="rate blank">？</span>でわる';
  fLadder.innerHTML=
    '<span class="u">'+p.big+'</span>'+
    '<span class="arrows"><span>─ '+rate+' →</span><span>← '+back+' ─</span></span>'+
    '<span class="u">'+p.small+'</span>';

  let rows='';
  [1,2,3].forEach(n=>{
    const bigN=n, smallN=n*p.r;
    const l=(F.dir==='b2s')?bigN:smallN;
    const rv=(F.dir==='b2s')?smallN:bigN;
    const right=F.revealed
      ? ((F.dir==='b2s')?zeroLightHTML(bigN,z):'<span class="zeros">'+bigN+'</span>')
      : '？';
    rows+='<div class="row">'+l+unitHTML(from)+'<span class="op">＝</span>'+
          '<span class="r'+(F.revealed?'':' blank')+'">'+right+'</span>'+unitHTML(to)+'</div>';
  });
  fTable.innerHTML=rows;
}
bindTap(document.getElementById('fShow'),()=>{if(!F.revealed){F.revealed=true;fRender();}});
bindTap(document.getElementById('fNext'),fNew);

/* =========================================================
   ステップ２：ドリル
========================================================= */
const GOAL=10;

/* --- 記録の読み書き（とじても消えないように保存） --- */
let stamps={},setStreak={};
try{const s=JSON.parse(localStorage.getItem('tanniStamps')||'null');if(s)stamps=s;}catch(e){}
try{const s=JSON.parse(localStorage.getItem('tanniStreak')||'null');if(s)setStreak=s;}catch(e){}
function saveStamps(){try{localStorage.setItem('tanniStamps',JSON.stringify(stamps));}catch(e){}}
function saveStreak(){try{localStorage.setItem('tanniStreak',JSON.stringify(setStreak));}catch(e){}}

let correct=0,total=0;
try{const sc=JSON.parse(sessionStorage.getItem('tanniScore:'+CAT)||'null');
  if(sc){correct=sc.c|0;total=sc.t|0;}}catch(e){}
function saveScore(){try{sessionStorage.setItem('tanniScore:'+CAT,JSON.stringify({c:correct,t:total}));}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 出す数：1000ばいのくみあわせは1〜9だけ（けたが多くなりすぎないように）。
   10ばい・100ばいのときは 2けたの数も入れて、0のつけたしを味わわせる。 */
let queue=[];
function refillQueue(){
  const r=pair().r;
  let ns=[1,2,3,4,5,6,7,8,9];
  if(r<=100){
    const twos=shuffle([12,15,18,24,25,30,36,45,60,75])
      .slice(0,5);              // 2けたは5つだけ混ぜる
    ns=ns.concat(twos);
  }
  queue=shuffle(ns);
}

const D={n:0,dir:'b2s',from:'',to:'',ans:0,input:'',locked:false};
const dEq=document.getElementById('dEq'),dVerdict=document.getElementById('dVerdict'),
      dStage=document.getElementById('dStage'),padEl=document.getElementById('pad');
const el={c:document.getElementById('sCorrect'),t:document.getElementById('sTotal'),s:document.getElementById('sStreak')};

function dNew(){
  D.input='';D.locked=false;
  dStage.className='stage';dVerdict.className='verdict';dVerdict.textContent='';
  if(!queue.length)refillQueue();
  const p=pair(),n=queue.shift();
  D.dir=Math.random()<0.5?'b2s':'s2b';
  if(D.dir==='b2s'){                 // 3km ＝ □m
    D.from=p.big;D.to=p.small;D.q=n;D.ans=n*p.r;
  }else{                             // 3000m ＝ □km
    D.from=p.small;D.to=p.big;D.q=n*p.r;D.ans=n;
  }
  D.n=n;
  dRender();buildPad();dScore();
}
function dRender(){
  const field=D.locked
    ? '<span class="field">'+D.ans+'</span>'
    : '<span class="field'+(D.input?'':' empty')+'">'+(D.input||'?')+'</span>';
  dEq.innerHTML=D.q+unitHTML(D.from)+'<span class="op">＝</span>'+field+unitHTML(D.to);
}
function dScore(){
  el.c.textContent=correct;el.t.textContent=total;
  const k=pkey();
  el.s.textContent=stamps[k]?'⭐':((setStreak[k]||0)+'/'+GOAL);
}
function hintFor(){
  const z=zerosOf(pair().r),w=KAZU[z];
  return (D.dir==='b2s')
    ? D.from+' から '+D.to+' は <em>'+pair().r+'ばい</em>。0を '+w+' つけるよ'
    : D.from+' から '+D.to+' は <em>'+pair().r+'でわる</em>。0を '+w+' とるよ';
}
function dCheck(){
  if(D.locked||D.input==='')return;
  D.locked=true;total++;
  const ok=Number(D.input)===D.ans,k=pkey();
  if(ok){
    correct++;dStage.classList.add('correct');dVerdict.className='verdict ok';
    setStreak[k]=(setStreak[k]||0)+1;
    if(!stamps[k]&&setStreak[k]>=GOAL){
      stamps[k]=true;saveStamps();buildChips();
      dVerdict.innerHTML='スタンプ ゲット！ ⭐ １０もん せいかい！';
      setStreak[k]=0;refillQueue();
    }else if(stamps[k]){dVerdict.textContent='せいかい！ 🎉';}
    else{dVerdict.textContent='せいかい！ 🎉（あと '+(GOAL-setStreak[k])+'もん で スタンプ）';}
    saveStreak();
  }else{
    if(!stamps[k])queue.push(D.n);      // まちがえた数は もう一度 出す
    setStreak[k]=0;saveStreak();        // れんぞく正かいは やりなおし
    dStage.classList.add('wrong');dVerdict.className='verdict ng';
    dVerdict.innerHTML='おしい！ こたえは '+D.ans+D.to+'　'+hintFor();
  }
  saveScore();
  dRender();dScore();buildPad();
}
function dPress(v){
  if(D.locked)return;
  const maxLen=String(D.ans).length;    // こたえのけた数まで（押しすぎ防止）
  if(v==='del')D.input=D.input.slice(0,-1);
  else if(D.input.length<maxLen)D.input+=v;
  dRender();
}
let lastAction=0;
function buildPad(){
  padEl.innerHTML='';
  for(let i=1;i<=9;i++)addKey(String(i),'key',()=>dPress(String(i)),false);
  addKey('けす','key del',()=>dPress('del'),false);
  addKey('0','key',()=>dPress('0'),false);
  if(D.locked)addKey('つぎ →','key next',dNew,true);
  else addKey('こたえ','key enter',dCheck,true);
  function addKey(label,cls,fn,guard){
    const b=document.createElement('button');b.className=cls;b.textContent=label;b.type='button';
    bindTap(b,()=>{
      if(guard){                        // こたえ／つぎ のみ 連打を防ぐ
        const now=Date.now();
        if(now-lastAction<450)return;
        lastAction=now;
      }
      fn();
    });
    padEl.appendChild(b);
  }
}

/* =========================================================
   ステップ３：ふたつの たんい（1500m ＝ 1km 500m）
   ・むきA  1km 500m ＝ □m      （あわせる）
   ・むきB  1500m ＝ □km □m    （わける）
   ・むきBは 大きいたんいの わくが うまったら つぎの わくへ すすむ
========================================================= */
const M={dir:'b',a:0,b:0,f:['',''],act:0,locked:false};
let mQueue=[];
const mEq=document.getElementById('mEq'),mVerdict=document.getElementById('mVerdict'),
      mStage=document.getElementById('mStage'),mNote=document.getElementById('mNote'),
      padMixEl=document.getElementById('padMix');
const mel={c:document.getElementById('mCorrect'),t:document.getElementById('mTotal'),s:document.getElementById('mStreak')};

function mKey(){return 'm:'+pkey();}
function mTotalVal(){return M.a*pair().r+M.b;}
/* ステップ３（かんさん）で使う数。うしろのグループは「0の ばしょ」で
   つまずきやすい形。2km30m＝2030m、2080m＝2km80m、305cm＝3m5cm を わざと入れている。
   ステップ４は これを使わない（pRests を見る） */
function mRests(){
  const r=pair().r;
  if(r===10) return [1,2,3,4,5,6,7,8,9];
  if(r===100)return [10,20,25,30,40,50,60,70,75,80,90,  2,5,8];
  return [100,200,250,300,400,500,600,700,750,800,900,  20,30,50,60,80,90];
}
/* のこりが たんいより1けた小さいとき＝0の ばしょに 気をつける形 */
function isHardRest(b,r){return b<r/10;}
function mNew(){
  M.f=['',''];M.act=0;M.locked=false;
  mStage.className='stage';mVerdict.className='verdict';mVerdict.textContent='';
  const q=mQueue.length?mQueue.shift():null;
  if(q){M.a=q.a;M.b=q.b;M.dir=q.dir;}
  else{
    const rests=mRests();
    M.a=1+Math.floor(Math.random()*9);
    M.b=rests[Math.floor(Math.random()*rests.length)];
    M.dir=Math.random()<0.5?'a':'b';
  }
  mRender();buildPadM();mScore();
}
function mMax(i){
  if(M.dir==='a')return String(mTotalVal()).length;
  return i===0?1:String(pair().r-1).length+1; // 大きいたんいは1けた・のこりは 1けた多めまで受ける
}
function mRender(){
  const p=pair(),big=unitHTML(p.big),small=unitHTML(p.small);
  const fld=(i,val)=>M.locked
    ? '<span class="fld fixed">'+val+'</span>'
    : '<span class="fld'+((M.act===i)?' on':'')+(M.f[i]?'':' empty')+'" data-i="'+i+'">'+(M.f[i]||'?')+'</span>';
  if(M.dir==='a'){        // 1km 500m ＝ □m
    mEq.innerHTML='<span class="grp">'+M.a+big+'</span><span class="grp">'+M.b+small+'</span>'+
      '<span class="op">＝</span><span class="grp">'+fld(0,mTotalVal())+small+'</span>';
    mNote.textContent='';
  }else{                  // 1500m ＝ □km □m
    mEq.innerHTML='<span class="grp">'+mTotalVal()+small+'</span><span class="op">＝</span>'+
      '<span class="grp">'+fld(0,M.a)+big+'</span><span class="grp">'+fld(1,M.b)+small+'</span>';
    mNote.textContent=M.locked?'':'わくを おすと、入れるところが かわるよ';
  }
  if(!M.locked){
    mEq.querySelectorAll('.fld[data-i]').forEach(el=>{
      bindTap(el,()=>{M.act=Number(el.dataset.i);mRender();});
    });
  }
}
function mScore(){
  mel.c.textContent=correct;mel.t.textContent=total;
  const k=mKey();
  mel.s.textContent=stamps[k]?'🏅':((setStreak[k]||0)+'/'+GOAL);
}
function mHint(){
  const p=pair();
  const care=isHardRest(M.b,p.r)?'。0の ばしょに 気をつけて':'';
  return (M.dir==='a')
    ? '<em>'+(M.a*p.r)+p.small+'</em> と '+M.b+p.small+' を あわせるよ'+care
    : '<em>'+p.r+p.small+'</em> で 1'+p.big+'。のこりは '+M.b+p.small+care;
}
function mCheck(){
  if(M.locked)return;
  if(M.f[0]===''||(M.dir==='b'&&M.f[1]==='')){
    mVerdict.className='verdict ng';
    mVerdict.textContent=(M.dir==='b')?'りょうほうの わくに 数を いれよう':'こたえを いれよう';
    return;
  }
  M.locked=true;total++;
  const p=pair(),k=mKey();
  const ok=(M.dir==='a')
    ? Number(M.f[0])===mTotalVal()
    : (Number(M.f[0])===M.a&&Number(M.f[1])===M.b);
  if(ok){
    correct++;mStage.classList.add('correct');mVerdict.className='verdict ok';
    setStreak[k]=(setStreak[k]||0)+1;
    if(!stamps[k]&&setStreak[k]>=GOAL){
      stamps[k]=true;saveStamps();buildChips();
      mVerdict.innerHTML='スタンプ ゲット！ 🏅 １０もん せいかい！';
      setStreak[k]=0;
    }else if(stamps[k]){mVerdict.textContent='せいかい！ 🎉';}
    else{mVerdict.textContent='せいかい！ 🎉（あと '+(GOAL-setStreak[k])+'もん で スタンプ）';}
    saveStreak();
  }else{
    if(!stamps[k])mQueue.push({a:M.a,b:M.b,dir:M.dir});   // まちがえた もんだいは もう一度
    setStreak[k]=0;saveStreak();
    mStage.classList.add('wrong');mVerdict.className='verdict ng';
    const ansTxt=(M.dir==='a')
      ? mTotalVal()+p.small
      : M.a+p.big+' '+M.b+p.small;
    mVerdict.innerHTML='おしい！ こたえは '+ansTxt+'　'+mHint();
  }
  saveScore();
  mRender();mScore();buildPadM();
}
function mPress(v){
  if(M.locked)return;
  const i=M.act;
  if(v==='del'){M.f[i]=M.f[i].slice(0,-1);}
  else if(M.f[i].length<mMax(i)){
    M.f[i]+=v;
    if(M.dir==='b'&&i===0&&M.f[0].length>=mMax(0))M.act=1;  // 大きいたんいが うまったら つぎのわくへ
  }
  mRender();
}
function buildPadM(){
  padMixEl.innerHTML='';
  for(let i=1;i<=9;i++)addKeyM(String(i),'key',()=>mPress(String(i)),false);
  addKeyM('けす','key del',()=>mPress('del'),false);
  addKeyM('0','key',()=>mPress('0'),false);
  if(M.locked)addKeyM('つぎ →','key next',mNew,true);
  else addKeyM('こたえ','key enter',mCheck,true);
  function addKeyM(label,cls,fn,guard){
    const b=document.createElement('button');b.className=cls;b.textContent=label;b.type='button';
    bindTap(b,()=>{
      if(guard){
        const now=Date.now();
        if(now-lastAction<450)return;
        lastAction=now;
      }
      fn();
    });
    padMixEl.appendChild(b);
  }
}

/* =========================================================
   ステップ４：たす・ひく（1km700m ＋ 600m ＝ □km □m）
   ・くり上がり／くり下がりの ある形も 出す
   ・ヒントの言い方は「くりあがりくりさがり」アプリと そろえる
========================================================= */
const P={mode:'+',op:'+',a1:0,b1:0,b2:0,ans:0,f:['',''],act:0,locked:false};
let pQueue=[];
const cEq=document.getElementById('cEq'),cVerdict=document.getElementById('cVerdict'),
      cStage=document.getElementById('cStage'),cNote=document.getElementById('cNote'),
      padCalcEl=document.getElementById('padCalc');
const cel={c:document.getElementById('cCorrect'),t:document.getElementById('cTotal'),s:document.getElementById('cStreak')};

/* スタンプは たす・ひく べつべつに数える。
   「まぜる」のときは、その問題の しるし（＋か－）のほうに数える */
function pKeyOp(op){return 'p:'+pkey()+':'+op;}
function pKey(){return pKeyOp(P.op);}
/* ステップ４で使う数。1km400m ＋ 800m のように、下のけたが 0 の数だけにする。
   くりあがり・くりさがりに集中させたいので、ここでは「0の ばしょ」の
   難しさ（2km30m のような形）を重ねない。それはステップ３で練習する */
function pRests(){
  const r=pair().r;
  if(r===10) return [1,2,3,4,5,6,7,8,9];
  if(r===100)return [10,20,30,40,50,60,70,80,90];
  return [100,200,300,400,500,600,700,800,900];
}
/* こたえの 小さいたんいが 0 にならず、大きいたんいが 1〜9 におさまる数だけを出す */
function pNums(){
  const r=pair().r,rests=pRests();
  for(let t=0;t<300;t++){
    const op=(P.mode==='x')?(Math.random()<0.5?'+':'-'):P.mode;
    const a1=1+Math.floor(Math.random()*8);
    const b1=rests[Math.floor(Math.random()*rests.length)];
    const b2=rests[Math.floor(Math.random()*rests.length)];
    const ans=(op==='+')?(a1*r+b1+b2):(a1*r+b1-b2);
    if(ans%r===0)continue;               // 「2km 0m」のような こたえは出さない
    const big=Math.floor(ans/r);
    if(big<1||big>9)continue;
    return {op:op,a1:a1,b1:b1,b2:b2,ans:ans};
  }
  const b=rests[0];                      // ここに来ることは まずないが、念のため
  const op=(P.mode==='-')?'-':'+';
  return (op==='+')
    ? {op:'+',a1:1,b1:b,b2:b,ans:r+b*2}
    : {op:'-',a1:2,b1:b,b2:b*2,ans:2*r+b-b*2};
}
function pNew(){
  P.f=['',''];P.act=0;P.locked=false;
  cStage.className='stage';cVerdict.className='verdict';cVerdict.textContent='';
  const q=pQueue.length?pQueue.shift():pNums();
  P.op=q.op;P.a1=q.a1;P.b1=q.b1;P.b2=q.b2;P.ans=q.ans;
  pRender();buildPadC();pScore();
}
/* のこりのわくは たんいのけた数＋1。
   「1km1300m」のような まちがいも 入力できるようにして、くりあがりのヒントを出す */
function pMax(i){return i===0?1:String(pair().r-1).length+1;}
function pRender(){
  const p=pair(),big=unitHTML(p.big),small=unitHTML(p.small);
  const sign=(P.op==='+')?'＋':'－';
  const ansBig=Math.floor(P.ans/p.r),ansSmall=P.ans%p.r;
  const fld=(i,val)=>P.locked
    ? '<span class="fld fixed">'+val+'</span>'
    : '<span class="fld'+((P.act===i)?' on':'')+(P.f[i]?'':' empty')+'" data-i="'+i+'">'+(P.f[i]||'?')+'</span>';
  cEq.innerHTML=
    '<div class="line">'+
      '<span class="grp">'+P.a1+big+'</span><span class="grp">'+P.b1+small+'</span>'+
      '<span class="sign">'+sign+'</span><span class="grp">'+P.b2+small+'</span>'+
    '</div>'+
    '<div class="line">'+
      '<span class="op">＝</span>'+
      '<span class="grp">'+fld(0,ansBig)+big+'</span><span class="grp">'+fld(1,ansSmall)+small+'</span>'+
    '</div>';
  cNote.textContent=P.locked?'':'わくを おすと、入れるところが かわるよ';
  if(!P.locked){
    cEq.querySelectorAll('.fld[data-i]').forEach(el=>{
      bindTap(el,()=>{P.act=Number(el.dataset.i);pRender();});
    });
  }
}
function pScore(){
  cel.c.textContent=correct;cel.t.textContent=total;
  const mark=(P.op==='+')?'➕':'➖';
  const k=pKey();
  if(P.mode==='x'&&stamps[pKeyOp('+')]&&stamps[pKeyOp('-')]){cel.s.textContent='➕➖';return;}
  if(stamps[k]){cel.s.textContent=mark;return;}
  /* まぜるのときは、いま数えているほうが わかるように しるしを付ける */
  cel.s.textContent=(P.mode==='x'?mark+' ':'')+((setStreak[k]||0)+'/'+GOAL);
}
function pHint(){
  const p=pair();
  if(P.op==='+'){
    return (P.b1+P.b2>=p.r)
      ? '<em>'+P.b1+p.small+' と '+P.b2+p.small+' で '+(P.b1+P.b2)+p.small+'</em>。'+p.r+p.small+' を 1'+p.big+' に くりあげるよ'
      : p.small+' どうしを たすよ。'+p.big+' は そのまま';
  }
  return (P.b2>P.b1)
    ? '<em>1'+p.big+' を '+p.r+p.small+' に かえて</em>、'+(p.r+P.b1)+p.small+' から '+P.b2+p.small+' を ひくよ'
    : p.small+' どうしを ひくよ。'+p.big+' は そのまま';
}
function pCheck(){
  if(P.locked)return;
  if(P.f[0]===''||P.f[1]===''){
    cVerdict.className='verdict ng';
    cVerdict.textContent='りょうほうの わくに 数を いれよう';
    return;
  }
  P.locked=true;total++;
  const p=pair(),k=pKey();
  const ansBig=Math.floor(P.ans/p.r),ansSmall=P.ans%p.r;
  const ok=(Number(P.f[0])===ansBig&&Number(P.f[1])===ansSmall);
  if(ok){
    correct++;cStage.classList.add('correct');cVerdict.className='verdict ok';
    setStreak[k]=(setStreak[k]||0)+1;
    if(!stamps[k]&&setStreak[k]>=GOAL){
      stamps[k]=true;saveStamps();buildChips();
      cVerdict.innerHTML='スタンプ ゲット！ '+((P.op==='+')?'➕':'➖')+' １０もん せいかい！';
      setStreak[k]=0;
    }else if(stamps[k]){cVerdict.textContent='せいかい！ 🎉';}
    else{cVerdict.textContent='せいかい！ 🎉（あと '+(GOAL-setStreak[k])+'もん で スタンプ）';}
    saveStreak();
  }else{
    if(!stamps[k])pQueue.push({op:P.op,a1:P.a1,b1:P.b1,b2:P.b2,ans:P.ans});
    setStreak[k]=0;saveStreak();
    cStage.classList.add('wrong');cVerdict.className='verdict ng';
    cVerdict.innerHTML='おしい！ こたえは '+ansBig+p.big+' '+ansSmall+p.small+'　'+pHint();
  }
  saveScore();
  pRender();pScore();buildPadC();
}
function pPress(v){
  if(P.locked)return;
  const i=P.act;
  if(v==='del'){P.f[i]=P.f[i].slice(0,-1);}
  else if(P.f[i].length<pMax(i)){
    P.f[i]+=v;
    if(i===0&&P.f[0].length>=pMax(0))P.act=1;   // 大きいたんいが うまったら つぎのわくへ
  }
  pRender();
}
function buildPadC(){
  padCalcEl.innerHTML='';
  for(let i=1;i<=9;i++)addKeyC(String(i),'key',()=>pPress(String(i)),false);
  addKeyC('けす','key del',()=>pPress('del'),false);
  addKeyC('0','key',()=>pPress('0'),false);
  if(P.locked)addKeyC('つぎ →','key next',pNew,true);
  else addKeyC('こたえ','key enter',pCheck,true);
  function addKeyC(label,cls,fn,guard){
    const b=document.createElement('button');b.className=cls;b.textContent=label;b.type='button';
    bindTap(b,()=>{
      if(guard){
        const now=Date.now();
        if(now-lastAction<450)return;
        lastAction=now;
      }
      fn();
    });
    padCalcEl.appendChild(b);
  }
}

/* =========================================================
   共通コントロール（タブ・くみあわせ）
========================================================= */
function buildChips(){
  const chips=document.getElementById('chips');chips.innerHTML='';
  PAIRS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='chip'+(i===S.pi?' on':'');
    b.innerHTML=p.big+'<span class="arw">⇄</span>'+p.small+
      (stamps[CAT+':'+i]?'<span class="stamp">⭐</span>':'')+
      (stamps['m:'+CAT+':'+i]?'<span class="stamp mx">🏅</span>':'')+
      (stamps['p:'+CAT+':'+i+':+']?'<span class="stamp pl">➕</span>':'')+
      (stamps['p:'+CAT+':'+i+':-']?'<span class="stamp mi">➖</span>':'');
    bindTap(b,()=>{
      if(i===S.pi)return;               // 同じくみあわせの再タップでは何もしない
      S.pi=i;
      refillQueue();mQueue=[];pQueue=[];buildChips();refreshView();
    });
    chips.appendChild(b);
  });
}
const VIEWS={find:'viewFind',drill:'viewDrill',mix:'viewMix',calc:'viewCalc'};
function refreshView(){
  if(S.view==='find')fReset();
  else if(S.view==='drill')dNew();
  else if(S.view==='mix')mNew();
  else pNew();
  fitShrink();
}
document.querySelectorAll('.op-btn').forEach(btn=>{
  bindTap(btn,()=>{
    if(P.mode===btn.dataset.o)return;   // 同じものの再タップでは作り直さない
    P.mode=btn.dataset.o;
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.toggle('active',b===btn));
    pQueue=[];pNew();fitShrink();
  });
});
document.querySelectorAll('.tab').forEach(t=>{
  bindTap(t,()=>{
    if(S.view===t.dataset.v)return;     // 同じタブの再タップでは作り直さない
    S.view=t.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    Object.keys(VIEWS).forEach(k=>{
      document.getElementById(VIEWS[k]).classList.toggle('hidden',S.view!==k);
    });
    refreshView();
  });
});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;                   // キー押しっぱなしの連続入力を防ぐ
  const v=S.view;
  if(v!=='drill'&&v!=='mix'&&v!=='calc')return;
  const press=(v==='mix')?mPress:(v==='calc')?pPress:dPress;
  if(e.key.length===1&&e.key>='0'&&e.key<='9')press(e.key);
  else if(e.key==='Backspace')press('del');
  else if(e.key==='Tab'){                                  // わくの いどう
    if(v==='mix'&&!M.locked&&M.dir==='b'){e.preventDefault();M.act=M.act?0:1;mRender();}
    else if(v==='calc'&&!P.locked){e.preventDefault();P.act=P.act?0:1;pRender();}
  }
  else if(e.key==='Enter'){
    const now=Date.now();
    if(now-lastAction<450)return;
    lastAction=now;
    if(v==='mix')M.locked?mNew():mCheck();
    else if(v==='calc')P.locked?pNew():pCheck();
    else D.locked?dNew():dCheck();
  }
});

/* ===== 枠の高さを実測して、その中に必ず収める ===== */
function frameHeight(){
  const c=document.documentElement.clientHeight||0;
  const w=window.innerHeight||0;
  const v=(window.visualViewport&&window.visualViewport.height)||0;
  return Math.min.apply(null,[c,w,v].filter(x=>x>0))||w||c;
}
function fitToFrame(){
  document.documentElement.style.setProperty('--fh',frameHeight()+'px');
  fitShrink();
}
/* ===== はみ出す場合は --shrink で自動縮小して必ず1画面に収める ===== */
let shrinkPass=0;
function fitShrink(){
  document.documentElement.style.setProperty('--shrink','1');
  shrinkPass=0;
  requestAnimationFrame(shrinkStep);
}
function shrinkStep(){
  const appEl=document.querySelector('.app');
  if(!appEl)return;
  const over=appEl.scrollHeight-appEl.clientHeight;
  if(over>2&&shrinkPass<6){
    const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--shrink'))||1;
    const next=Math.max(.55,cur*Math.max(.8,appEl.clientHeight/appEl.scrollHeight));
    document.documentElement.style.setProperty('--shrink',next.toFixed(3));
    shrinkPass++;
    requestAnimationFrame(shrinkStep);
  }
}
window.addEventListener('resize',fitToFrame);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitToFrame);
window.addEventListener('orientationchange',()=>setTimeout(fitToFrame,200));
window.addEventListener('load',fitToFrame);

/* ---------- はじめの表示 ---------- */
refillQueue();buildChips();fRender();dNew();mNew();pNew();fitToFrame();
</script>
